# Publish the `dist` artifact of python-package-release.yml to PyPI.
#
# PyPI Trusted Publishing cannot use a reusable workflow as the publisher: it
# matches the OIDC token's `job_workflow_ref`, which inside a reusable workflow
# is the reusable file, so a publisher registered for the caller's workflow is
# answered `invalid-publisher` (warehouse#11096). A composite action keeps the
# caller's `job_workflow_ref`, so the caller owns the job and this action is
# its publish step.
#
# The calling job must, in this order and at least:
#
#   needs: <the job that calls python-package-release.yml>
#   environment: pypi            # the name the Trusted Publisher on PyPI holds
#   permissions: { id-token: write }
#   steps: step-security/harden-runner first, then this action
#
# It checks nothing out and reads no secret: the files are the ones the
# reusable build job produced, and PyPI trusts the job's OIDC identity. The
# pypa action is a Docker action, so the runner pulls its image from ghcr.io
# (layers from pkg-containers.githubusercontent.com); a `block` allow-list in
# the caller's harden-runner step must name both. PEP 740 attestations are on.

name: Publish to PyPI
description: Download the dist artifact of python-package-release.yml and publish it to PyPI over Trusted Publishing, with attestations.

inputs:
  repository-url:
    description: The upload endpoint. The default is PyPI; https://test.pypi.org/legacy/ is TestPyPI.
    required: false
    default: https://upload.pypi.org/legacy/

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist
        path: dist/

    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        repository-url: ${{ inputs.repository-url }}
        attestations: true
