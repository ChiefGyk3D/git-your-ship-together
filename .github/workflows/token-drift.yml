# Reusable token-drift check: a file vendored from another repository (brand design tokens, a schema, a shared
# config) must still be the bytes its lock pinned, and, when asked, the lock must still equal the source
# repository's file at the commit its ref points to right now. Nothing is built or published; the job reads the
# caller's repository, and with `check-live` one public file through the GitHub API, and fails on drift.
#
# The lock is the file `vendored-drift.yml` reads, so one lock serves both (use that workflow when a generator
# must also be checked):
#
#   {
#     "vendored": "vendor/brand/tokens.json",
#     "sha256": "<64 lowercase hex characters>",
#     "source": {"repo": "owner/name", "path": "brand/tokens.json", "commit": "<40 hex characters>"}
#   }
#
# Checks, each of which fails the job (`advisory` turns drift, never a malformed input, into a warning):
#   1. the lock is well formed (exact keys, a real commit id, paths that stay inside the repository) and agrees
#      with `vendored-path`, `source-repo` and `source-path` when those are given;
#   2. the vendored file is a regular file inside the repository whose SHA-256 equals the pin;
#   3. with `check-live`: `source-ref` (empty means the default branch) is resolved to ONE commit, the source
#      file is fetched at exactly that commit, and its SHA-256 must equal the pin. A moving ref is allowed on
#      purpose: that is how "the source changed, re-vendor" is noticed. Pin `source-ref` to a commit to check
#      only that the lock tells the truth about its own commit.
#
# The checking script is scripts/check_token_drift.py in this repository, inlined below byte for byte (a
# reusable workflow cannot name the commit it runs from, so it cannot read its own repository's files);
# tests/test_token_drift.py holds the copy identical. A caller can vendor that file and run it locally.
#
# The live check sends the job's read-only token to api.github.com only (no redirect is followed) and needs a
# PUBLIC source repository; the job token cannot read another private one. No secret is used.
#
# It is opt-in: nothing in an existing caller changes. Call it with:
#
#   on:
#     pull_request:
#     push:
#       branches: [main]
#     schedule:
#       - cron: "17 5 * * 1"   # the live check is for a schedule; a pull request rarely needs it
#
#   jobs:
#     drift:
#       uses: ChiefGyk3D/git-your-ship-together/.github/workflows/token-drift.yml@<sha> # vX.Y.Z
#       permissions:
#         contents: read
#       with:
#         lock-file: vendor/brand/tokens.lock.json
#         check-live: ${{ github.event_name == 'schedule' }}

name: Token drift check (reusable)

on:
  workflow_call:
    inputs:
      lock-file:
        description: Repository-relative path of the lock file (JSON with `vendored`, `sha256` and `source`). Required; an empty value fails the job rather than passing with nothing checked.
        type: string
        default: ""
      vendored-path:
        description: Optional. The vendored file's path as the caller's own workflow file states it; the job fails when the lock says something else, so an edit of the lock alone cannot retarget the check. Empty skips the comparison.
        type: string
        default: ""
      source-repo:
        description: Optional. The source repository (`owner/name`) as the caller states it; same comparison against the lock's `source.repo`. Empty skips it.
        type: string
        default: ""
      source-path:
        description: Optional. The source file's path in the source repository; same comparison against the lock's `source.path`. Empty skips it.
        type: string
        default: ""
      source-ref:
        description: With `check-live`, the branch, tag or commit of the source repository to compare against. Empty means the default branch. Whatever it is, it is resolved to ONE commit and both fetches use that commit. Plain names only (letters, digits, `.`, `_`, `-`, `/`); anything else fails before a request is made.
        type: string
        default: ""
      check-live:
        description: Also fetch the source file at the resolved commit and require its SHA-256 to equal the pin. Needs a public source repository. Off by default so a pull request depends on nothing outside the caller's repository.
        type: boolean
        default: false
      advisory:
        description: Report drift as a warning and set the `drifted` output instead of failing the job. For fixtures that must prove the check fires; a malformed lock or input still fails. Leave off in a real caller.
        type: boolean
        default: false
      egress-policy:
        description: harden-runner egress policy - `audit` logs outbound connections, `block` allows only `allowed-endpoints`. This job passes the read-only job token to the GitHub API for the live check, so it always follows this input (EX-0001 lets only jobs that hold nothing follow the secretless input).
        type: string
        default: block
      egress-policy-secretless:
        description: Accepted so a caller can pass the same egress inputs to every workflow here, and validated like the other (exactly `audit` or `block`). It changes nothing in this workflow, whose one job passes the read-only job token to the GitHub API and so follows `egress-policy`.
        type: string
        default: block
      allowed-endpoints:
        description: harden-runner allow-list for `block`, space-separated host:port entries. The default is what the checkout and the live check need (the live check talks to api.github.com only, because the contents API answers the raw bytes directly, and a redirect to another host is refused rather than followed, so no other host is allowed); wildcards are not supported.
        type: string
        default: "api.github.com:443 github.com:443"
      extra-allowed-endpoints:
        description: Appended to `allowed-endpoints`, for hosts only the install command or the generator reaches (a package index, for example). Same format.
        type: string
        default: ""
      timeout-minutes:
        description: Job timeout.
        type: number
        default: 10
    outputs:
      drifted:
        description: "`false` when the vendored file (and with `check-live` the source) agrees with the pin; `true` when drift was found and `advisory` kept the job green. Empty when the job failed (a malformed lock or input, a fetch error, or drift without `advisory`)."
        value: ${{ jobs.drift.outputs.drifted }}

permissions:
  contents: read

jobs:
  drift:
    name: Vendored file matches its pin and its source
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read  # check out the caller's repository; the live check reads a public repository through the same read-only token
    outputs:
      drifted: ${{ steps.check.outputs.drifted }}
    steps:
      - name: Validate the egress policy inputs
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          disable-sudo: true
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ (inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block' }}

      - name: Egress canary
        if: ${{ runner.os == 'Linux' && ((inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block') }}
        timeout-minutes: 2
        shell: bash
        # The workspace root exists before checkout; a job default working-directory may not.
        working-directory: ${{ github.workspace }}
        run: |
          set -u
          NAMES="github.com api.github.com results-receiver.actions.githubusercontent.com"
          PORT=443
          canary_resolve() { timeout 5 getent ahostsv4 "$1" 2>/dev/null | awk '$2 == "STREAM" { print $1 }'; }
          canary_probe() { timeout 3 bash -c "exec 3<>\"/dev/tcp/\$0/\$1\"" "$1" "$PORT" 2>/dev/null; }
          canary_reach() {
            local i
            for i in 1 2 3 4; do
              canary_probe "$1" && return 0
              [ "$i" -lt 4 ] && sleep 1
            done
            return 1
          }
          canary_show() { local n=$1; shift; echo "+ $*"; { timeout 10 "$@" 2>&1 || true; } | head -n "$n" || true; }
          canary_diag() {
            local name
            echo "::group::egress canary diagnostics (for the GitHub Support ticket)"
            canary_show 5 uname -srmo
            canary_show 20 cat /etc/resolv.conf
            canary_show 20 bash -c "resolvectl status 2>/dev/null | grep -E '^ *(Current DNS Server|DNS Servers?|DNS Domain):'"
            canary_show 20 bash -c "ss -lun | grep ':53 '"
            for name in $NAMES pipelines.actions.githubusercontent.com; do
              canary_show 20 getent ahostsv4 "$name"
              canary_show 5 curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_connect}\n' --max-time 8 "https://$name"
            done
            echo "::endgroup::"
          }
          canary_main() {
            local tmp name addr n=0 bad
            tmp=$(mktemp -d) || return 1
            for _ in 1 2 3; do
              for name in $NAMES; do canary_resolve "$name" >>"$tmp/res.$name" & done
              wait
              sleep 1
            done
            for name in $NAMES; do
              if [ -s "$tmp/res.$name" ]; then sort -u "$tmp/res.$name"; else echo "-"; fi | sed "s|^|$name |" >>"$tmp/pairs"
            done
            while read -r name addr; do
              n=$((n + 1))
              ( { [ "$addr" != "-" ] && canary_reach "$addr"; } || echo "$name $addr" >"$tmp/bad.$n" ) </dev/null &
            done <"$tmp/pairs"
            wait
            bad=$(cat "$tmp"/bad.* 2>/dev/null | sort || true)
            rm -rf "$tmp"
            if [ -z "$bad" ]; then
              echo "egress canary: all $n addresses of $NAMES accept TCP $PORT"
              return 0
            fi
            echo "::error title=egress canary::egress broken on this runner (known westus2 DNS issue): rerun the job"
            echo "unreachable addresses (name address; '-' means the name did not resolve):"
            printf '%s\n' "$bad"
            canary_diag
            echo "egress canary failed, unreachable: $(printf '%s' "$bad" | tr '\n' ';')" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            return 1
          }
          set -m
          canary_main &
          main=$!
          (sleep 90; kill -TERM -- "-$main"; sleep 2; kill -KILL -- "-$main") >/dev/null 2>&1 &
          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
            kill -TERM -- "-$main" >/dev/null 2>&1 || true
            sleep 1
            kill -KILL -- "-$main" >/dev/null 2>&1 || true
          fi
          if [ "$rc" -eq 143 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=egress canary::the canary hit its 90 s deadline: rerun the job"
            rc=124
          fi
          exit "$rc"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the pin${{ inputs.check-live && ' and the source' || '' }}
        env:
          LOCK: ${{ inputs.lock-file }}
          EXPECT_VENDORED: ${{ inputs.vendored-path }}
          EXPECT_REPO: ${{ inputs.source-repo }}
          EXPECT_PATH: ${{ inputs.source-path }}
          SOURCE_REF: ${{ inputs.source-ref }}
          CHECK_LIVE: ${{ inputs.check-live }}
          ADVISORY: ${{ inputs.advisory }}
          GITHUB_TOKEN: ${{ github.token }}
        id: check
        run: |
          set -euo pipefail
          if [ -z "$LOCK" ]; then
            echo "::error title=token drift::lock-file is empty: nothing to check is not a pass"
            exit 1
          fi
          args=(--root "$GITHUB_WORKSPACE" --lock "$LOCK"
            "--expect-vendored=$EXPECT_VENDORED" "--expect-source-repo=$EXPECT_REPO" "--expect-source-path=$EXPECT_PATH")
          if [ "$CHECK_LIVE" = true ]; then args+=(--check-live "--source-ref=$SOURCE_REF"); fi
          if [ "$ADVISORY" = true ]; then args+=(--advisory); fi
          python3 -I - "${args[@]}" <<'PY'
          #!/usr/bin/env python3
          """Fail when a vendored file has drifted from its pin, or the pin from its source repository.

          Generic on purpose: stdlib only, no repository-specific names. The workflow `token-drift.yml` carries a
          byte-identical copy of this file (tests/test_token_drift.py holds the two together).

          Usage:
              python3 -I check_token_drift.py --lock vendor/x.lock.json [--root DIR]
                  [--expect-vendored PATH] [--expect-source-repo OWNER/NAME] [--expect-source-path PATH]
                  [--check-live [--source-ref REF]] [--advisory]

          The lock is the same file `vendored-drift.yml` reads: one JSON object with exactly these keys:

              vendored   path of the vendored file, relative to --root
              sha256     the pinned SHA-256 of that file (64 lowercase hex characters)
              source     {"repo": "owner/name", "path": "path/upstream", "commit": "<40 hex>"}

          Checks, in order. Malformed input is an error; a difference is drift. Both exit 1, every problem is printed
          (one `FAIL` line each), and nothing is skipped silently.
            1. the lock is well formed, and agrees with every --expect-* value given (a lock edited to point somewhere
               else is caught by the caller's own workflow file, which an attacker has to change in the open);
            2. the vendored file is a regular file inside the root and its SHA-256 equals the pin (drift);
            3. with --check-live: --source-ref (empty means the repository's default branch) is resolved to ONE commit
               through api.github.com, the source file is fetched at exactly that commit, and its SHA-256 must equal
               the pin (drift). The lock's own commit is printed beside it; the file, not the commit id, is compared,
               because upstream may move on without touching the file.

          --advisory turns drift (not errors) into WARN lines and exit 0. Whenever the run reaches a verdict (no errors,
          and either no drift or --advisory) it writes `drifted=true|false` to $GITHUB_OUTPUT; a run that fails writes
          nothing. --advisory exists for a fixture that must prove the check fires without leaving every run red.

          The live fetch sends GITHUB_TOKEN (the job's read-only token) only to api.github.com, never follows a
          redirect, reads at most MAX_BYTES, and needs a public source repository (the job token cannot read another
          private one). Lock files and vendored files are data: nothing in them is executed, and values taken from
          them are printed JSON-escaped so they cannot forge a log line or a workflow command.
          """

          from __future__ import annotations

          import argparse
          import hashlib
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          SHA256 = re.compile(r"[0-9a-f]{64}")
          COMMIT = re.compile(r"[0-9a-f]{40}")
          REPO = re.compile(r"[A-Za-z0-9_.-]{1,100}/[A-Za-z0-9_.-]{1,100}")
          REF = re.compile(r"[A-Za-z0-9._/-]{1,200}")
          LOCK_KEYS = {"vendored", "sha256", "source"}
          SOURCE_KEYS = {"repo", "path", "commit"}
          MAX_LOCK_BYTES = 1 << 20
          MAX_BYTES = 16 << 20
          API = "https://api.github.com"
          API_VERSION = "2022-11-28"
          TIMEOUT = 30


          class Error(Exception):
              """Malformed input or an unreachable source: always a failure, never advisory."""


          def q(value: object) -> str:
              """A value from a lock or a response, safe to print: JSON-escaped, one line, bounded."""
              text = value if isinstance(value, str) else repr(value)
              return json.dumps(text[:200], ensure_ascii=True)


          def reject_duplicates(pairs: list[tuple[str, object]]) -> dict[str, object]:
              out: dict[str, object] = {}
              for key, value in pairs:
                  if key in out:
                      raise ValueError(f"duplicate key {key!r}")
                  out[key] = value
              return out


          def relative(value: object) -> str | None:
              """The path if it is a plain relative path with no `..`, no NUL and no backslash."""
              if not isinstance(value, str) or not value or len(value) > 1000:
                  return None
              if "\x00" in value or "\\" in value or value.startswith("/"):
                  return None
              if any(part in ("", ".", "..") for part in value.split("/")):
                  return None
              return value


          def inside(root: Path, value: object) -> Path | None:
              """Resolve value under root, following symlinks; None if it is not a relative path that stays inside."""
              rel = relative(value)
              if rel is None:
                  return None
              try:
                  path = (root / rel).resolve()
              except (OSError, RuntimeError):
                  return None
              return path if path.is_relative_to(root.resolve()) else None


          def sha256_of(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1 << 20), b""):
                      digest.update(chunk)
              return digest.hexdigest()


          def read_lock(path: Path) -> object:
              if not path.is_file():
                  raise ValueError("not a regular file")
              if path.stat().st_size > MAX_LOCK_BYTES:
                  raise ValueError(f"larger than {MAX_LOCK_BYTES} bytes")
              return json.loads(path.read_text(encoding="utf-8"), object_pairs_hook=reject_duplicates)


          def parse_lock(root: Path, lock_path: Path) -> dict[str, object]:
              """The lock as a dict, or Error listing what is wrong with it."""
              name = q(str(lock_path))
              try:
                  resolved = lock_path.resolve()
              except (OSError, RuntimeError) as exc:
                  raise Error(f"{name}: cannot read the lock ({type(exc).__name__})") from exc
              if not resolved.is_relative_to(root):
                  raise Error(f"{name}: the lock must be a path that stays inside the root")
              try:
                  lock = read_lock(resolved)
              except (OSError, ValueError, UnicodeDecodeError, RecursionError) as exc:
                  raise Error(f"{name}: cannot read the lock ({type(exc).__name__}: {q(str(exc))})") from exc
              if not isinstance(lock, dict):
                  raise Error(f"{name}: the lock must be a JSON object")
              problems: list[str] = []
              if set(lock) != LOCK_KEYS:
                  problems.append(f"{name}: keys must be exactly {sorted(LOCK_KEYS)}, got {q(sorted(map(str, lock)))}")
              pin = lock.get("sha256")
              if not isinstance(pin, str) or not SHA256.fullmatch(pin):
                  problems.append(f"{name}: sha256 must be 64 lowercase hex characters")
              source = lock.get("source")
              if not isinstance(source, dict) or set(source) != SOURCE_KEYS:
                  problems.append(f"{name}: source must be an object with exactly repo, path and commit")
              else:
                  if not isinstance(source["repo"], str) or not REPO.fullmatch(source["repo"]):
                      problems.append(f"{name}: source.repo must look like owner/name")
                  if relative(source["path"]) is None:
                      problems.append(f"{name}: source.path must be a plain relative path")
                  if not isinstance(source["commit"], str) or not COMMIT.fullmatch(source["commit"]):
                      problems.append(f"{name}: source.commit must be a 40-character lowercase hex commit id")
              if relative(lock.get("vendored")) is None:
                  problems.append(f"{name}: vendored must be a plain relative path")
              if problems:
                  raise Error("\n".join(problems))
              return lock


          def check_expectations(lock: dict, args: argparse.Namespace) -> list[str]:
              problems = []
              pairs = (
                  ("vendored", lock["vendored"], args.expect_vendored),
                  ("source.repo", lock["source"]["repo"], args.expect_source_repo),
                  ("source.path", lock["source"]["path"], args.expect_source_path),
              )
              for label, actual, wanted in pairs:
                  if wanted and actual != wanted:
                      problems.append(f"the lock's {label} is {q(actual)}, but the workflow input says {q(wanted)}")
              return problems


          def check_vendored(root: Path, lock: dict) -> list[str]:
              vendored = inside(root, lock["vendored"])
              shown = q(lock["vendored"])
              if vendored is None:
                  return [f"vendored {shown} must be a relative path that stays inside the root"]
              if not vendored.is_file():  # a missing file, a directory, a FIFO or a device
                  return [f"vendored file {shown} is not a regular file"]
              if vendored.stat().st_size > MAX_BYTES:
                  return [f"vendored file {shown} is larger than {MAX_BYTES} bytes"]
              actual = sha256_of(vendored)
              if actual != lock["sha256"]:
                  return [f"hash mismatch: {shown} is {actual}, the lock pins {lock['sha256']}"]
              return []


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise urllib.error.HTTPError(req.full_url, code, "redirects are refused", headers, fp)


          def api_get(path: str, accept: str, limit: int) -> bytes:
              """GET https://api.github.com{path}; no redirect is followed and at most `limit` bytes are read."""
              headers = {"Accept": accept, "X-GitHub-Api-Version": API_VERSION, "User-Agent": "gyst-token-drift"}
              token = os.environ.get("GITHUB_TOKEN", "")
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              request = urllib.request.Request(API + path, headers=headers, method="GET")
              opener = urllib.request.build_opener(NoRedirect)
              try:
                  with opener.open(request, timeout=TIMEOUT) as response:
                      body = response.read(limit + 1)
              except urllib.error.HTTPError as exc:
                  raise Error(f"GET {path.split('?')[0]} answered HTTP {exc.code}") from exc
              except (urllib.error.URLError, TimeoutError, OSError) as exc:
                  raise Error(f"GET {path.split('?')[0]} failed ({type(exc).__name__})") from exc
              if len(body) > limit:
                  raise Error(f"GET {path.split('?')[0]} returned more than {limit} bytes")
              return body


          def resolve_commit(repo: str, ref: str) -> str:
              """The one commit `ref` (empty: the default branch) names right now."""
              if ref and (
                  not REF.fullmatch(ref) or ".." in ref or ref.startswith(("/", "-")) or ref.endswith("/") or "//" in ref
              ):
                  raise Error(f"source-ref {q(ref)} is not a plain branch, tag or commit name")
              target = urllib.parse.quote(ref or "HEAD", safe="")
              body = api_get(f"/repos/{repo}/commits/{target}", "application/vnd.github.sha", 200)
              commit = body.decode("ascii", errors="replace").strip()
              if not COMMIT.fullmatch(commit):
                  raise Error(f"the API did not answer a commit id for {q(ref or 'the default branch')}")
              return commit


          def check_live(lock: dict, ref: str) -> list[str]:
              source = lock["source"]
              commit = resolve_commit(source["repo"], ref)
              path = urllib.parse.quote(source["path"], safe="/")
              body = api_get(
                  f"/repos/{source['repo']}/contents/{path}?ref={commit}", "application/vnd.github.raw+json", MAX_BYTES
              )
              actual = hashlib.sha256(body).hexdigest()
              note = "the lock's commit" if commit == source["commit"] else f"commit {commit} (the lock says {source['commit']})"
              print(f"live {source['repo']}:{q(source['path'])} at {note} is {actual}")
              if actual != lock["sha256"]:
                  return [
                      f"drift: {q(source['path'])} in {source['repo']} at commit {commit} is {actual}, "
                      f"the lock pins {lock['sha256']} ({q(lock['vendored'])} is stale or the lock is wrong)"
                  ]
              return []


          def main(argv: list[str]) -> int:
              parser = argparse.ArgumentParser(description=(__doc__ or "").split("\n")[0])
              parser.add_argument("--root", type=Path, default=Path.cwd())
              parser.add_argument("--lock", type=Path, default=None)
              parser.add_argument("--expect-vendored", default="")
              parser.add_argument("--expect-source-repo", default="")
              parser.add_argument("--expect-source-path", default="")
              parser.add_argument("--check-live", action="store_true")
              parser.add_argument("--source-ref", default="")
              parser.add_argument("--advisory", action="store_true")
              args = parser.parse_args(argv)
              root = args.root.resolve()
              if not root.is_dir():
                  parser.error(f"--root {str(args.root)!r} is not a directory")
              if args.lock is None:
                  parser.error("--lock is required: nothing to check is not a pass")
              if args.source_ref and not args.check_live:
                  parser.error("--source-ref only means something with --check-live")

              errors: list[str] = []
              drift: list[str] = []
              try:
                  lock = parse_lock(root, root / args.lock)
                  errors.extend(check_expectations(lock, args))
                  if not errors:
                      drift.extend(check_vendored(root, lock))
                      if args.check_live:
                          drift.extend(check_live(lock, args.source_ref))
              except Error as exc:
                  errors.append(str(exc))

              for problem in errors:
                  print(f"FAIL {problem}")
              for problem in drift:
                  print(f"{'WARN' if args.advisory else 'FAIL'} {problem}")
              out = os.environ.get("GITHUB_OUTPUT")
              if out and not errors and (args.advisory or not drift):
                  with open(out, "a", encoding="utf-8") as handle:
                      handle.write(f"drifted={'true' if drift else 'false'}\n")
              if errors or (drift and not args.advisory):
                  return 1
              if drift:
                  print("ok   drift reported (advisory)")
              else:
                  scope = " and the source file at the resolved commit" if args.check_live else ""
                  print(f"ok   the vendored file matches its pin{scope}")
              return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          PY
