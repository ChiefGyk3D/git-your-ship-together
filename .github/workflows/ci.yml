# CI for the workflows themselves: actionlint and zizmor over every workflow
# and action, the test suite that pins the properties the callers rely on, and
# the two reusable workflows run against the fixture project from this ref, so
# a change is exercised here before a caller pins it. security.yml is run the
# same way by security-self.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly, on the default branch, the whole run: a scheduled run is never docs only (the classifier says `false`
  # for anything but a pull request), so dast-live and rescan-live, which a docs-only or unrelated pull request
  # skips, still run against the real ZAP image and the real Trivy every day, and so do the jobs that read the
  # published star-daemon image and today's vulnerability database.
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs this change can affect. The classify-changes action (the one callers use) reads the pull request's
  # changed files from the API and says docs-only=true only when every path is documentation or a test file: a
  # path under .github/, scripts/, fixture/, an action, a requirements file or anything else makes it false, and so
  # do a push, a schedule, a manual run, a moved head and any doubt. The jobs that need `changes` leave the run on
  # a docs-only change; actionlint, zizmor and the test suite never do (the suite reads tests/). `CI green` counts
  # such a skip as a pass only through this job's explicit result (.github/actions/ci-gate, scripts/ci_gate.py); a
  # skip for any other reason fails it. The rules and the threat notes: docs/wiki/Docs-only-fast-path.md.
  changes:
    name: changes
    runs-on: ubuntu-latest
    # normal: ~1 min (p50 0.2, p95 0.4; last ~30 green runs)
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # the changed-file list, which a fork's token can read
    outputs:
      docs-only: ${{ steps.c.outputs.docs-only }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: c
        uses: ./.github/actions/classify-changes # zizmor: ignore[self-repository]
        with:
          # No gated job reads docs/ or CHANGELOG.md, and the tests/ files it does read are on the never-skip list
          # below; the suite reads all of tests/ and is never skipped. README.md is not here: tests/test_sbom.py
          # reads it. The list is by file type, because bash-ci takes every tracked file with a shell name or a shell
          # shebang repo-wide; shell names are also never-skip below. tests/test_path_aware_gating.py checks this list
          # against what each gated job reads or enumerates.
          docs-only-patterns: |
            docs/**/*.md
            tests/**/*.py
            tests/**/*.json
            tests/**/*.txt
            CHANGELOG.md
          # The test files gated jobs run or import (.github/ and fixture/ are never docs only already):
          # dast-live runs tests/test_dast.py, which imports tests/test_workflows.py; rescan-live runs
          # tests/test_verify_published.py; fixture-sbom runs tests/test_sbom.py; tests/fixtures/ holds their samples.
          never-skip-patterns: |
            **/*.sh
            **/*.bash
            tests/test_dast.py
            tests/test_verify_published.py
            tests/test_workflows.py
            tests/test_sbom.py
            tests/fixtures/**

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    # normal: ~1 min (p50 0.3, p95 0.6; last ~30 green runs)
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          fail-on-error: true

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    # normal: ~1 min (p50 0.3, p95 0.5; last ~30 green runs)
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.30.1
          persona: pedantic
          advanced-security: false

  test:
    name: Test the workflows
    runs-on: ubuntu-latest
    # tests/test_wait_ci.py alone is about 540 process-bound scenarios; main took six minutes of the old ten and
    # the wait-ci pull request (#262) was cancelled at ten. A hung scenario still fails on its own: every run of the
    # script under test has a 60 second subprocess timeout.
    # normal: ~12 min (p50 12.5, p95 16.2; last ~30 green runs)
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # tests/test_wiki.py reads the release tags

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          # No pip cache in an audit job: audit.yml (block, Doppler) restores the same key (EX-0001).

      - name: Install test dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Lint the tests
        run: |
          ruff check tests/
          ruff format --check tests/

      # tests/test_wait_ci.py runs the watcher's jq expression with the real jq; ubuntu-latest ships it, this keeps a
      # missing one from skipping the tests (they fail when CI is set and jq is absent).
      - name: Require jq
        run: command -v jq >/dev/null || sudo apt-get install -y --no-install-recommends jq

      # pytest-xdist (requirements-dev.txt): one worker per CPU. The tests share no port, fixed path or working
      # directory (each scenario builds its own tmp_path and binds port 0), so the suite asserts the same things in
      # a fraction of the wall time. -n is in the command, not in pyproject.toml, so a local `pytest` stays serial.
      - name: Run the tests
        run: pytest -q -n auto

  # The fixture project (fixture/README.md) through python-ci.yml at this ref.
  # The grant is what a caller gives: python-ci narrows it to contents: read
  # on every job but the coverage upload, which never runs on a pull request.
  fixture-ci:
    name: fixture
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    # `$/.github/workflows/...` is the form zizmor asks for; actionlint still
    # rejects it (see security-self.yml).
    uses: ./.github/workflows/python-ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      id-token: write  # what a caller grants for Codecov and Doppler; python-ci keeps it off the test job
    with:
      # normal: ~1 min (p50 0.8, p95 2.8; last ~30 green runs)
      timeout-minutes: 10
      runners: '["ubuntu-24.04", "ubuntu-24.04-arm"]'
      distros: '["debian:12", "debian:13", "ubuntu:24.04", "kalilinux/kali-rolling", "parrotsec/core"]'
      distro-runners: '["ubuntu-24.04", "ubuntu-24.04-arm"]'
      install-command: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r fixture/requirements.txt
        pip install --no-deps ./fixture
      # pytest-cov is in the hash-locked fixture requirements; the XML it
      # writes feeds the threshold, measured at 76% and set a few points below.
      test-command: pytest fixture/tests --cov=fixture_app --cov-report=xml
      xdist: true  # PYTEST_ADDOPTS=-n auto reaches this pytest; the distro job runs the command as written
      coverage-threshold: "70"
      typecheck-install-command: pip install mypy==2.4.1
      typecheck-command: mypy fixture/src
      lint-install-command: pip install "$(grep -oE '^ruff==[0-9.]+' requirements-dev.txt)"
      lint-command: ruff check fixture
      smoke-install-command: pip install --no-deps ./fixture
      smoke-command: |
        fixture-app --version
        python -m fixture_app ci
      dockerfile: fixture/Dockerfile
      docker-context: fixture
      docker-test-command: |
        docker run --rm "$IMAGE" --version
        test "$(docker run --rm --entrypoint id "$IMAGE" -u)" != "0"
      zizmor-persona: pedantic
      # The two pull-request checks, with the smallest commands that still
      # need what they exist for: the whole history, and BASE and HEAD set.
      fragment-check-command: |
        git rev-parse --verify --quiet "origin/$BASE"
        test -n "$(git diff --name-only "origin/$BASE...HEAD")"
      commit-claims-command: |
        git cat-file -e "$HEAD"
        test "$(git rev-list --count "origin/$BASE..HEAD")" -gt 0

  # bash-ci.yml at this ref over every script in this repository: the
  # fixture's, and scripts/doppler-ci-set.sh. Block mode with the workflow's
  # own default list, so a host the list lacks fails here, named in the log,
  # before a caller meets it. Workflow lint is off because the jobs above
  # already run actionlint and zizmor over these files.
  fixture-bash:
    name: fixture shell
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/bash-ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
    with:
      # normal: ~1 min (p50 0.5, p95 1.0; last ~30 green runs)
      timeout-minutes: 5
      runners: '["ubuntu-24.04", "ubuntu-24.04-arm"]'
      distros: '["debian:13", "kalilinux/kali-rolling"]'
      distro-runners: '["ubuntu-24.04", "ubuntu-24.04-arm"]'
      shfmt-args: -i 2 -ci
      test-command: fixture/tests/test_greet.sh
      config-lint-command: |
        yamllint -d '{extends: relaxed, rules: {line-length: disable}}' .github fixture baseline
      workflow-lint: false
      egress-policy: block
      fragment-check-command: |
        git rev-parse --verify --quiet "origin/$BASE"
        test -n "$(git diff --name-only "origin/$BASE...HEAD")"
      commit-claims-command: |
        git cat-file -e "$HEAD"
        test "$(git rev-list --count "origin/$BASE..HEAD")" -gt 0

  # python-fuzz.yml at this ref over the fixture's one Atheris target, for five
  # seconds, in block mode with the workflow's own default list, so a host the
  # list lacks fails here before a caller meets it. That a crashing target
  # fails the job is proved by tests/test_fuzz.py, which runs the workflow's
  # run step against one: a deliberately failing job here would leave every
  # run red.
  fixture-fuzz:
    name: fixture fuzz
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/python-fuzz.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
    with:
      # normal: ~1 min (p50 0.5, p95 0.7; last ~30 green runs)
      timeout-minutes: 5
      fuzz-dir: fixture/fuzz
      seconds-per-target: 5
      install-command: pip install --no-deps ./fixture
      egress-policy: block

  # The fixture package through python-package-release.yml at this ref:
  # build, check, smoke-test from the wheel, never publish. The writes are
  # what the two publishing jobs declare; publish is false so both are
  # skipped, and neither checks anything out. Block mode with the default
  # list, so the build's hosts are measured here.
  fixture-package:
    name: fixture package
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/python-package-release.yml # zizmor: ignore[self-repository]
    permissions:
      contents: write  # the github-release job declares it for the publishing path it never takes here
      id-token: write  # likewise: PyPI Trusted Publishing and provenance, only when publish is true
      attestations: write  # likewise: the SLSA provenance record
    with:
      # normal: ~1 min (p50 0.6, p95 0.9; last ~30 green runs)
      timeout-minutes: 5
      publish: false
      package-directory: fixture
      verify-command: test "$VERSION" = "0.1.0"
      smoke-command: |
        fixture-app --version
        python -m fixture_app ci
      release-notes-command: printf 'fixture %s\n' "$VERSION"
      egress-policy: block

  # artifact-release.yml at this ref over a tarball of the fixture's scripts:
  # build, verify, collect, never publish. Same grants and gating as the
  # package job above. Block mode with the default list: the build reaches
  # nothing, so what is measured here is the workflow's own overhead.
  fixture-artifact:
    name: fixture artifact
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/artifact-release.yml # zizmor: ignore[self-repository]
    permissions:
      contents: write  # the publish job declares it for the path it never takes here
      id-token: write  # likewise: keyless signing and provenance, only when publish is true
      attestations: write  # likewise: the SLSA provenance record
    with:
      # normal: ~1 min (p50 0.3, p95 0.5; last ~30 green runs)
      timeout-minutes: 5
      publish: false
      build-command: |
        mkdir -p dist
        tar czf "dist/fixture-scripts-$VERSION.tgz" fixture/scripts
      verify-command: tar tzf dist/fixture-scripts-*.tgz | grep -q greet.sh
      artifacts: dist/*.tgz
      egress-policy: block

  # tofu-ci.yml at this ref over the fixture's provider-free module: fmt,
  # validate, `tofu test` over fixture/tofu/tests, tflint, the configuration
  # scan, and `opa test` over fixture/policy; no plan command, so the
  # Doppler-gated job is skipped. Block mode with the default list, which
  # is the tool downloads and Trivy's checks bundle.
  fixture-tofu:
    name: fixture tofu
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/tofu-ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      id-token: write  # what a caller grants for the plan job's Doppler fetch; skipped here
    with:
      # normal: ~1 min (p50 0.4, p95 0.9; last ~30 green runs)
      timeout-minutes: 5
      directories: fixture/tofu
      test: true
      test-matrix: true  # one leg here; the matrix path runs against a real module
      policy-directories: fixture/policy
      workflow-lint: false
      egress-policy: block

  # arduino-ci.yml at this ref over the fixture's blink sketch for an Uno:
  # the smallest core there is, so the job measures arduino-cli's own hosts
  # and nothing else. Block mode with the default list.
  fixture-arduino:
    name: fixture firmware
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/arduino-ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
    with:
      # normal: ~1 min (p50 0.6, p95 0.7; last ~30 green runs)
      timeout-minutes: 5
      sketches: fixture/firmware/blink
      workflow-lint: false
      egress-policy: block

  # docs-pages.yml at this ref over a one-page site: install, build, check the
  # output directory; deploy: false, so nothing is uploaded or deployed here
  # and this repository's Pages are never touched. The grants are what the
  # deploy job declares, which deploy: false skips.
  fixture-pages:
    name: fixture docs pages
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/docs-pages.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      pages: write  # the deploy job declares it for the path it never takes here
      id-token: write  # likewise: Pages verifies the deploy against it
    with:
      # normal: ~1 min (p50 0.4, p95 0.5; last ~30 green runs)
      timeout-minutes: 5
      deploy: false
      install-command: python -m pip --version
      build-command: |
        mkdir -p site
        cp fixture/site-src/index.html site/index.html
      egress-policy: block

  # wiki-publish.yml at this ref with a generator that writes two pages:
  # generate and keep the tree, never publish. contents: write is what the
  # publish job declares for the path publish: false skips.
  fixture-wiki:
    name: fixture wiki
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/wiki-publish.yml # zizmor: ignore[self-repository]
    permissions:
      contents: write  # the publish job declares it for the path it never takes here
    with:
      # normal: ~1 min (p50 0.3, p95 0.5; last ~30 green runs)
      timeout-minutes: 5
      publish: false
      generate-command: |
        mkdir -p "$OUT_DIR"
        printf '# Home\n\nSource %s\n' "$SOURCE_SHA" > "$OUT_DIR/Home.md"
        printf '* [Home](Home)\n' > "$OUT_DIR/_Sidebar.md"
      egress-policy: block

  # project-sync.yml at this ref in a dry run with no key: the workflow's
  # structure, the Doppler gate and the safo Action start under block mode
  # with the workflow's own default list. A dry run with no token says so and
  # succeeds; the sync's behaviour is tested in ChiefGyk3D/scrum-around-and-find-out, and an
  # end-to-end against a real board needs the maintainer's App (README).
  fixture-project-sync:
    name: fixture project sync
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/project-sync.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      id-token: write  # what a caller grants for the Doppler fetch
    with:
      # normal: ~1 min (p50 0.4, p95 0.6; last ~30 green runs)
      timeout-minutes: 5
      project-url: https://github.com/orgs/N0TST/projects/2
      app-id: "1"  # a placeholder: a dry run with no key mints nothing
      dry-run: true
      egress-policy: block

  # The fixture image through python-docker-release.yml at this ref: build,
  # check and scan, never publish. The writes are what the release job
  # declares for the publishing path; the called job holds them on a pull
  # request from this repository exactly as it does in every caller, and a
  # fork's pull request, whose token could not carry them, skips the job.
  fixture-release:
    name: fixture release
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/python-docker-release.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      packages: write  # the build job declares it for the temporary-tag push it never makes here
      id-token: write  # likewise: the merge job (skipped here) signs and attests, only after a push
      attestations: write  # likewise: the SLSA provenance record
      security-events: write  # the Trivy SARIF upload, which does run
    with:
      # normal: ~1 min (p50 1.1, p95 1.3; last ~30 green runs)
      timeout-minutes: 5
      push: false
      dockerfile: fixture/Dockerfile
      context: fixture
      docker-test-command: docker run --rm "$IMAGE" --version
      probe-read-only: true
      probe-command: --version
      trivyignores: fixture/.trivyignore

  # Which image the two jobs below check, read from ONE file: fixture/gyst-fixture/DIGEST. While it says
  # `unpublished` they keep checking the star-daemon image; once it holds a sha256 they check
  # ghcr.io/chiefgyk3d/gyst-fixture@<that digest>, the image fixture-image.yml publishes through container-release.yml.
  # The digest appears nowhere else (tests/test_fixture_image.py). A value that is neither fails here, so a typo cannot
  # fall back to the old image.
  fixture-pin:
    name: fixture pin
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      image: ${{ steps.pin.outputs.image }}
      source-repository: ${{ steps.pin.outputs.source-repository }}
      identity-regexp: ${{ steps.pin.outputs.identity-regexp }}
      test-command: ${{ steps.pin.outputs.test-command }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: fixture/gyst-fixture/DIGEST
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Read the pin
        id: pin
        env:
          DIGEST_FILE: fixture/gyst-fixture/DIGEST
        run: |
          set -euo pipefail
          pin="$(tr -d '[:space:]' < "$DIGEST_FILE")"
          if [ "$pin" = unpublished ]; then
            cat >> "$GITHUB_OUTPUT" << 'EOF'
          image=ghcr.io/chiefgyk3d/star-daemon:latest
          source-repository=ChiefGyk3D/Star-Daemon
          identity-regexp=^https://github.com/ChiefGyk3D/
          test-command=docker run --rm "$IMAGE" sh -c "python -m py_compile /app/star-daemon.py /app/star_daemon.py /app/star_announcer.py /app/github_stars.py /app/config.py /app/platforms.py"
          EOF
          elif [[ "$pin" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            cat >> "$GITHUB_OUTPUT" << EOF
          image=ghcr.io/chiefgyk3d/gyst-fixture@$pin
          source-repository=ChiefGyk3D/git-your-ship-together
          identity-regexp=^https://github\\.com/ChiefGyk3D/git-your-ship-together/\\.github/workflows/container-release\\.yml@refs/heads/main\$
          test-command=docker run --rm "\$IMAGE" | grep -Eqx '[0-9]+\\.[0-9]+\\.[0-9]+'
          EOF
          else
            echo "::error::$DIGEST_FILE must hold 'unpublished' or one sha256:<64 lowercase hex> digest"
            exit 1
          fi

  # verify-published.yml against the image this account publishes through
  # container-release.yml: signature, SBOM attestation and provenance verified
  # from outside, then each platform pulled and its entrypoint checked. The
  # check is the one star-daemon's own release runs on the built image.
  fixture-verify:
    name: fixture verify
    needs: [changes, fixture-pin]
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/verify-published.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read  # gh attestation verify reads with the workflow's own token
      packages: read  # pull the public image from GHCR
    with:
      # normal: ~1 min (p50 0.9, p95 1.2; last ~30 green runs)
      timeout-minutes: 5
      image: ${{ needs.fixture-pin.outputs.image }}
      source-repository: ${{ needs.fixture-pin.outputs.source-repository }}  # the repository that built it
      identity-regexp: ${{ needs.fixture-pin.outputs.identity-regexp }}
      test-command: ${{ needs.fixture-pin.outputs.test-command }}

  # verify-published.yml's rescan over the same published image: Trivy,
  # pinned by hash, against today's database, in block mode with the workflow's
  # own default list, so the database and image hosts are measured here. It
  # runs at CRITICAL only, so an advisory landing on a base layer on a Tuesday
  # does not turn main red; that the rescan DOES fail on a finding is proved by
  # the next job, against an SBOM that carries one.
  fixture-rescan:
    name: fixture rescan
    needs: [changes, fixture-pin]
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/verify-published.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read  # the call's own read grant
      packages: read  # the verify job pulls the public image from GHCR
    with:
      # normal: ~1 min (p50 0.5, p95 0.7; last ~30 green runs)
      timeout-minutes: 5
      image: ${{ needs.fixture-pin.outputs.image }}
      source-repository: ${{ needs.fixture-pin.outputs.source-repository }}  # the repository that built it
      identity-regexp: ${{ needs.fixture-pin.outputs.identity-regexp }}
      platforms: linux/amd64
      rescan: true
      rescan-severity: CRITICAL
      rescan-artifact-name: fixture-rescan

  # vendored-drift.yml at this ref over the fixture's vendored file: the lock's hash, then the generator's
  # --check, in block mode with the workflow's own default list. That the same check FAILS on drift is proved
  # by tests/test_vendored_drift.py, which runs the inlined script against hostile locks; a deliberately
  # failing job here would leave every run red.
  fixture-drift:
    name: fixture drift
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/vendored-drift.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
    with:
      # normal: ~1 min (p50 0.3, p95 0.5; last ~30 green runs)
      timeout-minutes: 5
      lock-files: fixture/vendored/tokens.lock.json
      generator-command: python3 fixture/vendored/gen_tokens.py

  # repin.yml at this ref in report-only mode (no App, no key, and a pull request is no event it opens from):
  # this repository holds no pins of itself, so it prints "no GYST pins" and succeeds. That a pull request is
  # opened only by the pin-only script, and never merged, is proved by tests/test_repin.py.
  fixture-repin:
    name: fixture repin
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/repin.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      id-token: write  # what a caller grants for the Doppler fetch
    with:
      # normal: ~1 min (p50 0.3, p95 0.5; last ~30 green runs)
      timeout-minutes: 5

  # pin-comments.yml at this ref over this repository's own workflows: every `# vX.Y.Z` comment must name the
  # commit it is pinned to. That the same check FAILS on a wrong comment, a missing one, a missing tag and an
  # unverifiable lookup is proved by tests/test_pin_comments.py against a fake API; a deliberately failing job
  # here would leave every run red.
  fixture-pin-comments:
    name: fixture pin comments
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/pin-comments.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
    with:
      # normal: ~1 min (p50 0.5, p95 0.6; last ~30 green runs)
      timeout-minutes: 5

  # token-drift.yml at this ref, in block mode with the workflow's own default list (api.github.com and github.com
  # only, so the live fetch needs nothing else, or this job goes red). `fixture-token-drift` checks a pin with the input
  # cross-checks and no network; `-live` also fetches this repository's LICENSE through the API at the default
  # branch's commit and requires the lock to equal it. The two planted fixtures run advisory, so their jobs are
  # green by design, and `token-drift-control` then fails unless both reported drifted=true: a green drift check
  # over fixtures that cannot go red proves nothing. tests/test_token_drift.py runs the script against hostile
  # locks, refs and responses.
  fixture-token-drift:
    name: fixture token drift
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/token-drift.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
    with:
      # normal: ~1 min (p50 0.3, p95 1.2; last ~30 green runs)
      timeout-minutes: 5
      lock-file: fixture/token-drift/ok/tokens.lock.json
      vendored-path: fixture/token-drift/ok/tokens.json
      source-repo: example/brand-tokens
      source-path: brand/tokens.json

  fixture-token-drift-live:
    name: fixture token drift (live)
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/token-drift.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
    with:
      # normal: ~1 min (p50 0.3, p95 0.9; last ~30 green runs)
      timeout-minutes: 5
      lock-file: fixture/token-drift/live/tokens.lock.json
      check-live: true

  fixture-token-drift-planted-pin:
    name: fixture token drift (planted pin)
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/token-drift.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
    with:
      # normal: ~1 min (p50 0.3, p95 1.0; last ~30 green runs)
      timeout-minutes: 5
      lock-file: fixture/token-drift/planted-pin/tokens.lock.json
      advisory: true

  fixture-token-drift-planted-live:
    name: fixture token drift (planted live)
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/token-drift.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
    with:
      # normal: ~1 min (p50 0.3, p95 0.5; last ~30 green runs)
      timeout-minutes: 5
      lock-file: fixture/token-drift/planted-live/tokens.lock.json
      check-live: true
      advisory: true

  token-drift-control:
    name: token drift control
    if: needs.changes.outputs.docs-only != 'true'
    needs: [changes, fixture-token-drift-planted-pin, fixture-token-drift-planted-live]
    runs-on: ubuntu-latest
    # normal: ~1 min (p50 0.2, p95 0.3; last ~30 green runs)
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: The check fired on the planted fixtures
        env:
          PIN: ${{ needs.fixture-token-drift-planted-pin.outputs.drifted }}
          LIVE: ${{ needs.fixture-token-drift-planted-live.outputs.drifted }}
        run: |
          set -euo pipefail
          echo "planted pin drifted=${PIN:-unset}; planted live drifted=${LIVE:-unset}"
          bad=0
          if [ "$PIN" != true ]; then
            echo "::error title=token drift control::the planted pin fixture must report drifted=true"
            bad=1
          fi
          if [ "$LIVE" != true ]; then
            echo "::error title=token drift control::the planted live fixture must report drifted=true"
            bad=1
          fi
          exit "$bad"

  # markdown-lint.yml at this ref over one clean document and one planted MD001 heading-level jump. The planted
  # call is advisory so the reusable job stays green, while markdown-lint-control fails unless rumdl reports at
  # least one finding. tests/test_markdown_lint.py exercises glob, config, annotation and fail-mode handling with
  # a fake rumdl executable; this fixture is the real release integration in CI.
  fixture-markdown-lint:
    name: fixture markdown lint
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/markdown-lint.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
    with:
      # normal: ~1 min (p50 0.3, p95 0.5; last ~30 green runs)
      timeout-minutes: 10
      globs: fixture/markdown-lint/passing.md
      egress-policy-secretless: block

  fixture-markdown-lint-planted:
    name: fixture markdown lint (planted)
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/markdown-lint.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
    with:
      # normal: ~1 min (p50 0.3, p95 0.5; last ~30 green runs)
      timeout-minutes: 10
      globs: fixture/markdown-lint/planted.md
      fail-on-findings: false
      egress-policy-secretless: block

  markdown-lint-control:
    name: markdown lint control
    needs: [changes, fixture-markdown-lint-planted]
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: The linter fired on the planted document
        env:
          FINDINGS: ${{ needs.fixture-markdown-lint-planted.outputs.findings }}
        run: |
          set -euo pipefail
          echo "planted Markdown findings=${FINDINGS:-unset}"
          case "$FINDINGS" in
            '' | *[!0-9]* | 0)
              echo "::error title=markdown lint control::the planted document must produce at least one finding"
              exit 1
              ;;
          esac

  # base-image-digest.yml at this ref over the fixture's Dockerfile, in block mode with the workflow's own
  # default list, so the registry and database hosts are measured here. exit-code "0" because a new advisory on
  # a Tuesday must not turn main red; that a fixable finding DOES fail the job is proved by
  # tests/test_base_image_digest.py and tests/test_base_image_workflow.py against fake docker and trivy.
  fixture-base-image:
    name: fixture base image
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/base-image-digest.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
    with:
      # normal: ~1 min (p50 0.5, p95 0.9; last ~30 green runs)
      timeout-minutes: 5
      dockerfile: fixture/Dockerfile
      exit-code: "0"

  # parallel-ci.yml at this ref over the fixture's one-page site: one build, then five checks side by side (the
  # plain one, a path-gated one, one that needs a tool the setup command installs, one with the pip cache, one
  # that reads the second output), in block mode with the workflow's own default list. The path rules, the
  # gate and the input validation are exercised against hostile values by tests/test_parallel_ci.py and
  # tests/test_ci_gate.py; a deliberately failing check here would leave every run red.
  fixture-parallel:
    name: fixture parallel
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/parallel-ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
    with:
      # normal: ~1 min (p50 0.3, p95 0.5; last ~30 green runs)
      build-timeout-minutes: 5
      setup-command: |
        mkdir -p "$RUNNER_TEMP/fixture-bin" "$RUNNER_TEMP/fixture-dl"
        echo download >"$RUNNER_TEMP/fixture-dl/note"
        printf '#!/bin/sh\necho fixture-tool\n' >"$RUNNER_TEMP/fixture-bin/fixture-tool"
        chmod +x "$RUNNER_TEMP/fixture-bin/fixture-tool"
        export PATH="$RUNNER_TEMP/fixture-bin:$PATH"
      build-command: |
        mkdir -p fixture-site "$RUNNER_TEMP/fixture-extra"
        cp fixture/site-src/index.html fixture-site/index.html
        printf 'second output\n' >"$RUNNER_TEMP/fixture-extra/note.txt"
        fixture-tool
      build-output-path: fixture-site
      extra-output-path: RUNNER_TEMP/fixture-extra
      cache-tool-path: RUNNER_TEMP/fixture-dl
      cache-tool-key-files: '["fixture/requirements.in"]'
      cache-pip-files: '["fixture/requirements.txt"]'
      areas: '{"docs": ["*.md", "docs/*"], "code": ["*"]}'
      # Every check below takes about 30 seconds (p95 0.5 min, last ~30 green runs); the plan's own default is 15.
      jobs: |
        [
          {"name": "site exists", "command": "test -s fixture-site/index.html", "timeout": 5},
          {"name": "code only", "command": "test -s fixture-site/index.html", "areas": ["code"], "timeout": 5},
          {"name": "tool on path", "command": "test \"$(fixture-tool)\" = fixture-tool", "tools": true, "build": false, "timeout": 5},
          {"name": "pip cache", "command": "mkdir -p ~/.cache/pip && echo fixture > ~/.cache/pip/fixture", "pip-cache": true, "build": false, "timeout": 5},
          {"name": "second output", "command": "test \"$(cat \"$RUNNER_TEMP/fixture-extra/note.txt\")\" = 'second output'", "timeout": 5}
        ]

  # ci-gate.yml at this ref over the job above: the gate a caller with several workflows side by side requires.
  # `if: always()` is what lets it judge a red job; that it FAILS on a failure, a cancellation and a skip nobody
  # asked for is proved by tests/test_ci_gate.py against the script it inlines.
  fixture-gate:
    name: fixture gate
    needs: [changes, fixture-parallel]
    if: always() && needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/ci-gate.yml # zizmor: ignore[self-repository]
    permissions: {}
    with:
      needs-json: ${{ toJSON(needs) }}

  # The real Trivy, installed by the workflow's own pinned step, over an SBOM
  # naming a package with known critical advisories. tests/test_verify_published.py
  # skips these unless RESCAN_LIVE is set.
  rescan-live:
    name: rescan fails when it should
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04
    # normal: ~1 min (p50 0.9, p95 1.5; last ~30 green runs)
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          # No pip cache in an audit job: audit.yml (block, Doppler) restores the same key (EX-0001).

      - name: Install test dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Run the live rescans
        env:
          RESCAN_LIVE: "1"
        run: pytest tests/test_verify_published.py -k live

  # dast.yml at this ref over the fixture's loopback server, which sends the
  # security headers a ZAP baseline looks for: it must pass at `low`, the
  # strictest level that has nothing to find on it. Block mode with the
  # workflow's own default list, so the image pull and the SARIF upload are
  # measured here. That the same scan FAILS on a page without them is proved by
  # the next job, which runs the real image: a deliberately failing job here
  # would leave every run red.
  fixture-dast:
    name: fixture dast
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/dast.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      security-events: write  # the SARIF upload, which runs here
    with:
      # normal: ~1 min (p50 1.1, p95 1.4; last ~30 green runs)
      timeout-minutes: 5
      start-command: python3 fixture/dast/server.py --port 8080
      target-url: http://127.0.0.1:8080
      fail-on: low
      egress-policy: block

  # Falsifiability of dast.yml, with the real ZAP image: the scan job's own
  # steps run against the fixture server, one scan per class of hole. The
  # baseline must pass the page with its headers and fail it without them
  # (`fail-on: medium`; `high` is not reached by a missing header). The page
  # that reflects its query unescaped must pass the baseline (passive rules
  # cannot see it) and fail the full scan at `high`, which the escaping page
  # must pass at `medium`. The api scan must import the committed OpenAPI
  # definition, whose server is a host that does not exist, and still scan
  # the loopback service. tests/test_dast.py skips these unless DAST_LIVE is
  # set, and fails them when it is set and docker is not usable, so this is
  # the job that holds the proof. The active scans take minutes each.
  dast-live:
    name: dast fails when it should
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-24.04
    # normal: ~9 min (p50 8.6, p95 9.2; last ~30 green runs)
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          # No pip cache in an audit job: audit.yml (block, Doppler) restores the same key (EX-0001).

      - name: Install test dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Run the live scans
        env:
          DAST_LIVE: "1"
        # -vv: without it pytest elides the middle of a failing step's output, which is ZAP's own log (issue 133).
        run: pytest -vv tests/test_dast.py -k live

  # The SBOMs the fixture-package job just wrote, validated against the
  # CycloneDX schema: the product of the workflow, not a sample of it. The
  # artifact is in this run, so no token beyond the default is involved.
  fixture-sbom:
    name: fixture sbom
    needs: [changes, fixture-package]
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    # normal: ~1 min (p50 0.4, p95 0.5; last ~30 green runs)
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          # No pip cache in an audit job: audit.yml (block, Doppler) restores the same key (EX-0001).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/
      - name: Validate what the package workflow wrote
        env:
          SBOM_DIR: ${{ runner.temp }}/sbom
        run: |
          set -euo pipefail
          ls -l "$SBOM_DIR"
          pip install --require-hashes -r requirements-dev.txt
          pytest tests/test_sbom.py

  # threat-model.yml at this ref over a one-model fixture: the model check in
  # block mode with the workflow's own default list, and a required topic so
  # the topic rule runs too. ai-paths stays empty, because this repository has
  # no AI surface of its own; the pull request rule is run against real git
  # repositories in tests/test_threat_model.py.
  fixture-threat-model:
    name: fixture threat model
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/threat-model.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
    with:
      # normal: ~1 min (p50 0.3, p95 0.4; last ~30 green runs)
      timeout-minutes: 5
      model-glob: fixture/threat-model/*.threat-dragon.json
      required-topics: prompt injection
      egress-policy: block

  # agent-scan.yml at this ref over fixture/agent-scan, in block mode: the clean files must pass the strictest
  # threshold (zero findings of any severity), so a scanner that fails closed on its own install or its inputs shows
  # here. The planted files run advisory, so the job is green by design, and `agent-scan-control` then fails unless
  # the scanners fired on them: a green scan of a fixture that cannot go red proves nothing. Neither call uploads a
  # report (no alert is opened on this repository), but the caller still grants what the called workflow declares.
  fixture-agent-scan:
    name: fixture agent scan
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/agent-scan.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      security-events: write  # declared by the upload jobs, which upload-sarif: false skips
    with:
      # normal: ~1 min (p50 0.9, p95 1.1; last ~30 green runs)
      timeout-minutes: 5
      skill-paths: fixture/agent-scan/clean-skill
      mcp-tool-files: fixture/agent-scan/mcp/clean-tools.json
      fail-on-severity: info
      upload-sarif: false
      egress-policy: block
      egress-policy-secretless: block

  fixture-agent-scan-planted:
    name: fixture agent scan (planted)
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.changes.outputs.docs-only != 'true'
    uses: ./.github/workflows/agent-scan.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      security-events: write  # declared by the upload jobs, which upload-sarif: false skips
    with:
      # normal: ~1 min (p50 0.9, p95 1.1; last ~30 green runs)
      timeout-minutes: 5
      skill-paths: fixture/agent-scan/planted-skill
      mcp-tool-files: fixture/agent-scan/mcp/planted-tools.json
      upload-sarif: false
      egress-policy: block
      egress-policy-secretless: block

  agent-scan-control:
    name: agent scan control
    if: needs.changes.outputs.docs-only != 'true'
    needs: [changes, fixture-agent-scan-planted]
    runs-on: ubuntu-latest
    # normal: ~1 min (p50 0.2, p95 0.3; last ~30 green runs)
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: The scanners fired on the planted files
        env:
          SKILL_MAX: ${{ needs.fixture-agent-scan-planted.outputs.skill-max-severity }}
          SKILL_N: ${{ needs.fixture-agent-scan-planted.outputs.skill-findings }}
          MCP_MAX: ${{ needs.fixture-agent-scan-planted.outputs.mcp-max-severity }}
          MCP_N: ${{ needs.fixture-agent-scan-planted.outputs.mcp-findings }}
        run: |
          set -euo pipefail
          echo "skill: $SKILL_N finding(s), highest ${SKILL_MAX:-unset}; mcp: $MCP_N finding(s), highest ${MCP_MAX:-unset}"
          bad=0
          if [ "$SKILL_MAX" != critical ]; then
            echo "::error title=agent scan control::the planted skill must produce a critical finding"
            bad=1
          fi
          if [ "$MCP_MAX" != high ]; then
            echo "::error title=agent scan control::the planted tool list must produce a high finding"
            bad=1
          fi
          exit "$bad"

  # The composite actions a caller's `CI green` is built from, loaded and run by a real runner. v1.32.0 shipped a
  # ci-gate manifest that no runner could load (an expression over `needs` in an input description), and nothing
  # here ever ran it, so nothing noticed. This job runs the local action with stub `needs` JSON: the two cases that
  # must pass are plain steps, so a manifest the runner cannot load, or a gate that refuses a good input, fails the
  # job. The cases that must fail (a failed job, an unnamed skip, a missing input) are proved by
  # tests/test_docs_only_fast_path.py against the script the action calls; a failing step cannot be asserted here
  # without masking its result. tests/test_action_manifests.py is the static half.
  fixture-ci-gate-action:
    name: fixture ci-gate action
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    # normal: ~1 min (p50 0.2, p95 0.3; last ~30 green runs)
    timeout-minutes: 5
    permissions:
      contents: read  # check out the repository so the local ci-gate action and its script can be loaded; nothing is written
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: All needed jobs succeeded
        uses: ./.github/actions/ci-gate # zizmor: ignore[self-repository]
        with:
          needs: '{"a": {"result": "success", "outputs": {}}, "b": {"result": "success", "outputs": {}}}'
          required-jobs: a b

      - name: A named job skipped on a docs-only change
        uses: ./.github/actions/ci-gate # zizmor: ignore[self-repository]
        with:
          needs: '{"classify": {"result": "success", "outputs": {"docs-only": "true", "reason": "stub"}}, "tofu": {"result": "skipped", "outputs": {}}}'
          required-jobs: classify tofu
          skippable-jobs: tofu
          classifier-job: classify

  # classify-changes on the event this run has. On a pull request it reads the changed files through the API; on a
  # push it says false, "not a pull request". Either way the action must load, run and produce its outputs, and
  # that is all this asserts: the verdict depends on the pull request, so it is never compared. pull-requests: read
  # is what the action documents it needs.
  fixture-classify-action:
    name: fixture classify action
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    # normal: ~1 min (p50 0.2, p95 0.4; last ~30 green runs)
    timeout-minutes: 5
    permissions:
      contents: read  # check out the repository so the local classify-changes action and its script can be loaded; nothing is written
      pull-requests: read  # classify-changes lists the pull request's changed files through the API; a fork's token has it too
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Classify this event
        id: classify
        uses: ./.github/actions/classify-changes # zizmor: ignore[self-repository]
        with:
          docs-only-patterns: |
            docs/**
            tests/**
            *.md

      - name: The action produced its outputs
        env:
          DOCS_ONLY: ${{ steps.classify.outputs.docs-only }}
          REASON: ${{ steps.classify.outputs.reason }}
          CHANGED: ${{ steps.classify.outputs.changed }}
        run: |
          set -euo pipefail
          echo "docs-only=$DOCS_ONLY changed=$CHANGED reason=$REASON"
          case "$DOCS_ONLY" in true | false) ;; *) echo "::error::docs-only is '$DOCS_ONLY'"; exit 1 ;; esac
          test -n "$REASON" || { echo "::error::no reason output"; exit 1; }
          case "$CHANGED" in '' | *[!0-9]*) echo "::error::changed is '$CHANGED'"; exit 1 ;; esac

  ci-green:
    name: CI green
    if: always()
    needs: [changes, actionlint, zizmor, test, fixture-ci, fixture-bash, fixture-fuzz, fixture-tofu, fixture-arduino, fixture-package, fixture-sbom, fixture-artifact, fixture-pages, fixture-wiki, fixture-release, fixture-pin, fixture-verify, fixture-rescan, fixture-drift, fixture-token-drift, fixture-token-drift-live, fixture-token-drift-planted-pin, fixture-token-drift-planted-live, token-drift-control, fixture-markdown-lint, fixture-markdown-lint-planted, markdown-lint-control, fixture-pin-comments, fixture-base-image, fixture-repin, fixture-parallel, fixture-gate, fixture-ci-gate-action, fixture-classify-action, rescan-live, fixture-project-sync, fixture-dast, dast-live, fixture-threat-model, fixture-agent-scan, fixture-agent-scan-planted, agent-scan-control]
    runs-on: ubuntu-latest
    # normal: ~1 min (p50 0.2, p95 0.4; last ~30 green runs)
    timeout-minutes: 5
    permissions:
      contents: read  # the gate action and script are read from the trusted checkout below
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      # The code that judges a pull request must not come from the pull request: on a pull request this reads the gate
      # action and script from the base commit, otherwise from the commit that triggered the run. The verdict inputs
      # still come from `needs` and the changes job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: |
            .github/actions/ci-gate
            scripts/ci_gate.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Every needed job must be `success`. Two skips count, each by an explicit reason and only for the jobs named:
      # `changes` said docs-only=true, or this is a pull request from a fork and the job needs a token a fork does
      # not get. A skip for any other reason (an upstream failure, a mistyped `if:`, a `changes` that failed or said
      # false), a failure, a cancellation or a job dropped from `needs` fails.
      - name: Every job passed
        uses: ./.github/actions/ci-gate # zizmor: ignore[self-repository]
        with:
          needs: ${{ toJSON(needs) }}
          required-jobs: changes actionlint zizmor test fixture-ci fixture-bash fixture-fuzz fixture-package fixture-artifact fixture-tofu fixture-arduino fixture-pages fixture-wiki fixture-project-sync fixture-release fixture-pin fixture-verify fixture-rescan fixture-drift fixture-token-drift fixture-token-drift-live fixture-token-drift-planted-pin fixture-token-drift-planted-live token-drift-control fixture-markdown-lint fixture-markdown-lint-planted markdown-lint-control fixture-pin-comments fixture-repin fixture-base-image fixture-parallel fixture-gate fixture-ci-gate-action fixture-classify-action rescan-live fixture-dast dast-live fixture-sbom fixture-threat-model fixture-agent-scan fixture-agent-scan-planted agent-scan-control
          skippable-jobs: fixture-ci fixture-bash fixture-fuzz fixture-package fixture-artifact fixture-tofu fixture-arduino fixture-pages fixture-wiki fixture-project-sync fixture-release fixture-pin fixture-verify fixture-rescan fixture-drift fixture-token-drift fixture-token-drift-live fixture-token-drift-planted-pin fixture-token-drift-planted-live token-drift-control fixture-markdown-lint fixture-markdown-lint-planted markdown-lint-control fixture-pin-comments fixture-repin fixture-base-image fixture-parallel fixture-gate fixture-ci-gate-action fixture-classify-action fixture-dast fixture-sbom fixture-threat-model fixture-agent-scan fixture-agent-scan-planted agent-scan-control rescan-live dast-live
          classifier-job: changes
          fork-skippable-jobs: fixture-package fixture-artifact fixture-pages fixture-wiki fixture-release fixture-dast fixture-sbom fixture-threat-model fixture-agent-scan fixture-agent-scan-planted agent-scan-control
          fork-pull-request: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
