# This repository's own security checks, run through the reusable workflow it
# ships: CodeQL over the workflow files themselves (the `actions` language),
# gitleaks over the history, pip-audit over the test dependencies, and the
# generic `audit-command` path over the fixture's lock, so both ways of
# naming a dependency audit are exercised here before a caller uses them.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    # `$/.github/workflows/security.yml` is the form GitHub recommends since
    # July 2026 and what zizmor asks for; actionlint still rejects it, and the
    # workflow-lint job runs both, so the `./` form stays until actionlint
    # parses `$/`.
    uses: ./.github/workflows/security.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      security-events: write  # CodeQL and Scorecard SARIF uploads
      pull-requests: write  # dependency-review summary comment
      id-token: write  # Scorecard publishing
    with:
      codeql-languages: actions  # no Python package here; `python` would find nothing and fail
      pip-audit-requirements: requirements-dev.txt
      audit-install-command: pip install pip-audit
      audit-command: pip-audit --requirement fixture/requirements.txt --strict
      scorecard: true
