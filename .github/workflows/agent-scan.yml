            yarl==1.25.1 \
                --hash=sha256:14b79a30a93a3ce2e8832603fd0ab780ada281b0ba5110b519a634f2d7d7d1fc \
                --hash=sha256:30eec96e8a91bd588ce897c9543f6d5d8d34b28fbcba28a4dedf20ebeae9fe57 \
                --hash=sha256:4d781294bb815ecb5ea57ff6bbf8038e0a31a95fdf3e1788f66e0dc100d64b58 \
                --hash=sha256:681c758b0490f9e96b78e5fa8e8dc6e648e9185bb6eaebe73183c33ea0c445f3 \
                --hash=sha256:77e5099b99b37f3cf79c246998ca9f7313a78054cd1809ec46bc1afad47e1c4c \
                --hash=sha256:be80550d9bfe83d9b62398a37081a90434e6df2d978ec345c3d2820de6beddab \
                --hash=sha256:c6f117789d22dce188e5754e8bc65b7e6ebf8cb73963b9fa761f672a5883769d
            zipp==4.1.2 \
                --hash=sha256:b30cb6cd253122169c47de245ca24a86bac2a5d3802ba15bf7ba6414eb9e144d
        run: |
          set -euo pipefail
          printf '%s\n' "$REQUIREMENTS" > "$RUNNER_TEMP/cisco-ai-mcp-scanner-requirements.txt"
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r "$RUNNER_TEMP/cisco-ai-mcp-scanner-requirements.txt"

      # The script below is the same text in both scan jobs (tests/test_agent_scan.py holds them equal and runs it).
      # It reads its inputs from the environment only, runs the scanner from an empty directory with an environment
      # of its own making (no token, no repository .env), and writes the report only when every target was scanned.
      - name: MCP tool scan (static engines only)
        id: scan
        env:
          KIND: mcp
          TARGETS: ${{ inputs.mcp-tool-files }}
          FAIL_ON: ${{ inputs.fail-on-severity }}
          WORKSPACE: ${{ github.workspace }}
          SARIF_OUT: ${{ runner.temp }}/mcp-scanner.sarif
        run: |
          python -I - <<'PY'
          import fnmatch
          import hashlib
          import json
          import os
          import re
          import stat
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          KIND = os.environ["KIND"]
          RANKS = {"info": 0, "low": 1, "medium": 2, "high": 3, "critical": 4}
          NAMES = {v: k for k, v in RANKS.items()}
          WORKSPACE = Path(os.environ["WORKSPACE"]).resolve()
          SARIF_OUT = Path(os.environ["SARIF_OUT"])
          MAX_TARGETS = 200
          MAX_ENTRIES = 100000
          MAX_DEPTH = 30
          MAX_MATCHED_BYTES = 256 * 1024 * 1024
          MAX_BYTES = 5 * 1024 * 1024
          TIMEOUT = 300
          errors = []


          def clean(value, limit=120):
              """Text from the scanner or the repository, reduced to characters that cannot start a command, a link or a mention."""
              return re.sub(r"[^A-Za-z0-9_./ :+,*-]", "?", str(value))[:limit]


          def error(message):
              errors.append(message)
              print(f"::error title=Agent scan::{clean(message, 300)}")


          fail_on = os.environ.get("FAIL_ON", "").strip().lower()
          if fail_on and fail_on not in RANKS:
              error(f"fail-on-severity must be empty or one of {', '.join(RANKS)}")
              fail_on = ""
          threshold = RANKS[fail_on] if fail_on else None
          if KIND not in ("skill", "mcp"):
              sys.exit("KIND must be skill or mcp")


          class Limit(Exception):
              pass


          def expand(pattern):
              """Paths under the workspace that match `pattern`, found by walking real directories only.

              A directory symlink is never entered, `.git` and dot-directories are skipped unless the pattern names them, and
              the walk stops at MAX_ENTRIES directory entries, MAX_DEPTH levels or MAX_MATCHED_BYTES of matched files.
              """
              parts = [part for part in pattern.split("/") if part not in ("", ".")]
              found, seen = [], {"entries": 0, "bytes": 0}

              def listing(directory):
                  try:
                      names = sorted(os.listdir(directory))
                  except OSError:
                      return []
                  seen["entries"] += len(names)
                  if seen["entries"] > MAX_ENTRIES:
                      raise Limit("too many entries")
                  return names

              def visible(name, part):
                  return name != ".git" and (not name.startswith(".") or part.startswith("."))

              def is_real_dir(path):
                  try:
                      return stat.S_ISDIR(os.lstat(path).st_mode)
                  except OSError:
                      return False

              def add(path):
                  info = os.lstat(path)
                  if stat.S_ISREG(info.st_mode):
                      seen["bytes"] += info.st_size
                      if seen["bytes"] > MAX_MATCHED_BYTES:
                          raise Limit("matched files are too large")
                  found.append(path)

              def walk(directory, rest, depth):
                  if depth > MAX_DEPTH:
                      raise Limit("too deep")
                  part, rest = rest[0], rest[1:]
                  if part == "**" and not rest:
                      part = "*"
                  if part == "**":
                      walk(directory, rest, depth)
                      for name in listing(directory):
                          child = os.path.join(directory, name)
                          if visible(name, "") and is_real_dir(child):
                              walk(child, [part, *rest], depth + 1)
                  elif not re.search(r"[*?\[]", part):
                      child = os.path.join(directory, part)
                      seen["entries"] += 1
                      if part != ".git" and os.path.lexists(child):
                          if not rest:
                              add(child)
                          elif is_real_dir(child):
                              walk(child, rest, depth + 1)
                  else:
                      for name in listing(directory):
                          child = os.path.join(directory, name)
                          if visible(name, part) and fnmatch.fnmatchcase(name, part):
                              if not rest:
                                  add(child)
                              elif is_real_dir(child):
                                  walk(child, rest, depth + 1)

              if parts:
                  walk(str(WORKSPACE), parts, 0)
              return [Path(path).relative_to(WORKSPACE).as_posix() for path in found]


          def find_targets():
              """The files or directories the caller named: relative to the workspace, inside it, never through `..`."""
              found = []
              for token in os.environ.get("TARGETS", "").split():
                  parts = Path(token).parts
                  if token.startswith(("/", "-", "~")) or ".." in parts or ".git" in parts:
                      error(f"{clean(token)} is not a path inside the repository")
                      continue
                  try:
                      matches = sorted(expand(token))
                  except Limit as exc:
                      error(f"{clean(token)}: {exc}")
                      continue
                  if not matches:
                      error(f"{clean(token)} matches nothing")
                  for match in matches:
                      real = (WORKSPACE / match).resolve()
                      if WORKSPACE not in real.parents:
                          error(f"{clean(match)} leads outside the repository")
                      elif real not in found:
                          found.append(real)
              if not found and not errors:
                  error("no paths to scan")
              if len(found) > MAX_TARGETS:
                  error(f"{len(found)} targets; the limit is {MAX_TARGETS}")
                  found = []
              return found


          def relative(path):
              return Path(path).relative_to(WORKSPACE).as_posix()


          def run(command, home):
              env = {
                  "PATH": os.environ["PATH"],
                  "HOME": home,
                  "LITELLM_LOCAL_MODEL_COST_MAP": "True",
                  "NO_COLOR": "1",
                  "PYTHONNOUSERSITE": "1",
              }
              try:
                  return subprocess.run(command, cwd=home, env=env, capture_output=True, text=True, timeout=TIMEOUT, check=False)
              except (OSError, subprocess.TimeoutExpired) as exc:
                  error(f"{command[0]} did not finish: {clean(type(exc).__name__)}")
                  return None


          def level_rank(result):
              severity = str((result.get("properties") or {}).get("severity", "")).lower()
              if severity in RANKS:
                  return RANKS[severity]
              return {"error": 3, "warning": 2}.get(result.get("level"), 0)


          def links_stay_inside(directory):
              """True when no symlink under `directory` leads outside the repository (the scanner would read what it points at)."""
              seen = 0
              for root, names, files in os.walk(directory):
                  for name in names + files:
                      seen += 1
                      path = Path(root, name)
                      if seen > 20000 or (path.is_symlink() and WORKSPACE not in path.resolve().parents):
                          error(f"{clean(relative(directory))}: too many files, or a symlink that leaves the repository")
                          return False
              return True


          def scan_skill(target, home, index):
              directory, name = (target, None) if target.is_dir() else (target.parent, target.name)
              if not links_stay_inside(directory):
                  return [], [], False
              out = Path(home) / f"skill-{index}.sarif"
              command = ["skill-scanner", "scan", str(directory), "--format", "sarif", "--output-sarif", str(out)]
              if name and name != "SKILL.md":
                  command.append(f"--skill-file={name}")
              done = run(command, home)
              if done is None:
                  return [], [], False
              if done.returncode != 0:
                  # The threshold is applied to the report below, never to an exit code, so a crash cannot pass for a finding
                  # and a partial report is never kept.
                  error(f"{clean(relative(target))}: the scanner exited {done.returncode}")
                  return [], [], False
              try:
                  run_ = json.loads(out.read_text())["runs"][0]
                  results, rules = list(run_["results"]), list(run_["tool"]["driver"].get("rules") or [])
              except (OSError, ValueError, KeyError, IndexError, TypeError):
                  error(f"{clean(relative(target))}: the scanner wrote no report (exit {done.returncode})")
                  return [], [], False
              prefix = str(WORKSPACE).lstrip("/") + "/"
              for result in results:
                  for location in result.get("locations") or []:
                      artifact = (location.get("physicalLocation") or {}).get("artifactLocation") or {}
                      uri = str(artifact.get("uri", ""))
                      artifact["uri"] = uri[len(prefix) :] if uri.startswith(prefix) else relative(target)
                      artifact["uriBaseId"] = "%SRCROOT%"
              worst = max((level_rank(r) for r in results), default=-1)
              tripped = threshold is not None and worst >= threshold
              return results, rules, tripped


          MCP_SEVERITY = {"LOW": "low", "MEDIUM": "medium", "HIGH": "high"}
          MCP_SCORE = {"low": "3.0", "medium": "5.5", "high": "8.0"}
          MCP_LEVEL = {"low": "note", "medium": "warning", "high": "error"}


          def scan_mcp(target, home, index):
              label = clean(relative(target))
              try:
                  if not target.is_file() or target.stat().st_size > MAX_BYTES:
                      raise ValueError("not a file, or over 5 MiB")
                  tools = json.loads(target.read_text(encoding="utf-8"))["tools"]
                  if not isinstance(tools, list) or not tools or not all(isinstance(t, dict) for t in tools):
                      raise ValueError("tools must be a non-empty list of objects")
                  names = [t.get("name") for t in tools]
                  if not all(isinstance(n, str) and n for n in names):
                      raise ValueError("every tool needs a name")
              except (OSError, ValueError, KeyError, TypeError, RecursionError) as exc:
                  error(f"{label}: not an MCP tools list ({clean(exc)})")
                  return [], [], False
              for name in sorted({n for n in names if names.count(n) > 1}):
                  error(f"{label}: more than one tool named {clean(name, 60)}; results could not be matched to tools")
              if len(set(names)) != len(names):
                  return [], [], False
              done = run(["mcp-scanner", "--analyzers", "yara", "--raw", "static", "--tools", str(target)], home)
              if done is None:
                  return [], [], False
              try:
                  scanned = json.loads(done.stdout)
                  if done.returncode != 0 or not isinstance(scanned, list) or not all(isinstance(e, dict) for e in scanned):
                      raise ValueError("exit status or shape")
              except ValueError:
                  error(f"{label}: the scanner did not report on all {len(tools)} tools (exit {done.returncode})")
                  return [], [], False
              # One result per requested tool, matched by name (names are unique, checked above): no duplicate, no result for
              # a tool nobody asked about, none missing, and the description the scanner saw is the one in the file.
              wanted = {t["name"]: t for t in tools}
              matched = {}
              for entry in scanned:
                  name = entry.get("tool_name")
                  if not isinstance(name, str) or name not in wanted:
                      error(f"{label}: result for a tool that was not requested: {clean(name, 60)}")
                  elif name in matched:
                      error(f"{label}: two results for tool {clean(name, 60)}")
                  else:
                      matched[name] = entry
                      seen_description, own = entry.get("tool_description"), wanted[name].get("description")
                      if isinstance(seen_description, str) and isinstance(own, str) and seen_description != own:
                          error(f"{label}: tool {clean(name, 60)}: the scanner saw a different description")
              for name in wanted:
                  if name not in matched:
                      error(f"{label}: no result for tool {clean(name, 60)}")
              if len(matched) != len(wanted) or len(scanned) != len(wanted):
                  error(f"{label}: {len(scanned)} results for {len(wanted)} tools")
                  return [], [], False
              results, rules, tripped = [], {}, False
              for entry in scanned:
                  tool = clean(entry.get("tool_name", "?"), 60)
                  if entry.get("status") != "completed" or not isinstance(entry.get("is_safe"), bool):
                      error(f"{label}: tool {tool} was not scanned")
                      continue
                  found = False
                  for analyzer, finding in (entry.get("findings") or {}).items():
                      if not isinstance(finding, dict):
                          error(f"{label}: tool {tool}: unreadable finding from {clean(analyzer, 40)}")
                          continue
                      raw = str(finding.get("severity", "")).upper()
                      if raw == "SAFE":
                          continue
                      severity = MCP_SEVERITY.get(raw)
                      if severity is None:
                          error(f"{label}: tool {tool}: unknown severity {clean(raw, 20)} from {clean(analyzer, 40)}")
                          continue
                      for threat in finding.get("threat_names") or ["UNSPECIFIED"]:
                          found = True
                          rule = "mcp-scanner/" + re.sub(r"[^a-z0-9]+", "-", str(threat).lower()).strip("-")[:60]
                          rules.setdefault(
                              rule,
                              {
                                  "id": rule,
                                  "shortDescription": {"text": clean(threat, 80)},
                                  "properties": {"security-severity": MCP_SCORE[severity], "tags": ["security", "mcp"]},
                              },
                          )
                          digest = hashlib.sha256(f"{label}|{tool}|{rule}|{analyzer}".encode()).hexdigest()[:32]
                          results.append(
                              {
                                  "ruleId": rule,
                                  "level": MCP_LEVEL[severity],
                                  "message": {"text": f"Tool {tool}: {clean(finding.get('threat_summary', threat), 200)}"},
                                  "properties": {"severity": severity.upper()},
                                  "locations": [
                                      {
                                          "physicalLocation": {
                                              "artifactLocation": {"uri": relative(target), "uriBaseId": "%SRCROOT%"}
                                          }
                                      }
                                  ],
                                  "partialFingerprints": {"agentScan/v1": digest},
                              }
                          )
                          tripped = tripped or (threshold is not None and RANKS[severity] >= threshold)
                  if not entry["is_safe"] and not found:
                      error(f"{label}: tool {tool} is reported unsafe with no finding to show")
              return results, list(rules.values()), tripped


          def main():
              targets = find_targets()
              results, rules, tripped, scanned, seen = [], {}, False, 0, set()
              with tempfile.TemporaryDirectory() as home:
                  for index, target in enumerate(targets):
                      if KIND == "skill":
                          found, found_rules, trip = scan_skill(target, home, index)
                      else:
                          found, found_rules, trip = scan_mcp(target, home, index)
                      scanned += 1
                      for result in found:
                          place = ((result.get("locations") or [{}])[0].get("physicalLocation") or {})
                          key = (
                              result.get("ruleId"),
                              (place.get("artifactLocation") or {}).get("uri"),
                              (place.get("region") or {}).get("startLine"),
                              (result.get("message") or {}).get("text"),
                          )
                          # Scanning one file of a directory scans its siblings too; a finding is reported once.
                          if key not in seen:
                              seen.add(key)
                              results.append(result)
                      for rule in found_rules:
                          rules.setdefault(rule.get("id"), rule)
                      tripped = tripped or trip
                      top = max((level_rank(r) for r in found), default=-1)
                      print(f"scanned {clean(relative(target))}: {len(found)} finding(s), highest {NAMES.get(top, 'none')}")
              counts = {name: 0 for name in RANKS}
              for result in results:
                  counts[NAMES[level_rank(result)]] += 1
              highest = max((level_rank(r) for r in results), default=-1)
              highest_name = NAMES.get(highest, "none")
              if not errors:
                  driver = {
                      "skill": {"name": "skill-scanner", "informationUri": "https://github.com/cisco-ai-defense/skill-scanner"},
                      "mcp": {"name": "mcp-scanner", "informationUri": "https://github.com/cisco-ai-defense/mcp-scanner"},
                  }[KIND]
                  sarif = {
                      "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
                      "version": "2.1.0",
                      "runs": [{"tool": {"driver": {**driver, "rules": list(rules.values())}}, "results": results}],
                  }
                  SARIF_OUT.write_text(json.dumps(sarif))
              summary = [
                  f"### {'Skill' if KIND == 'skill' else 'MCP tool'} scan (static engines only, advisory unless a threshold is set)",
                  "",
                  f"Scanned {scanned} target(s); {len(results)} finding(s); highest severity {highest_name}.",
                  "",
                  "| Severity | Findings |",
                  "| --- | --- |",
                  *[f"| {name} | {counts[name]} |" for name in reversed(list(RANKS))],
              ]
              shown = sorted(results, key=lambda r: -level_rank(r))[:50]
              if shown:
                  summary += ["", "| Severity | Rule | File |", "| --- | --- | --- |"]
                  for result in shown:
                      location = ((result.get("locations") or [{}])[0].get("physicalLocation") or {}).get("artifactLocation") or {}
                      name = NAMES[level_rank(result)]
                      summary.append(f"| {name} | `{clean(result.get('ruleId', ''), 60)}` | `{clean(location.get('uri', ''), 100)}` |")
                  if len(results) > len(shown):
                      summary.append(f"\n{len(results) - len(shown)} more in the SARIF report.")
              if errors:
                  summary += ["", f"The scan did not complete: {len(errors)} error(s). No report was uploaded."]
              if tripped:
                  summary += ["", f"A finding is at or above `{fail_on}`, so this job fails."]
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
                      handle.write("\n".join(summary) + "\n")
              if os.environ.get("GITHUB_OUTPUT"):
                  with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
                      handle.write(f"findings={len(results)}\nmax-severity={highest_name}\nscanned={scanned}\n")
                      handle.write(f"sarif={'false' if errors else 'true'}\n")
              if tripped:
                  print(f"::error title=Agent scan::a finding is at or above {fail_on}")
              sys.exit(1 if errors or tripped else 0)


          main()
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan.outputs.sarif == 'true'
        with:
          name: ${{ inputs.sarif-category }}-mcp
          path: ${{ runner.temp }}/mcp-scanner.sarif
          if-no-files-found: error
          retention-days: 14

  mcp-upload:
    name: Upload mcp-scan SARIF
    needs: mcp-scan
    if: >-
      always() && inputs.upload-sarif && needs.mcp-scan.outputs.sarif == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # the SARIF upload
    steps:
      - name: Validate the egress policy inputs (EX-0001)
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ (inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          disable-sudo: true
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ ((inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block') == 'block' }}

      - name: Egress canary (EX-0001)
        if: ${{ runner.os == 'Linux' && (((inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block') == 'block') }}
        timeout-minutes: 2
        shell: bash
        # The workspace root exists before checkout; a job default working-directory may not.
        working-directory: ${{ github.workspace }}
        run: |
          set -u
          NAMES="github.com api.github.com results-receiver.actions.githubusercontent.com"
          PORT=443
          canary_resolve() { timeout 5 getent ahostsv4 "$1" 2>/dev/null | awk '$2 == "STREAM" { print $1 }'; }
          canary_probe() { timeout 3 bash -c "exec 3<>\"/dev/tcp/\$0/\$1\"" "$1" "$PORT" 2>/dev/null; }
          canary_reach() {
            local i
            for i in 1 2 3 4; do
              canary_probe "$1" && return 0
              [ "$i" -lt 4 ] && sleep 1
            done
            return 1
          }
          canary_show() { local n=$1; shift; echo "+ $*"; { timeout 10 "$@" 2>&1 || true; } | head -n "$n" || true; }
          canary_diag() {
            local name
            echo "::group::egress canary diagnostics (EX-0001, for the GitHub Support ticket)"
            canary_show 5 uname -srmo
            canary_show 20 cat /etc/resolv.conf
            canary_show 20 bash -c "resolvectl status 2>/dev/null | grep -E '^ *(Current DNS Server|DNS Servers?|DNS Domain):'"
            canary_show 20 bash -c "ss -lun | grep ':53 '"
            for name in $NAMES pipelines.actions.githubusercontent.com; do
              canary_show 20 getent ahostsv4 "$name"
              canary_show 5 curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_connect}\n' --max-time 8 "https://$name"
            done
            echo "::endgroup::"
          }
          canary_main() {
            local tmp name addr n=0 bad
            tmp=$(mktemp -d) || return 1
            for _ in 1 2 3; do
              for name in $NAMES; do canary_resolve "$name" >>"$tmp/res.$name" & done
              wait
              sleep 1
            done
            for name in $NAMES; do
              if [ -s "$tmp/res.$name" ]; then sort -u "$tmp/res.$name"; else echo "-"; fi | sed "s|^|$name |" >>"$tmp/pairs"
            done
            while read -r name addr; do
              n=$((n + 1))
              ( { [ "$addr" != "-" ] && canary_reach "$addr"; } || echo "$name $addr" >"$tmp/bad.$n" ) </dev/null &
            done <"$tmp/pairs"
            wait
            bad=$(cat "$tmp"/bad.* 2>/dev/null | sort || true)
            rm -rf "$tmp"
            if [ -z "$bad" ]; then
              echo "egress canary: all $n addresses of $NAMES accept TCP $PORT"
              return 0
            fi
            echo "::error title=egress canary::egress broken on this runner (known westus2 DNS issue, EX-0001): rerun the job"
            echo "unreachable addresses (name address; '-' means the name did not resolve):"
            printf '%s\n' "$bad"
            canary_diag
            echo "EX-0001 egress canary failed, unreachable: $(printf '%s' "$bad" | tr '\n' ';')" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            return 1
          }
          set -m
          canary_main &
          main=$!
          (sleep 90; kill -TERM -- "-$main"; sleep 2; kill -KILL -- "-$main") >/dev/null 2>&1 &
          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
            kill -TERM -- "-$main" >/dev/null 2>&1 || true
            sleep 1
            kill -KILL -- "-$main" >/dev/null 2>&1 || true
          fi
          if [ "$rc" -eq 143 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=egress canary::the canary hit its 90 s deadline (EX-0001): rerun the job"
            rc=124
          fi
          exit "$rc"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.sarif-category }}-mcp
          path: agent-scan-report

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: agent-scan-report/mcp-scanner.sarif
          category: ${{ inputs.sarif-category }}-mcp
