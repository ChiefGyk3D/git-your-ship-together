# Reusable, optional scans of agent content: skills and MCP tool definitions.
#
#   skill-scan   cisco-ai-skill-scanner over the skill directories or entry files you name.
#   mcp-scan     cisco-ai-mcp-scanner, `static` mode, over the MCP `tools/list` JSON files you name.
#
# Off unless you pass paths, and advisory unless you pass `fail-on-severity`: findings go to the job summary and
# to code scanning as SARIF, and the job stays green. Call it with:
#
#   on:
#     push: { branches: [main] }
#     pull_request:
#   jobs:
#     agent-scan:
#       uses: ChiefGyk3D/git-your-ship-together/.github/workflows/agent-scan.yml@<sha> # vX.Y.Z
#       permissions:
#         contents: read
#         security-events: write   # declared by the upload jobs; a caller grants it even with `upload-sarif: false`
#       with:
#         skill-paths: |
#           .claude/skills/*
#           roles/*.md
#         mcp-tool-files: mcp/tools-list.json
#         fail-on-severity: high   # optional; leave it out and the scans only report
#
# Static engines only. Both scanners run their pattern, YARA-rule and structure checks on files already on the
# runner. There is no LLM engine, no cloud engine, no VirusTotal, no AI Defense API and no API key: the workflow
# takes no secret, passes the scanners an environment of its own making (no token, nothing from the repository's
# `.env`), runs them from an empty directory, and never passes a flag that would leave the machine
# (tests/test_agent_scan.py holds all of that). The skill scanner is not given `--use-behavioral` either.
#
# What the scan is and is not: a detector for known-bad text patterns in instruction files and tool descriptions
# (prompt-injection phrases, `curl | bash`, credential reads, hidden instructions). A clean result does not show
# that a skill or a tool is safe, and the checks cannot judge instruction text that is malicious in meaning
# alone. Read a finding as a lead.
#
# Supply chain. Each scanner is installed from a hash lock that travels inside this file (a reusable workflow
# cannot check out its own commit): `.github/requirements/cisco-ai-skill-scanner.{in,txt}` and
# `cisco-ai-mcp-scanner.{in,txt}`, copied in by scripts/tool_locks.py, installed with `--require-hashes --no-deps
# --only-binary=:all:`. Both are Apache-2.0 on PyPI; the `.in` files name the exact versions.
#
# Jobs. The scan jobs read the repository and hold `contents: read` only. The upload jobs hold the one write
# (`security-events: write`), check nothing out and run nothing of the repository's: they carry one SARIF file
# from the scan job to the Security tab, as dast.yml does. A scan that could not cover every target (a bad path,
# a scanner that crashed, a file that is not a tools list) fails the job and uploads nothing, so an unreadable
# file never closes the alerts of the last good run.
#
# Skill targets. A directory is scanned as a skill (it needs a SKILL.md). A file is scanned as the entry file of
# its directory, one scanner run per file, so `roles/*.md` works. A scanner run covers the whole directory of its
# target, so findings in a sibling file can show up under a run of another; the report holds each one once.
#
# MCP targets. A JSON file of the form {"tools": [...]}, the output of a `tools/list` call. Prompts and
# resources are not scanned. Each tool must have a unique name, and the scanner must return exactly one result per
# tool; a duplicate, a missing or an unexpected result fails the job.
#
# Threshold. Neither scanner's exit code is used as a finding: the skill scanner must exit 0, and `fail-on-severity`
# is applied by this workflow to the severities in the parsed reports. The MCP scanner reports at most HIGH, so
# `critical` never fails there and `info` counts any finding.
#
# Egress. The scan jobs run third-party code beside your checkout, so they default to harden-runner `block` with an
# allow-list of the checkout and PyPI hosts (`egress-policy: audit` opts out). The scanners themselves reach nothing.

name: Agent scan (reusable)

on:
  workflow_call:
    inputs:
      skill-paths:
        description: "Skill directories or skill entry files to scan, relative to the repository root, whitespace- or newline-separated. Globs work (`.claude/skills/*`, `roles/*.md`, `**/SKILL.md`). A pattern that matches nothing fails the job. Paths with spaces are not supported. Empty skips the skill scan."
        type: string
        default: ""
      mcp-tool-files:
        description: "MCP tool-definition JSON files to scan (the output of `tools/list`, `{\"tools\": [...]}`), relative to the repository root, whitespace- or newline-separated; globs work. Empty skips the MCP scan."
        type: string
        default: ""
      fail-on-severity:
        description: "Fail the job when a finding is at or above this severity - `critical`, `high`, `medium`, `low` or `info`. Empty (the default) is advisory: findings are reported and the job stays green. The workflow applies it to the severities in the scanners' reports (the MCP scanner reports at most HIGH); a scanner that exits nonzero is an error, never a finding."
        type: string
        default: ""
      upload-sarif:
        description: Upload the SARIF reports to code scanning. Turn it off on a private repository without GitHub Advanced Security, where code scanning is unavailable and the upload fails the job; the scan, the job summary and the threshold still work. Fork pull requests never upload.
        type: boolean
        default: true
      sarif-category:
        description: Code scanning category prefix and artifact name prefix; the scans append `-skill` and `-mcp`. Change it when a repository calls this workflow twice in one run, so the two reports do not replace each other.
        type: string
        default: agent-scan
      python-version:
        description: Python for the scanners, 3.12 to 3.14 (the hash locks cover CPython 3.12 for the MCP scanner and 3.11 for the skill scanner, through 3.14). A version the runner does not already carry is downloaded, which needs more hosts than the default allow-list.
        type: string
        default: "3.13"
      egress-policy:
        description: harden-runner egress policy for the scan jobs, which run third-party scanner code beside your checkout - `block` (the default) allows only `allowed-endpoints` and `extra-allowed-endpoints`, `audit` only logs outbound connections. The upload jobs hold no secret and follow `egress-policy-secretless` instead (EX-0001).
        type: string
        default: block
      egress-policy-secretless:
        description: harden-runner egress policy for the jobs that hold no stored secret, no OIDC token and no write-scoped or publish-capable token (read-only contents, a SARIF upload at most), and whose output no privileged job consumes - exactly `audit` or `block`. Defaults to `audit` while security exception EX-0001 is active (GitHub-hosted runners in westus2 break harden-runner `block`; expires 2026-11-07 or when step-security/harden-runner#708 is fixed; see docs/security/exceptions/). Every job still has the default read-only job token. Set `block` to opt back in. Any other job follows `egress-policy`. Any other value fails the job.
        type: string
        default: audit
      allowed-endpoints:
        description: harden-runner allow-list for `block`, space-separated host:port entries. The default is the checkout and the pip install of the scanners from PyPI; the scanners themselves reach nothing (the MCP scanner is told not to fetch its price list). Wildcards are not supported and a newline-separated list matches nothing. The runner's own infrastructure needs no entry.
        type: string
        default: "api.github.com:443 files.pythonhosted.org:443 github.com:443 pypi.org:443"
      extra-allowed-endpoints:
        description: Appended to `allowed-endpoints`, for hosts only this repository reaches. Same format.
        type: string
        default: ""
      timeout-minutes:
        description: Per-job timeout of the scan jobs.
        type: number
        default: 15
    outputs:
      skill-findings:
        description: Number of skill-scan findings, after de-duplication. Empty when the skill scan did not run.
        value: ${{ jobs.skill-scan.outputs.findings }}
      skill-max-severity:
        description: Highest skill-scan severity - `critical`, `high`, `medium`, `low`, `info` or `none`. Empty when the skill scan did not run.
        value: ${{ jobs.skill-scan.outputs.max-severity }}
      mcp-findings:
        description: Number of MCP scan findings. Empty when the MCP scan did not run.
        value: ${{ jobs.mcp-scan.outputs.findings }}
      mcp-max-severity:
        description: Highest MCP scan severity - `high`, `medium`, `low` or `none`. Empty when the MCP scan did not run.
        value: ${{ jobs.mcp-scan.outputs.max-severity }}

permissions:
  contents: read

jobs:
  skill-scan:
    name: Skill scan
    if: inputs.skill-paths != ''
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read  # this job reads the repository's content and holds nothing else
    outputs:
      findings: ${{ steps.scan.outputs.findings }}
      max-severity: ${{ steps.scan.outputs.max-severity }}
      sarif: ${{ steps.scan.outputs.sarif }}
    steps:
      - name: Validate the egress policy inputs (EX-0001)
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ inputs.egress-policy == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          disable-sudo: true
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ (inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block' }}

      - name: Egress canary (EX-0001)
        if: ${{ runner.os == 'Linux' && ((inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block') }}
        timeout-minutes: 2
        shell: bash
        # The workspace root exists before checkout; a job default working-directory may not.
        working-directory: ${{ github.workspace }}
        run: |
          set -u
          NAMES="github.com api.github.com results-receiver.actions.githubusercontent.com"
          PORT=443
          canary_resolve() { timeout 5 getent ahostsv4 "$1" 2>/dev/null | awk '$2 == "STREAM" { print $1 }'; }
          canary_probe() { timeout 3 bash -c "exec 3<>\"/dev/tcp/\$0/\$1\"" "$1" "$PORT" 2>/dev/null; }
          canary_reach() {
            local i
            for i in 1 2 3 4; do
              canary_probe "$1" && return 0
              [ "$i" -lt 4 ] && sleep 1
            done
            return 1
          }
          canary_show() { local n=$1; shift; echo "+ $*"; { timeout 10 "$@" 2>&1 || true; } | head -n "$n" || true; }
          canary_diag() {
            local name
            echo "::group::egress canary diagnostics (EX-0001, for the GitHub Support ticket)"
            canary_show 5 uname -srmo
            canary_show 20 cat /etc/resolv.conf
            canary_show 20 bash -c "resolvectl status 2>/dev/null | grep -E '^ *(Current DNS Server|DNS Servers?|DNS Domain):'"
            canary_show 20 bash -c "ss -lun | grep ':53 '"
            for name in $NAMES pipelines.actions.githubusercontent.com; do
              canary_show 20 getent ahostsv4 "$name"
              canary_show 5 curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_connect}\n' --max-time 8 "https://$name"
            done
            echo "::endgroup::"
          }
          canary_main() {
            local tmp name addr n=0 bad
            tmp=$(mktemp -d) || return 1
            for _ in 1 2 3; do
              for name in $NAMES; do canary_resolve "$name" >>"$tmp/res.$name" & done
              wait
              sleep 1
            done
            for name in $NAMES; do
              if [ -s "$tmp/res.$name" ]; then sort -u "$tmp/res.$name"; else echo "-"; fi | sed "s|^|$name |" >>"$tmp/pairs"
            done
            while read -r name addr; do
              n=$((n + 1))
              ( { [ "$addr" != "-" ] && canary_reach "$addr"; } || echo "$name $addr" >"$tmp/bad.$n" ) </dev/null &
            done <"$tmp/pairs"
            wait
            bad=$(cat "$tmp"/bad.* 2>/dev/null | sort || true)
            rm -rf "$tmp"
            if [ -z "$bad" ]; then
              echo "egress canary: all $n addresses of $NAMES accept TCP $PORT"
              return 0
            fi
            echo "::error title=egress canary::egress broken on this runner (known westus2 DNS issue, EX-0001): rerun the job"
            echo "unreachable addresses (name address; '-' means the name did not resolve):"
            printf '%s\n' "$bad"
            canary_diag
            echo "EX-0001 egress canary failed, unreachable: $(printf '%s' "$bad" | tr '\n' ';')" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            return 1
          }
          set -m
          canary_main &
          main=$!
          (sleep 90; kill -TERM -- "-$main"; sleep 2; kill -KILL -- "-$main") >/dev/null 2>&1 &
          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
            kill -TERM -- "-$main" >/dev/null 2>&1 || true
            sleep 1
            kill -KILL -- "-$main" >/dev/null 2>&1 || true
          fi
          if [ "$rc" -eq 143 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=egress canary::the canary hit its 90 s deadline (EX-0001): rerun the job"
            rc=124
          fi
          exit "$rc"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      # The lock is .github/requirements/cisco-ai-skill-scanner.txt, copied here by scripts/tool_locks.py.
