        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: ${{ inputs.doppler-project }}
          doppler-config: ${{ inputs.doppler-config }}
          inject-env-vars: true
      # ---------------------------------------------------------------------

      # Codecov verifies this job's GitHub OIDC token, so a public repository
      # needs no Codecov token at all and nothing from Doppler reaches this
      # step. The Doppler steps above stay so a caller's `ci` config is still
      # exported here for anything else it may hold.
      - name: Upload coverage to Codecov
