# Reusable CI for a Python project: lint, a test matrix, an optional CLI smoke
# test, a single-arch container build that is run before it is trusted, and a
# lint of the caller's own workflow files.
#
# Call it from a repository with:
#
#   jobs:
#     ci:
#       uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-ci.yml@<sha> # vX.Y.Z
#       permissions:
#         contents: read
#         id-token: write        # OIDC: the Codecov upload and the Doppler fetch
#       secrets:
#         DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional fallback
#       with:
#         python-versions: '["3.11", "3.12", "3.13", "3.14", "3.15"]'
#         test-command: pytest --cov=my_pkg --cov-report=xml
#
# Every input has a default that matches the most common shape across the
# ChiefGyk3D repositories; a caller overrides only what differs. The `ci-green`
# job at the end is the one to name in branch protection: it fails when any job
# it needs failed, so a job added here can never merge unchecked.
#
# Commands a caller supplies (`lint-command`, `test-command`, ...) reach the
# shell through an environment variable, never by template expansion into the
# script, so a value can only ever be data.
#
# Secrets come from Doppler over the job's own OIDC identity; the steps are the
# same as .github/actions/doppler-secrets, inlined so that a caller pinned to a
# commit of this file gets exactly that commit's behaviour.

name: Python CI (reusable)

on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions for the test matrix. The default is the CPython versions still in security support (.github/python-support.json in this repository).
        type: string
        default: '["3.11", "3.12", "3.13", "3.14", "3.15"]'
      coverage-python-version:
        description: The matrix leg that uploads the coverage report.
        type: string
        default: "3.13"
      install-command:
        description: Shell run before tests on every matrix leg.
        type: string
        default: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      test-command:
        description: Shell that runs the test suite.
        type: string
        default: pytest
      coverage-file:
        description: Coverage report path uploaded as an artifact when present.
        type: string
        default: coverage.xml
      coverage-threshold:
        description: Minimum total line coverage, a percentage such as `85`; the test job fails below it. Read from `coverage-file` (Cobertura XML, which coverage.py and pytest-cov write) on the leg that uploads it, so the test command must produce that file. Empty skips the check.
        type: string
        default: ""
      codecov:
        description: Upload the coverage report to Codecov over GitHub OIDC; no Codecov token is stored anywhere. The repository must be enabled in the Codecov GitHub App.
        type: boolean
        default: false
      lint-python-version:
        description: Python used for the lint job.
        type: string
        default: "3.13"
      lint-install-command:
        description: >-
          Shell that installs the linters. The default pins ruff: an unpinned install turned every
          caller's lint red on the day ruff 0.17.0 changed its default target version (2026-10-09).
          Move the pin here, deliberately, with a release.
        type: string
        default: pip install "ruff==0.16.9"
      lint-command:
        description: Shell that lints. A non-zero exit fails the job unless `lint-continue-on-error` is set.
        type: string
        default: ruff check .
      lint-continue-on-error:
        description: Report lint failures without failing CI. A migration aid, not a resting state.
        type: boolean
        default: false
      typecheck-install-command:
        description: Shell that installs the type checker and whatever it needs to resolve imports, e.g. `pip install mypy==2.4.0`; empty installs nothing. Runs on `lint-python-version`.
        type: string
        default: ""
      typecheck-command:
        description: Shell that type-checks, e.g. `mypy src`; empty skips the `Type check` job.
        type: string
        default: ""
      fragment-check-command:
        description: Shell run on pull requests only, with the full history checked out and `BASE` set to the pull request's base branch name (so `origin/$BASE` resolves); empty skips the `Changelog fragment` job. For a repository that keeps one changelog fragment per change under `changelog.d/`, e.g. `python3 scripts/changelog.py check-pr --base "origin/$BASE"`. Part of the gate when set.
        type: string
        default: ""
      commit-claims-command:
        description: Shell run on pull requests only, with the full history checked out, `BASE` set to the base branch name and `HEAD` to the pull request's head commit; empty skips the `Commit claims` job. For a repository that checks what each commit message claims against its diff, e.g. `python3 scripts/check_commit_claims.py --range "origin/$BASE..HEAD"`. Part of the gate when set.
        type: string
        default: ""
      smoke-command:
        description: Shell run after `smoke-install-command` on `coverage-python-version`; empty skips the job.
        type: string
        default: ""
      smoke-install-command:
        description: Shell that installs the project for the smoke test.
        type: string
        default: pip install .
      docker-build:
        description: Build the container image (single platform, never pushed).
        type: boolean
        default: true
      dockerfile:
        description: Path to the Dockerfile.
        type: string
        default: Dockerfile
      docker-context:
        description: Build context.
        type: string
        default: "."
      docker-test-command:
        description: Shell run against the built image; `$IMAGE` names it. Empty skips the check.
        type: string
        default: ""
      workflow-lint:
        description: Run actionlint and zizmor over the caller's own .github/workflows.
        type: boolean
        default: true
      zizmor-persona:
        description: zizmor strictness - `regular`, `pedantic` or `auditor`.
        type: string
        default: regular
      runners:
        description: JSON array of runner labels for the `test` matrix, e.g. `["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15", "windows-2025"]`. The first entry also uploads the coverage report. A Windows runner runs the commands under bash.
        type: string
        default: '["ubuntu-24.04"]'
      distros:
        description: JSON array of container images to run the tests in as well, e.g. `["debian:13", "kalilinux/kali-rolling"]`. GitHub-hosted runners are Ubuntu, macOS and Windows only; another distribution is tested inside its official image on a runner. `[]` skips the job.
        type: string
        default: '[]'
      distro-runners:
        description: JSON array of runner labels the `distros` run on. Add `ubuntu-24.04-arm` to run the images natively on arm64.
        type: string
        default: '["ubuntu-24.04"]'
      distro-setup-command:
        description: Shell run as root inside each image before the install command. The default installs python3, python3-venv, python3-pip, git and ca-certificates with apt-get where it exists, else with dnf; non-interactive and quiet. The install and test commands then run in a fresh virtual environment.
        type: string
        default: |
          export DEBIAN_FRONTEND=noninteractive
          if command -v apt-get >/dev/null 2>&1; then
            # Kali's redirector hands out a different mirror per request, which
            # no egress list can follow; the CDN host it fronts is one name.
            if grep -qx 'ID=kali' /etc/os-release; then
              sed -i 's|http://http.kali.org|http://kali.download|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            fi
            # Parrot's package redirector (director.parrot.sh) does the same;
            # its /direct path serves the pool from deb.parrot.sh itself.
            if grep -qx 'ID=parrot' /etc/os-release; then
              sed -i 's|https://deb.parrot.sh/parrot|https://deb.parrot.sh/direct/parrot|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            fi
            # A mirror that answers 502, or is caught mid-sync (Kali's "File has
            # unexpected size", #228), is not retried by apt itself, so the whole
            # step is tried six times with a growing pause (20 s up to 60 s). The
            # package lists are cleared between tries so a partial index is never
            # reused; the last failure exits non-zero with apt's own error shown.
            for attempt in 1 2 3 4 5 6; do
              apt-get -o Acquire::Retries=3 update -qq &&
                apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends python3 python3-venv python3-pip git ca-certificates && break
              if [ "$attempt" = 6 ]; then
                echo "apt-get still failing after 6 attempts" >&2
                exit 1
              fi
              rm -rf /var/lib/apt/lists/*
              sleep $((attempt * 20 > 60 ? 60 : attempt * 20))
            done
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y -q python3 python3-pip git ca-certificates
          fi
      distro-egress-policy:
        description: harden-runner egress policy for the `distro` job - `audit` logs outbound connections, `block` allows only `distro-allowed-endpoints` and `extra-allowed-endpoints`.
        type: string
        default: block
      distro-allowed-endpoints:
        description: harden-runner allow-list for the `distro` job in `block`, space-separated host:port entries. The default is Docker Hub's image pull, the package mirrors of the Debian, Ubuntu, Kali and Parrot images, and the PyPI hosts the install command reaches. A distribution not named here (Fedora, whose metalink mirrors vary by run) needs its hosts in `extra-allowed-endpoints`, or `distro-egress-policy` set to `audit`. Wildcards are not supported and a newline-separated list matches nothing.
        type: string
        default: "archive.ubuntu.com:80 auth.docker.io:443 deb.debian.org:80 deb.parrot.sh:443 files.pythonhosted.org:443 kali.download:80 ports.ubuntu.com:80 production.cloudfront.docker.com:443 pypi.org:443 registry-1.docker.io:443 security.ubuntu.com:80"
      distro-continue-on-error:
        description: Let a failing distro run leave the gate green. For a suite that assumes a non-root user or a newer Python than the distribution ships; the result stays visible on the job.
        type: boolean
        default: false
      egress-policy:
        description: harden-runner egress policy for every job except `distro` - `audit` logs outbound connections, `block` allows only `allowed-endpoints`. Jobs that hold no secret follow `egress-policy-secretless` instead (EX-0001).
        type: string
        default: audit
      egress-policy-secretless:
        description: harden-runner egress policy for the jobs that hold no stored secret, no OIDC token and no write-scoped or publish-capable token (read-only contents, a SARIF upload at most), and whose output no privileged job consumes - exactly `audit` or `block`. Defaults to `audit` while security exception EX-0001 is active (GitHub-hosted runners in westus2 break harden-runner `block`; expires 2026-11-07 or when step-security/harden-runner#708 is fixed; see docs/security/exceptions/). Every job still has the default read-only job token. Set `block` to opt back in. Any other job follows `egress-policy`. Any other value fails the job.
        type: string
        default: audit
      allowed-endpoints:
        description: harden-runner allow-list for `block`, space-separated host:port entries. The default is every endpoint this workflow's jobs reached in audit mode across the calling repositories; the runner's own infrastructure needs no entry. Wildcards are not supported and a newline-separated list matches nothing.
        type: string
        default: "api.doppler.com:443 api.github.com:443 auth.docker.io:443 cli.codecov.io:443 deb.debian.org:80 files.pythonhosted.org:443 ghcr.io:443 github.com:443 ingest.codecov.io:443 keybase.io:443 pkg-containers.githubusercontent.com:443 production.cloudfront.docker.com:443 pypi.org:443 raw.githubusercontent.com:443 registry-1.docker.io:443 registry.npmjs.org:443 release-assets.githubusercontent.com:443 storage.googleapis.com:443"
      extra-allowed-endpoints:
        description: Appended to `allowed-endpoints`, for hosts only this repository reaches, such as an apt repository its Dockerfile adds. Same format.
        type: string
        default: ""
      doppler-project:
        description: Doppler project slug.
        type: string
        default: ""
      doppler-config:
        description: Doppler config slug holding CI secrets.
        type: string
        default: ""
      doppler-identity-id:
        description: Doppler Service Account Identity UUID for OIDC.
        type: string
        default: ""
      doppler-trusted-refs-only:
        description: Fetch CI secrets only on the default branch, a version tag (vN.N.N) or a schedule; never on a pull request or another branch. `false` restores fetching on every same-repository run.
        type: boolean
        default: true
      timeout-minutes:
        description: Per-job timeout.
        type: number
        default: 15
    secrets:
      DOPPLER_TOKEN:
        description: Doppler Service Token fallback when OIDC is not configured.
        required: false

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Validate the egress policy inputs (EX-0001)
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_DISTRO_EGRESS_POLICY: ${{ inputs.distro-egress-policy }}
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ (inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          disable-sudo: true
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ ((inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block') == 'block' }}

      - name: Egress canary (EX-0001)
        if: ${{ runner.os == 'Linux' && (((inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block') == 'block') }}
        timeout-minutes: 2
        shell: bash
        # The workspace root exists before checkout; a job default working-directory may not.
        working-directory: ${{ github.workspace }}
        run: |
          set -u
          NAMES="github.com api.github.com results-receiver.actions.githubusercontent.com"
          PORT=443
          canary_resolve() { timeout 5 getent ahostsv4 "$1" 2>/dev/null | awk '$2 == "STREAM" { print $1 }'; }
          canary_probe() { timeout 3 bash -c "exec 3<>\"/dev/tcp/\$0/\$1\"" "$1" "$PORT" 2>/dev/null; }
          canary_reach() {
            local i
            for i in 1 2 3 4; do
              canary_probe "$1" && return 0
              [ "$i" -lt 4 ] && sleep 1
            done
            return 1
          }
          canary_show() { local n=$1; shift; echo "+ $*"; { timeout 10 "$@" 2>&1 || true; } | head -n "$n" || true; }
          canary_diag() {
            local name
            echo "::group::egress canary diagnostics (EX-0001, for the GitHub Support ticket)"
            canary_show 5 uname -srmo
            canary_show 20 cat /etc/resolv.conf
            canary_show 20 bash -c "resolvectl status 2>/dev/null | grep -E '^ *(Current DNS Server|DNS Servers?|DNS Domain):'"
            canary_show 20 bash -c "ss -lun | grep ':53 '"
            for name in $NAMES pipelines.actions.githubusercontent.com; do
              canary_show 20 getent ahostsv4 "$name"
              canary_show 5 curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_connect}\n' --max-time 8 "https://$name"
            done
            echo "::endgroup::"
          }
          canary_main() {
            local tmp name addr n=0 bad
            tmp=$(mktemp -d) || return 1
            for _ in 1 2 3; do
              for name in $NAMES; do canary_resolve "$name" >>"$tmp/res.$name" & done
              wait
              sleep 1
            done
            for name in $NAMES; do
              if [ -s "$tmp/res.$name" ]; then sort -u "$tmp/res.$name"; else echo "-"; fi | sed "s|^|$name |" >>"$tmp/pairs"
            done
            while read -r name addr; do
              n=$((n + 1))
              ( { [ "$addr" != "-" ] && canary_reach "$addr"; } || echo "$name $addr" >"$tmp/bad.$n" ) </dev/null &
            done <"$tmp/pairs"
            wait
            bad=$(cat "$tmp"/bad.* 2>/dev/null | sort || true)
            rm -rf "$tmp"
            if [ -z "$bad" ]; then
              echo "egress canary: all $n addresses of $NAMES accept TCP $PORT"
              return 0
            fi
            echo "::error title=egress canary::egress broken on this runner (known westus2 DNS issue, EX-0001): rerun the job"
            echo "unreachable addresses (name address; '-' means the name did not resolve):"
            printf '%s\n' "$bad"
            canary_diag
            echo "EX-0001 egress canary failed, unreachable: $(printf '%s' "$bad" | tr '\n' ';')" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            return 1
          }
          set -m
          canary_main &
          main=$!
          (sleep 90; kill -TERM -- "-$main"; sleep 2; kill -KILL -- "-$main") >/dev/null 2>&1 &
          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
            kill -TERM -- "-$main" >/dev/null 2>&1 || true
            sleep 1
            kill -KILL -- "-$main" >/dev/null 2>&1 || true
          fi
          if [ "$rc" -eq 143 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=egress canary::the canary hit its 90 s deadline (EX-0001): rerun the job"
            rc=124
          fi
          exit "$rc"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.lint-python-version }}
          # pip's cache keys on a manifest; a repository without one (stdlib only)
          # would fail the step, so caching is skipped there.
          cache: ${{ ((inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block') == 'block' && hashFiles('**/requirements*.txt', '**/pyproject.toml', '**/setup.py') != '' && 'pip' || '' }}

      - name: Install linters
        env:
          COMMAND: ${{ inputs.lint-install-command }}
        run: bash -eo pipefail -c "$COMMAND"

      - name: Lint
        continue-on-error: ${{ inputs.lint-continue-on-error }}
        env:
          COMMAND: ${{ inputs.lint-command }}
        run: bash -eo pipefail -c "$COMMAND"

  typecheck:
    name: Type check
    if: inputs.typecheck-command != ''
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Validate the egress policy inputs (EX-0001)
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_DISTRO_EGRESS_POLICY: ${{ inputs.distro-egress-policy }}
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ (inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          disable-sudo: true
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ ((inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block') == 'block' }}

      - name: Egress canary (EX-0001)
        if: ${{ runner.os == 'Linux' && (((inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block') == 'block') }}
        timeout-minutes: 2
        shell: bash
        # The workspace root exists before checkout; a job default working-directory may not.
        working-directory: ${{ github.workspace }}
        run: |
          set -u
          NAMES="github.com api.github.com results-receiver.actions.githubusercontent.com"
          PORT=443
          canary_resolve() { timeout 5 getent ahostsv4 "$1" 2>/dev/null | awk '$2 == "STREAM" { print $1 }'; }
          canary_probe() { timeout 3 bash -c "exec 3<>\"/dev/tcp/\$0/\$1\"" "$1" "$PORT" 2>/dev/null; }
          canary_reach() {
            local i
            for i in 1 2 3 4; do
              canary_probe "$1" && return 0
              [ "$i" -lt 4 ] && sleep 1
            done
            return 1
          }
          canary_show() { local n=$1; shift; echo "+ $*"; { timeout 10 "$@" 2>&1 || true; } | head -n "$n" || true; }
          canary_diag() {
            local name
            echo "::group::egress canary diagnostics (EX-0001, for the GitHub Support ticket)"
            canary_show 5 uname -srmo
            canary_show 20 cat /etc/resolv.conf
            canary_show 20 bash -c "resolvectl status 2>/dev/null | grep -E '^ *(Current DNS Server|DNS Servers?|DNS Domain):'"
            canary_show 20 bash -c "ss -lun | grep ':53 '"
            for name in $NAMES pipelines.actions.githubusercontent.com; do
              canary_show 20 getent ahostsv4 "$name"
              canary_show 5 curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_connect}\n' --max-time 8 "https://$name"
            done
            echo "::endgroup::"
          }
          canary_main() {
            local tmp name addr n=0 bad
            tmp=$(mktemp -d) || return 1
            for _ in 1 2 3; do
              for name in $NAMES; do canary_resolve "$name" >>"$tmp/res.$name" & done
              wait
              sleep 1
            done
            for name in $NAMES; do
              if [ -s "$tmp/res.$name" ]; then sort -u "$tmp/res.$name"; else echo "-"; fi | sed "s|^|$name |" >>"$tmp/pairs"
            done
            while read -r name addr; do
              n=$((n + 1))
              ( { [ "$addr" != "-" ] && canary_reach "$addr"; } || echo "$name $addr" >"$tmp/bad.$n" ) </dev/null &
            done <"$tmp/pairs"
            wait
            bad=$(cat "$tmp"/bad.* 2>/dev/null | sort || true)
            rm -rf "$tmp"
            if [ -z "$bad" ]; then
              echo "egress canary: all $n addresses of $NAMES accept TCP $PORT"
              return 0
            fi
            echo "::error title=egress canary::egress broken on this runner (known westus2 DNS issue, EX-0001): rerun the job"
            echo "unreachable addresses (name address; '-' means the name did not resolve):"
            printf '%s\n' "$bad"
            canary_diag
            echo "EX-0001 egress canary failed, unreachable: $(printf '%s' "$bad" | tr '\n' ';')" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            return 1
          }
          set -m
          canary_main &
          main=$!
          (sleep 90; kill -TERM -- "-$main"; sleep 2; kill -KILL -- "-$main") >/dev/null 2>&1 &
          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
