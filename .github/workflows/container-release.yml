          canary_main &
          main=$!
          (sleep 90; kill -TERM -- "-$main"; sleep 2; kill -KILL -- "-$main") >/dev/null 2>&1 &
          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
            kill -TERM -- "-$main" >/dev/null 2>&1 || true
            sleep 1
            kill -KILL -- "-$main" >/dev/null 2>&1 || true
          fi
          if [ "$rc" -eq 143 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=egress canary::the canary hit its 90 s deadline (EX-0001): rerun the job"
            rc=124
          fi
          exit "$rc"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # hadolint is not a GitHub-owned action and not on the approved list, so it
      # is a pinned binary like shellcheck in bash-ci.yml: the cache holds only
      # the download, and the file on disk is checked against the pinned hash
      # whether it came from the cache or the network.
      - name: Restore the cached hadolint binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tool-cache/hadolint
          key: tool-hadolint-${{ inputs.hadolint-version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Fetch hadolint at the pinned version
        env:
          VERSION: ${{ inputs.hadolint-version }}
          AMD64_SHA256: ${{ inputs.hadolint-sha256-amd64 }}
          ARM64_SHA256: ${{ inputs.hadolint-sha256-arm64 }}
          RUNNER_ARCH_NAME: ${{ runner.arch }}
          CACHE_DIR: ${{ runner.temp }}/tool-cache/hadolint
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH_NAME" in
            X64) asset=hadolint-linux-x86_64; SHA256="$AMD64_SHA256" ;;
            ARM64) asset=hadolint-linux-arm64; SHA256="$ARM64_SHA256" ;;
            *) echo "::error title=hadolint::no hadolint binary for runner architecture $RUNNER_ARCH_NAME"; exit 1 ;;
          esac
          mkdir -p "$CACHE_DIR"
          if [ -f "$CACHE_DIR/hadolint" ] && ! echo "${SHA256}  $CACHE_DIR/hadolint" | sha256sum --status -c -; then
            echo "cached hadolint binary does not match the pinned hash; fetching it again"
            rm -f "$CACHE_DIR/hadolint"
          fi
          if [ ! -f "$CACHE_DIR/hadolint" ]; then
            curl -sSfL -o "$CACHE_DIR/hadolint" "https://github.com/hadolint/hadolint/releases/download/v${VERSION}/${asset}"
          fi
          echo "${SHA256}  $CACHE_DIR/hadolint" | sha256sum -c -
          chmod 0755 "$CACHE_DIR/hadolint"
          "$CACHE_DIR/hadolint" --version

      - name: Lint the Dockerfile (hadolint)
        continue-on-error: ${{ inputs.hadolint-continue-on-error }}
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          ARGS: ${{ inputs.hadolint-args }}
          HADOLINT: ${{ runner.temp }}/tool-cache/hadolint/hadolint
        run: |
          set -euo pipefail
          read -r -a args <<< "$ARGS"
          "$HADOLINT" "${args[@]}" "$DOCKERFILE"

  # One job per platform, on a runner of that architecture, for a run that
  # publishes: build once, push under a temporary tag
  # (`<sha>-<run id>-<attempt>-<arch>`), pull that image back by digest and run
  # every check against it, then hand the digest to `merge`, which merges by
  # digest, not by tag. A run that does not publish uses `build-local`.
  build:
    name: Build, test, scan (${{ matrix.platform }})
    needs: [plan, dockerfile-lint]
    # A skipped lint (hadolint: false) must not skip the build; a failed or
    # cancelled one must.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.publish == 'true' && (needs.dockerfile-lint.result == 'success' || needs.dockerfile-lint.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # This job runs only when publishing and is the only build job with
    # `packages: write`: every action in a job can read the job token, and a
    # job's permissions cannot depend on an expression, so a run that does not
    # publish uses `build-local` instead.
    permissions:
      contents: read
      packages: write  # push the per-platform image under its temporary tag
      security-events: write  # Trivy SARIF upload
    outputs:
      d0: ${{ steps.record.outputs.d0 }}
      d1: ${{ steps.record.outputs.d1 }}
      d2: ${{ steps.record.outputs.d2 }}
      d3: ${{ steps.record.outputs.d3 }}
      d4: ${{ steps.record.outputs.d4 }}
      d5: ${{ steps.record.outputs.d5 }}
      d6: ${{ steps.record.outputs.d6 }}
      d7: ${{ steps.record.outputs.d7 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Validate the egress policy inputs (EX-0001)
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ (inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block' }}

      - name: Egress canary (EX-0001)
        if: ${{ runner.os == 'Linux' && ((inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block') }}
        timeout-minutes: 2
        shell: bash
        # The workspace root exists before checkout; a job default working-directory may not.
        working-directory: ${{ github.workspace }}
        run: |
          set -u
          NAMES="github.com api.github.com results-receiver.actions.githubusercontent.com"
          PORT=443
          canary_resolve() { timeout 5 getent ahostsv4 "$1" 2>/dev/null | awk '$2 == "STREAM" { print $1 }'; }
          canary_probe() { timeout 3 bash -c "exec 3<>\"/dev/tcp/\$0/\$1\"" "$1" "$PORT" 2>/dev/null; }
          canary_reach() {
            local i
            for i in 1 2 3 4; do
              canary_probe "$1" && return 0
              [ "$i" -lt 4 ] && sleep 1
            done
            return 1
          }
          canary_show() { local n=$1; shift; echo "+ $*"; { timeout 10 "$@" 2>&1 || true; } | head -n "$n" || true; }
          canary_diag() {
            local name
            echo "::group::egress canary diagnostics (EX-0001, for the GitHub Support ticket)"
            canary_show 5 uname -srmo
            canary_show 20 cat /etc/resolv.conf
            canary_show 20 bash -c "resolvectl status 2>/dev/null | grep -E '^ *(Current DNS Server|DNS Servers?|DNS Domain):'"
            canary_show 20 bash -c "ss -lun | grep ':53 '"
            for name in $NAMES pipelines.actions.githubusercontent.com; do
              canary_show 20 getent ahostsv4 "$name"
              canary_show 5 curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_connect}\n' --max-time 8 "https://$name"
            done
            echo "::endgroup::"
          }
          canary_main() {
            local tmp name addr n=0 bad
            tmp=$(mktemp -d) || return 1
            for _ in 1 2 3; do
              for name in $NAMES; do canary_resolve "$name" >>"$tmp/res.$name" & done
              wait
              sleep 1
            done
            for name in $NAMES; do
              if [ -s "$tmp/res.$name" ]; then sort -u "$tmp/res.$name"; else echo "-"; fi | sed "s|^|$name |" >>"$tmp/pairs"
            done
            while read -r name addr; do
              n=$((n + 1))
              ( { [ "$addr" != "-" ] && canary_reach "$addr"; } || echo "$name $addr" >"$tmp/bad.$n" ) </dev/null &
            done <"$tmp/pairs"
            wait
            bad=$(cat "$tmp"/bad.* 2>/dev/null | sort || true)
            rm -rf "$tmp"
            if [ -z "$bad" ]; then
              echo "egress canary: all $n addresses of $NAMES accept TCP $PORT"
              return 0
            fi
            echo "::error title=egress canary::egress broken on this runner (known westus2 DNS issue, EX-0001): rerun the job"
            echo "unreachable addresses (name address; '-' means the name did not resolve):"
            printf '%s\n' "$bad"
            canary_diag
            echo "EX-0001 egress canary failed, unreachable: $(printf '%s' "$bad" | tr '\n' ';')" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            return 1
          }
          set -m
          canary_main &
          main=$!
          (sleep 90; kill -TERM -- "-$main"; sleep 2; kill -KILL -- "-$main") >/dev/null 2>&1 &
          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
            kill -TERM -- "-$main" >/dev/null 2>&1 || true
            sleep 1
            kill -KILL -- "-$main" >/dev/null 2>&1 || true
          fi
          if [ "$rc" -eq 143 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=egress canary::the canary hit its 90 s deadline (EX-0001): rerun the job"
            rc=124
          fi
          exit "$rc"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only a platform with no native runner needs emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.platform != 'linux/amd64' && matrix.platform != 'linux/arm64'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: needs.plan.outputs.publish == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.plan.outputs.ghcr }}
          tags: ${{ inputs.tags }}

      - name: Build and push this platform's image
        if: needs.plan.outputs.publish == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ needs.plan.outputs.ghcr }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          # No cache here: a publishing build never reads the Actions cache.
          # Signing, the SBOM and provenance are produced by `merge` as
          # explicit, verifiable artefacts; BuildKit's own attestation
          # manifests would duplicate them and add unknown/unknown entries.
          provenance: false
          sbom: false

      - name: Pull and verify the pushed image
        id: pushed
        if: needs.plan.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          GHCR: ${{ needs.plan.outputs.ghcr }}
        run: |
          set -euo pipefail
          shopt -u nocasematch
          verify_platform_image() {
            local ref=$1 want=$2 raw config actual wos warch wvar aos aarch avar def
            raw="$(docker buildx imagetools inspect --raw "$ref")" || return 1
            if ! jq -e 'type == "object" and (has("manifests") | not) and has("config") and has("layers")' <<< "$raw" > /dev/null; then
              echo "::error title=digest::$ref is not a single-platform image manifest"
              return 1
            fi
            config="$(docker buildx imagetools inspect "$ref" --format '{{json .Image}}')" || return 1
            actual="$(jq -r 'if type != "object" then "invalid" elif has("architecture") then "\(.os)/\(.architecture)/\(.variant // "")" elif length == 1 then (.[] | "\(.os)/\(.architecture)/\(.variant // "")") else "invalid" end' <<< "$config")"
            IFS=/ read -r wos warch wvar <<< "$want"
            IFS=/ read -r aos aarch avar <<< "$actual"
            # An omitted variant means the architecture's default, on both sides.
            case "$warch" in arm64) def=v8 ;; arm) def=v7 ;; amd64) def=v1 ;; *) def="" ;; esac
            if [ "$wos/$warch/${wvar:-$def}" != "$aos/$aarch/${avar:-$def}" ]; then
              echo "::error title=digest::$ref is $actual, expected $want"
              return 1
            fi
          }

          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error title=digest::the push of $PLATFORM produced no valid digest"; exit 1; }
          ref="${GHCR}@${DIGEST}"
          # The checks below run against exactly the image that was pushed.
          verify_platform_image "$ref" "$PLATFORM"
          docker pull --platform "$PLATFORM" "$ref"
          docker tag "$ref" release-candidate:local

      - name: Require a non-root user
        if: inputs.require-non-root
        run: |
          set -euo pipefail
          if ! uid="$(docker run --rm --entrypoint id release-candidate:local -u)"; then
            echo "::error title=non-root::could not run \`id -u\` in the image; add a USER instruction, or set require-non-root: false for an image with no id binary"
            exit 1
          fi
          if [ "$uid" = "0" ]; then
            echo "::error title=non-root::the image runs as root (uid 0); add a USER instruction to the Dockerfile, or set require-non-root: false"
            exit 1
          fi
          echo "the image runs as uid $uid"

      - name: Check the image
        if: inputs.docker-test-command != ''
        env:
          IMAGE: release-candidate:local
          COMMAND: ${{ inputs.docker-test-command }}
        run: bash -eo pipefail -c "$COMMAND"

      - name: Probe with a read-only root filesystem
        if: inputs.probe-read-only
        env:
          PROBE_COMMAND: ${{ inputs.probe-command }}
        run: |
          set -euo pipefail
          if [ -z "$PROBE_COMMAND" ]; then
            echo "::error title=probe-read-only::probe-command is empty; give it the arguments that make the image exit on its own, such as --version"
            exit 1
          fi
          read -r -a args <<< "$PROBE_COMMAND"
          if ! docker run --rm --read-only --tmpfs /tmp release-candidate:local "${args[@]}"; then
            echo "::error title=probe-read-only::the image fails with a read-only root filesystem; it writes outside /tmp. Point its writable paths at a tmpfs or a volume, or leave probe-read-only off"
            exit 1
          fi

      - name: Let Trivy's secret scanner skip installed Python packages
        if: inputs.trivy && inputs.skip-secret-scan-in-site-packages
        run: |
          # One global allow rule with a path only: the secret scanner ignores files under a Python
          # site-packages directory of one of three image roots (usr/lib, usr/local/lib, opt/venv/lib; lib64
          # too), the path anchored at the image root with a numeric X.Y version. Trivy's vulnerability scanner reads the same packages as before.
          # Nothing else is allowed, disabled or skipped. Trivy reads the file through its documented
          # --secret-config flag, set here by its environment form.
          CONFIG="$RUNNER_TEMP/trivy-secret.yaml"
          cat > "$CONFIG" <<'EOF'
          allow-rules:
            - id: python-site-packages
              description: Installed Python packages under the listed roots (see skip-secret-scan-in-site-packages)
              path: ^(usr/(local/)?lib(64)?|opt/venv/lib)/python[0-9]+\.[0-9]+/site-packages/
          EOF
          echo "TRIVY_SECRET_CONFIG=$CONFIG" >> "$GITHUB_ENV"

      - name: Scan the image with Trivy
        if: inputs.trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: release-candidate:local
          format: sarif
          output: trivy-results.sarif
          severity: ${{ inputs.trivy-severity }}
          exit-code: ${{ inputs.trivy-exit-code }}
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
          trivyignores: ${{ inputs.trivyignores }}

      - name: Upload Trivy results to the Security tab
        if: inputs.trivy && always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-${{ matrix.arch }}

      - name: Record this platform's digest
        id: record
        if: needs.plan.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          IDX: ${{ matrix.idx }}
        run: |
          set -euo pipefail
          shopt -u nocasematch
          [[ "$IDX" =~ ^[0-7]$ ]] || { echo "::error title=digest::bad platform index"; exit 1; }
          [[ "$PLATFORM" =~ ^linux/[a-z0-9]+(/v[0-9]+)?$ ]] || { echo "::error title=digest::bad platform"; exit 1; }
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error title=digest::the push of $PLATFORM produced no valid digest"; exit 1; }
          # Reached only after the checks passed on this exact digest.
          echo "d${IDX}=${PLATFORM} ${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "recorded ${PLATFORM} ${DIGEST}"


  # The same checks for a run that does not publish: one local build that is the
  # one tested, with no package write permission and no login. A publishing run
  # uses `build`.
  build-local:
    name: Build, test, scan, local (${{ matrix.platform }})
    needs: [plan, dockerfile-lint]
    # A skipped lint (hadolint: false) must not skip the build; a failed or
    # cancelled one must.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.publish != 'true' && (needs.dockerfile-lint.result == 'success' || needs.dockerfile-lint.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      security-events: write  # Trivy SARIF upload
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Validate the egress policy inputs (EX-0001)
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ (inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block' }}

      - name: Egress canary (EX-0001)
        if: ${{ runner.os == 'Linux' && ((inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block') }}
        timeout-minutes: 2
        shell: bash
        # The workspace root exists before checkout; a job default working-directory may not.
        working-directory: ${{ github.workspace }}
        run: |
          set -u
          NAMES="github.com api.github.com results-receiver.actions.githubusercontent.com"
          PORT=443
          canary_resolve() { timeout 5 getent ahostsv4 "$1" 2>/dev/null | awk '$2 == "STREAM" { print $1 }'; }
          canary_probe() { timeout 3 bash -c "exec 3<>\"/dev/tcp/\$0/\$1\"" "$1" "$PORT" 2>/dev/null; }
          canary_reach() {
            local i
            for i in 1 2 3 4; do
              canary_probe "$1" && return 0
              [ "$i" -lt 4 ] && sleep 1
            done
            return 1
          }
          canary_show() { local n=$1; shift; echo "+ $*"; { timeout 10 "$@" 2>&1 || true; } | head -n "$n" || true; }
          canary_diag() {
            local name
            echo "::group::egress canary diagnostics (EX-0001, for the GitHub Support ticket)"
            canary_show 5 uname -srmo
            canary_show 20 cat /etc/resolv.conf
            canary_show 20 bash -c "resolvectl status 2>/dev/null | grep -E '^ *(Current DNS Server|DNS Servers?|DNS Domain):'"
            canary_show 20 bash -c "ss -lun | grep ':53 '"
            for name in $NAMES pipelines.actions.githubusercontent.com; do
              canary_show 20 getent ahostsv4 "$name"
              canary_show 5 curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_connect}\n' --max-time 8 "https://$name"
            done
            echo "::endgroup::"
          }
          canary_main() {
            local tmp name addr n=0 bad
            tmp=$(mktemp -d) || return 1
            for _ in 1 2 3; do
              for name in $NAMES; do canary_resolve "$name" >>"$tmp/res.$name" & done
              wait
              sleep 1
            done
            for name in $NAMES; do
              if [ -s "$tmp/res.$name" ]; then sort -u "$tmp/res.$name"; else echo "-"; fi | sed "s|^|$name |" >>"$tmp/pairs"
            done
            while read -r name addr; do
              n=$((n + 1))
              ( { [ "$addr" != "-" ] && canary_reach "$addr"; } || echo "$name $addr" >"$tmp/bad.$n" ) </dev/null &
            done <"$tmp/pairs"
            wait
            bad=$(cat "$tmp"/bad.* 2>/dev/null | sort || true)
            rm -rf "$tmp"
            if [ -z "$bad" ]; then
              echo "egress canary: all $n addresses of $NAMES accept TCP $PORT"
              return 0
            fi
            echo "::error title=egress canary::egress broken on this runner (known westus2 DNS issue, EX-0001): rerun the job"
            echo "unreachable addresses (name address; '-' means the name did not resolve):"
            printf '%s\n' "$bad"
            canary_diag
            echo "EX-0001 egress canary failed, unreachable: $(printf '%s' "$bad" | tr '\n' ';')" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            return 1
          }
          set -m
          canary_main &
          main=$!
          (sleep 90; kill -TERM -- "-$main"; sleep 2; kill -KILL -- "-$main") >/dev/null 2>&1 &
          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
            kill -TERM -- "-$main" >/dev/null 2>&1 || true
            sleep 1
            kill -KILL -- "-$main" >/dev/null 2>&1 || true
          fi
          if [ "$rc" -eq 143 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=egress canary::the canary hit its 90 s deadline (EX-0001): rerun the job"
            rc=124
          fi
          exit "$rc"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only a platform with no native runner needs emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.platform != 'linux/amd64' && matrix.platform != 'linux/arm64'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.plan.outputs.ghcr }}
          tags: ${{ inputs.tags }}

      - name: Build for this platform and load it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: release-candidate:local
          labels: ${{ steps.meta.outputs.labels }}
          # The Actions cache is writable by anyone who can open a pull
          # request; a publishing build must not read it. One scope per
          # platform so the architectures do not overwrite each other.
          cache-from: ${{ !inputs.push && (inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block' && format('type=gha,scope={0}', matrix.arch) || '' }}
          cache-to: ${{ !inputs.push && (inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block' && format('type=gha,mode=max,scope={0}', matrix.arch) || '' }}

      - name: Require a non-root user
        if: inputs.require-non-root
        run: |
          set -euo pipefail
          if ! uid="$(docker run --rm --entrypoint id release-candidate:local -u)"; then
            echo "::error title=non-root::could not run \`id -u\` in the image; add a USER instruction, or set require-non-root: false for an image with no id binary"
            exit 1
          fi
          if [ "$uid" = "0" ]; then
            echo "::error title=non-root::the image runs as root (uid 0); add a USER instruction to the Dockerfile, or set require-non-root: false"
            exit 1
          fi
          echo "the image runs as uid $uid"

      - name: Check the image
        if: inputs.docker-test-command != ''
        env:
          IMAGE: release-candidate:local
          COMMAND: ${{ inputs.docker-test-command }}
        run: bash -eo pipefail -c "$COMMAND"

      - name: Probe with a read-only root filesystem
        if: inputs.probe-read-only
        env:
          PROBE_COMMAND: ${{ inputs.probe-command }}
        run: |
          set -euo pipefail
          if [ -z "$PROBE_COMMAND" ]; then
            echo "::error title=probe-read-only::probe-command is empty; give it the arguments that make the image exit on its own, such as --version"
            exit 1
          fi
          read -r -a args <<< "$PROBE_COMMAND"
          if ! docker run --rm --read-only --tmpfs /tmp release-candidate:local "${args[@]}"; then
            echo "::error title=probe-read-only::the image fails with a read-only root filesystem; it writes outside /tmp. Point its writable paths at a tmpfs or a volume, or leave probe-read-only off"
            exit 1
          fi

      - name: Let Trivy's secret scanner skip installed Python packages
        if: inputs.trivy && inputs.skip-secret-scan-in-site-packages
        run: |
          # One global allow rule with a path only: the secret scanner ignores files under a Python
          # site-packages directory of one of three image roots (usr/lib, usr/local/lib, opt/venv/lib; lib64
          # too), the path anchored at the image root with a numeric X.Y version. Trivy's vulnerability scanner reads the same packages as before.
          # Nothing else is allowed, disabled or skipped. Trivy reads the file through its documented
          # --secret-config flag, set here by its environment form.
          CONFIG="$RUNNER_TEMP/trivy-secret.yaml"
          cat > "$CONFIG" <<'EOF'
          allow-rules:
            - id: python-site-packages
              description: Installed Python packages under the listed roots (see skip-secret-scan-in-site-packages)
              path: ^(usr/(local/)?lib(64)?|opt/venv/lib)/python[0-9]+\.[0-9]+/site-packages/
          EOF
          echo "TRIVY_SECRET_CONFIG=$CONFIG" >> "$GITHUB_ENV"

      - name: Scan the image with Trivy
        if: inputs.trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: release-candidate:local
          format: sarif
          output: trivy-results.sarif
          severity: ${{ inputs.trivy-severity }}
          exit-code: ${{ inputs.trivy-exit-code }}
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
          trivyignores: ${{ inputs.trivyignores }}

      - name: Upload Trivy results to the Security tab
        if: inputs.trivy && always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-${{ matrix.arch }}

  # Joins the per-platform images into one multi-arch index under the real
  # tags, then signs, attests and records provenance for that index.
  merge:
    name: Publish, sign
    # Never on a pull request, whatever the caller passes: this job holds the
    # tokens that sign and attest.
    if: needs.plan.outputs.publish == 'true' && github.event_name != 'pull_request'
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write  # push the index, signature, SBOM attestation and provenance
      id-token: write  # Doppler OIDC, cosign keyless signing, GitHub attestation
      attestations: write  # record SLSA provenance
    outputs:
      digest: ${{ steps.index.outputs.digest }}
      image: ${{ steps.names.outputs.ghcr }}@${{ steps.index.outputs.digest }}
    steps:
      - name: Validate the egress policy inputs (EX-0001)
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ (inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block' }}

      - name: Egress canary (EX-0001)
        if: ${{ runner.os == 'Linux' && ((inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block') }}
        timeout-minutes: 2
        shell: bash
        # The workspace root exists before checkout; a job default working-directory may not.
        working-directory: ${{ github.workspace }}
        run: |
          set -u
          NAMES="github.com api.github.com results-receiver.actions.githubusercontent.com"
          PORT=443
          canary_resolve() { timeout 5 getent ahostsv4 "$1" 2>/dev/null | awk '$2 == "STREAM" { print $1 }'; }
          canary_probe() { timeout 3 bash -c "exec 3<>\"/dev/tcp/\$0/\$1\"" "$1" "$PORT" 2>/dev/null; }
          canary_reach() {
            local i
            for i in 1 2 3 4; do
              canary_probe "$1" && return 0
              [ "$i" -lt 4 ] && sleep 1
            done
            return 1
          }
          canary_show() { local n=$1; shift; echo "+ $*"; { timeout 10 "$@" 2>&1 || true; } | head -n "$n" || true; }
          canary_diag() {
            local name
            echo "::group::egress canary diagnostics (EX-0001, for the GitHub Support ticket)"
            canary_show 5 uname -srmo
            canary_show 20 cat /etc/resolv.conf
            canary_show 20 bash -c "resolvectl status 2>/dev/null | grep -E '^ *(Current DNS Server|DNS Servers?|DNS Domain):'"
            canary_show 20 bash -c "ss -lun | grep ':53 '"
            for name in $NAMES pipelines.actions.githubusercontent.com; do
              canary_show 20 getent ahostsv4 "$name"
              canary_show 5 curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_connect}\n' --max-time 8 "https://$name"
            done
            echo "::endgroup::"
          }
          canary_main() {
            local tmp name addr n=0 bad
            tmp=$(mktemp -d) || return 1
            for _ in 1 2 3; do
              for name in $NAMES; do canary_resolve "$name" >>"$tmp/res.$name" & done
              wait
              sleep 1
            done
            for name in $NAMES; do
              if [ -s "$tmp/res.$name" ]; then sort -u "$tmp/res.$name"; else echo "-"; fi | sed "s|^|$name |" >>"$tmp/pairs"
            done
            while read -r name addr; do
              n=$((n + 1))
              ( { [ "$addr" != "-" ] && canary_reach "$addr"; } || echo "$name $addr" >"$tmp/bad.$n" ) </dev/null &
            done <"$tmp/pairs"
            wait
            bad=$(cat "$tmp"/bad.* 2>/dev/null | sort || true)
            rm -rf "$tmp"
            if [ -z "$bad" ]; then
              echo "egress canary: all $n addresses of $NAMES accept TCP $PORT"
              return 0
            fi
            echo "::error title=egress canary::egress broken on this runner (known westus2 DNS issue, EX-0001): rerun the job"
            echo "unreachable addresses (name address; '-' means the name did not resolve):"
            printf '%s\n' "$bad"
            canary_diag
            echo "EX-0001 egress canary failed, unreachable: $(printf '%s' "$bad" | tr '\n' ';')" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            return 1
          }
          set -m
          canary_main &
          main=$!
          (sleep 90; kill -TERM -- "-$main"; sleep 2; kill -KILL -- "-$main") >/dev/null 2>&1 &
          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
            kill -TERM -- "-$main" >/dev/null 2>&1 || true
            sleep 1
            kill -KILL -- "-$main" >/dev/null 2>&1 || true
          fi
          if [ "$rc" -eq 143 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=egress canary::the canary hit its 90 s deadline (EX-0001): rerun the job"
            rc=124
          fi
          exit "$rc"

      # --- Doppler (same steps as .github/actions/doppler-secrets) ---------
      - name: Decide how to authenticate to Doppler
        id: doppler
        if: needs.plan.outputs.publish == 'true' && inputs.dockerhub
        env:
          IDENTITY_ID: ${{ inputs.doppler-identity-id }}
          TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PROJECT: ${{ inputs.doppler-project }}
          CONFIG: ${{ inputs.doppler-config }}
          REQUIRED: "false"
          TRUSTED_ONLY: ${{ inputs.doppler-trusted-refs-only }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mode=none
          skip=""
          untrusted_tag=false
          # A trusted run is one only a push by someone with write access, a manual
          # dispatch by such a person, or the schedule can produce, on the default
          # branch or a version tag (vN.N.N). The event must be on this allow-list:
          # any other event (issue_comment, workflow_run, an event added later) is
          # refused when the gate is on, because the ref alone does not say who
          # triggered it. A pull request is never trusted, whichever repository its
          # head is in. For a version tag the job also checks, when it can, that the
          # tagged commit is in the default branch's history (see the README).
          trusted=false
          # An inherited BASHOPTS must not make a comparison below case-insensitive.
          shopt -u nocasematch nocaseglob
          # The gate is parsed strictly: true or false in any casing, and anything else
          # stops the job. A typo must never switch the gate off.
          case "${TRUSTED_ONLY,,}" in
            true) TRUSTED_ONLY=true ;;
            false) TRUSTED_ONLY=false ;;
            *)
              echo "::error title=Doppler::trusted-refs-only must be true or false"
              exit 1 ;;
          esac
          case "$EVENT" in
            schedule) trusted=true ;;
            push|workflow_dispatch)
              if [ -n "$DEFAULT_BRANCH" ] && [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
                trusted=true
              elif [[ "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                trusted=true
                # Best effort: refuse a tag only on a clean "not an ancestor" answer from a
                # complete history. No checkout, a shallow clone, a missing remote ref or any
                # git error cannot show where the tag points, so the name rule stands and a
                # notice says the tag was not verified.
                if [ "$TRUSTED_ONLY" = "true" ]; then
                  verdict=unknown
                  if [ -n "$DEFAULT_BRANCH" ] && [ -n "${GITHUB_WORKSPACE:-}" ] && [ -n "${GITHUB_SHA:-}" ] \
                    && git -C "$GITHUB_WORKSPACE" rev-parse --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH^{commit}" >/dev/null 2>&1 \
                    && git -C "$GITHUB_WORKSPACE" rev-parse --verify --quiet "$GITHUB_SHA^{commit}" >/dev/null 2>&1 \
                    && [ "$(git -C "$GITHUB_WORKSPACE" rev-parse --is-shallow-repository 2>/dev/null)" = "false" ]; then
                    rc=0
                    git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT_BRANCH" >/dev/null 2>&1 || rc=$?
                    case "$rc" in
                      0) verdict=in ;;
                      1) verdict=out ;;
                    esac
                  fi
                  case "$verdict" in
                    out) trusted=false ;;
                    unknown) echo "::notice title=Doppler::tag $REF not verified against the default branch history (no checkout, incomplete history or git error); only its name was checked" ;;
                  esac
                fi
              fi ;;
            *) trusted=false ;;
          esac
          if [ "$IS_FORK" = "true" ]; then
            # A fork's pull request has no id-token and must never receive a
            # secret. Silent skip is correct here, whatever `required` says.
            skip="pull request from a fork"
          elif [ "$TRUSTED_ONLY" = "true" ] && [ "$trusted" != "true" ]; then
            skip="$EVENT on $REF is not a push or dispatch on the default branch or a version tag (vN.N.N, in the default branch history), or a schedule (trusted-refs-only)"
            # A tag this rule refused is reported, so a job that was asked for a
            # secret-backed feature can fail instead of skipping it quietly.
            case "$REF" in refs/tags/*) untrusted_tag=true ;; esac
          elif [ -n "$IDENTITY_ID" ]; then
            mode=oidc
          elif [ -n "$TOKEN" ]; then
            mode=token
          fi
          if [ -n "$skip" ]; then
            echo "::notice title=Doppler::$skip - no secrets are fetched"
          fi
          if [ "$mode" != "none" ] && { [ -z "$PROJECT" ] || [ -z "$CONFIG" ]; }; then
            echo "::error title=Doppler::project and config are required when authenticating"
            exit 1
          fi
          if [ "$mode" = "none" ] && [ -z "$skip" ]; then
            if [ "$REQUIRED" = "true" ]; then
              echo "::error title=Doppler::no identity-id and no DOPPLER_TOKEN; this job needs one (see README, 'Doppler setup')"
              exit 1
            fi
            echo "::notice title=Doppler::not configured (no identity-id, no DOPPLER_TOKEN) - continuing without CI secrets"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "untrusted-tag=$untrusted_tag" >> "$GITHUB_OUTPUT"
          echo "Doppler auth mode: $mode"

      - name: Fetch CI secrets from Doppler (OIDC)
        if: steps.doppler.outputs.mode == 'oidc'
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ inputs.doppler-identity-id }}
          doppler-project: ${{ inputs.doppler-project }}
          doppler-config: ${{ inputs.doppler-config }}
          inject-env-vars: true

      - name: Fetch CI secrets from Doppler (Service Token)
        if: steps.doppler.outputs.mode == 'token'
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: ${{ inputs.doppler-project }}
          doppler-config: ${{ inputs.doppler-config }}
          inject-env-vars: true
      # ---------------------------------------------------------------------

      - name: Resolve image names
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
          IMAGE_NAME: ${{ inputs.image-name }}
          DOCKERHUB: ${{ inputs.dockerhub }}
          DOCKERHUB_REPOSITORY: ${{ inputs.dockerhub-repository }}
          PUSH: ${{ needs.plan.outputs.publish }}
          UNTRUSTED_TAG: ${{ steps.doppler.outputs.untrusted-tag }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$PUSH" = "true" ] && [ "$DOCKERHUB" = "true" ] && [ "${UNTRUSTED_TAG:-}" = "true" ]; then
            # Asked for, and refused on this ref: fail rather than publish to GHCR alone and stay green.
            echo "::error title=Docker Hub::dockerhub is true but $REF: ref is not a vMAJOR.MINOR.PATCH release tag: Doppler secrets are not fetched"
            exit 1
          fi
          repo_name="${REPOSITORY#*/}"
          repo_name="$(printf '%s' "$repo_name" | tr '[:upper:]' '[:lower:]')"
          owner="$(printf '%s' "${REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
          ghcr="ghcr.io/${owner}/${IMAGE_NAME:-$repo_name}"
          echo "ghcr=$ghcr" >> "$GITHUB_OUTPUT"
          images="$ghcr"
          hub=""
          if [ "$PUSH" = "true" ] && [ "$DOCKERHUB" = "true" ]; then
            if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
              hub="docker.io/${DOCKERHUB_USERNAME}/${DOCKERHUB_REPOSITORY:-$repo_name}"
              images="$images"$'\n'"$hub"
              echo "Docker Hub publish enabled: $hub"
            else
              echo "::warning title=Docker Hub::dockerhub is true but DOCKERHUB_USERNAME/DOCKERHUB_TOKEN were not fetched from Doppler - publishing to GHCR only"
            fi
          fi
          echo "dockerhub=$hub" >> "$GITHUB_OUTPUT"
          {
            echo "images<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: needs.plan.outputs.publish == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.plan.outputs.publish == 'true' && steps.names.outputs.dockerhub != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.names.outputs.images }}
          tags: ${{ inputs.tags }}

      - name: Create the multi-arch index
        id: index
        if: needs.plan.outputs.publish == 'true'
        env:
          GHCR: ${{ steps.names.outputs.ghcr }}
          HUB: ${{ steps.names.outputs.dockerhub }}
          TAGS: ${{ steps.meta.outputs.tags }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          D0: ${{ needs.build.outputs.d0 }}
          D1: ${{ needs.build.outputs.d1 }}
          D2: ${{ needs.build.outputs.d2 }}
          D3: ${{ needs.build.outputs.d3 }}
          D4: ${{ needs.build.outputs.d4 }}
          D5: ${{ needs.build.outputs.d5 }}
          D6: ${{ needs.build.outputs.d6 }}
          D7: ${{ needs.build.outputs.d7 }}
        run: |
          set -euo pipefail
          shopt -u nocasematch
          verify_platform_image() {
            local ref=$1 want=$2 raw config actual wos warch wvar aos aarch avar def
            raw="$(docker buildx imagetools inspect --raw "$ref")" || return 1
            if ! jq -e 'type == "object" and (has("manifests") | not) and has("config") and has("layers")' <<< "$raw" > /dev/null; then
              echo "::error title=digest::$ref is not a single-platform image manifest"
              return 1
            fi
            config="$(docker buildx imagetools inspect "$ref" --format '{{json .Image}}')" || return 1
            actual="$(jq -r 'if type != "object" then "invalid" elif has("architecture") then "\(.os)/\(.architecture)/\(.variant // "")" elif length == 1 then (.[] | "\(.os)/\(.architecture)/\(.variant // "")") else "invalid" end' <<< "$config")"
            IFS=/ read -r wos warch wvar <<< "$want"
            IFS=/ read -r aos aarch avar <<< "$actual"
            # An omitted variant means the architecture's default, on both sides.
            case "$warch" in arm64) def=v8 ;; arm) def=v7 ;; amd64) def=v1 ;; *) def="" ;; esac
            if [ "$wos/$warch/${wvar:-$def}" != "$aos/$aarch/${avar:-$def}" ]; then
              echo "::error title=digest::$ref is $actual, expected $want"
              return 1
            fi
          }

          fail() { echo "::error title=digest::$1"; exit 1; }
          digest_re='^sha256:[0-9a-f]{64}$'
          # The index is made from the digests the build jobs pushed and
          # checked, one per planned platform, each an image of its platform.
          slots=("$D0" "$D1" "$D2" "$D3" "$D4" "$D5" "$D6" "$D7")
          count="$(jq 'length' <<< "$MATRIX")"
          sources=()
          digests=()
          for i in 0 1 2 3 4 5 6 7; do
            value="${slots[$i]}"
            if [ "$i" -ge "$count" ]; then
              [ -z "$value" ] || fail "unexpected digest in slot $i"
              continue
            fi
            want="$(jq -r --argjson i "$i" '.[] | select(.idx == $i) | .platform' <<< "$MATRIX")"
            platform="${value%% *}"
            digest="${value#* }"
            if [ -z "$value" ] || [ "$platform" != "$want" ] || ! [[ "$digest" =~ $digest_re ]]; then
              fail "no valid digest was recorded for $want"
            fi
            verify_platform_image "${GHCR}@${digest}" "$want" || exit 1
            sources+=("${GHCR}@${digest}")
            digests+=("$digest")
          done
          # Each registry gets its own index, staged under a tag of this run
          # only, checked against the recorded platform digests, and promoted
          # by that digest. A source held by another registry is copied by
          # buildx. The digests are compared, not assumed equal.
          registries=("$GHCR")
          if [ -n "$HUB" ]; then registries+=("$HUB"); fi
          first_digest=""
          for repo in "${registries[@]}"; do
            staging="${repo}:stage-${SHA}-${RUN_ID}-${RUN_ATTEMPT}"
            docker buildx imagetools create --tag "$staging" "${sources[@]}"
            digest="$(docker buildx imagetools inspect "$staging" --format '{{.Manifest.Digest}}')"
            [[ "$digest" =~ $digest_re ]] || fail "the staged index in $repo has no valid digest"
            # The staged index must hold exactly the digests that passed.
            got="$(docker buildx imagetools inspect --raw "${repo}@${digest}" | jq -c '[.manifests[]?.digest] | sort')"
            want_set="$(printf '%s\n' "${digests[@]}" | jq -R . | jq -sc 'sort')"
            [ "$got" = "$want_set" ] || fail "the staged index in $repo does not hold exactly the recorded platform digests"
            if [ -z "$first_digest" ]; then first_digest="$digest"; fi
            [ "$digest" = "$first_digest" ] || fail "the index digest in $repo ($digest) differs from the one in $GHCR ($first_digest)"
            # Promote that exact digest to this registry's final tags.
            while IFS= read -r tag; do
              case "$tag" in "${repo}:"*) ;; *) continue ;; esac
              docker buildx imagetools create --tag "$tag" "${repo}@${digest}"
            done <<< "$TAGS"
          done
          # Every final tag, in every registry, must resolve to the digest.
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            [ "$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')" = "$first_digest" ] || fail "$tag does not resolve to the staged index"
          done <<< "$TAGS"
          echo "digest=$first_digest" >> "$GITHUB_OUTPUT"
          echo "index digest: $first_digest"

      - name: Re-check the final tags before signing
        if: needs.plan.outputs.publish == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          # Reads each final tag again. This proves only that, at the moment of
          # each read, the tag resolved to the staged digest; it does not make
          # a tag immutable or the tags simultaneous. Consumers deploy by digest.
          fail=0
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            got="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}' || true)"
            if [ "$got" != "$DIGEST" ]; then
              echo "::error title=tag::$tag resolves to '${got}', not to the staged index $DIGEST"
              fail=1
            fi
          done <<< "$TAGS"
          exit "$fail"


      - name: Install cosign
        if: needs.plan.outputs.publish == 'true' && (inputs.sign || inputs.sbom)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        if: needs.plan.outputs.publish == 'true' && inputs.sign
        env:
          GHCR: ${{ steps.names.outputs.ghcr }}
          DOCKERHUB: ${{ steps.names.outputs.dockerhub }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          for image in $GHCR $DOCKERHUB; do
            echo "signing ${image}@${DIGEST}"
            cosign sign --yes "${image}@${DIGEST}"
          done

      - name: Generate the SBOM with syft
        if: needs.plan.outputs.publish == 'true' && inputs.sbom
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.names.outputs.ghcr }}@${{ steps.index.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Attach the SBOM as a cosign attestation
        if: needs.plan.outputs.publish == 'true' && inputs.sbom
        env:
          GHCR: ${{ steps.names.outputs.ghcr }}
          DOCKERHUB: ${{ steps.names.outputs.dockerhub }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          for image in $GHCR $DOCKERHUB; do
            echo "attesting SBOM on ${image}@${DIGEST}"
            cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${image}@${DIGEST}"
          done

      - name: Record build provenance
        if: needs.plan.outputs.publish == 'true' && inputs.provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.ghcr }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - name: Re-check the final tags after attestation
        if: needs.plan.outputs.publish == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          # Reads each final tag again. This proves only that, at the moment of
          # each read, the tag resolved to the staged digest; it does not make
          # a tag immutable or the tags simultaneous. Consumers deploy by digest.
          fail=0
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            got="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}' || true)"
            if [ "$got" != "$DIGEST" ]; then
              echo "::error title=tag::$tag resolves to '${got}', not to the staged index $DIGEST"
              fail=1
            fi
          done <<< "$TAGS"
          exit "$fail"


      - name: Summary
        if: needs.plan.outputs.publish == 'true'
        env:
          GHCR: ${{ steps.names.outputs.ghcr }}
          DIGEST: ${{ steps.index.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          SIGNED: ${{ inputs.sign }}
          SBOM: ${{ inputs.sbom }}
          PROVENANCE: ${{ inputs.provenance }}
        run: |
          {
            echo "## Published"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "| Artefact | Present |"
            echo "|---|---|"
            echo "| cosign signature | $SIGNED |"
            echo "| SPDX SBOM (syft, cosign attestation + artifact) | $SBOM |"
            echo "| SLSA provenance (GitHub attestation) | $PROVENANCE |"
            echo
            echo "Verify:"
            echo
            echo '```'
            echo "cosign verify ${GHCR}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/ChiefGyk3D/git-your-ship-together/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
