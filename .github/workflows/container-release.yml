          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
            kill -TERM -- "-$main" >/dev/null 2>&1 || true
            sleep 1
            kill -KILL -- "-$main" >/dev/null 2>&1 || true
          fi
          if [ "$rc" -eq 143 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=egress canary::the canary hit its 90 s deadline: rerun the job"
            rc=124
          fi
          exit "$rc"

      # --- Doppler (same steps as .github/actions/doppler-secrets) ---------
      - name: Validate the signer identity
        timeout-minutes: 1
        env:
          IDENTITY_REGEXP: ${{ inputs.signer-identity-regexp }}
        run: |
          set -euo pipefail
          # Literal characters only: letters, digits, _ and -, an escaped dot,
          # and / between path segments. No wildcard, alternation, group or
          # class can pass, so the value names one workflow file.
          seg='([A-Za-z0-9_-]|\\\.)+'
          shape='^\^https://github\\\.com/'"${seg}/${seg}/"'\\\.github/workflows/'"${seg}"'@$'
          if ! [[ "$IDENTITY_REGEXP" =~ $shape ]]; then
            echo "::error title=signer-identity-regexp::must be ^https://github\\.com/<owner>/<repo>/\\.github/workflows/<file>@ with only letters, digits, _ - and escaped dots"
            exit 1
          fi

      - name: Decide how to authenticate to Doppler
        id: doppler
        if: needs.plan.outputs.publish == 'true' && inputs.dockerhub
        env:
          IDENTITY_ID: ${{ inputs.doppler-identity-id }}
          TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PROJECT: ${{ inputs.doppler-project }}
          CONFIG: ${{ inputs.doppler-config }}
          REQUIRED: "false"
          TRUSTED_ONLY: ${{ inputs.doppler-trusted-refs-only }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mode=none
          skip=""
          untrusted_tag=false
          # A trusted run is one only a push by someone with write access, a manual
          # dispatch by such a person, or the schedule can produce, on the default
          # branch or a version tag (vN.N.N). The event must be on this allow-list:
          # any other event (issue_comment, workflow_run, an event added later) is
          # refused when the gate is on, because the ref alone does not say who
          # triggered it. A pull request is never trusted, whichever repository its
          # head is in. For a version tag the job also checks, when it can, that the
          # tagged commit is in the default branch's history (see the README).
          trusted=false
          # An inherited BASHOPTS must not make a comparison below case-insensitive.
          shopt -u nocasematch nocaseglob
          # The gate is parsed strictly: true or false in any casing, and anything else
          # stops the job. A typo must never switch the gate off.
          case "${TRUSTED_ONLY,,}" in
            true) TRUSTED_ONLY=true ;;
            false) TRUSTED_ONLY=false ;;
            *)
              echo "::error title=Doppler::trusted-refs-only must be true or false"
              exit 1 ;;
          esac
          case "$EVENT" in
            schedule) trusted=true ;;
            push|workflow_dispatch)
              if [ -n "$DEFAULT_BRANCH" ] && [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
                trusted=true
              elif [[ "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                trusted=true
                # Best effort: refuse a tag only on a clean "not an ancestor" answer from a
                # complete history. No checkout, a shallow clone, a missing remote ref or any
                # git error cannot show where the tag points, so the name rule stands and a
                # notice says the tag was not verified.
                if [ "$TRUSTED_ONLY" = "true" ]; then
                  verdict=unknown
                  if [ -n "$DEFAULT_BRANCH" ] && [ -n "${GITHUB_WORKSPACE:-}" ] && [ -n "${GITHUB_SHA:-}" ] \
                    && git -C "$GITHUB_WORKSPACE" rev-parse --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH^{commit}" >/dev/null 2>&1 \
                    && git -C "$GITHUB_WORKSPACE" rev-parse --verify --quiet "$GITHUB_SHA^{commit}" >/dev/null 2>&1 \
                    && [ "$(git -C "$GITHUB_WORKSPACE" rev-parse --is-shallow-repository 2>/dev/null)" = "false" ]; then
                    rc=0
                    git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT_BRANCH" >/dev/null 2>&1 || rc=$?
                    case "$rc" in
                      0) verdict=in ;;
                      1) verdict=out ;;
                    esac
                  fi
                  case "$verdict" in
                    out) trusted=false ;;
                    unknown) echo "::notice title=Doppler::tag $REF not verified against the default branch history (no checkout, incomplete history or git error); only its name was checked" ;;
                  esac
                fi
              fi ;;
            *) trusted=false ;;
          esac
          if [ "$IS_FORK" = "true" ]; then
            # A fork's pull request has no id-token and must never receive a
            # secret. Silent skip is correct here, whatever `required` says.
            skip="pull request from a fork"
          elif [ "$TRUSTED_ONLY" = "true" ] && [ "$trusted" != "true" ]; then
            skip="$EVENT on $REF is not a push or dispatch on the default branch or a version tag (vN.N.N, in the default branch history), or a schedule (trusted-refs-only)"
            # A tag this rule refused is reported, so a job that was asked for a
            # secret-backed feature can fail instead of skipping it quietly.
            case "$REF" in refs/tags/*) untrusted_tag=true ;; esac
          elif [ -n "$IDENTITY_ID" ]; then
            mode=oidc
          elif [ -n "$TOKEN" ]; then
            mode=token
          fi
          if [ -n "$skip" ]; then
            echo "::notice title=Doppler::$skip - no secrets are fetched"
          fi
          if [ "$mode" != "none" ] && { [ -z "$PROJECT" ] || [ -z "$CONFIG" ]; }; then
            echo "::error title=Doppler::project and config are required when authenticating"
            exit 1
          fi
          if [ "$mode" = "none" ] && [ -z "$skip" ]; then
            if [ "$REQUIRED" = "true" ]; then
              echo "::error title=Doppler::no identity-id and no DOPPLER_TOKEN; this job needs one (see README, 'Doppler setup')"
              exit 1
            fi
            echo "::notice title=Doppler::not configured (no identity-id, no DOPPLER_TOKEN) - continuing without CI secrets"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "untrusted-tag=$untrusted_tag" >> "$GITHUB_OUTPUT"
          echo "Doppler auth mode: $mode"

      - name: Fetch CI secrets from Doppler (OIDC)
        if: steps.doppler.outputs.mode == 'oidc'
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ inputs.doppler-identity-id }}
          doppler-project: ${{ inputs.doppler-project }}
          doppler-config: ${{ inputs.doppler-config }}
          inject-env-vars: true

      - name: Fetch CI secrets from Doppler (Service Token)
        if: steps.doppler.outputs.mode == 'token'
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: ${{ inputs.doppler-project }}
          doppler-config: ${{ inputs.doppler-config }}
          inject-env-vars: true
      # ---------------------------------------------------------------------

      - name: Resolve image names
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
          IMAGE_NAME: ${{ inputs.image-name }}
          DOCKERHUB: ${{ inputs.dockerhub }}
          DOCKERHUB_REPOSITORY: ${{ inputs.dockerhub-repository }}
          PUSH: ${{ needs.plan.outputs.publish }}
          UNTRUSTED_TAG: ${{ steps.doppler.outputs.untrusted-tag }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$PUSH" = "true" ] && [ "$DOCKERHUB" = "true" ] && [ "${UNTRUSTED_TAG:-}" = "true" ]; then
            # Asked for, and refused on this ref: fail rather than publish to GHCR alone and stay green.
            echo "::error title=Docker Hub::dockerhub is true but $REF: ref is not a vMAJOR.MINOR.PATCH release tag: Doppler secrets are not fetched"
            exit 1
          fi
          repo_name="${REPOSITORY#*/}"
          repo_name="$(printf '%s' "$repo_name" | tr '[:upper:]' '[:lower:]')"
          owner="$(printf '%s' "${REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
          ghcr="ghcr.io/${owner}/${IMAGE_NAME:-$repo_name}"
          echo "ghcr=$ghcr" >> "$GITHUB_OUTPUT"
          images="$ghcr"
          hub=""
          if [ "$PUSH" = "true" ] && [ "$DOCKERHUB" = "true" ]; then
            if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
              hub="docker.io/${DOCKERHUB_USERNAME}/${DOCKERHUB_REPOSITORY:-$repo_name}"
              images="$images"$'\n'"$hub"
              echo "Docker Hub publish enabled: $hub"
            else
              echo "::warning title=Docker Hub::dockerhub is true but DOCKERHUB_USERNAME/DOCKERHUB_TOKEN were not fetched from Doppler - publishing to GHCR only"
            fi
          fi
          echo "dockerhub=$hub" >> "$GITHUB_OUTPUT"
          {
            echo "images<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: needs.plan.outputs.publish == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.plan.outputs.publish == 'true' && steps.names.outputs.dockerhub != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.names.outputs.images }}
          tags: ${{ inputs.tags }}

      # The index is built from the digests the build jobs pushed and checked,
      # never from a tag, and goes up in each registry under a staging tag of
      # this run only. No release tag (`latest`, the branch, semver or sha
      # tags) is written here: they wait for "Publish the release tags", after
      # the image is signed, attested, recorded and verified (issue #286).
      - name: Create the multi-arch index
        id: index
        if: needs.plan.outputs.publish == 'true'
        env:
          GHCR: ${{ steps.names.outputs.ghcr }}
          HUB: ${{ steps.names.outputs.dockerhub }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          D0: ${{ needs.build.outputs.d0 }}
          D1: ${{ needs.build.outputs.d1 }}
          D2: ${{ needs.build.outputs.d2 }}
          D3: ${{ needs.build.outputs.d3 }}
          D4: ${{ needs.build.outputs.d4 }}
          D5: ${{ needs.build.outputs.d5 }}
          D6: ${{ needs.build.outputs.d6 }}
          D7: ${{ needs.build.outputs.d7 }}
        run: |
          set -euo pipefail
          shopt -u nocasematch
          verify_platform_image() {
            local ref=$1 want=$2 raw config actual wos warch wvar aos aarch avar def
            raw="$(docker buildx imagetools inspect --raw "$ref")" || return 1
            if ! jq -e 'type == "object" and (has("manifests") | not) and has("config") and has("layers")' <<< "$raw" > /dev/null; then
              echo "::error title=digest::$ref is not a single-platform image manifest"
              return 1
            fi
            config="$(docker buildx imagetools inspect "$ref" --format '{{json .Image}}')" || return 1
            actual="$(jq -r 'if type != "object" then "invalid" elif has("architecture") then "\(.os)/\(.architecture)/\(.variant // "")" elif length == 1 then (.[] | "\(.os)/\(.architecture)/\(.variant // "")") else "invalid" end' <<< "$config")"
            IFS=/ read -r wos warch wvar <<< "$want"
            IFS=/ read -r aos aarch avar <<< "$actual"
            # An omitted variant means the architecture's default, on both sides.
            case "$warch" in arm64) def=v8 ;; arm) def=v7 ;; amd64) def=v1 ;; *) def="" ;; esac
            if [ "$wos/$warch/${wvar:-$def}" != "$aos/$aarch/${avar:-$def}" ]; then
              echo "::error title=digest::$ref is $actual, expected $want"
              return 1
            fi
          }

          fail() { echo "::error title=digest::$1"; exit 1; }
          digest_re='^sha256:[0-9a-f]{64}$'
          # One bounded retry for every registry call: 4 attempts in all,
          # waiting 5, 10 and 20 seconds. Only a transient failure is retried
          # (HTTP 408, 425, 429 and every 5xx, a timeout, a reset connection).
          registry_transient() {
            grep -Eqi '(^|[ :[(])(408|425|429|5[0-9]{2})( |]|\)|$)|context deadline exceeded|i/o timeout|timed out|connection reset|connection refused|temporarily unavailable|unexpected EOF|TLS handshake timeout' <<< "$1"
          }
          registry_retry() {
            local n=1 rc errf delay
            while :; do
              rc=0
              errf="$(mktemp)"
              REG_OUT="$("$@" 2> "$errf")" || rc=$?
              REG_ERR="$(< "$errf")"
              rm -f "$errf"
              if [ "$rc" -eq 0 ]; then return 0; fi
              if registry_transient "$REG_ERR" && [ "$n" -lt 4 ]; then
                delay=$(( ${REGISTRY_BACKOFF_SECONDS:-5} * (1 << (n - 1)) ))
                echo "::warning title=registry retry::attempt ${n} of 4 of '$1 $2 $3' hit a transient error; retrying in ${delay}s" >&2
                sleep "$delay"
                n=$((n + 1))
                continue
              fi
              return "$rc"
            done
          }
          # The index is made from the digests the build jobs pushed and
          # checked, one per planned platform, each an image of its platform.
          slots=("$D0" "$D1" "$D2" "$D3" "$D4" "$D5" "$D6" "$D7")
          count="$(jq 'length' <<< "$MATRIX")"
          sources=()
          digests=()
          for i in 0 1 2 3 4 5 6 7; do
            value="${slots[$i]}"
            if [ "$i" -ge "$count" ]; then
              [ -z "$value" ] || fail "unexpected digest in slot $i"
              continue
            fi
            want="$(jq -r --argjson i "$i" '.[] | select(.idx == $i) | .platform' <<< "$MATRIX")"
            platform="${value%% *}"
            digest="${value#* }"
            if [ -z "$value" ] || [ "$platform" != "$want" ] || ! [[ "$digest" =~ $digest_re ]]; then
              fail "no valid digest was recorded for $want"
            fi
            verify_platform_image "${GHCR}@${digest}" "$want" || exit 1
            sources+=("${GHCR}@${digest}")
            digests+=("$digest")
          done
          # Each registry gets its own index, staged under a tag of this run
          # only and checked against the recorded platform digests. A source
          # held by another registry is copied by buildx. The digests are
          # compared, not assumed equal.
          registries=("$GHCR")
          if [ -n "$HUB" ]; then registries+=("$HUB"); fi
          first_digest=""
          for repo in "${registries[@]}"; do
            staging="${repo}:stage-${SHA}-${RUN_ID}-${RUN_ATTEMPT}"
            # A write that returned an error may still have committed: the
            # staged tag is read back and judged by what it holds.
            registry_retry docker buildx imagetools create --tag "$staging" "${sources[@]}" \
              || echo "::notice title=staging::writing $staging returned an error; reading it back"
            registry_retry docker buildx imagetools inspect "$staging" --format '{{.Manifest.Digest}}' \
              || fail "the staged index $staging could not be read back in $repo"
            digest="$REG_OUT"
            [[ "$digest" =~ $digest_re ]] || fail "the staged index in $repo has no valid digest"
            # The staged index must hold exactly the digests that passed.
            registry_retry docker buildx imagetools inspect --raw "${repo}@${digest}" \
              || fail "the staged index ${repo}@${digest} could not be read"
            got="$(jq -c '[.manifests[]?.digest] | sort' <<< "$REG_OUT")"
            want_set="$(printf '%s\n' "${digests[@]}" | jq -R . | jq -sc 'sort')"
            [ "$got" = "$want_set" ] || fail "the staged index in $repo does not hold exactly the recorded platform digests"
            if [ -z "$first_digest" ]; then first_digest="$digest"; fi
            [ "$digest" = "$first_digest" ] || fail "the index digest in $repo ($digest) differs from the one in $GHCR ($first_digest)"
          done
          echo "digest=$first_digest" >> "$GITHUB_OUTPUT"
          echo "index digest: $first_digest (staging tags only; the release tags have not moved)"

      - name: Install cosign
        if: needs.plan.outputs.publish == 'true' && (inputs.sign || inputs.sbom)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # A Rekor 409 ("an equivalent entry already exists") is not a failure by
      # itself: it is success only if `cosign verify` of this exact digest
      # passes with the constraints below. Transient Rekor/Fulcio errors are
      # retried 4 times with a doubling backoff. Everything else is fatal.
      - name: Prepare the Rekor retry helper
        if: needs.plan.outputs.publish == 'true' && (inputs.sign || inputs.sbom)
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rekor-run.sh" <<'HELPER'
          #!/usr/bin/env bash
          # usage: rekor-run.sh <signature|sbom> <image@digest> <command...>
          set -uo pipefail
          REKOR_ATTEMPTS=4

          rekor_is_conflict() {
            grep -Eqi '\[409\]|createLogEntryConflict' <<<"$1" && grep -qi 'equivalent entry already exists' <<<"$1"
          }

          rekor_is_transient() {
            grep -Eqi '\[(408|425|429|5[0-9]{2})\]|context deadline exceeded|i/o timeout|timed out|connection reset|connection refused|temporarily unavailable|unexpected EOF|TLS handshake timeout' <<<"$1"
          }

          # Never an unconstrained verify: an empty regexp matches every identity.
          rekor_verify() {
            if [ -z "${IDENTITY_REGEXP:-}" ] || [ -z "${OIDC_ISSUER:-}" ] || [ -z "${SOURCE_REPOSITORY:-}" ] || [ -z "${WORKFLOW_SHA:-}" ]; then
              echo "::error title=Rekor conflict::the identity, issuer, repository and commit constraints are not all set; refusing an unconstrained verify"
              return 1
            fi
            case "$1" in
              signature)
                cosign verify "$2" \
                  --certificate-identity-regexp "$IDENTITY_REGEXP" \
                  --certificate-oidc-issuer "$OIDC_ISSUER" \
                  --certificate-github-workflow-repository "$SOURCE_REPOSITORY" \
                  --certificate-github-workflow-sha "$WORKFLOW_SHA" > /dev/null ;;
              sbom)
                cosign verify-attestation --type spdxjson "$2" \
                  --certificate-identity-regexp "$IDENTITY_REGEXP" \
                  --certificate-oidc-issuer "$OIDC_ISSUER" \
                  --certificate-github-workflow-repository "$SOURCE_REPOSITORY" \
                  --certificate-github-workflow-sha "$WORKFLOW_SHA" > /dev/null ;;
              *) return 1 ;;
            esac
          }

          rekor_run() {
            local kind=$1 ref=$2 n=1 rc out delay
            shift 2
            while :; do
              rc=0
              out=$("$@" 2>&1) || rc=$?
              printf '%s\n' "$out"
              if [ "$rc" -eq 0 ]; then
                return 0
              fi
              if rekor_is_conflict "$out"; then
                echo "::notice title=Rekor conflict::an equivalent entry exists for ${ref}; accepting it only if the ${kind} verifies"
                if rekor_verify "$kind" "$ref"; then
                  echo "${kind} of ${ref} verified against the pinned identity; treating the conflict as success"
                  return 0
                fi
                echo "::error title=Rekor conflict::the ${kind} of ${ref} did not verify after an equivalent-entry conflict; the release is stopped"
                return 1
              fi
              if rekor_is_transient "$out" && [ "$n" -lt "$REKOR_ATTEMPTS" ]; then
                delay=$(( ${REKOR_BACKOFF_SECONDS:-5} * (1 << (n - 1)) ))
                echo "::warning title=Rekor retry::attempt ${n} of ${REKOR_ATTEMPTS} for the ${kind} of ${ref} hit a transient error; retrying in ${delay}s"
                sleep "$delay"
                n=$((n + 1))
                continue
              fi
              echo "::error title=${kind} failed::the ${kind} of ${ref} failed on attempt ${n} of ${REKOR_ATTEMPTS} and is not retryable (or the attempts are used up); the release tags stay where they were"
              return 1
            done
          }

          rekor_run "$@"
          HELPER
          chmod 700 "$RUNNER_TEMP/rekor-run.sh"

      - name: Sign the image (keyless)
        if: needs.plan.outputs.publish == 'true' && inputs.sign
        env:
          GHCR: ${{ steps.names.outputs.ghcr }}
          DOCKERHUB: ${{ steps.names.outputs.dockerhub }}
          DIGEST: ${{ steps.index.outputs.digest }}
          IDENTITY_REGEXP: ${{ inputs.signer-identity-regexp }}
          OIDC_ISSUER: https://token.actions.githubusercontent.com
          SOURCE_REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          images=("$GHCR")
          if [ -n "$DOCKERHUB" ]; then images+=("$DOCKERHUB"); fi
          for image in "${images[@]}"; do
            echo "signing ${image}@${DIGEST}"
            "$RUNNER_TEMP/rekor-run.sh" signature "${image}@${DIGEST}" cosign sign --yes "${image}@${DIGEST}"
          done

      - name: Generate the SBOM with syft
        if: needs.plan.outputs.publish == 'true' && inputs.sbom
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.names.outputs.ghcr }}@${{ steps.index.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Attach the SBOM as a cosign attestation
        if: needs.plan.outputs.publish == 'true' && inputs.sbom
        env:
          GHCR: ${{ steps.names.outputs.ghcr }}
          DOCKERHUB: ${{ steps.names.outputs.dockerhub }}
          DIGEST: ${{ steps.index.outputs.digest }}
          IDENTITY_REGEXP: ${{ inputs.signer-identity-regexp }}
          OIDC_ISSUER: https://token.actions.githubusercontent.com
          SOURCE_REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          images=("$GHCR")
          if [ -n "$DOCKERHUB" ]; then images+=("$DOCKERHUB"); fi
          for image in "${images[@]}"; do
            echo "attesting SBOM on ${image}@${DIGEST}"
            "$RUNNER_TEMP/rekor-run.sh" sbom "${image}@${DIGEST}" \
              cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${image}@${DIGEST}"
          done

      - name: Record build provenance
        if: needs.plan.outputs.publish == 'true' && inputs.provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.ghcr }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - name: Verify the image before publishing the tags
        if: needs.plan.outputs.publish == 'true' && (inputs.sign || inputs.sbom)
        env:
          GHCR: ${{ steps.names.outputs.ghcr }}
          DOCKERHUB: ${{ steps.names.outputs.dockerhub }}
          DIGEST: ${{ steps.index.outputs.digest }}
          SIGN: ${{ inputs.sign }}
          SBOM: ${{ inputs.sbom }}
          IDENTITY_REGEXP: ${{ inputs.signer-identity-regexp }}
          OIDC_ISSUER: https://token.actions.githubusercontent.com
          SOURCE_REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$IDENTITY_REGEXP" ] || [ -z "$OIDC_ISSUER" ] || [ -z "$SOURCE_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ]; then
            echo "::error title=verify::the identity, issuer, repository and commit constraints must all be set; refusing an unconstrained verify"
            exit 1
          fi
          images=("$GHCR")
          if [ -n "$DOCKERHUB" ]; then images+=("$DOCKERHUB"); fi
          for image in "${images[@]}"; do
            if [ "$SIGN" = "true" ]; then
              if ! cosign verify "${image}@${DIGEST}" \
                --certificate-identity-regexp "$IDENTITY_REGEXP" \
                --certificate-oidc-issuer "$OIDC_ISSUER" \
                --certificate-github-workflow-repository "$SOURCE_REPOSITORY" \
                --certificate-github-workflow-sha "$WORKFLOW_SHA" > /dev/null; then
                echo "::error title=verify::the signature of ${image}@${DIGEST} does not verify; the release tags were not moved"
                exit 1
              fi
              echo "signature verified: ${image}@${DIGEST}"
            fi
            if [ "$SBOM" = "true" ]; then
              if ! cosign verify-attestation --type spdxjson "${image}@${DIGEST}" \
                --certificate-identity-regexp "$IDENTITY_REGEXP" \
                --certificate-oidc-issuer "$OIDC_ISSUER" \
                --certificate-github-workflow-repository "$SOURCE_REPOSITORY" \
                --certificate-github-workflow-sha "$WORKFLOW_SHA" > /dev/null; then
                echo "::error title=verify::the SBOM attestation of ${image}@${DIGEST} does not verify; the release tags were not moved"
                exit 1
              fi
              echo "SBOM attestation verified: ${image}@${DIGEST}"
            fi
          done

      # The only step that moves latest, the branch, semver and sha tags.
      #
      # What the step guarantees, and what it does not. A registry cannot
      # write several tags in one step, so the step is bounded, not atomic.
      # It moves one tag at a time, after recording the digest every tag holds
      # now, and reads each tag back; every registry call is retried a bounded
      # number of times when the failure is transient, and a write that returns
      # an error is judged by reading the tag back, not by its exit status.
      # Every digest a tag is moved to is already signed, attested and verified
      # by the steps before it, and `latest` moves last. On a failure it
      # restores a tag to its previous digest only while the tag still holds
      # the digest this run wrote: a tag that holds anything else was changed
      # by another writer and is left alone, and the step fails naming the tag
      # and the digests. The restore is best effort: it needs the previous
      # manifest to still exist, a restored digest is whatever the tag held
      # and is not verified again by this workflow, and a tag that did not
      # exist before cannot be deleted, so it may remain. If a restore fails
      # or is refused, the step fails with a "rollback failed" error that names
      # every tag and digest left behind. Runs that can write the same
      # destination are serialized by the job's concurrency group, and a
      # release tag ref moves the mutable tags only when it is the newest
      # SemVer release.
      - name: Publish the release tags
        if: needs.plan.outputs.publish == 'true'
        env:
          GHCR: ${{ steps.names.outputs.ghcr }}
          HUB: ${{ steps.names.outputs.dockerhub }}
          DIGEST: ${{ steps.index.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          SIGN: ${{ inputs.sign }}
          SBOM: ${{ inputs.sbom }}
          PROVENANCE: ${{ inputs.provenance }}
          ALLOW_UNSIGNED: ${{ inputs.allow-unsigned-publish }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set -f
          shopt -u nocasematch
          export LC_ALL=C
          digest_re='^sha256:[0-9a-f]{64}$'
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

          # One bounded retry for every registry and API call: 4 attempts in
          # all, waiting 5, 10 and 20 seconds. Only a transient failure is
          # retried (HTTP 408, 425, 429 and every 5xx, a timeout, a reset
          # connection). The output is left in REG_OUT and REG_ERR.
          registry_transient() {
            grep -Eqi '(^|[ :[(])(408|425|429|5[0-9]{2})( |]|\)|$)|context deadline exceeded|i/o timeout|timed out|connection reset|connection refused|temporarily unavailable|unexpected EOF|TLS handshake timeout' <<< "$1"
          }
          registry_retry() {
            local n=1 rc errf delay
            while :; do
              rc=0
              errf="$(mktemp)"
              REG_OUT="$("$@" 2> "$errf")" || rc=$?
              REG_ERR="$(< "$errf")"
              rm -f "$errf"
              if [ "$rc" -eq 0 ]; then return 0; fi
              if registry_transient "$REG_ERR" && [ "$n" -lt 4 ]; then
                delay=$(( ${REGISTRY_BACKOFF_SECONDS:-5} * (1 << (n - 1)) ))
                echo "::warning title=registry retry::attempt ${n} of 4 of '$1 $2 $3' hit a transient error; retrying in ${delay}s" >&2
                sleep "$delay"
                n=$((n + 1))
                continue
              fi
              return "$rc"
            done
          }

          # SemVer 2.0.0 precedence: prints -1, 0 or 1 for $1 against $2
          # (versions without the leading v; build metadata is ignored).
          semver_cmp() {
            local a="${1%%+*}" b="${2%%+*}" ac bc ap="" bp="" i x y xn yn
            local -a an bn ai bi
            ac="${a%%-*}"; if [ "$ac" != "$a" ]; then ap="${a#*-}"; fi
            bc="${b%%-*}"; if [ "$bc" != "$b" ]; then bp="${b#*-}"; fi
            IFS=. read -r -a an <<< "$ac"
            IFS=. read -r -a bn <<< "$bc"
            for i in 0 1 2; do
              x="${an[i]}"; y="${bn[i]}"
              if [ "${#x}" -gt "${#y}" ]; then echo 1; return; fi
              if [ "${#x}" -lt "${#y}" ]; then echo -1; return; fi
              if [[ $x > $y ]]; then echo 1; return; fi
              if [[ $x < $y ]]; then echo -1; return; fi
            done
            if [ -z "$ap" ] && [ -z "$bp" ]; then echo 0; return; fi
            if [ -z "$ap" ]; then echo 1; return; fi
            if [ -z "$bp" ]; then echo -1; return; fi
            IFS=. read -r -a ai <<< "$ap"
            IFS=. read -r -a bi <<< "$bp"
            for ((i = 0; ; i++)); do
              if [ "$i" -ge "${#ai[@]}" ] || [ "$i" -ge "${#bi[@]}" ]; then
                if [ "${#ai[@]}" -eq "${#bi[@]}" ]; then echo 0
                elif [ "${#ai[@]}" -lt "${#bi[@]}" ]; then echo -1
                else echo 1; fi
                return
              fi
              x="${ai[i]}"; y="${bi[i]}"
              xn=0; yn=0
              if [[ $x =~ ^[0-9]+$ ]]; then xn=1; fi
              if [[ $y =~ ^[0-9]+$ ]]; then yn=1; fi
              if [ "$xn" = 1 ] && [ "$yn" = 1 ]; then
                if [ "${#x}" -gt "${#y}" ]; then echo 1; return; fi
                if [ "${#x}" -lt "${#y}" ]; then echo -1; return; fi
              elif [ "$xn" = 1 ]; then echo -1; return
              elif [ "$yn" = 1 ]; then echo 1; return
              fi
              if [[ $x > $y ]]; then echo 1; return; fi
              if [[ $x < $y ]]; then echo -1; return; fi
            done
          }

          if [ "$ALLOW_UNSIGNED" != "true" ] \
            && { [ "$SIGN" != "true" ] || [ "$SBOM" != "true" ] || [ "$PROVENANCE" != "true" ]; }; then
            echo "::error title=unsigned publish::sign, sbom or provenance is off and allow-unsigned-publish is not true; the release tags were not moved"
            exit 1
          fi
          [[ "$DIGEST" =~ $digest_re ]] || { echo "::error title=tags::no usable index digest; the release tags were not moved"; exit 1; }
          mapfile -t release_tags < <(printf '%s\n' "$TAGS" | sed '/^$/d')
          if [ "${#release_tags[@]}" -eq 0 ]; then
            echo "::error title=tags::no release tags to publish"
            exit 1
          fi

          # Which tags this run may write. A branch run moves its tags only if
          # its commit is still the branch head. A release tag ref moves the
          # mutable tags (latest, major and minor, anything but the full
          # version and the sha- tags) only when it is the newest SemVer
          # release; a tag ref that is not a SemVer release has no order, so
          # it publishes only its own tag name and the sha- tags. Everything
          # skipped is announced. If the head or the tag list cannot be read,
          # nothing is moved and the job fails. The check is repeated right
          # before every write of a mutable tag (see the write loop), so a ref
          # that moves during the registry work stops the rest of the moving
          # tags instead of being judged once, at the start.
          publish_tags=("${release_tags[@]}")
          keep_immutable() {
            local kept=() tag name
            for tag in "${publish_tags[@]}"; do
              name="${tag##*:}"
              case "$name" in sha-* | "$1" | "v$1" | "$2") kept+=("$tag") ;; esac
            done
            publish_tags=("${kept[@]}")
          }
          ref_name=""
          version=""
          ordered_release=0
          case "$REF" in
            refs/tags/*)
              ref_name="${REF#refs/tags/}"
              version="${ref_name#v}"
              if [[ "$version" =~ $semver_re ]] && [ "$ref_name" != "$version" ]; then ordered_release=1; fi ;;
          esac
          # A moving tag is anything but a sha- tag and, on a tag ref, the
          # run's own version and tag name.
          is_mutable() {
            local name="${1##*:}"
            case "$name" in sha-*) return 1 ;; esac
            if [ -n "$ref_name" ]; then
              case "$name" in "${version%%+*}" | "v${version%%+*}" | "$ref_name") return 1 ;; esac
            fi
            return 0
          }
          # Is this run still the newest? Returns 0 when it is, 2 when it is
          # not (NEWER names what is newer), 1 when that could not be read
          # (ORDER_TITLE and ORDER_MSG say why). Reads the live state every time.
          NEWER=""
          ORDER_TITLE=""
          ORDER_MSG=""
          check_newest() {
            local existing
            NEWER=""
            case "$REF" in
              refs/heads/*)
                if ! registry_retry gh api "repos/${REPOSITORY}/commits/${REF#refs/heads/}" --jq .sha \
                  || ! [[ "$REG_OUT" =~ ^[0-9a-f]{40}$ ]]; then
                  ORDER_TITLE="branch head"
                  ORDER_MSG="could not read the head of ${REF#refs/heads/}"
                  return 1
                fi
                if [ "$REG_OUT" != "$WORKFLOW_SHA" ]; then
                  NEWER="$REG_OUT"
                  return 2
                fi ;;
              refs/tags/*)
                if [ "$ordered_release" = 1 ]; then
                  if ! registry_retry gh api --paginate "repos/${REPOSITORY}/git/matching-refs/tags/v" --jq '.[].ref'; then
                    ORDER_TITLE="release order"
                    ORDER_MSG="could not read the release tags of ${REPOSITORY}"
                    return 1
                  fi
                  while IFS= read -r existing; do
                    existing="${existing#refs/tags/v}"
                    [[ "$existing" =~ $semver_re ]] || continue
                    # A stable release is ordered against stable releases only.
                    if [[ "$version" != *-* && "$existing" == *-* ]]; then continue; fi
                    if [ "$(semver_cmp "$existing" "$version")" = "1" ]; then NEWER="$existing"; return 2; fi
                  done <<< "$REG_OUT"
                fi ;;
            esac
            return 0
          }
          check_rc=0
          check_newest || check_rc=$?
          if [ "$check_rc" -eq 1 ]; then
            echo "::error title=${ORDER_TITLE}::${ORDER_MSG}; the release tags were not moved"
            exit 1
          fi
          case "$REF" in
            refs/heads/*)
              if [ "$check_rc" -eq 2 ]; then
                publish_tags=()
                for tag in "${release_tags[@]}"; do
                  case "${tag##*:}" in sha-*) publish_tags+=("$tag") ;; esac
                done
                echo "::warning title=stale run::${WORKFLOW_SHA} is no longer the head of ${REF#refs/heads/}; only the immutable sha- tags are published, the moving tags were not moved"
              fi ;;
            refs/tags/*)
              if [ "$ordered_release" = 1 ]; then
                if [ "$check_rc" -eq 2 ]; then
                  keep_immutable "${version%%+*}" "$ref_name"
                  echo "::notice title=older release::v${NEWER} is newer than ${ref_name}; only the version and sha- tags are published, the moving tags (latest and the like) were not moved"
                fi
              else
                keep_immutable "${version%%+*}" "$ref_name"
                echo "::notice title=unordered tag::${ref_name} is not a vMAJOR.MINOR.PATCH release, so it has no order against other releases; only its own tag name and the sha- tags are published, the moving tags were not moved"
              fi ;;
          esac
          if [ "${#publish_tags[@]}" -eq 0 ]; then
            echo "::warning title=nothing to publish::this run has no tag it may write"
            exit 0
          fi

          # Order: the immutable sha- tags, then the other tags, `latest` last.
          # Every tag must belong to a registry that holds the staged index.
          ordered=()
          seen=" "
          for pass in sha other latest; do
            for tag in "${publish_tags[@]}"; do
              name="${tag##*:}"
              case "$pass:$name" in
                sha:sha-* | latest:latest) ;;
                other:sha-* | other:latest) continue ;;
                other:*) ;;
                *) continue ;;
              esac
              case "$seen" in *" $tag "*) continue ;; esac
              seen="$seen$tag "
              repo="${tag%:*}"
              if [ "$repo" != "$GHCR" ] && { [ -z "$HUB" ] || [ "$repo" != "$HUB" ]; }; then
                echo "::error title=tags::${tag} is not in a registry that holds the staged index; the release tags were not moved"
                exit 1
              fi
              ordered+=("$tag")
            done
          done

          # Prints the digest a reference resolves to, or "absent" when the
          # registry says it does not exist. Any other failure is an error.
          read_digest() {
            local out rc=0
            if registry_retry docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}'; then
              out="$(printf '%s' "$REG_OUT" | tr -d '[:space:]')"
              [[ "$out" =~ $digest_re ]] || return 1
              printf '%s' "$out"
              return 0
            else
              rc=$?
            fi
            if [ "$rc" -ne 127 ] && grep -Eqi 'not found|manifest unknown|name unknown|404' <<< "$REG_ERR"; then
              printf 'absent'
              return 0
            fi
            return 1
          }

          # Before anything moves: the staged index is where it should be, and
          # every tag's current digest is known. An unreadable tag stops the run
          # with nothing moved, since it could not be restored.
          declare -A prev=()
          for repo in "$GHCR" ${HUB:+"$HUB"}; do
            staged="$(read_digest "${repo}@${DIGEST}")" || staged="unreadable"
            if [ "$staged" != "$DIGEST" ]; then
              echo "::error title=tags::the staged index ${repo}@${DIGEST} reads back as '${staged}'; the release tags were not moved"
              exit 1
            fi
          done
          for tag in "${ordered[@]}"; do
            if ! now="$(read_digest "$tag")"; then
              echo "::error title=tags::could not read the current digest of ${tag}; the release tags were not moved"
              exit 1
            fi
            prev["$tag"]="$now"
          done

          touched=()
          problem=""
          stale=0
          moving_written=0
          for tag in "${ordered[@]}"; do
            repo="${tag%:*}"
            if is_mutable "$tag"; then
              # The ref may have moved since the start: ask again, right before
              # this write, and refuse it if this run is no longer the newest.
              check_rc=0
              check_newest || check_rc=$?
              if [ "$check_rc" -eq 1 ]; then
                problem="${ORDER_MSG} before writing ${tag}, so it was not written"
                break
              elif [ "$check_rc" -eq 2 ]; then
                stale=1
                if [ "$ordered_release" = 1 ]; then
                  problem="v${NEWER} is newer than ${ref_name}, so ${tag} was not written"
                else
                  problem="${WORKFLOW_SHA} is no longer the head of ${REF#refs/heads/}, so ${tag} was not written"
                fi
                break
              fi
              moving_written=1
            fi
            touched+=("$tag")
            write_rc=0
            registry_retry docker buildx imagetools create --tag "$tag" "${repo}@${DIGEST}" || write_rc=$?
            # A write that returned an error may still have committed, so the
            # tag is read back and judged by what it holds.
            got="$(read_digest "$tag")" || got="unreadable"
            if [ "$got" != "$DIGEST" ]; then
              if [ "$write_rc" -ne 0 ] && [ "$got" = "${prev[$tag]}" ]; then
                problem="writing ${tag} failed and the tag did not move"
              else
                problem="${tag} reads back as ${got}, not as the signed ${DIGEST}"
              fi
              break
            fi
            if [ "$write_rc" -ne 0 ]; then
              echo "::notice title=write error::writing ${tag} returned an error but the tag reads back as ${DIGEST}"
            fi
            echo "published ${tag} -> ${DIGEST}"
          done
          if [ "$stale" = 1 ] && [ "$moving_written" = 0 ] && [ "$problem" != "${problem#*, so }" ]; then
            # The ref moved on before any moving tag was written: only the
            # immutable tags went out, exactly as for a run that was stale at
            # the start. Not a failure.
            echo "::warning title=stale run::${problem}; only the immutable tags were published, the moving tags were not moved"
            exit 0
          fi
          if [ -z "$problem" ] && [ "$moving_written" = 1 ]; then
            # Nothing re-checks the ref after the last moving write unless this
            # does: the ref may have moved between the lookup before that write
            # and the write itself. A run that is no longer the newest is rolled
            # back and fails.
            check_rc=0
            check_newest || check_rc=$?
            if [ "$check_rc" -eq 1 ]; then
              problem="${ORDER_MSG} after the last moving tag was written"
            elif [ "$check_rc" -eq 2 ]; then
              problem="a newer ref (${NEWER}) appeared while the last moving tag was written, so this run is no longer the newest"
            fi
          fi
          if [ -z "$problem" ]; then
            # A second read of every tag: one that moved while the others were
            # written is a failure too.
            for tag in "${ordered[@]}"; do
              got="$(read_digest "$tag")" || got="unreadable"
              if [ "$got" != "$DIGEST" ]; then
                problem="${tag} reads back as ${got} after the last write, not as ${DIGEST}"
                break
              fi
            done
          fi
          if [ -z "$problem" ]; then
            echo "all ${#ordered[@]} release tags resolve to ${DIGEST}"
            exit 0
          fi

          # Best-effort restore, newest write first. A tag is written back
          # only while it still holds the digest this run wrote; any other
          # digest means another writer changed it, and it is left alone.
          echo "::error title=tags::promotion failed: ${problem}; restoring the tags this run moved"
          restored=()
          failed=()
          kept=()
          for ((i = ${#touched[@]} - 1; i >= 0; i--)); do
            tag="${touched[$i]}"
            repo="${tag%:*}"
            want="${prev[$tag]}"
            cur="$(read_digest "$tag")" || cur="unreadable"
            if [ "$want" = "absent" ]; then
              # A registry tag cannot be deleted with these tools.
              if [ "$cur" != "absent" ]; then kept+=("${tag} (new, now ${cur})"); fi
              continue
            fi
            if [ "$cur" = "$want" ]; then continue; fi
            if [ "$cur" != "$DIGEST" ]; then
              failed+=("${tag} holds ${cur}, this run promoted ${DIGEST}, the recorded previous digest is ${want}; a concurrent change prevented a safe restore and nothing was written")
              continue
            fi
            # The registry has no conditional write (no compare-and-swap on a
            # tag), so the check above and the write below cannot be one atomic
            # step. The window is cut to the one read between them: read the tag
            # again and write only if it still holds this run's digest. It
            # cannot be closed: a writer that changes the tag after that read
            # and before the write is overwritten, and nothing can detect it,
            # because the read-back after the write sees only this run's
            # restore. What narrows it is the concurrency group (writers of
            # one GHCR image queue) and the immediate re-read; the step fails
            # loudly whenever the restore does not read back as expected.
            again="$(read_digest "$tag")" || again="unreadable"
            if [ "$again" != "$DIGEST" ]; then
              failed+=("${tag} holds ${again}, this run promoted ${DIGEST}, the recorded previous digest is ${want}; it changed between the check and the restore (a concurrent change) and nothing was written")
              continue
            fi
            restore_rc=0
            registry_retry docker buildx imagetools create --tag "$tag" "${repo}@${want}" || restore_rc=$?
            cur="$(read_digest "$tag")" || cur="unreadable"
            if [ "$cur" = "$want" ]; then
              restored+=("${tag} -> ${want}")
            else
              failed+=("${tag} is ${cur}, was ${want}, this run promoted ${DIGEST} (the restore write ended with status ${restore_rc})")
            fi
          done
          if [ "${#restored[@]}" -gt 0 ]; then
            echo "restored: $(printf '%s; ' "${restored[@]}")"
          fi
          if [ "${#kept[@]}" -gt 0 ]; then
            echo "::warning title=new tags::these tags did not exist before and cannot be deleted by this step: $(printf '%s; ' "${kept[@]}")"
          fi
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error title=rollback failed::the release failed (${problem}) and these tags could NOT be restored, so they were left behind: $(printf '%s; ' "${failed[@]}")"
            exit 1
          fi
          echo "::error title=tags::the release failed (${problem}); the tags this run moved were restored and read back"
          exit 1

      - name: Summary
        if: needs.plan.outputs.publish == 'true'
        env:
          GHCR: ${{ steps.names.outputs.ghcr }}
          DIGEST: ${{ steps.index.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          SIGNED: ${{ inputs.sign }}
          SBOM: ${{ inputs.sbom }}
          PROVENANCE: ${{ inputs.provenance }}
        run: |
          {
            echo "## Published"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "| Artefact | Present |"
            echo "|---|---|"
            echo "| cosign signature | $SIGNED |"
            echo "| SPDX SBOM (syft, cosign attestation + artifact) | $SBOM |"
            echo "| SLSA provenance (GitHub attestation) | $PROVENANCE |"
            echo
            echo "Verify:"
            echo
            echo '```'
            echo "cosign verify ${GHCR}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/ChiefGyk3D/git-your-ship-together/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
