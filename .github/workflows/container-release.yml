# Reusable container release: build once, test it, scan it, then publish a
# multi-arch image with the provenance an integrator can verify. It builds
# whatever the Dockerfile builds; nothing here is Python. Callers pinned to
# the old name, python-docker-release.yml, reach this file through a thin
# caller kept under that name.
#
#   0. Lint the Dockerfile with hadolint (a pinned, hash-checked binary).
#   1. Build each platform natively (linux/arm64 on ubuntu-24.04-arm, linux/amd64
#      on ubuntu-24.04; QEMU only for any other platform), load it, require a
#      non-root user, run the
#      caller's check against it.
#   2. Scan each with Trivy; results go to the Security tab as SARIF.
#   3. When `push` is true: push each platform image under a temporary tag
#      `<sha>-<arch>`, join them into one index under the real tags on GHCR
#      (and Docker Hub when the Doppler config carries credentials), then
#        - sign the index with cosign (keyless, Sigstore, GitHub OIDC identity),
#        - generate an SPDX SBOM with syft, attach it as a cosign attestation
#          and keep it as a workflow artifact,
#        - record SLSA build provenance with GitHub Artifact Attestations.
#
# Call it with:
#
#   jobs:
#     release:
#       uses: ChiefGyk3D/git-your-ship-together/.github/workflows/container-release.yml@<sha> # vX.Y.Z
#       permissions:
#         contents: read
#         packages: write
#         id-token: write
#         attestations: write
#         security-events: write
#       secrets:
#         DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional fallback
#       with:
#         dockerfile: docker/Dockerfile
#         push: ${{ github.event_name != 'pull_request' }}
#         docker-test-command: docker run --rm "$IMAGE" --version
#
# A publishing build never reads the Actions cache. Anyone who can open a pull
# request can write to that cache, and a poisoned layer in a signed release is
# the one outcome the signature cannot undo. Pull-request builds use it.
#
# Verify a published image with:
#
#   cosign verify ghcr.io/<owner>/<repo>:<tag> \
#     --certificate-identity-regexp '^https://github.com/ChiefGyk3D/git-your-ship-together/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   cosign verify-attestation --type spdxjson ghcr.io/<owner>/<repo>:<tag> \
#     --certificate-identity-regexp '^https://github.com/ChiefGyk3D/git-your-ship-together/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify oci://ghcr.io/<owner>/<repo>:<tag> --owner <owner>
#
# The signing identity is this reusable workflow, not the caller: that is how
# keyless signing attributes a job that runs in a reusable workflow, and it
# means one identity to trust across every repository that calls it.

name: Container release (reusable)

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Path to the Dockerfile.
        type: string
        default: Dockerfile
      context:
        description: Build context.
        type: string
        default: "."
      platforms:
        description: Platforms for the published image.
        type: string
        default: linux/amd64,linux/arm64
      image-name:
        description: Image name under ghcr.io. Defaults to the repository name, lower-cased.
        type: string
        default: ""
      push:
        description: Publish. False builds, tests and scans only.
        type: boolean
        default: false
      tags:
        description: docker/metadata-action tag rules.
        type: string
        default: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}
      docker-test-command:
        description: Shell run against the locally built image; `$IMAGE` names it. Empty skips the check.
        type: string
        default: ""
      hadolint:
        description: Lint the Dockerfile with hadolint before building.
        type: boolean
        default: true
      hadolint-version:
        description: hadolint release to download (hadolint/hadolint), without the `v`. Changing it means changing both `hadolint-sha256-*` inputs.
        type: string
        default: "2.15.1"
      hadolint-sha256-amd64:
        description: SHA-256 of the hadolint-linux-x86_64 binary for that version.
        type: string
        default: "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
      hadolint-sha256-arm64:
        description: SHA-256 of the hadolint-linux-arm64 binary for that version.
        type: string
        default: "f6198ef8090f404dbb771abfee086eb8c48ac177f30da7fd3510aca35b344b5d"
      hadolint-args:
        description: Arguments passed to hadolint before the Dockerfile path, split on whitespace.
        type: string
        default: "--failure-threshold warning"
      hadolint-continue-on-error:
        description: Report hadolint findings without failing the job. For a repository adopting the linter before its Dockerfile is clean.
        type: boolean
        default: false
      require-non-root:
        description: Fail when the built image runs as root (`id -u` prints 0). The fix is a `USER` instruction in the Dockerfile. Needs an `id` binary in the image; turn it off for a distroless or scratch image.
        type: boolean
        default: true
      probe-read-only:
        description: Also run the image with a read-only root filesystem (`--read-only --tmpfs /tmp`) and fail if it breaks. Enable once the image is known to write only under tmpfs or volumes.
        type: boolean
        default: false
      probe-command:
        description: Arguments for the read-only probe, which runs `docker run --rm --read-only --tmpfs /tmp "$IMAGE" <probe-command>` with the image's own entrypoint. Must exit on its own, such as `--version`. Required when `probe-read-only` is true.
        type: string
        default: ""
      dockerhub:
        description: Also publish to Docker Hub when the Doppler config holds DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
        type: boolean
        default: false
      dockerhub-repository:
        description: Docker Hub repository name (without the namespace). Defaults to the repository name, lower-cased.
        type: string
        default: ""
      sign:
        description: Sign the published image with cosign (keyless).
        type: boolean
        default: true
      sbom:
        description: Generate an SPDX SBOM with syft and attach it as a cosign attestation.
        type: boolean
        default: true
      provenance:
        description: Record SLSA build provenance with GitHub Artifact Attestations.
        type: boolean
        default: true
      trivy:
        description: Scan the built image with Trivy and upload SARIF.
        type: boolean
        default: true
      trivy-severity:
        description: Severities Trivy reports.
        type: string
        default: CRITICAL,HIGH
      trivy-exit-code:
        description: Trivy exit code when findings exist. "1" makes findings fail the job.
        type: string
        default: "0"
      egress-policy:
        description: harden-runner egress policy - `audit` logs outbound connections, `block` allows only `allowed-endpoints`.
        type: string
        default: audit
      allowed-endpoints:
        description: harden-runner allow-list for `block`, space-separated host:port entries. The default is every endpoint this workflow's jobs reached in audit mode across the calling repositories; the runner's own infrastructure needs no entry. Wildcards are not supported and a newline-separated list matches nothing.
        type: string
        default: "api.doppler.com:443 api.github.com:443 auth.docker.io:443 check.trivy.dev:443 deb.debian.org:80 files.pythonhosted.org:443 fulcio.sigstore.dev:443 get.trivy.dev:443 ghcr.io:443 github.com:443 index.docker.io:443 mirror.gcr.io:443 pkg-containers.githubusercontent.com:443 production.cloudfront.docker.com:443 pypi.org:443 raw.githubusercontent.com:443 registry-1.docker.io:443 rekor.sigstore.dev:443 release-assets.githubusercontent.com:443 timestamp.sigstore.dev:443 tuf-repo-cdn.sigstore.dev:443"
      extra-allowed-endpoints:
        description: Appended to `allowed-endpoints`, for hosts only this repository reaches, such as an apt repository its Dockerfile adds. Same format.
        type: string
        default: ""
      doppler-project:
        description: Doppler project slug.
        type: string
        default: ""
      doppler-config:
        description: Doppler config slug holding CI secrets.
        type: string
        default: ""
      doppler-identity-id:
        description: Doppler Service Account Identity UUID for OIDC.
        type: string
        default: ""
      doppler-trusted-refs-only:
        description: Fetch CI secrets only on the default branch, a tag or a schedule; never on a pull request or another branch. `false` restores fetching on every same-repository run.
        type: boolean
        default: true
      timeout-minutes:
        description: Job timeout. Multi-arch builds that compile native code need a generous one.
        type: number
        default: 60
    secrets:
      DOPPLER_TOKEN:
        description: Doppler Service Token fallback when OIDC is not configured.
        required: false
    outputs:
      digest:
        description: Digest of the published image index (empty when not pushed).
        value: ${{ jobs.merge.outputs.digest }}
      image:
        description: The GHCR image reference by digest (empty when not pushed).
        value: ${{ jobs.merge.outputs.image }}

permissions:
  contents: read

jobs:
  # Turns `platforms` into the build matrix and names the GHCR image, so the
  # build jobs need neither Doppler nor the Docker Hub logic.
  plan:
    name: Plan the build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      ghcr: ${{ steps.plan.outputs.ghcr }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }}
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ inputs.egress-policy == 'block' }}

      - name: Plan the matrix
        id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
          REPOSITORY: ${{ github.repository }}
          IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          set -euo pipefail
          repo_name="${REPOSITORY#*/}"
          repo_name="$(printf '%s' "$repo_name" | tr '[:upper:]' '[:lower:]')"
          owner="$(printf '%s' "${REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
          echo "ghcr=ghcr.io/${owner}/${IMAGE_NAME:-$repo_name}" >> "$GITHUB_OUTPUT"
          # arm64 and amd64 build natively on their own runner; anything else
          # falls back to an amd64 runner with QEMU.
          matrix='[]'
          IFS=',' read -r -a platforms <<< "$PLATFORMS"
          for platform in "${platforms[@]}"; do
            platform="$(printf '%s' "$platform" | tr -d '[:space:]')"
            [ -n "$platform" ] || continue
            if ! printf '%s' "$platform" | grep -Eq '^linux/[a-z0-9]+(/v[0-9]+)?$'; then
              echo "::error title=platforms::'$platform' is not a linux/<arch> platform"
              exit 1
            fi
            case "$platform" in
              linux/arm64) runner=ubuntu-24.04-arm ;;
              *) runner=ubuntu-24.04 ;;
            esac
            matrix="$(jq -c --arg platform "$platform" --arg arch "${platform//\//-}" --arg runner "$runner" \
              '. + [{platform: $platform, arch: $arch, runner: $runner}]' <<< "$matrix")"
          done
          if [ "$matrix" = "[]" ]; then
            echo "::error title=platforms::no platform given"
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "build matrix: $matrix"

  # The Dockerfile lint runs in a job of its own, not inside `build`: it
  # restores a cache (the pinned hadolint binary), and a job that restores a
  # cache must not be the one that pushes an image. `build` waits for it.
  dockerfile-lint:
    name: Lint the Dockerfile (hadolint)
    if: inputs.hadolint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }}
          disable-sudo: true
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ inputs.egress-policy == 'block' }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # hadolint is not a GitHub-owned action and not on the approved list, so it
      # is a pinned binary like shellcheck in bash-ci.yml: the cache holds only
      # the download, and the file on disk is checked against the pinned hash
      # whether it came from the cache or the network.
      - name: Restore the cached hadolint binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tool-cache/hadolint
          key: tool-hadolint-${{ inputs.hadolint-version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Fetch hadolint at the pinned version
        env:
          VERSION: ${{ inputs.hadolint-version }}
          AMD64_SHA256: ${{ inputs.hadolint-sha256-amd64 }}
          ARM64_SHA256: ${{ inputs.hadolint-sha256-arm64 }}
          RUNNER_ARCH_NAME: ${{ runner.arch }}
          CACHE_DIR: ${{ runner.temp }}/tool-cache/hadolint
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH_NAME" in
            X64) asset=hadolint-linux-x86_64; SHA256="$AMD64_SHA256" ;;
            ARM64) asset=hadolint-linux-arm64; SHA256="$ARM64_SHA256" ;;
            *) echo "::error title=hadolint::no hadolint binary for runner architecture $RUNNER_ARCH_NAME"; exit 1 ;;
          esac
          mkdir -p "$CACHE_DIR"
          if [ -f "$CACHE_DIR/hadolint" ] && ! echo "${SHA256}  $CACHE_DIR/hadolint" | sha256sum --status -c -; then
            echo "cached hadolint binary does not match the pinned hash; fetching it again"
            rm -f "$CACHE_DIR/hadolint"
          fi
          if [ ! -f "$CACHE_DIR/hadolint" ]; then
            curl -sSfL -o "$CACHE_DIR/hadolint" "https://github.com/hadolint/hadolint/releases/download/v${VERSION}/${asset}"
          fi
          echo "${SHA256}  $CACHE_DIR/hadolint" | sha256sum -c -
          chmod 0755 "$CACHE_DIR/hadolint"
          "$CACHE_DIR/hadolint" --version

      - name: Lint the Dockerfile (hadolint)
        continue-on-error: ${{ inputs.hadolint-continue-on-error }}
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          ARGS: ${{ inputs.hadolint-args }}
          HADOLINT: ${{ runner.temp }}/tool-cache/hadolint/hadolint
        run: |
          set -euo pipefail
          read -r -a args <<< "$ARGS"
          "$HADOLINT" "${args[@]}" "$DOCKERFILE"

  # One job per platform, on a runner of that architecture: build, check and
  # scan the image where it runs. When publishing, the same job pushes the
  # platform image under a temporary tag, `<sha>-<arch>`, for `merge`.
  build:
    name: Build, test, scan (${{ matrix.platform }})
    needs: [plan, dockerfile-lint]
    # A skipped lint (hadolint: false) must not skip the build; a failed or
    # cancelled one must.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.dockerfile-lint.result == 'success' || needs.dockerfile-lint.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      packages: write  # push the per-platform image under its temporary tag
      security-events: write  # Trivy SARIF upload
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }}
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ inputs.egress-policy == 'block' }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only a platform with no native runner needs emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.platform != 'linux/amd64' && matrix.platform != 'linux/arm64'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.plan.outputs.ghcr }}
          tags: ${{ inputs.tags }}

      - name: Build for this platform and load it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: release-candidate:local
          labels: ${{ steps.meta.outputs.labels }}
          # The Actions cache is writable by anyone who can open a pull
          # request; a publishing build must not read it. One scope per
          # platform so the architectures do not overwrite each other.
          cache-from: ${{ !inputs.push && format('type=gha,scope={0}', matrix.arch) || '' }}
          cache-to: ${{ !inputs.push && format('type=gha,mode=max,scope={0}', matrix.arch) || '' }}

      - name: Require a non-root user
        if: inputs.require-non-root
        run: |
          set -euo pipefail
          if ! uid="$(docker run --rm --entrypoint id release-candidate:local -u)"; then
            echo "::error title=non-root::could not run \`id -u\` in the image; add a USER instruction, or set require-non-root: false for an image with no id binary"
            exit 1
          fi
          if [ "$uid" = "0" ]; then
            echo "::error title=non-root::the image runs as root (uid 0); add a USER instruction to the Dockerfile, or set require-non-root: false"
            exit 1
          fi
          echo "the image runs as uid $uid"

      - name: Check the image
        if: inputs.docker-test-command != ''
        env:
          IMAGE: release-candidate:local
          COMMAND: ${{ inputs.docker-test-command }}
        run: bash -eo pipefail -c "$COMMAND"

      - name: Probe with a read-only root filesystem
        if: inputs.probe-read-only
        env:
          PROBE_COMMAND: ${{ inputs.probe-command }}
        run: |
          set -euo pipefail
          if [ -z "$PROBE_COMMAND" ]; then
            echo "::error title=probe-read-only::probe-command is empty; give it the arguments that make the image exit on its own, such as --version"
            exit 1
          fi
          read -r -a args <<< "$PROBE_COMMAND"
          if ! docker run --rm --read-only --tmpfs /tmp release-candidate:local "${args[@]}"; then
            echo "::error title=probe-read-only::the image fails with a read-only root filesystem; it writes outside /tmp. Point its writable paths at a tmpfs or a volume, or leave probe-read-only off"
            exit 1
          fi

      - name: Scan the image with Trivy
        if: inputs.trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: release-candidate:local
          format: sarif
          output: trivy-results.sarif
          severity: ${{ inputs.trivy-severity }}
          exit-code: ${{ inputs.trivy-exit-code }}
          ignore-unfixed: true

      - name: Upload Trivy results to the Security tab
        if: inputs.trivy && always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-${{ matrix.arch }}

      - name: Build and push this platform's image
        if: inputs.push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ needs.plan.outputs.ghcr }}:${{ github.sha }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          # No cache here: a publishing build never reads the Actions cache.
          # Signing, the SBOM and provenance are produced by `merge` as
          # explicit, verifiable artefacts; BuildKit's own attestation
          # manifests would duplicate them and add unknown/unknown entries.
          provenance: false
          sbom: false

  # Joins the per-platform images into one multi-arch index under the real
  # tags, then signs, attests and records provenance for that index.
  merge:
    name: Publish, sign
    # Never on a pull request, whatever the caller passes: this job holds the
    # tokens that sign and attest.
    if: inputs.push && github.event_name != 'pull_request'
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write  # push the index, signature, SBOM attestation and provenance
      id-token: write  # Doppler OIDC, cosign keyless signing, GitHub attestation
      attestations: write  # record SLSA provenance
    outputs:
      digest: ${{ steps.index.outputs.digest }}
      image: ${{ steps.names.outputs.ghcr }}@${{ steps.index.outputs.digest }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }}
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ inputs.egress-policy == 'block' }}

      # --- Doppler (same steps as .github/actions/doppler-secrets) ---------
      - name: Decide how to authenticate to Doppler
        id: doppler
        if: inputs.push && inputs.dockerhub
        env:
          IDENTITY_ID: ${{ inputs.doppler-identity-id }}
          TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PROJECT: ${{ inputs.doppler-project }}
          CONFIG: ${{ inputs.doppler-config }}
          REQUIRED: "false"
          TRUSTED_ONLY: ${{ inputs.doppler-trusted-refs-only }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mode=none
          skip=""
          # A trusted ref is one only a push by someone with write access, or the
          # schedule, can produce: the default branch, a tag, or a scheduled run
          # (which GitHub always starts from the default branch). A pull request
          # is never trusted, whichever repository its head is in.
          trusted=false
          case "$EVENT" in
            schedule) trusted=true ;;
            pull_request|pull_request_target) trusted=false ;;
            *)
              if [ -n "$DEFAULT_BRANCH" ] && [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
                trusted=true
              elif [ "${REF#refs/tags/}" != "$REF" ]; then
                trusted=true
              fi ;;
          esac
          if [ "$IS_FORK" = "true" ]; then
            # A fork's pull request has no id-token and must never receive a
            # secret. Silent skip is correct here, whatever `required` says.
            skip="pull request from a fork"
          elif [ "$TRUSTED_ONLY" = "true" ] && [ "$trusted" != "true" ]; then
            skip="$EVENT on $REF is not the default branch, a tag or a schedule (trusted-refs-only)"
          elif [ -n "$IDENTITY_ID" ]; then
            mode=oidc
          elif [ -n "$TOKEN" ]; then
            mode=token
          fi
          if [ -n "$skip" ]; then
            echo "::notice title=Doppler::$skip - no secrets are fetched"
          fi
          if [ "$mode" != "none" ] && { [ -z "$PROJECT" ] || [ -z "$CONFIG" ]; }; then
            echo "::error title=Doppler::project and config are required when authenticating"
            exit 1
          fi
          if [ "$mode" = "none" ] && [ -z "$skip" ]; then
            if [ "$REQUIRED" = "true" ]; then
              echo "::error title=Doppler::no identity-id and no DOPPLER_TOKEN; this job needs one (see README, 'Doppler setup')"
              exit 1
            fi
            echo "::notice title=Doppler::not configured (no identity-id, no DOPPLER_TOKEN) - continuing without CI secrets"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Doppler auth mode: $mode"

      - name: Fetch CI secrets from Doppler (OIDC)
        if: steps.doppler.outputs.mode == 'oidc'
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ inputs.doppler-identity-id }}
          doppler-project: ${{ inputs.doppler-project }}
          doppler-config: ${{ inputs.doppler-config }}
          inject-env-vars: true

      - name: Fetch CI secrets from Doppler (Service Token)
        if: steps.doppler.outputs.mode == 'token'
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: ${{ inputs.doppler-project }}
          doppler-config: ${{ inputs.doppler-config }}
          inject-env-vars: true
      # ---------------------------------------------------------------------

      - name: Resolve image names
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
          IMAGE_NAME: ${{ inputs.image-name }}
          DOCKERHUB: ${{ inputs.dockerhub }}
          DOCKERHUB_REPOSITORY: ${{ inputs.dockerhub-repository }}
          PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail
          repo_name="${REPOSITORY#*/}"
          repo_name="$(printf '%s' "$repo_name" | tr '[:upper:]' '[:lower:]')"
          owner="$(printf '%s' "${REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
          ghcr="ghcr.io/${owner}/${IMAGE_NAME:-$repo_name}"
          echo "ghcr=$ghcr" >> "$GITHUB_OUTPUT"
          images="$ghcr"
          hub=""
          if [ "$PUSH" = "true" ] && [ "$DOCKERHUB" = "true" ]; then
            if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
              hub="docker.io/${DOCKERHUB_USERNAME}/${DOCKERHUB_REPOSITORY:-$repo_name}"
              images="$images"$'\n'"$hub"
              echo "Docker Hub publish enabled: $hub"
            else
              echo "::warning title=Docker Hub::dockerhub is true but DOCKERHUB_USERNAME/DOCKERHUB_TOKEN were not fetched from Doppler - publishing to GHCR only"
            fi
          fi
          echo "dockerhub=$hub" >> "$GITHUB_OUTPUT"
          {
            echo "images<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: inputs.push && steps.names.outputs.dockerhub != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.names.outputs.images }}
          tags: ${{ inputs.tags }}

      - name: Create the multi-arch index
        id: index
        env:
          GHCR: ${{ steps.names.outputs.ghcr }}
          TAGS: ${{ steps.meta.outputs.tags }}
          PLATFORMS: ${{ inputs.platforms }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<< "$TAGS"
          sources=()
          IFS=',' read -r -a platforms <<< "$PLATFORMS"
          for platform in "${platforms[@]}"; do
            platform="$(printf '%s' "$platform" | tr -d '[:space:]')"
            [ -n "$platform" ] || continue
            sources+=("${GHCR}:${SHA}-${platform//\//-}")
          done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          first="$(head -n 1 <<< "$TAGS")"
          digest="$(docker buildx imagetools inspect "$first" --format '{{.Manifest.Digest}}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "index digest: $digest"

      - name: Install cosign
        if: inputs.push && (inputs.sign || inputs.sbom)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        if: inputs.push && inputs.sign
        env:
          GHCR: ${{ steps.names.outputs.ghcr }}
          DOCKERHUB: ${{ steps.names.outputs.dockerhub }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          for image in $GHCR $DOCKERHUB; do
            echo "signing ${image}@${DIGEST}"
            cosign sign --yes "${image}@${DIGEST}"
          done

      - name: Generate the SBOM with syft
        if: inputs.push && inputs.sbom
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.names.outputs.ghcr }}@${{ steps.index.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Attach the SBOM as a cosign attestation
        if: inputs.push && inputs.sbom
        env:
          GHCR: ${{ steps.names.outputs.ghcr }}
          DOCKERHUB: ${{ steps.names.outputs.dockerhub }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          for image in $GHCR $DOCKERHUB; do
            echo "attesting SBOM on ${image}@${DIGEST}"
            cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${image}@${DIGEST}"
          done

      - name: Record build provenance
        if: inputs.push && inputs.provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.ghcr }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: inputs.push
        env:
          GHCR: ${{ steps.names.outputs.ghcr }}
          DIGEST: ${{ steps.index.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          SIGNED: ${{ inputs.sign }}
          SBOM: ${{ inputs.sbom }}
          PROVENANCE: ${{ inputs.provenance }}
        run: |
          {
            echo "## Published"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "| Artefact | Present |"
            echo "|---|---|"
            echo "| cosign signature | $SIGNED |"
            echo "| SPDX SBOM (syft, cosign attestation + artifact) | $SBOM |"
            echo "| SLSA provenance (GitHub attestation) | $PROVENANCE |"
            echo
            echo "Verify:"
            echo
            echo '```'
            echo "cosign verify ${GHCR}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/ChiefGyk3D/git-your-ship-together/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
