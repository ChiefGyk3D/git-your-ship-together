          canary_main &
          main=$!
          (sleep 90; kill -TERM -- "-$main"; sleep 2; kill -KILL -- "-$main") >/dev/null 2>&1 &
          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
            kill -TERM -- "-$main" >/dev/null 2>&1 || true
            sleep 1
            kill -KILL -- "-$main" >/dev/null 2>&1 || true
          fi
          if [ "$rc" -eq 143 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=egress canary::the canary hit its 90 s deadline: rerun the job"
            rc=124
          fi
          exit "$rc"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only a platform with no native runner needs emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.platform != 'linux/amd64' && matrix.platform != 'linux/arm64'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.plan.outputs.ghcr }}
          tags: ${{ inputs.tags }}

      - name: Build for this platform and load it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: release-candidate:local
          labels: ${{ steps.meta.outputs.labels }}
          # The Actions cache is writable by anyone who can open a pull
          # request; a publishing build must not read it. One scope per
          # platform so the architectures do not overwrite each other.
          cache-from: ${{ !inputs.push && (inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block' && format('type=gha,scope={0}', matrix.arch) || '' }}
          cache-to: ${{ !inputs.push && (inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block' && format('type=gha,mode=max,scope={0}', matrix.arch) || '' }}

      - name: Require a non-root user
        if: inputs.require-non-root
        run: |
          set -euo pipefail
          if ! uid="$(docker run --rm --entrypoint id release-candidate:local -u)"; then
            echo "::error title=non-root::could not run \`id -u\` in the image; add a USER instruction, or set require-non-root: false for an image with no id binary"
            exit 1
          fi
          if [ "$uid" = "0" ]; then
            echo "::error title=non-root::the image runs as root (uid 0); add a USER instruction to the Dockerfile, or set require-non-root: false"
            exit 1
          fi
          echo "the image runs as uid $uid"

      - name: Check the image
        if: inputs.docker-test-command != ''
        env:
          IMAGE: release-candidate:local
          COMMAND: ${{ inputs.docker-test-command }}
        run: bash -eo pipefail -c "$COMMAND"

      - name: Probe with a read-only root filesystem
        if: inputs.probe-read-only
        env:
          PROBE_COMMAND: ${{ inputs.probe-command }}
        run: |
          set -euo pipefail
          if [ -z "$PROBE_COMMAND" ]; then
            echo "::error title=probe-read-only::probe-command is empty; give it the arguments that make the image exit on its own, such as --version"
            exit 1
          fi
          read -r -a args <<< "$PROBE_COMMAND"
          if ! docker run --rm --read-only --tmpfs /tmp release-candidate:local "${args[@]}"; then
            echo "::error title=probe-read-only::the image fails with a read-only root filesystem; it writes outside /tmp. Point its writable paths at a tmpfs or a volume, or leave probe-read-only off"
            exit 1
          fi

      - name: Suppress Trivy secret findings under installed Python package roots
        if: inputs.trivy && inputs.skip-secret-scan-in-site-packages
        run: |
          # One global allow rule with a path only: Trivy still reads these files and detects secrets in them
          # but drops those findings, for a Python site-packages directory of one of three image roots
          # (usr/lib, usr/local/lib, opt/venv/lib; lib64 too), the path anchored at the image root with a
          # numeric X.Y version. Trivy's vulnerability scanner reads the same packages as before.
          # Nothing else is allowed, disabled or skipped. Trivy reads the file through its documented
          # --secret-config flag, set here by its environment form.
          CONFIG="$RUNNER_TEMP/trivy-secret.yaml"
          cat > "$CONFIG" <<'EOF'
          allow-rules:
            - id: python-site-packages
              description: Installed Python packages under the listed roots (see skip-secret-scan-in-site-packages)
              path: ^(usr/(local/)?lib(64)?|opt/venv/lib)/python[0-9]+\.[0-9]+/site-packages/
          EOF
          echo "TRIVY_SECRET_CONFIG=$CONFIG" >> "$GITHUB_ENV"

      - name: Scan the image with Trivy
        if: inputs.trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: release-candidate:local
          format: sarif
          output: trivy-results.sarif
          severity: ${{ inputs.trivy-severity }}
          exit-code: ${{ inputs.trivy-exit-code }}
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
          trivyignores: ${{ inputs.trivyignores }}

      - name: Upload Trivy results to the Security tab
        if: inputs.trivy && always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image-${{ matrix.arch }}

  # Joins the per-platform images into one multi-arch index under the real
  # tags, then signs, attests and records provenance for that index.
  merge:
    name: Publish, sign
    # Never on a pull request, whatever the caller passes: this job holds the
    # tokens that sign and attest.
    if: needs.plan.outputs.publish == 'true' && github.event_name != 'pull_request'
    needs: [plan, build]
    # One publish per GHCR image at a time, whatever the ref and whether or
    # not Docker Hub is on, and a running one is never cancelled halfway
    # through signing. The key comes from the plan and always names the GHCR
    # image, which every run writes; it is a caller input, never event data.
    # A job has one group, so Docker Hub is not in the key: two callers with
    # different GHCR images that share one Hub repository are not queued
    # behind each other (the Hub namespace is also unknown before the job
    # starts). Their Hub writes are covered only by the compare-before-write
    # checks and read-backs in the publish step. The group serializes runs in
    # the order they reach this job, not in commit order; the publish step
    # re-checks the ref before each moving tag and once after the last, so a
    # stale run does not leave a branch's or an older release's mutable tags.
    # GitHub keeps one pending run per group, so a pending run is replaced by
    # a newer pending run of the same image; re-run the replaced one.
