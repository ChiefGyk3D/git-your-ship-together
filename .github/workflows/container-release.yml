# Reusable container release: build once, test it, scan it, then publish a
# multi-arch image with the provenance an integrator can verify. It builds
# whatever the Dockerfile builds; nothing here is Python. Callers pinned to
# the old name, python-docker-release.yml, reach this file through a thin
# caller kept under that name.
#
#   0. Lint the Dockerfile with hadolint (a pinned, hash-checked binary).
#   1. Build each platform natively (linux/arm64 on ubuntu-24.04-arm, linux/amd64
#      on ubuntu-24.04; QEMU only for any other platform), load it, require a
#      non-root user, run the
#      caller's check against it.
#   2. Scan each with Trivy; results go to the Security tab as SARIF.
#   3. When `push` is true: push each platform image under a temporary tag
#      `<sha>-<arch>`, join them into one index under the real tags on GHCR
#      (and Docker Hub when the Doppler config carries credentials), then
#        - sign the index with cosign (keyless, Sigstore, GitHub OIDC identity),
#        - generate an SPDX SBOM with syft, attach it as a cosign attestation
#          and keep it as a workflow artifact,
#        - record SLSA build provenance with GitHub Artifact Attestations.
#
# Call it with:
#
#   jobs:
#     release:
#       uses: ChiefGyk3D/git-your-ship-together/.github/workflows/container-release.yml@<sha> # vX.Y.Z
#       permissions:
#         contents: read
#         packages: write
#         id-token: write
#         attestations: write
#         security-events: write
#       secrets:
#         DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional fallback
#       with:
#         dockerfile: docker/Dockerfile
#         push: ${{ github.event_name != 'pull_request' }}
#         docker-test-command: docker run --rm "$IMAGE" --version
#
# A publishing build never reads the Actions cache. Anyone who can open a pull
# request can write to that cache, and a poisoned layer in a signed release is
# the one outcome the signature cannot undo. Pull-request builds use it.
#
# Verify a published image with:
#
#   cosign verify ghcr.io/<owner>/<repo>:<tag> \
#     --certificate-identity-regexp '^https://github.com/ChiefGyk3D/git-your-ship-together/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   cosign verify-attestation --type spdxjson ghcr.io/<owner>/<repo>:<tag> \
#     --certificate-identity-regexp '^https://github.com/ChiefGyk3D/git-your-ship-together/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify oci://ghcr.io/<owner>/<repo>:<tag> --owner <owner>
#
# The signing identity is this reusable workflow, not the caller: that is how
# keyless signing attributes a job that runs in a reusable workflow, and it
# means one identity to trust across every repository that calls it.

name: Container release (reusable)

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Path to the Dockerfile.
        type: string
        default: Dockerfile
      context:
        description: Build context.
        type: string
        default: "."
      platforms:
        description: Platforms for the published image.
        type: string
        default: linux/amd64,linux/arm64
      image-name:
        description: Image name under ghcr.io. Defaults to the repository name, lower-cased.
        type: string
        default: ""
      push:
        description: Publish. False builds, tests and scans only.
        type: boolean
        default: false
      tags:
        description: docker/metadata-action tag rules.
        type: string
        default: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}
      signer-identity-regexp:
        description: >-
          Certificate identity the merge job's own signature and SBOM
          attestation must match (checked before the release tags move). It is
          validated before anything is pushed: it must start with
          ^https://github\.com/, name a workflow file under
          \.github/workflows/, end with @, and use no metacharacter except an
          escaped dot. The default names this reusable workflow; a fork of it
          sets its own.
        type: string
        default: ^https://github\.com/ChiefGyk3D/git-your-ship-together/\.github/workflows/container-release\.yml@
      allow-unsigned-publish:
        description: >-
          Let a publishing run move the release tags with sign, sbom or
          provenance turned off. Default false: a run that would publish with
          any of the three off fails before it builds, so an unsigned image
          cannot reach latest by accident. A run that does not publish is not
          affected.
        type: boolean
        default: false
      docker-test-command:
        description: Shell run against the locally built image; `$IMAGE` names it. Empty skips the check.
        type: string
        default: ""
      hadolint:
        description: Lint the Dockerfile with hadolint before building.
        type: boolean
        default: true
      hadolint-version:
        description: hadolint release to download (hadolint/hadolint), without the `v`. Changing it means changing both `hadolint-sha256-*` inputs.
        type: string
        default: "2.15.1"
      hadolint-sha256-amd64:
        description: SHA-256 of the hadolint-linux-x86_64 binary for that version.
        type: string
        default: "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507"
      hadolint-sha256-arm64:
        description: SHA-256 of the hadolint-linux-arm64 binary for that version.
        type: string
        default: "f6198ef8090f404dbb771abfee086eb8c48ac177f30da7fd3510aca35b344b5d"
      hadolint-args:
        description: Arguments passed to hadolint before the Dockerfile path, split on whitespace.
        type: string
        default: "--failure-threshold warning"
      hadolint-continue-on-error:
        description: Report hadolint findings without failing the job. For a repository adopting the linter before its Dockerfile is clean.
        type: boolean
        default: false
      require-non-root:
        description: Fail when the built image runs as root (`id -u` prints 0). The fix is a `USER` instruction in the Dockerfile. Needs an `id` binary in the image; turn it off for a distroless or scratch image.
        type: boolean
        default: true
      probe-read-only:
        description: Also run the image with a read-only root filesystem (`--read-only --tmpfs /tmp`) and fail if it breaks. Enable once the image is known to write only under tmpfs or volumes.
        type: boolean
        default: false
      probe-command:
        description: Arguments for the read-only probe, which runs `docker run --rm --read-only --tmpfs /tmp "$IMAGE" <probe-command>` with the image's own entrypoint. Must exit on its own, such as `--version`. Required when `probe-read-only` is true.
        type: string
        default: ""
      dockerhub:
        description: Also publish to Docker Hub when the Doppler config holds DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
        type: boolean
        default: false
      dockerhub-repository:
        description: Docker Hub repository name (without the namespace). Defaults to the repository name, lower-cased.
        type: string
        default: ""
      sign:
        description: Sign the published image with cosign (keyless).
        type: boolean
        default: true
      sbom:
        description: Generate an SPDX SBOM with syft and attach it as a cosign attestation.
        type: boolean
        default: true
      provenance:
        description: Record SLSA build provenance with GitHub Artifact Attestations.
        type: boolean
        default: true
      trivy:
        description: Scan the built image with Trivy and upload SARIF.
        type: boolean
        default: true
      trivy-severity:
        description: Severities Trivy reports.
        type: string
        default: CRITICAL,HIGH
      trivy-exit-code:
        description: Trivy exit code when findings exist. "1" (the default) makes findings fail the job; "0" reports only.
        type: string
        default: "1"
      trivy-ignore-unfixed:
        description: Skip advisories that have no fix in the distribution, so they do not block the gate.
        type: boolean
        default: true
      skip-secret-scan-in-site-packages:
        description: >-
          Suppress ALL Trivy secret findings (every secret rule, not one rule id) from files under three image roots only: usr/lib[64], usr/local/lib[64] and opt/venv/lib, each pythonX.Y/site-packages.
          Reason: a package's docstring text can match a secret rule (the anthropic SDK's text about an API enum value matches
          gcp-service-account) when nothing is a credential and no fixed version exists. Trivy still reads those files (this is not a performance boundary) and only secret findings are affected: the
          vulnerability scan, severity, ignore-unfixed and exit code are unchanged. A real secret shipped inside a dependency under those roots will NOT be detected (a supply-chain tradeoff); secrets at every other path are still found.
        type: boolean
        default: false
      trivyignores:
        description: Path to the caller's .trivyignore file, relative to the repository. Empty means none. Every entry needs a reason and a review date.
        type: string
        default: ""
      egress-policy:
        description: harden-runner egress policy - `audit` logs outbound connections, `block` allows only `allowed-endpoints`. Jobs that hold no secret follow `egress-policy-secretless` instead (EX-0001).
        type: string
        default: audit
      egress-policy-secretless:
        description: harden-runner egress policy for the jobs that hold no stored secret, no OIDC token and no write-scoped or publish-capable token (read-only contents, a SARIF upload at most), and whose output no privileged job consumes - exactly `audit` or `block`. Defaults to `block` since security exception EX-0001 (GitHub-hosted runners in westus2 broke harden-runner `block`) was closed on 2026-11-02 after harden-runner v2.22.3 passed on westus2; see docs/security/exceptions/. Every job still has the default read-only job token. Set `audit` to opt out if the defect recurs. Any other job follows `egress-policy`. Any other value fails the job.
        type: string
        default: block
      allowed-endpoints:
        description: harden-runner allow-list for `block`, space-separated host:port entries. The default is every endpoint this workflow's jobs reached in audit mode across the calling repositories; the runner's own infrastructure needs no entry. Wildcards are not supported and a newline-separated list matches nothing.
        type: string
        default: "api.doppler.com:443 api.github.com:443 auth.docker.io:443 check.trivy.dev:443 deb.debian.org:80 files.pythonhosted.org:443 fulcio.sigstore.dev:443 get.trivy.dev:443 ghcr.io:443 github.com:443 index.docker.io:443 mirror.gcr.io:443 pkg-containers.githubusercontent.com:443 production.cloudfront.docker.com:443 pypi.org:443 raw.githubusercontent.com:443 registry-1.docker.io:443 rekor.sigstore.dev:443 release-assets.githubusercontent.com:443 timestamp.sigstore.dev:443 tuf-repo-cdn.sigstore.dev:443"
      extra-allowed-endpoints:
        description: Appended to `allowed-endpoints`, for hosts only this repository reaches, such as an apt repository its Dockerfile adds. Same format.
        type: string
        default: ""
      doppler-project:
        description: Doppler project slug.
        type: string
        default: ""
      doppler-config:
        description: Doppler config slug holding CI secrets.
        type: string
        default: ""
      doppler-identity-id:
        description: Doppler Service Account Identity UUID for OIDC.
        type: string
        default: ""
      doppler-trusted-refs-only:
        description: Fetch CI secrets only on the default branch, a version tag (vN.N.N) or a schedule; never on a pull request or another branch. `false` restores fetching on every same-repository run.
        type: boolean
        default: true
      allowed-publish-events:
        description: Comma-separated event names (`github.event_name`) from which `push` may publish. Default `push`. `*` allows every event except `pull_request` and `pull_request_target`, which never publish. Together with `require-tag-ref` this is the allow-list for pushing, signing and attesting.
        type: string
        default: push
      require-tag-ref:
        description: Publish only from a `refs/tags/v*` ref. `false` also allows other refs, for a caller that publishes from a branch on purpose.
        type: boolean
        default: true
      timeout-minutes:
        description: Job timeout. Multi-arch builds that compile native code need a generous one.
        type: number
        default: 60
    secrets:
      DOPPLER_TOKEN:
        description: Doppler Service Token fallback when OIDC is not configured.
        required: false
    outputs:
      digest:
        description: Digest of the published image index (empty when not pushed).
        value: ${{ jobs.merge.outputs.digest }}
      image:
        description: The GHCR image reference by digest (empty when not pushed).
        value: ${{ jobs.merge.outputs.image }}

permissions:
  contents: read

jobs:
  # Turns `platforms` into the build matrix and names the GHCR image, so the
  # build jobs need neither Doppler nor the Docker Hub logic.
  plan:
    name: Plan the build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      ghcr: ${{ steps.plan.outputs.ghcr }}
      serialize: ${{ steps.plan.outputs.serialize }}
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - name: Validate the egress policy inputs
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ (inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block' }}

      - name: Egress canary
        if: ${{ runner.os == 'Linux' && ((inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block') }}
        timeout-minutes: 2
        shell: bash
        # The workspace root exists before checkout; a job default working-directory may not.
        working-directory: ${{ github.workspace }}
        run: |
          set -u
          NAMES="github.com api.github.com results-receiver.actions.githubusercontent.com"
          PORT=443
          canary_resolve() { timeout 5 getent ahostsv4 "$1" 2>/dev/null | awk '$2 == "STREAM" { print $1 }'; }
          canary_probe() { timeout 3 bash -c "exec 3<>\"/dev/tcp/\$0/\$1\"" "$1" "$PORT" 2>/dev/null; }
          canary_reach() {
            local i
            for i in 1 2 3 4; do
              canary_probe "$1" && return 0
              [ "$i" -lt 4 ] && sleep 1
            done
            return 1
          }
          canary_show() { local n=$1; shift; echo "+ $*"; { timeout 10 "$@" 2>&1 || true; } | head -n "$n" || true; }
          canary_diag() {
            local name
            echo "::group::egress canary diagnostics (for the GitHub Support ticket)"
            canary_show 5 uname -srmo
            canary_show 20 cat /etc/resolv.conf
            canary_show 20 bash -c "resolvectl status 2>/dev/null | grep -E '^ *(Current DNS Server|DNS Servers?|DNS Domain):'"
            canary_show 20 bash -c "ss -lun | grep ':53 '"
            for name in $NAMES pipelines.actions.githubusercontent.com; do
              canary_show 20 getent ahostsv4 "$name"
              canary_show 5 curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_connect}\n' --max-time 8 "https://$name"
            done
            echo "::endgroup::"
          }
          canary_main() {
            local tmp name addr n=0 bad
            tmp=$(mktemp -d) || return 1
            for _ in 1 2 3; do
              for name in $NAMES; do canary_resolve "$name" >>"$tmp/res.$name" & done
              wait
              sleep 1
            done
            for name in $NAMES; do
              if [ -s "$tmp/res.$name" ]; then sort -u "$tmp/res.$name"; else echo "-"; fi | sed "s|^|$name |" >>"$tmp/pairs"
            done
            while read -r name addr; do
              n=$((n + 1))
              ( { [ "$addr" != "-" ] && canary_reach "$addr"; } || echo "$name $addr" >"$tmp/bad.$n" ) </dev/null &
            done <"$tmp/pairs"
            wait
            bad=$(cat "$tmp"/bad.* 2>/dev/null | sort || true)
            rm -rf "$tmp"
            if [ -z "$bad" ]; then
              echo "egress canary: all $n addresses of $NAMES accept TCP $PORT"
              return 0
            fi
            echo "::error title=egress canary::egress broken on this runner (known westus2 DNS issue): rerun the job"
            echo "unreachable addresses (name address; '-' means the name did not resolve):"
            printf '%s\n' "$bad"
            canary_diag
            echo "egress canary failed, unreachable: $(printf '%s' "$bad" | tr '\n' ';')" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            return 1
          }
          set -m
          canary_main &
          main=$!
          (sleep 90; kill -TERM -- "-$main"; sleep 2; kill -KILL -- "-$main") >/dev/null 2>&1 &
          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
            kill -TERM -- "-$main" >/dev/null 2>&1 || true
            sleep 1
            kill -KILL -- "-$main" >/dev/null 2>&1 || true
          fi
          if [ "$rc" -eq 143 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=egress canary::the canary hit its 90 s deadline: rerun the job"
            rc=124
          fi
          exit "$rc"

      - name: Decide whether to publish
        id: publish
        env:
          PUSH: ${{ inputs.push }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ALLOWED_EVENTS: ${{ inputs.allowed-publish-events }}
          REQUIRE_TAG: ${{ inputs.require-tag-ref }}
        run: |
          set -euo pipefail
          set -f
          shopt -u nocasematch nocaseglob
          is_semver_release_tag() {
            local re='^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
            [[ $1 =~ $re ]]
          }
          # Pushing, signing and attesting follow this one decision: the
          # `push` input, an allowed event, and (by default) a SemVer v-tag.
          events_re='^(\*|[a-z][a-z_]*(,[a-z][a-z_]*)*)$'
          if ! [[ $ALLOWED_EVENTS =~ $events_re ]]; then
            echo "::error title=allowed-publish-events::allowed-publish-events must be * or comma-separated lowercase event names with no spaces or empty entries, such as push or push,workflow_dispatch"
            exit 1
          fi
          IFS=',' read -r -a items <<< "$ALLOWED_EVENTS"
          for ((i = 0; i < ${#items[@]}; i++)); do
            for ((j = i + 1; j < ${#items[@]}; j++)); do
              if [ "${items[i]}" = "${items[j]}" ]; then
                echo "::error title=allowed-publish-events::allowed-publish-events lists '${items[i]}' twice"
                exit 1
              fi
            done
          done
          ok=false
          reason=""
          pr_event=false
          event_blocked=false
          tag_blocked=false
          case "$EVENT" in
            pull_request | pull_request_target | "")
              pr_event=true
              reason="pull requests never publish (event '$EVENT')"
              ;;
            *)
              case ",$ALLOWED_EVENTS," in ",*,") ok=true ;; *",$EVENT,"*) ok=true ;; esac
              if [ "$ok" != true ]; then
                event_blocked=true
                reason="event '$EVENT' is not in allowed-publish-events ('$ALLOWED_EVENTS')"
              fi
              ;;
          esac
          if [ "$pr_event" != true ] && [ "$REQUIRE_TAG" != "false" ] && ! is_semver_release_tag "$REF"; then
            tag_blocked=true
            ok=false
            tag_reason="ref '$REF' is not a vMAJOR.MINOR.PATCH release tag (require-tag-ref is true)"
            if [ -n "$reason" ]; then reason="$reason; and $tag_reason"; else reason="$tag_reason"; fi
          fi
          publish=false
          if [ "$PUSH" = "true" ]; then
            if [ "$ok" = true ]; then
              publish=true
            else
              # Name only the inputs that would change this outcome.
              if [ "$pr_event" = true ]; then
                fix="No input can enable publishing from a pull request; publish from a push, tag or other non-pull-request event instead."
              elif [ "$event_blocked" = true ] && [ "$tag_blocked" = true ]; then
                fix="To publish from this run, add the event to allowed-publish-events (for example push,schedule,workflow_dispatch) and set require-tag-ref: false in the caller."
              elif [ "$event_blocked" = true ]; then
                fix="To publish from this event, add it to allowed-publish-events (for example push,schedule,workflow_dispatch) in the caller."
              else
                fix="To publish from a branch or other non-release ref, set require-tag-ref: false in the caller."
              fi
              msg="push is true but this run did NOT publish: $reason. (event '$EVENT', ref '$REF'.) $fix This run only built and scanned."
              echo "::warning title=publish skipped::$msg"
              { echo "### Publish skipped: this run did NOT publish"; echo; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "publish: $publish"

      - name: Require signing for a publish
        timeout-minutes: 1
        env:
          PUBLISH: ${{ steps.publish.outputs.publish }}
          SIGN: ${{ inputs.sign }}
          SBOM: ${{ inputs.sbom }}
          PROVENANCE: ${{ inputs.provenance }}
          ALLOW_UNSIGNED: ${{ inputs.allow-unsigned-publish }}
        run: |
          set -euo pipefail
          # Keyed on the publish decision: a run that does not publish (a pull
          # request, a branch the caller did not allow) pushes nothing, so it
          # has no unsigned release to refuse.
          if [ "$PUBLISH" = "true" ] && [ "$ALLOW_UNSIGNED" != "true" ] \
            && { [ "$SIGN" != "true" ] || [ "$SBOM" != "true" ] || [ "$PROVENANCE" != "true" ]; }; then
            echo "::error title=unsigned publish::this run would publish but sign, sbom or provenance is off; set all three, or set allow-unsigned-publish: true to accept an unsigned release"
            exit 1
          fi

      - name: Validate the signer identity
        timeout-minutes: 1
        env:
          IDENTITY_REGEXP: ${{ inputs.signer-identity-regexp }}
        run: |
          set -euo pipefail
          # Literal characters only: letters, digits, _ and -, an escaped dot,
          # and / between path segments. No wildcard, alternation, group or
          # class can pass, so the value names one workflow file.
          seg='([A-Za-z0-9_-]|\\\.)+'
          shape='^\^https://github\\\.com/'"${seg}/${seg}/"'\\\.github/workflows/'"${seg}"'@$'
          if ! [[ "$IDENTITY_REGEXP" =~ $shape ]]; then
            echo "::error title=signer-identity-regexp::must be ^https://github\\.com/<owner>/<repo>/\\.github/workflows/<file>@ with only letters, digits, _ - and escaped dots"
            exit 1
          fi

      - name: Plan the matrix
        id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
          REPOSITORY: ${{ github.repository }}
          IMAGE_NAME: ${{ inputs.image-name }}
          DOCKERHUB: ${{ inputs.dockerhub }}
          DOCKERHUB_REPOSITORY: ${{ inputs.dockerhub-repository }}
        run: |
          set -euo pipefail
          # These values reach $GITHUB_OUTPUT and a concurrency group: a
          # newline or any character outside this set is refused before
          # anything is written.
          name_re='^[A-Za-z0-9._/-]+$'
          for pair in "repository:${REPOSITORY}" "image-name:${IMAGE_NAME:-}" "dockerhub-repository:${DOCKERHUB_REPOSITORY:-}"; do
            label="${pair%%:*}"
            val="${pair#*:}"
            if [ -n "$val" ] && ! [[ "$val" =~ $name_re ]]; then
              echo "::error title=${label}::${label} may contain only letters, digits, . _ - and /, on one line"
              exit 1
            fi
          done
          repo_name="${REPOSITORY#*/}"
          repo_name="$(printf '%s' "$repo_name" | tr '[:upper:]' '[:lower:]')"
          owner="$(printf '%s' "${REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
          image="$(printf '%s' "${IMAGE_NAME:-$repo_name}" | tr '[:upper:]' '[:lower:]')"
          echo "ghcr=ghcr.io/${owner}/${IMAGE_NAME:-$repo_name}" >> "$GITHUB_OUTPUT"
          # The publish queue always names the GHCR image: every run writes it,
          # whether or not Docker Hub is on and whichever Hub repository it
          # uses, so runs that write one GHCR image share one queue.
          echo "serialize=ghcr-${owner}/${image}" >> "$GITHUB_OUTPUT"
          # arm64 and amd64 build natively on their own runner; anything else
          # falls back to an amd64 runner with QEMU.
          matrix='[]'
          seen=""
          # Exactly comma-separated linux/<arch>[/v<N>] entries: no spaces, no
          # empty entries, nothing is repaired.
          platforms_re='^linux/[a-z0-9]+(/v[0-9]+)?(,linux/[a-z0-9]+(/v[0-9]+)?)*$'
          if ! [[ $PLATFORMS =~ $platforms_re ]]; then
            echo "::error title=platforms::platforms must be comma-separated linux/<arch> or linux/<arch>/v<N> entries with no spaces and no empty entries"
            exit 1
          fi
          IFS=',' read -r -a platforms <<< "$PLATFORMS"
          for platform in "${platforms[@]}"; do
            # One image per platform: a repeat (after default variants are
            # applied) would share a temporary tag and make the index ambiguous.
            IFS=/ read -r _ parch pvar <<< "$platform"
            case "$parch" in arm64) pdef=v8 ;; arm) pdef=v7 ;; amd64) pdef=v1 ;; *) pdef="" ;; esac
            key="${parch}/${pvar:-$pdef}"
            case " $seen " in
              *" $key "*)
                echo "::error title=platforms::'$platform' is a duplicate platform (after default variants); list each platform once"
                exit 1
                ;;
            esac
            seen="$seen $key"
            case "$platform" in
              linux/arm64) runner=ubuntu-24.04-arm ;;
              *) runner=ubuntu-24.04 ;;
            esac
            matrix="$(jq -c --arg platform "$platform" --arg arch "${platform//\//-}" --arg runner "$runner" \
              '. + [{platform: $platform, arch: $arch, runner: $runner, idx: length}]' <<< "$matrix")"
          done
          count="$(jq 'length' <<< "$matrix")"
          if [ "$count" -gt 8 ]; then
            echo "::error title=platforms::at most 8 platforms are supported"
            exit 1
          fi
          if [ "$matrix" = "[]" ]; then
            echo "::error title=platforms::no platform given"
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "build matrix: $matrix"

  # The Dockerfile lint runs in a job of its own, not inside `build`: it
  # restores a cache (the pinned hadolint binary), and a job that restores a
  # cache must not be the one that pushes an image. `build` waits for it.
  dockerfile-lint:
    name: Lint the Dockerfile (hadolint)
    if: inputs.hadolint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate the egress policy inputs
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ (inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          disable-sudo: true
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ ((inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block') == 'block' }}

      - name: Egress canary
        if: ${{ runner.os == 'Linux' && (((inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block') == 'block') }}
        timeout-minutes: 2
        shell: bash
        # The workspace root exists before checkout; a job default working-directory may not.
        working-directory: ${{ github.workspace }}
        run: |
          set -u
          NAMES="github.com api.github.com results-receiver.actions.githubusercontent.com"
          PORT=443
          canary_resolve() { timeout 5 getent ahostsv4 "$1" 2>/dev/null | awk '$2 == "STREAM" { print $1 }'; }
          canary_probe() { timeout 3 bash -c "exec 3<>\"/dev/tcp/\$0/\$1\"" "$1" "$PORT" 2>/dev/null; }
          canary_reach() {
            local i
            for i in 1 2 3 4; do
              canary_probe "$1" && return 0
              [ "$i" -lt 4 ] && sleep 1
            done
            return 1
          }
          canary_show() { local n=$1; shift; echo "+ $*"; { timeout 10 "$@" 2>&1 || true; } | head -n "$n" || true; }
          canary_diag() {
            local name
            echo "::group::egress canary diagnostics (for the GitHub Support ticket)"
            canary_show 5 uname -srmo
            canary_show 20 cat /etc/resolv.conf
            canary_show 20 bash -c "resolvectl status 2>/dev/null | grep -E '^ *(Current DNS Server|DNS Servers?|DNS Domain):'"
            canary_show 20 bash -c "ss -lun | grep ':53 '"
            for name in $NAMES pipelines.actions.githubusercontent.com; do
              canary_show 20 getent ahostsv4 "$name"
              canary_show 5 curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_connect}\n' --max-time 8 "https://$name"
            done
            echo "::endgroup::"
          }
          canary_main() {
            local tmp name addr n=0 bad
            tmp=$(mktemp -d) || return 1
            for _ in 1 2 3; do
              for name in $NAMES; do canary_resolve "$name" >>"$tmp/res.$name" & done
              wait
              sleep 1
            done
            for name in $NAMES; do
              if [ -s "$tmp/res.$name" ]; then sort -u "$tmp/res.$name"; else echo "-"; fi | sed "s|^|$name |" >>"$tmp/pairs"
            done
            while read -r name addr; do
              n=$((n + 1))
              ( { [ "$addr" != "-" ] && canary_reach "$addr"; } || echo "$name $addr" >"$tmp/bad.$n" ) </dev/null &
            done <"$tmp/pairs"
            wait
            bad=$(cat "$tmp"/bad.* 2>/dev/null | sort || true)
            rm -rf "$tmp"
            if [ -z "$bad" ]; then
              echo "egress canary: all $n addresses of $NAMES accept TCP $PORT"
              return 0
            fi
            echo "::error title=egress canary::egress broken on this runner (known westus2 DNS issue): rerun the job"
            echo "unreachable addresses (name address; '-' means the name did not resolve):"
            printf '%s\n' "$bad"
            canary_diag
            echo "egress canary failed, unreachable: $(printf '%s' "$bad" | tr '\n' ';')" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            return 1
          }
          set -m
          canary_main &
          main=$!
          (sleep 90; kill -TERM -- "-$main"; sleep 2; kill -KILL -- "-$main") >/dev/null 2>&1 &
          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
            kill -TERM -- "-$main" >/dev/null 2>&1 || true
            sleep 1
            kill -KILL -- "-$main" >/dev/null 2>&1 || true
          fi
          if [ "$rc" -eq 143 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=egress canary::the canary hit its 90 s deadline: rerun the job"
            rc=124
          fi
          exit "$rc"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # hadolint is not a GitHub-owned action and not on the approved list, so it
      # is a pinned binary like shellcheck in bash-ci.yml: the cache holds only
      # the download, and the file on disk is checked against the pinned hash
      # whether it came from the cache or the network.
      - name: Restore the cached hadolint binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tool-cache/hadolint
          key: tool-hadolint-${{ inputs.hadolint-version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Fetch hadolint at the pinned version
        env:
          VERSION: ${{ inputs.hadolint-version }}
          AMD64_SHA256: ${{ inputs.hadolint-sha256-amd64 }}
          ARM64_SHA256: ${{ inputs.hadolint-sha256-arm64 }}
          RUNNER_ARCH_NAME: ${{ runner.arch }}
          CACHE_DIR: ${{ runner.temp }}/tool-cache/hadolint
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH_NAME" in
            X64) asset=hadolint-linux-x86_64; SHA256="$AMD64_SHA256" ;;
            ARM64) asset=hadolint-linux-arm64; SHA256="$ARM64_SHA256" ;;
            *) echo "::error title=hadolint::no hadolint binary for runner architecture $RUNNER_ARCH_NAME"; exit 1 ;;
          esac
          mkdir -p "$CACHE_DIR"
          if [ -f "$CACHE_DIR/hadolint" ] && ! echo "${SHA256}  $CACHE_DIR/hadolint" | sha256sum --status -c -; then
            echo "cached hadolint binary does not match the pinned hash; fetching it again"
            rm -f "$CACHE_DIR/hadolint"
          fi
          if [ ! -f "$CACHE_DIR/hadolint" ]; then
            curl -sSfL -o "$CACHE_DIR/hadolint" "https://github.com/hadolint/hadolint/releases/download/v${VERSION}/${asset}"
          fi
          echo "${SHA256}  $CACHE_DIR/hadolint" | sha256sum -c -
          chmod 0755 "$CACHE_DIR/hadolint"
          "$CACHE_DIR/hadolint" --version

      - name: Lint the Dockerfile (hadolint)
        continue-on-error: ${{ inputs.hadolint-continue-on-error }}
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          ARGS: ${{ inputs.hadolint-args }}
          HADOLINT: ${{ runner.temp }}/tool-cache/hadolint/hadolint
        run: |
          set -euo pipefail
          read -r -a args <<< "$ARGS"
          "$HADOLINT" "${args[@]}" "$DOCKERFILE"

  # One job per platform, on a runner of that architecture, for a run that
  # publishes: build once, push under a temporary tag
  # (`<sha>-<run id>-<attempt>-<arch>`), pull that image back by digest and run
  # every check against it, then hand the digest to `merge`, which merges by
  # digest, not by tag. A run that does not publish uses `build-local`.
  build:
    name: Build, test, scan (${{ matrix.platform }})
    needs: [plan, dockerfile-lint]
    # A skipped lint (hadolint: false) must not skip the build; a failed or
    # cancelled one must.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.publish == 'true' && (needs.dockerfile-lint.result == 'success' || needs.dockerfile-lint.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # This job runs only when publishing and is the only build job with
    # `packages: write`: every action in a job can read the job token, and a
    # job's permissions cannot depend on an expression, so a run that does not
    # publish uses `build-local` instead.
    permissions:
      contents: read
      packages: write  # push the per-platform image under its temporary tag
      security-events: write  # Trivy SARIF upload
    outputs:
      d0: ${{ steps.record.outputs.d0 }}
      d1: ${{ steps.record.outputs.d1 }}
      d2: ${{ steps.record.outputs.d2 }}
      d3: ${{ steps.record.outputs.d3 }}
      d4: ${{ steps.record.outputs.d4 }}
      d5: ${{ steps.record.outputs.d5 }}
      d6: ${{ steps.record.outputs.d6 }}
      d7: ${{ steps.record.outputs.d7 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Validate the egress policy inputs
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ (inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block' }}

      - name: Egress canary
        if: ${{ runner.os == 'Linux' && ((inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block') }}
        timeout-minutes: 2
        shell: bash
        # The workspace root exists before checkout; a job default working-directory may not.
        working-directory: ${{ github.workspace }}
        run: |
          set -u
          NAMES="github.com api.github.com results-receiver.actions.githubusercontent.com"
          PORT=443
          canary_resolve() { timeout 5 getent ahostsv4 "$1" 2>/dev/null | awk '$2 == "STREAM" { print $1 }'; }
          canary_probe() { timeout 3 bash -c "exec 3<>\"/dev/tcp/\$0/\$1\"" "$1" "$PORT" 2>/dev/null; }
          canary_reach() {
            local i
            for i in 1 2 3 4; do
              canary_probe "$1" && return 0
              [ "$i" -lt 4 ] && sleep 1
            done
            return 1
          }
          canary_show() { local n=$1; shift; echo "+ $*"; { timeout 10 "$@" 2>&1 || true; } | head -n "$n" || true; }
          canary_diag() {
            local name
            echo "::group::egress canary diagnostics (for the GitHub Support ticket)"
            canary_show 5 uname -srmo
            canary_show 20 cat /etc/resolv.conf
            canary_show 20 bash -c "resolvectl status 2>/dev/null | grep -E '^ *(Current DNS Server|DNS Servers?|DNS Domain):'"
            canary_show 20 bash -c "ss -lun | grep ':53 '"
            for name in $NAMES pipelines.actions.githubusercontent.com; do
              canary_show 20 getent ahostsv4 "$name"
              canary_show 5 curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_connect}\n' --max-time 8 "https://$name"
            done
            echo "::endgroup::"
          }
          canary_main() {
            local tmp name addr n=0 bad
            tmp=$(mktemp -d) || return 1
            for _ in 1 2 3; do
              for name in $NAMES; do canary_resolve "$name" >>"$tmp/res.$name" & done
              wait
              sleep 1
            done
            for name in $NAMES; do
              if [ -s "$tmp/res.$name" ]; then sort -u "$tmp/res.$name"; else echo "-"; fi | sed "s|^|$name |" >>"$tmp/pairs"
            done
            while read -r name addr; do
              n=$((n + 1))
              ( { [ "$addr" != "-" ] && canary_reach "$addr"; } || echo "$name $addr" >"$tmp/bad.$n" ) </dev/null &
            done <"$tmp/pairs"
            wait
            bad=$(cat "$tmp"/bad.* 2>/dev/null | sort || true)
            rm -rf "$tmp"
            if [ -z "$bad" ]; then
              echo "egress canary: all $n addresses of $NAMES accept TCP $PORT"
              return 0
            fi
            echo "::error title=egress canary::egress broken on this runner (known westus2 DNS issue): rerun the job"
            echo "unreachable addresses (name address; '-' means the name did not resolve):"
            printf '%s\n' "$bad"
            canary_diag
            echo "egress canary failed, unreachable: $(printf '%s' "$bad" | tr '\n' ';')" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            return 1
          }
          set -m
          canary_main &
          main=$!
          (sleep 90; kill -TERM -- "-$main"; sleep 2; kill -KILL -- "-$main") >/dev/null 2>&1 &
          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
            kill -TERM -- "-$main" >/dev/null 2>&1 || true
            sleep 1
            kill -KILL -- "-$main" >/dev/null 2>&1 || true
          fi
          if [ "$rc" -eq 143 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=egress canary::the canary hit its 90 s deadline: rerun the job"
            rc=124
          fi
          exit "$rc"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only a platform with no native runner needs emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.platform != 'linux/amd64' && matrix.platform != 'linux/arm64'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: needs.plan.outputs.publish == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.plan.outputs.ghcr }}
          tags: ${{ inputs.tags }}

      - name: Build and push this platform's image
        if: needs.plan.outputs.publish == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ needs.plan.outputs.ghcr }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          # No cache here: a publishing build never reads the Actions cache.
          # Signing, the SBOM and provenance are produced by `merge` as
          # explicit, verifiable artefacts; BuildKit's own attestation
          # manifests would duplicate them and add unknown/unknown entries.
          provenance: false
          sbom: false

      - name: Pull and verify the pushed image
        id: pushed
        if: needs.plan.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          GHCR: ${{ needs.plan.outputs.ghcr }}
        run: |
          set -euo pipefail
          shopt -u nocasematch
          verify_platform_image() {
            local ref=$1 want=$2 raw config actual wos warch wvar aos aarch avar def
            raw="$(docker buildx imagetools inspect --raw "$ref")" || return 1
            if ! jq -e 'type == "object" and (has("manifests") | not) and has("config") and has("layers")' <<< "$raw" > /dev/null; then
              echo "::error title=digest::$ref is not a single-platform image manifest"
              return 1
            fi
            config="$(docker buildx imagetools inspect "$ref" --format '{{json .Image}}')" || return 1
            actual="$(jq -r 'if type != "object" then "invalid" elif has("architecture") then "\(.os)/\(.architecture)/\(.variant // "")" elif length == 1 then (.[] | "\(.os)/\(.architecture)/\(.variant // "")") else "invalid" end' <<< "$config")"
            IFS=/ read -r wos warch wvar <<< "$want"
            IFS=/ read -r aos aarch avar <<< "$actual"
            # An omitted variant means the architecture's default, on both sides.
            case "$warch" in arm64) def=v8 ;; arm) def=v7 ;; amd64) def=v1 ;; *) def="" ;; esac
            if [ "$wos/$warch/${wvar:-$def}" != "$aos/$aarch/${avar:-$def}" ]; then
              echo "::error title=digest::$ref is $actual, expected $want"
              return 1
            fi
          }

          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error title=digest::the push of $PLATFORM produced no valid digest"; exit 1; }
          ref="${GHCR}@${DIGEST}"
          # The checks below run against exactly the image that was pushed.
          verify_platform_image "$ref" "$PLATFORM"
          docker pull --platform "$PLATFORM" "$ref"
          docker tag "$ref" release-candidate:local

      - name: Require a non-root user
        if: inputs.require-non-root
        run: |
          set -euo pipefail
          if ! uid="$(docker run --rm --entrypoint id release-candidate:local -u)"; then
            echo "::error title=non-root::could not run \`id -u\` in the image; add a USER instruction, or set require-non-root: false for an image with no id binary"
            exit 1
          fi
          if [ "$uid" = "0" ]; then
            echo "::error title=non-root::the image runs as root (uid 0); add a USER instruction to the Dockerfile, or set require-non-root: false"
            exit 1
          fi
          echo "the image runs as uid $uid"

      - name: Check the image
        if: inputs.docker-test-command != ''
        env:
          IMAGE: release-candidate:local
          COMMAND: ${{ inputs.docker-test-command }}
        run: bash -eo pipefail -c "$COMMAND"

      - name: Probe with a read-only root filesystem
        if: inputs.probe-read-only
        env:
          PROBE_COMMAND: ${{ inputs.probe-command }}
        run: |
          set -euo pipefail
          if [ -z "$PROBE_COMMAND" ]; then
            echo "::error title=probe-read-only::probe-command is empty; give it the arguments that make the image exit on its own, such as --version"
            exit 1
          fi
          read -r -a args <<< "$PROBE_COMMAND"
          if ! docker run --rm --read-only --tmpfs /tmp release-candidate:local "${args[@]}"; then
            echo "::error title=probe-read-only::the image fails with a read-only root filesystem; it writes outside /tmp. Point its writable paths at a tmpfs or a volume, or leave probe-read-only off"
            exit 1
          fi

      - name: Suppress Trivy secret findings under installed Python package roots
        if: inputs.trivy && inputs.skip-secret-scan-in-site-packages
        run: |
          # One global allow rule with a path only: Trivy still reads these files and detects secrets in them
          # but drops those findings, for a Python site-packages directory of one of three image roots
          # (usr/lib, usr/local/lib, opt/venv/lib; lib64 too), the path anchored at the image root with a
          # numeric X.Y version. Trivy's vulnerability scanner reads the same packages as before.
          # Nothing else is allowed, disabled or skipped. Trivy reads the file through its documented
          # --secret-config flag, set here by its environment form.
          CONFIG="$RUNNER_TEMP/trivy-secret.yaml"
          cat > "$CONFIG" <<'EOF'
          allow-rules:
            - id: python-site-packages
              description: Installed Python packages under the listed roots (see skip-secret-scan-in-site-packages)
              path: ^(usr/(local/)?lib(64)?|opt/venv/lib)/python[0-9]+\.[0-9]+/site-packages/
          EOF
          echo "TRIVY_SECRET_CONFIG=$CONFIG" >> "$GITHUB_ENV"

      - name: Scan the image with Trivy
        if: inputs.trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: release-candidate:local
          format: sarif
          output: trivy-results.sarif
          severity: ${{ inputs.trivy-severity }}
          exit-code: ${{ inputs.trivy-exit-code }}
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
          trivyignores: ${{ inputs.trivyignores }}

      - name: Upload Trivy results to the Security tab
        if: inputs.trivy && always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
