          sarif_file: trivy-results.sarif
          category: trivy-image-${{ matrix.arch }}

      - name: Record this platform's digest
        id: record
        if: needs.plan.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          IDX: ${{ matrix.idx }}
        run: |
          set -euo pipefail
          shopt -u nocasematch
          [[ "$IDX" =~ ^[0-7]$ ]] || { echo "::error title=digest::bad platform index"; exit 1; }
