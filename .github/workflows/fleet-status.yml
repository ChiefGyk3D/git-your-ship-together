# Fleet status: scripts/fleet_status.py over the repositories of this repository's owner, once a week and on demand.
# One page of counts: which callers pin an old GYST release, how many Dependabot alerts are open by severity, which
# default branches are unprotected and what checks the protected ones require, and whether the newest push to each
# default branch is green. Counts only: no advisory text, package name or secret is read into the report. NOT a
# reusable workflow; no caller uses it. Nothing is written to any repository.
#
# The credential. There is none to add. The job holds the default job token (`contents: read`) and nothing else: no
# secret, no Doppler, no GitHub App. With that token the report covers what the token can read, which is this
# repository and the public repositories of the owner (workflow files and releases). What it cannot read (Dependabot
# alerts, branch protection, another private repository) is reported as `n/a` in the table, never guessed and never
# read as clean. To fill those in, run the script by hand with a token that can read them:
#   python3 scripts/fleet_status.py --owner ChiefGyk3D --markdown fleet.md --json fleet.json
#
# The table goes to the job summary; the JSON is kept as an artifact for 30 days. A rate limit stops the job with a
# message and no report (a partial table would read as a clean fleet).
name: Fleet status

on:
  schedule:
    - cron: "37 6 * * 1" # Monday, before the baseline audit (07:00 UTC) so the two never share a minute
  workflow_dispatch:
    inputs:
      owners:
        description: "Space-separated owners to report on (default: the owner of this repository)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# One report at a time; a dispatch during the scheduled run waits rather than cutting it short.
concurrency:
  group: fleet-status
  cancel-in-progress: false

jobs:
  report:
    name: Fleet status report
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: api.github.com:443 github.com:443 results-receiver.actions.githubusercontent.com:443

      - name: Egress canary
        timeout-minutes: 2
        shell: bash
        # The workspace root exists before checkout; a job default working-directory may not.
        working-directory: ${{ github.workspace }}
        run: |
          set -u
          NAMES="github.com api.github.com results-receiver.actions.githubusercontent.com"
          PORT=443
          canary_resolve() { timeout 5 getent ahostsv4 "$1" 2>/dev/null | awk '$2 == "STREAM" { print $1 }'; }
          canary_probe() { timeout 3 bash -c "exec 3<>\"/dev/tcp/\$0/\$1\"" "$1" "$PORT" 2>/dev/null; }
          canary_reach() {
            local i
            for i in 1 2 3 4; do
              canary_probe "$1" && return 0
              [ "$i" -lt 4 ] && sleep 1
            done
            return 1
          }
          canary_show() { local n=$1; shift; echo "+ $*"; { timeout 10 "$@" 2>&1 || true; } | head -n "$n" || true; }
          canary_diag() {
            local name
            echo "::group::egress canary diagnostics (for the GitHub Support ticket)"
            canary_show 5 uname -srmo
            canary_show 20 cat /etc/resolv.conf
            canary_show 20 bash -c "resolvectl status 2>/dev/null | grep -E '^ *(Current DNS Server|DNS Servers?|DNS Domain):'"
            canary_show 20 bash -c "ss -lun | grep ':53 '"
            for name in $NAMES pipelines.actions.githubusercontent.com; do
              canary_show 20 getent ahostsv4 "$name"
              canary_show 5 curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_connect}\n' --max-time 8 "https://$name"
            done
            echo "::endgroup::"
          }
          canary_main() {
            local tmp name addr n=0 bad
            tmp=$(mktemp -d) || return 1
            for _ in 1 2 3; do
              for name in $NAMES; do canary_resolve "$name" >>"$tmp/res.$name" & done
              wait
              sleep 1
            done
            for name in $NAMES; do
              if [ -s "$tmp/res.$name" ]; then sort -u "$tmp/res.$name"; else echo "-"; fi | sed "s|^|$name |" >>"$tmp/pairs"
            done
            while read -r name addr; do
              n=$((n + 1))
              ( { [ "$addr" != "-" ] && canary_reach "$addr"; } || echo "$name $addr" >"$tmp/bad.$n" ) </dev/null &
            done <"$tmp/pairs"
            wait
            bad=$(cat "$tmp"/bad.* 2>/dev/null | sort || true)
            rm -rf "$tmp"
            if [ -z "$bad" ]; then
              echo "egress canary: all $n addresses of $NAMES accept TCP $PORT"
              return 0
            fi
            echo "::error title=egress canary::egress broken on this runner (known westus2 DNS issue): rerun the job"
            echo "unreachable addresses (name address; '-' means the name did not resolve):"
            printf '%s\n' "$bad"
            canary_diag
            echo "egress canary failed, unreachable: $(printf '%s' "$bad" | tr '\n' ';')" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            return 1
          }
          set -m
          canary_main &
          main=$!
          (sleep 90; kill -TERM -- "-$main"; sleep 2; kill -KILL -- "-$main") >/dev/null 2>&1 &
          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
            kill -TERM -- "-$main" >/dev/null 2>&1 || true
            sleep 1
            kill -KILL -- "-$main" >/dev/null 2>&1 || true
          fi
          if [ "$rc" -eq 143 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=egress canary::the canary hit its 90 s deadline: rerun the job"
            rc=124
          fi
          exit "$rc"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Standard library only: the runner's Python is enough, so there is no install step and no package host.
      # The owners come in through the environment, never into the script text; the script refuses anything that is
      # not a GitHub login.
      - name: Read the fleet
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OWNERS: ${{ inputs.owners || github.repository_owner }}
        run: |
          set -euo pipefail
          read -r -a owners <<< "$OWNERS"
          args=()
          for owner in "${owners[@]}"; do
            args+=(--owner "$owner")
          done
          python3 scripts/fleet_status.py "${args[@]}" --markdown fleet-status.md --json fleet-status.json

      - name: Put the table in the job summary
        if: always()
        run: |
          if [ -s fleet-status.md ]; then
            cat fleet-status.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The fleet report produced no table; see the step log.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fleet-status
          path: fleet-status.json
          if-no-files-found: ignore
          retention-days: 30
