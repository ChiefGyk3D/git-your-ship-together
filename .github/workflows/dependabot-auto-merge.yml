# Let Dependabot's own pull requests merge themselves once the gate is green.
#
# The seven-day cooldown in dependabot.yml means a release cut this morning is
# not proposed this afternoon; `ci / CI green` means a bump that breaks the
# build cannot land; this workflow is what removes the last manual step for
# the bumps that are not worth a human's attention. A bump larger than
# `max-update-type` is left alone.
#
# Call it with:
#
#   on: pull_request
#   permissions:
#     contents: read
#   jobs:
#     auto-merge:
#       uses: ChiefGyk3D/git-your-ship-together/.github/workflows/dependabot-auto-merge.yml@<sha> # vX.Y.Z
#       permissions:
#         contents: write        # enable auto-merge on the pull request
#         pull-requests: write   # and read its metadata
#
# The repository must have auto-merge enabled (Settings -> General -> Allow
# auto-merge, or `gh api -X PATCH repos/OWNER/REPO -F allow_auto_merge=true`),
# and a required status check, or there is nothing for the merge to wait on.
#
# This workflow never checks the pull request out. It runs two pinned actions
# and the `gh` CLI against the API, so none of the proposed code executes
# here, which is what makes `contents: write` on a pull-request trigger safe.
# dependabot/fetch-metadata verifies the commits really are Dependabot's
# before reporting what they change; a pull request that merely claims the
# name gets no metadata and no merge.

name: Dependabot auto-merge (reusable)

on:
  workflow_call:
    inputs:
      max-update-type:
        description: >-
          The largest semver change that may merge on its own: `patch`,
          `minor` or `major`. Anything above it is left for a human, as is a
          pull request whose update type Dependabot did not report.
        type: string
        default: minor
      merge-method:
        description: >-
          How to merge: `squash`, `merge` or `rebase`. Squash is the default
          because a repository that requires linear history refuses a merge
          commit.
        type: string
        default: squash
      egress-policy:
        description: harden-runner egress policy, `audit` or `block`.
        type: string
        default: audit
      allowed-endpoints:
        description: >-
          Hosts this job may reach under `block`, space-separated `host:port`
          on one line. The default is the GitHub subset of the list measured
          for the CI workflow: the API this job calls, plus where the runner
          downloads the two actions from.
        type: string
        default: api.github.com:443 github.com:443 release-assets.githubusercontent.com:443
      extra-allowed-endpoints:
        description: Appended to `allowed-endpoints`, for hosts only this repository reaches.
        type: string
        default: ""
      timeout-minutes:
        description: Job timeout.
        type: number
        default: 10

permissions:
  contents: read

jobs:
  auto-merge:
    name: Dependabot auto-merge
    # Dependabot's pull requests only. GitHub gives a fork's pull request a
    # read-only token whatever this workflow asks for, so the grant below
    # cannot reach one even if the login somehow matched.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write  # enable auto-merge on the pull request
      pull-requests: write  # read its Dependabot metadata
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ inputs.egress-policy == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ (inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block' }}

      - name: Validate the egress policy inputs (EX-0001)
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - name: Egress canary (EX-0001)
        if: ${{ (inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block' }}
        timeout-minutes: 2
        shell: bash
        # The workspace root exists before checkout; a job default working-directory may not.
        working-directory: ${{ github.workspace }}
        run: |
          set -u
          NAMES="github.com api.github.com results-receiver.actions.githubusercontent.com"
          PORT=443
          canary_resolve() { timeout 5 getent ahostsv4 "$1" 2>/dev/null | awk '$2 == "STREAM" { print $1 }'; }
          canary_probe() { timeout 3 bash -c "exec 3<>\"/dev/tcp/\$0/\$1\"" "$1" "$PORT" 2>/dev/null; }
          canary_reach() {
            local i
            for i in 1 2 3 4; do
              canary_probe "$1" && return 0
              [ "$i" -lt 4 ] && sleep 1
            done
            return 1
          }
          canary_show() { local n=$1; shift; echo "+ $*"; { timeout 10 "$@" 2>&1 || true; } | head -n "$n" || true; }
          canary_diag() {
            local name
            echo "::group::egress canary diagnostics (EX-0001, for the GitHub Support ticket)"
            canary_show 5 uname -srmo
            canary_show 20 cat /etc/resolv.conf
            canary_show 20 bash -c "resolvectl status 2>/dev/null | grep -E '^ *(Current DNS Server|DNS Servers?|DNS Domain):'"
            canary_show 20 bash -c "ss -lun | grep ':53 '"
            for name in $NAMES pipelines.actions.githubusercontent.com; do
              canary_show 20 getent ahostsv4 "$name"
              canary_show 5 curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_connect}\n' --max-time 8 "https://$name"
            done
            echo "::endgroup::"
          }
          canary_main() {
            local tmp name addr n=0 bad
            tmp=$(mktemp -d) || return 1
            for _ in 1 2 3; do
              for name in $NAMES; do canary_resolve "$name" >>"$tmp/res.$name" & done
              wait
              sleep 1
            done
            for name in $NAMES; do
              if [ -s "$tmp/res.$name" ]; then sort -u "$tmp/res.$name"; else echo "-"; fi | sed "s|^|$name |" >>"$tmp/pairs"
            done
            while read -r name addr; do
              n=$((n + 1))
              ( { [ "$addr" != "-" ] && canary_reach "$addr"; } || echo "$name $addr" >"$tmp/bad.$n" ) </dev/null &
            done <"$tmp/pairs"
            wait
            bad=$(cat "$tmp"/bad.* 2>/dev/null | sort || true)
            rm -rf "$tmp"
            if [ -z "$bad" ]; then
              echo "egress canary: all $n addresses of $NAMES accept TCP $PORT"
              return 0
            fi
            echo "::error title=egress canary::egress broken on this runner (known westus2 DNS issue, EX-0001): rerun the job"
            echo "unreachable addresses (name address; '-' means the name did not resolve):"
            printf '%s\n' "$bad"
            canary_diag
            echo "EX-0001 egress canary failed, unreachable: $(printf '%s' "$bad" | tr '\n' ';')" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            return 1
          }
          set -m
          canary_main &
          main=$!
          (sleep 90; kill -TERM -- "-$main"; sleep 2; kill -KILL -- "-$main") >/dev/null 2>&1 &
          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
            kill -TERM -- "-$main" >/dev/null 2>&1 || true
            sleep 1
            kill -KILL -- "-$main" >/dev/null 2>&1 || true
          fi
          if [ "$rc" -eq 143 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=egress canary::the canary hit its 90 s deadline (EX-0001): rerun the job"
            rc=124
          fi
          exit "$rc"

      - name: Read what Dependabot is proposing
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether this bump may merge on its own
        id: decide
        env:
          # `update-type` is the largest change in the pull request, so a
          # grouped bump is judged by its biggest step, not its smallest.
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          NAMES: ${{ steps.metadata.outputs.dependency-names }}
          MAX: ${{ inputs.max-update-type }}
          METHOD: ${{ inputs.merge-method }}
        run: |
          set -euo pipefail
          case "$METHOD" in
            squash|merge|rebase) ;;
            *) echo "::error title=Auto-merge::merge-method must be squash, merge or rebase, not '$METHOD'"; exit 1 ;;
          esac
          rank() {
            case "$1" in
              patch) echo 1 ;;
              minor) echo 2 ;;
              major) echo 3 ;;
              *) echo 0 ;;
            esac
          }
          max=$(rank "$MAX")
          if [ "$max" -eq 0 ]; then
            echo "::error title=Auto-merge::max-update-type must be patch, minor or major, not '$MAX'"
            exit 1
          fi
          # An update type this workflow does not recognise, or none at all,
          # is a reason to stop rather than to guess.
          level=$(rank "${UPDATE_TYPE#version-update:semver-}")
          if [ "$level" -eq 0 ]; then
            echo "::notice title=Auto-merge::update type '${UPDATE_TYPE:-none reported}' is not a semver bump; leaving ${NAMES:-this pull request} for a human"
            echo "merge=false" >> "$GITHUB_OUTPUT"
          elif [ "$level" -gt "$max" ]; then
            echo "::notice title=Auto-merge::${UPDATE_TYPE#version-update:semver-} is larger than max-update-type=$MAX; leaving ${NAMES:-this pull request} for a human"
            echo "merge=false" >> "$GITHUB_OUTPUT"
          else
            echo "merge=true" >> "$GITHUB_OUTPUT"
            echo "auto-merging ${NAMES:-this pull request} (${UPDATE_TYPE#version-update:semver-}) once the required checks pass"
          fi

      - name: Merge it when the required checks pass
        if: steps.decide.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          METHOD: ${{ inputs.merge-method }}
        run: |
          set -euo pipefail
          # --auto queues the merge behind branch protection; it does not
          # merge now, and a red check leaves the pull request open.
          case "$METHOD" in
            squash) gh pr merge --auto --squash "$PR_URL" ;;
            merge) gh pr merge --auto --merge "$PR_URL" ;;
            rebase) gh pr merge --auto --rebase "$PR_URL" ;;
          esac
