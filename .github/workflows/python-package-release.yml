# Reusable Python package release: build the sdist and wheel once, check
# them, prove the wheel installs and runs, then publish the same files to
# a GitHub release with build provenance and hand them (the `dist` artifact)
# to the caller's own PyPI publish job. Four repositories carried a copy of this by hand.
#
#   1. Build: `python -m build`, `twine check --strict`, the version read
#      from the sdist's own name. On a tag, refuse a tag that disagrees with
#      that version. Install the wheel into a fresh venv and run the caller's
#      smoke command. Run the caller's verify command (a CHANGELOG section,
#      say) and its release-notes command. Everything here runs with
#      contents: read.
#   2. When `publish` is true and the event is not a pull request: record
#      build provenance for every file and attach them, with a SHA256SUMS, to
#      the GitHub release for the tag, creating it from the notes when it does
#      not exist and uploading to it when it does (a caller that triggers on
#      `release: published`).
#   3. PyPI is NOT published from here. Trusted Publishing cannot use a
#      reusable workflow as the publisher (the OIDC token names this file, not
#      the caller's, and PyPI answers `invalid-publisher`; warehouse#11096).
#      Publish from a job in the caller's own workflow: download the `dist`
#      artifact this workflow uploads, then run pypa/gh-action-pypi-publish as
#      a DIRECT step (it is a Docker action; wrapped in a composite action or
#      a reusable workflow it resolves its image from the wrapper's
#      repository and fails). The README shows the job.
#   The build job also writes a CycloneDX and an SPDX SBOM (`sbom.cdx.json`,
#   `sbom.spdx.json`) with syft, pinned by the `syft-version` and `syft-sha256` inputs, over the
#   unpacked wheel and sdist. They travel in their own artifact, never in
#   `dist/`, so PyPI is not offered them; the release job adds them to the
#   release assets, to SHA256SUMS and to the same build-provenance step.
#
# Call it with:
#
#   jobs:
#     package:
#       uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-package-release.yml@<sha> # vX.Y.Z
#       permissions:
#         contents: write
#         id-token: write
#         attestations: write
#       with:
#         publish: ${{ startsWith(github.ref, 'refs/tags/v') }}
#         smoke-command: my-cli --version
#
# Nothing here needs a secret: the GitHub release uses the job's own token
# and PyPI (from the caller's job) trusts that job's OIDC identity. No Doppler
# step, no secrets: block.
#
# Commands a caller supplies reach the shell through an environment variable,
# never by template expansion into the script, so a value can only ever be
# data. They run in the build job, which holds contents: read; the two
# release job runs only pinned actions and `gh`.

name: Python package release (reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: Python used to build, check and smoke-test the package.
        type: string
        default: "3.13"
      package-directory:
        description: Directory holding pyproject.toml, relative to the repository root.
        type: string
        default: "."
      build-install-command:
        description: Shell that installs the build tooling.
        type: string
        default: python -m pip install --upgrade pip build twine
      build-command:
        description: Shell that writes the sdist and wheel to dist/.
        type: string
        default: python -m build
      tag-prefix:
        description: What precedes the version in a release tag; `v` makes v1.2.3 the tag for version 1.2.3.
        type: string
        default: v
      verify-command:
        description: Shell run after the build with `$VERSION` set, to refuse a release whose tree disagrees with it, e.g. `grep -q "^## \[$VERSION\]" CHANGELOG.md`; empty runs nothing.
        type: string
        default: ""
      smoke-command:
        description: Shell run with the built wheel installed in a fresh venv on PATH and `$VERSION` set, e.g. `my-cli --version`; empty skips the check.
        type: string
        default: ""
      release-notes-command:
        description: Shell that prints the GitHub release notes to stdout with `$VERSION` set, e.g. a CHANGELOG section; empty lets GitHub generate them from the commits.
        type: string
        default: ""
      publish:
        description: Publish to the GitHub release. False builds, checks and stops; a pull request never publishes whatever this says.
        type: boolean
        default: false
      allowed-publish-events:
        description: Comma-separated event names (no spaces) that may publish, when the ref is also a release tag (`refs/tags/v<major>.<minor>.<patch>`). Default `push`; a caller that publishes on `release` sets `push,release`. A pull request event is refused even if listed.
        type: string
        default: push
      pypi:
        description: Unsupported, kept so old callers still parse. PyPI Trusted Publishing cannot use a reusable workflow as the publisher (invalid-publisher, warehouse#11096), so true fails the run with the fix; publish from a job in the caller's workflow with the publish-pypi composite action instead.
        type: boolean
        default: false
      pypi-environment:
        description: Unused by this workflow; the environment belongs to the caller's publish job. Kept so existing callers still parse.
        type: string
        default: pypi
      github-release:
        description: Attach the distribution files, their SBOMs, their SHA256SUMS and build provenance to the GitHub release for the tag.
        type: boolean
        default: true
      release-title:
        description: Title of a GitHub release this workflow creates; empty uses the tag.
        type: string
        default: ""
      sbom:
        description: Write a CycloneDX and an SPDX SBOM for the built wheel and sdist (syft, pinned) and attach them to the GitHub release with the rest, listed in SHA256SUMS and covered by the same build provenance. They are written whenever the package is built, so a pull request exercises them; they are only published with the release.
        type: boolean
        default: true
      syft-version:
        description: syft release to download (anchore/syft), without the `v`; the one syft pin in this repository. Changing it means changing `syft-sha256`. To bump - `gh release download v<new> -R anchore/syft -p '*_linux_amd64.tar.gz'`, `sha256sum` it and compare the line in the release's own `*_checksums.txt`.
        type: string
        default: "1.56.0"
      syft-sha256:
        description: SHA-256 of the syft linux_amd64 tarball for that version.
        type: string
        default: 1c2493cfcf52d3367d6cb25780d9190c111c2219c34c820574c43e8bae15c528
      attest:
        description: Record SLSA build provenance for every distribution file through GitHub's attestation API.
        type: boolean
        default: true
      egress-policy:
        description: harden-runner egress policy for every job - `audit` logs outbound connections, `block` allows only `allowed-endpoints`. Jobs that hold no secret follow `egress-policy-secretless` instead (EX-0001).
        type: string
        default: audit
      egress-policy-secretless:
        description: harden-runner egress policy for the jobs that hold no stored secret, no OIDC token and no write-scoped or publish-capable token (read-only contents, a SARIF upload at most), and whose output no privileged job consumes - exactly `audit` or `block`. Defaults to `block` since security exception EX-0001 (GitHub-hosted runners in westus2 broke harden-runner `block`) was closed on 2026-11-02 after harden-runner v2.22.3 passed on westus2; see docs/security/exceptions/. Every job still has the default read-only job token. Set `audit` to opt out if the defect recurs. Any other job follows `egress-policy`. Any other value fails the job.
        type: string
        default: block
      allowed-endpoints:
        description: harden-runner allow-list for `block`, space-separated host:port entries. The build hosts were measured by running the build in block mode here; the release job's hosts are GitHub's and Sigstore's documented ones. Wildcards are not supported and a newline-separated list matches nothing.
        type: string
        default: "api.github.com:443 files.pythonhosted.org:443 fulcio.sigstore.dev:443 github.com:443 pypi.org:443 rekor.sigstore.dev:443 release-assets.githubusercontent.com:443 timestamp.sigstore.dev:443 tuf-repo-cdn.sigstore.dev:443 upload.pypi.org:443 uploads.github.com:443"
      extra-allowed-endpoints:
        description: Appended to `allowed-endpoints`, for hosts only this repository reaches. Same format.
        type: string
        default: ""
      timeout-minutes:
        description: Per-job timeout.
        type: number
        default: 20
    outputs:
      version:
        description: The version the sdist was built as.
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    name: Build, check${{ inputs.smoke-command != '' && ', smoke-test' || '' }}
    runs-on: ubuntu-latest
    # normal: ~1 min (p50 0.6, p95 0.9; last ~30 green runs)
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read  # every caller command runs here, beside nothing
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: ${{ inputs.package-directory }}
    steps:
      - name: Validate the egress policy inputs
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          disable-sudo: true
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ (inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block' }}


      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install the build tooling
        env:
          COMMAND: ${{ inputs.build-install-command }}
        run: bash -eo pipefail -c "$COMMAND"

      - name: Build the sdist and wheel
        env:
          COMMAND: ${{ inputs.build-command }}
        run: |
          rm -rf dist
          bash -eo pipefail -c "$COMMAND"
          ls -l dist

      - name: Check the distribution metadata
        run: twine check --strict dist/*

      # The version is read from what was built, not from where the project
      # keeps it, so a static `version =`, a dynamic attribute and a VCS
      # plugin all answer the same way.
      - name: Read the version from the sdist
        id: version
        run: |
          set -euo pipefail
          sdists=(dist/*.tar.gz)
          if [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::expected one sdist in dist/, found ${#sdists[@]}"
            exit 1
          fi
          stem="${sdists[0]##*/}"
          stem="${stem%.tar.gz}"
          version="${stem##*-}"
          echo "version=$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The tag is the one input typed by hand. A tag that disagrees with the
      # packaged version would publish a file nobody can trace to a commit.
      - name: The tag must agree with the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          PREFIX: ${{ inputs.tag-prefix }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "tag=$TAG packaged=$VERSION"
          if [ "${TAG#"$PREFIX"}" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match the packaged version $VERSION"
            exit 1
          fi

      - name: Verify the tree agrees with the version
        if: inputs.verify-command != ''
        env:
          COMMAND: ${{ inputs.verify-command }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bash -eo pipefail -c "$COMMAND"

      # From the artifact, not the tree: a wheel that installs and cannot run
      # is the failure a source checkout never shows.
      - name: Install the wheel into a fresh venv and smoke-test it
        if: inputs.smoke-command != ''
        env:
          COMMAND: ${{ inputs.smoke-command }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install --disable-pip-version-check dist/*.whl
          PATH="$RUNNER_TEMP/smoke/bin:$PATH" bash -eo pipefail -c "$COMMAND"

      # syft reads metadata and runs nothing. It is pointed at the unpacked
      # wheel and sdist rather than the archives, because it does not open a
      # wheel and reports an sdist's files by their extraction path. The
      # binary is pinned by hash; no action and no new egress host is
      # involved (github.com redirects to release-assets.githubusercontent.com,
      # both already on the list).
      - name: Download syft at the pinned version
        if: inputs.sbom
        env:
          FETCH_RELEASE_TOKEN: ${{ github.token }}
          SYFT_VERSION: ${{ inputs.syft-version }}
          SYFT_SHA256: ${{ inputs.syft-sha256 }}
        run: |
          set -euo pipefail
          # BEGIN fetch_release
          fetch_release() {
            local xt=0 rc
            case $- in *x*) xt=1 ;; esac
            set +x
            if _fetch_release "$@"; then rc=0; else rc=$?; fi
            if [ "$xt" = 1 ]; then set -x; fi
            return "$rc"
          }
          _fetch_release() {
            local url=${1:-} out=${2:-} want=${3:-} token=${FETCH_RELEASE_TOKEN:-}
            local tries=5 budget=${FETCH_RELEASE_BUDGET:-170} delay=${FETCH_RELEASE_BASE_DELAY:-2}
            local start=$SECONDS n=0 left cap pause step tmp code rc have
            case $url in https://?*) ;; *)
              echo "::error title=fetch_release::the URL must start with https://"
              return 2
              ;;
            esac
            if [ -z "$out" ]; then
              echo "::error title=fetch_release::no output file given"
              return 2
            fi
            case $want in *[!0-9a-fA-F]*) want="" ;; esac
            if [ "${#want}" -ne 64 ]; then
              echo "::error title=fetch_release::a SHA-256 of exactly 64 hex digits is required for $url"
              return 2
            fi
            case $budget in '' | *[!0-9]*) budget=170 ;; esac
            case $delay in '' | *[!0-9]*) delay=2 ;; esac
            if [ "$budget" -gt 170 ]; then budget=170; fi
            case $url in https://github.com/*) ;; *) token="" ;; esac
            case $token in *[!A-Za-z0-9_.-]*) token="" ;; esac
            tmp=$(mktemp "${out}.XXXXXX") || return 1
            step=$delay
            while [ "$n" -lt "$tries" ]; do
              n=$((n + 1))
              left=$((budget - (SECONDS - start)))
              if [ "$left" -lt 1 ]; then break; fi
              cap=$((left < 45 ? left : 45))
              if [ -n "$token" ]; then have="header = \"Authorization: Bearer ${token}\""; else have="# anonymous"; fi
              if code=$(printf '%s\n' "$have" | curl -q -sSfL --proto '=https' --proto-redir '=https' --tlsv1.2 \
                --connect-timeout 10 --max-time "$cap" -K - -w '%{http_code}' -o "$tmp" "$url"); then
                rc=0
              else
                rc=$?
              fi
              if [ "$rc" -eq 0 ]; then
                have=$(sha256sum "$tmp" | cut -d' ' -f1)
                if [ "$have" != "$(printf '%s' "$want" | tr 'A-F' 'a-f')" ]; then
                  rm -f "$tmp"
                  echo "::error title=fetch_release::SHA-256 mismatch for $url: expected $want, got $have"
                  return 1
                fi
                mv -f "$tmp" "$out"
                return 0
              fi
              echo "fetch_release: attempt $n of $tries failed for $url (curl exit $rc, HTTP ${code:-none})" >&2
              case $code in 401 | 403) token="" ;; esac
              if [ "$n" -ge "$tries" ]; then break; fi
              pause=$((step + RANDOM % (step / 2 + 1)))
              left=$((budget - (SECONDS - start)))
              if [ "$pause" -ge "$left" ]; then break; fi
              echo "fetch_release: waiting ${pause}s before the next try" >&2
              sleep "$pause"
              step=$((step * 2))
            done
            rm -f "$tmp"
            echo "::error title=fetch_release::could not download $url after $n tries (last curl exit ${rc:-none}); nothing was written to the output file"
            return 1
          }
          # END fetch_release
          archive="$RUNNER_TEMP/syft.tar.gz"
          fetch_release "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" "$archive" "${SYFT_SHA256}"
          echo "${SYFT_SHA256}  ${archive}" | sha256sum -c -
          mkdir "$RUNNER_TEMP/syft-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/syft-bin" syft

      - name: Write the SBOMs with syft
        if: inputs.sbom
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          syft="$RUNNER_TEMP/syft-bin/syft"
          "$syft" --version

          stage="$RUNNER_TEMP/sbom-stage"
          out="$RUNNER_TEMP/sbom"
          mkdir -p "$stage/wheel" "$stage/sdist" "$out"
          for wheel in dist/*.whl; do
            python -m zipfile -e "$wheel" "$stage/wheel"
          done
          tar -xzf dist/*.tar.gz -C "$stage/sdist"
          stem="$(basename dist/*.tar.gz .tar.gz)"
          name="${stem%-*}"
          (
            cd "$stage"
            "$syft" scan dir:. --source-name "$name" --source-version "$VERSION" \
              -o "cyclonedx-json=$out/sbom.cdx.json" -o "spdx-json=$out/sbom.spdx.json"
          )
          # The runner's path says nothing about the package.
          sed -i "s#${stage}/##g; s#${stage}##g" "$out/sbom.cdx.json" "$out/sbom.spdx.json"
          ls -l "$out"

      # An SBOM that lists nothing is worse than none: it reads as assurance.
      - name: The SBOMs must name the package
        if: inputs.sbom
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/sbom" "$VERSION" <<'PY'
          import json, re, sys
          out, version = sys.argv[1:]
          norm = lambda n: re.sub(r"[-_.]+", "-", n).lower()
          cdx = json.load(open(f"{out}/sbom.cdx.json"))
          spdx = json.load(open(f"{out}/sbom.spdx.json"))
          assert cdx.get("bomFormat") == "CycloneDX", "sbom.cdx.json is not CycloneDX"
          assert str(spdx.get("spdxVersion", "")).startswith("SPDX-"), "sbom.spdx.json is not SPDX"
          want = norm(cdx["metadata"]["component"]["name"])
          have = {(norm(c["name"]), c.get("version")) for c in cdx.get("components", []) if c.get("type") == "library"}
          assert (want, version) in have, f"sbom.cdx.json lists no {want} {version}: {sorted(have)}"
          have = {(norm(p["name"]), p.get("versionInfo")) for p in spdx.get("packages", [])}
          assert (want, version) in have, f"sbom.spdx.json lists no {want} {version}: {sorted(have)}"
          print(f"SBOMs list {want} {version}")
          PY

      - name: Write the release notes
        env:
          COMMAND: ${{ inputs.release-notes-command }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$COMMAND" ]; then
            bash -eo pipefail -c "$COMMAND" > "$RUNNER_TEMP/release-notes.md"
            echo "release notes: $(wc -l < "$RUNNER_TEMP/release-notes.md") line(s)"
          else
            : > "$RUNNER_TEMP/release-notes.md"
            echo "release notes: generated by GitHub"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ${{ inputs.package-directory }}/dist/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.sbom
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          retention-days: 7

  # PyPI cannot be published from here (see the header), so asking for it fails
  # at once with the fix rather than at PyPI with `invalid-publisher`. The
  # release job does not need it, so a GitHub release is still made.
  pypi-unsupported:
    name: PyPI publishing moved to the caller
    if: inputs.publish && inputs.pypi && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # normal: no fixture history
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Validate the egress policy inputs
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ (inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          disable-sudo: true
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ ((inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block') == 'block' }}


      - name: Explain
        env:
          ENVIRONMENT: ${{ inputs.pypi-environment }}
        run: |
          echo "::error title=pypi: true cannot work::PyPI Trusted Publishing rejects a reusable workflow as the publisher (invalid-publisher, warehouse#11096). Set pypi: false and add a publish-pypi job (environment: ${ENVIRONMENT}) to your own workflow with actions/download-artifact (name: dist) then pypa/gh-action-pypi-publish as direct steps; see the README, Python package release."
          exit 1

  # No checkout here either: the one write in the workflow runs beside
  # nothing from the tree, only the files the build job handed over.
  github-release:
    name: GitHub release
    needs: build
    if: >-
      inputs.publish && inputs.github-release && github.event_name != 'pull_request' &&
      contains(format(',{0},', inputs.allowed-publish-events), format(',{0},', github.event_name)) &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # normal: no fixture history
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write  # create the release, upload its assets
      id-token: write  # build provenance is signed with the job's identity
      attestations: write  # and recorded through GitHub's attestation API
    steps:
      - name: Validate the egress policy inputs
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          disable-sudo: true
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ (inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block' }}


      # Publication is an allow-list: an allowed event and a release-shaped tag.
      # The job condition repeats the check; every step that signs, attests
      # or uploads runs only on this step's `publish` output.
      - name: Check the publish context
        id: context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ALLOWED_EVENTS: ${{ inputs.allowed-publish-events }}
        run: |
          set -euo pipefail
          if ! [[ "$ALLOWED_EVENTS" =~ ^[a-z_]+(,[a-z_]+)*$ ]]; then
            echo "::error title=publish context::allowed-publish-events must be a comma-separated list of event names without spaces"
            exit 1
          fi
          case ",$ALLOWED_EVENTS," in
            *,pull_request,* | *,pull_request_target,*)
              echo "::error title=publish context::a pull request event can never publish"
              exit 1
              ;;
          esac
          case ",$ALLOWED_EVENTS," in
            *",$EVENT_NAME,"*) ;;
            *)
              echo "::error title=publish context::event '$EVENT_NAME' is not in allowed-publish-events ($ALLOWED_EVENTS)"
              exit 1
              ;;
          esac
          num='(0|[1-9][0-9]*)'
          pre='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          bld='[0-9A-Za-z-]+'
          semver="^refs/tags/v${num}\\.${num}\\.${num}(-${pre}(\\.${pre})*)?(\\+${bld}(\\.${bld})*)?$"
          if ! [[ "$REF" =~ $semver ]]; then
            echo "::error title=publish context::ref is not a SemVer 2.0.0 release tag (refs/tags/v<major>.<minor>.<patch>[-prerelease][+build], no leading zeroes)"
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # Into dist/ beside the distributions, so the checksums, the provenance
      # and the upload below treat them as any other asset. The PyPI job
      # downloads `dist` alone and never sees them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.sbom
        with:
          name: sbom
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes/

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Record build provenance
        if: inputs.attest && steps.context.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create the release, or upload to the one that exists
        if: steps.context.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ inputs.release-title }}
          ASSET_DIR: dist
        run: |
          set -euo pipefail
          # dotglob: a hidden file in the staging directory is listed, so the
          # naming policy below rejects it instead of the glob skipping it.
          shopt -s nullglob dotglob
          files=("$ASSET_DIR"/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error title=release assets::nothing to upload in $ASSET_DIR"
            exit 1
          fi
          # Naming policy (a conservative repository rule): GitHub documents that
          # it renames uploaded files with special characters or leading or
          # trailing periods, and a renamed asset would fail the exact
          # comparison below after the release was already written. So refuse,
          # before any release call, a name outside: ASCII letters, digits,
          # ".", "_" and "-", beginning and ending with a letter or digit.
          safe_name='^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$'
          bad_names=0
          for f in "${files[@]}"; do
            asset=${f##*/}
            if ! (LC_ALL=C; [[ "$asset" =~ $safe_name ]]); then
              echo "::error title=release asset name::$(printf '%q' "$asset") is outside the asset naming policy (a conservative repository rule, so uploaded names stay as built); use only ASCII letters, digits, '.', '_' and '-', starting and ending with a letter or digit"
              bad_names=1
            fi
          done
          if [ "$bad_names" -ne 0 ]; then
            exit 1
          fi
          # Also policy: names that differ only in letter case (compared in the
          # C locale) are refused, because one of them could be rejected by the
          # release after the other was already uploaded. GitHub's exact rule
          # for case is not verified here.
          declare -A lower_seen=()
          for f in "${files[@]}"; do
            asset=${f##*/}
            key=$(printf '%s' "$asset" | LC_ALL=C tr '[:upper:]' '[:lower:]')
            if [ -n "${lower_seen[$key]:-}" ]; then
              echo "::error title=release asset name::$asset and ${lower_seen[$key]} differ only in letter case, which the asset naming policy refuses"
              bad_names=1
            else
              lower_seen[$key]=$asset
            fi
          done
          if [ "$bad_names" -ne 0 ]; then
            exit 1
          fi
          err=$(mktemp)
          declare -A local_names=()
          for f in "${files[@]}"; do local_names["${f##*/}"]=1; done
          local_json=$(printf '%s\n' "${!local_names[@]}" | jq -Rnc '[inputs]')

          # Read the release for this tag. The HTTP status comes from the
          # status line of `gh api --include`, never from message text: 200 is
          # a published release, 404 means none (then drafts are checked),
          # anything else, or no status line at all, stops the run. The assets
          # are read from their own paginated endpoint, not the embedded array.
          status_re='^[Hh][Tt][Tt][Pp]/[0-9.]+[[:space:]]+([0-9]{3})([[:space:]].*)?$'
          fetch_release() {
            local out first status="" body
            out=$(gh api --include "repos/$GH_REPO/releases/tags/$TAG" 2> "$err") || true
            first=${out%%$'\n'*}
            first=${first%$'\r'}
            if [[ "$first" =~ $status_re ]]; then status=${BASH_REMATCH[1]}; fi
            if [ "$status" = "404" ]; then
              if ! pages=$(gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" 2> "$err"); then
                echo "::error title=release lookup::could not list releases to look for a draft of $TAG: $(tr '\n' ' ' < "$err")"
                exit 1
              fi
              if ! releases=$(jq -ce 'select(type == "array" and all(.[]; type == "array")) | add // [] | select(all(.[]; type == "object" and (.tag_name | type) == "string"))' <<< "$pages" 2> /dev/null); then
                echo "::error title=release lookup::the release listing is not a list of releases, so a draft of $TAG cannot be ruled out"
                exit 1
              fi
              if jq -e --arg t "$TAG" 'any(.[]; .tag_name == $t)' <<< "$releases" > /dev/null; then
                echo "::error title=release $TAG::a draft release for $TAG exists. A draft is not completed automatically: publish or delete it, or burn this version and publish a new one."
                exit 1
              fi
              found=0
              assets="[]"
              return 0
            fi
            if [ "$status" != "200" ]; then
              echo "::error title=release lookup::could not read release $TAG (HTTP status ${status:-none}): $(tr '\n' ' ' < "$err")"
              exit 1
            fi
            body=$(sed '1,/^\r\{0,1\}$/d' <<< "$out")
            if ! release_id=$(jq -er 'select(.draft == false) | .id | select(type == "number")' <<< "$body" 2> /dev/null); then
              echo "::error title=release lookup::the response for $TAG is not a published release object"
              exit 1
            fi
            if ! pages=$(gh api --paginate --slurp "repos/$GH_REPO/releases/$release_id/assets?per_page=100" 2> "$err"); then
              echo "::error title=release lookup::could not list the assets of release $TAG: $(tr '\n' ' ' < "$err")"
              exit 1
            fi
            if ! assets=$(jq -ce 'select(type == "array" and all(.[]; type == "array")) | add // [] | select(all(.[]; type == "object" and (.name | type) == "string"))' <<< "$pages" 2> /dev/null); then
              echo "::error title=release lookup::the asset listing for release $TAG is not a list of assets"
              exit 1
            fi
            expected_pre=false
            if [[ "${TAG%%+*}" == *-* ]]; then expected_pre=true; fi
            release_pre=$(jq -r 'if (.prerelease | type) == "boolean" then (.prerelease | tostring) else "invalid" end' <<< "$body")
            if [ "$release_pre" = "invalid" ]; then
              echo "::error title=release lookup::the prerelease field of release $TAG is not a boolean"
              exit 1
            fi
            if [ "$release_pre" != "$expected_pre" ]; then
              echo "::error title=release $TAG::the release has prerelease=$release_pre but the tag implies prerelease=$expected_pre. Burn this version and publish a new one."
              exit 1
            fi
            found=1
          }

          # The release must hold exactly the files built here: each one
          # absent or identical (sha256), and no asset that was not built here.
          # Sets missing and differ.
          compare_assets() {
            missing=()
            differ=0
            # Whole-listing invariants first, extras included: every remote
            # asset is in state uploaded, and no name occurs twice.
            not_uploaded=$(jq -r '[.[] | select(.state != "uploaded") | .name | @json] | join(", ")' <<< "$assets")
            if [ -n "$not_uploaded" ]; then
              echo "::error title=release asset::release $TAG has asset(s) $not_uploaded not in state uploaded"
              differ=1
            fi
            repeated=$(jq -r '[group_by(.name)[] | select(length > 1) | .[0].name | @json] | join(", ")' <<< "$assets")
            if [ -n "$repeated" ]; then
              echo "::error title=release asset::release $TAG has asset(s) $repeated more than once"
              differ=1
            fi
            for f in "${files[@]}"; do
              asset=${f##*/}
              want="sha256:$(sha256sum "$f" | cut -d' ' -f1)"
              have=$(jq -r --arg n "$asset" '[.[] | select(.name == $n)] | if length == 0 then "!absent" else (.[0].digest | if type == "string" then . else "!unknown" end) end' <<< "$assets")
              if [ "$have" = "!absent" ]; then
                missing+=("$f")
              elif [ "$have" = "!unknown" ]; then
                echo "::error title=release asset::$asset exists on release $TAG without a digest, so it cannot be shown identical"
                differ=1
              elif [ "$have" = "$want" ]; then
                echo "$asset: on the release, identical"
              else
                echo "::error title=release asset::$asset exists on release $TAG with a different digest (release $have, built $want)"
                differ=1
              fi
            done
            extras=$(jq -r --argjson l "$local_json" '[.[].name | select(. as $x | any($l[]; . == $x) | not)] | map(@json) | join(", ")' <<< "$assets")
            if [ -n "$extras" ]; then
              echo "::error title=release asset::$extras is on release $TAG but is not part of this build"
              differ=1
            fi
          }

          fetch_release
          if [ "$found" -eq 1 ]; then
            # An existing release is only ever completed. Nothing is replaced.
            compare_assets
            if [ "$differ" -ne 0 ]; then
              echo "::error title=release $TAG::assets are never replaced; this release is in a different state from this build. Burn this version and publish a new one."
              exit 1
            fi
            if [ "${#missing[@]}" -gt 0 ]; then
              echo "release $TAG exists; uploading ${#missing[@]} missing asset(s)"
              gh release upload "$TAG" "${missing[@]}"
            fi
          else
            args=(--title "${TITLE:-$TAG}" --verify-tag)
            if [ -s notes/release-notes.md ]; then
              args+=(--notes-file notes/release-notes.md)
            else
              args+=(--generate-notes)
            fi
            # A SemVer prerelease (a "-" before any "+build" part of the validated
            # tag) is published as a prerelease, not as the latest release.
            core=${TAG%%+*}
            if [[ "$core" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" "${files[@]}" "${args[@]}"
          fi

          # Read the release again before reporting success: every file must
          # now be there with the identical digest. Concurrent writers to the
          # same release are unsupported; this catches one that interfered.
          fetch_release
          if [ "$found" -ne 1 ]; then
            echo "::error title=release $TAG::the release is not readable after the upload"
            exit 1
          fi
          compare_assets
          if [ "$differ" -ne 0 ] || [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=release $TAG::the release does not hold exactly this build's assets after the upload (${#missing[@]} missing, differing: $differ). Burn this version and publish a new one."
            exit 1
          fi
          echo "release $TAG verified: exactly this build's assets, each with the identical digest"
