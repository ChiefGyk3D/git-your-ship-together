# Reusable sync of a GitHub Projects v2 board with a repository's issues and
# pull requests: an item is added when one opens, moved to Done with a date when
# one closes or merges, and a scheduled reconcile repairs whatever an event
# missed. User-owned projects have no "auto-add" built-in, so each repository
# calls this from a small workflow of its own.
#
# Call it from a workflow that triggers on issues, pull_request_target,
# schedule and workflow_dispatch (the full caller is in the README, "Keeping a
# project current"):
#
#   jobs:
#     sync:
#       uses: ChiefGyk3D/git-your-ship-together/.github/workflows/project-sync.yml@<sha> # vX.Y.Z
#       permissions:
#         contents: read
#         id-token: write        # the Doppler OIDC fetch of the App key
#       secrets:
#         DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional fallback
#       with:
#         project-url: https://github.com/orgs/<org>/projects/<n>
#         client-id: ${{ vars.PROJECTS_APP_CLIENT_ID }}
#         doppler-project: projects
#         doppler-config: prd
#         doppler-identity-id: ${{ vars.PROJECTS_DOPPLER_IDENTITY_ID }}
#         doppler-trusted-refs-only: false    # see "Why pull_request_target" in the README
#
# Why pull_request_target in the caller: a `pull_request` run from a fork gets a
# read-only token and no secrets, so a fork's pull request could never reach the
# board. `pull_request_target` runs the workflow file from the base branch with
# secrets. That is safe here because this job checks out nothing from the pull
# request and runs only safo below, which reads the event payload as data
# (never expanded into a shell) and talks only to api.github.com.
#
# The sync itself is ChiefGyk3D/scrum-around-and-find-out (safo), called below by
# commit with a `# vX.Y.Z` comment. This file is the delivery layer: the inputs
# callers already pass, the Doppler fetch of the App key over this job's OIDC
# identity, and harden-runner. safo mints the one-hour installation token from
# that key (actions/create-github-app-token, limited to the calling
# repository's installation and revoked when the job ends), reads the event
# payload as data and never the pull request's title, and talks to
# api.github.com. No personal access token is accepted.

name: Project sync (reusable)

on:
  workflow_call:
    inputs:
      project-url:
        description: The organization-owned project, `https://github.com/orgs/<login>/projects/<n>`. A `/users/` URL is refused, because an App has no user-account Projects permission.
        type: string
        default: ""
      status-field:
        description: The single-select field that holds an item's status.
        type: string
        default: Status
      status-open-issue:
        description: Status given to an issue that is opened, or reopened out of Done. An issue already holding a status other than Done keeps it.
        type: string
        default: Backlog
      status-open-pr:
        description: Status given to a pull request that is opened, reopened or marked ready for review.
        type: string
        default: In progress
      status-draft-pr:
        description: Status given to a draft pull request, opened as a draft or converted to one.
        type: string
        default: Backlog
      status-done:
        description: Status given to an issue that closes or a pull request that closes or merges.
        type: string
        default: Done
      done-date-field:
        description: The date field set to the close or merge date when an item reaches Done; cleared if the item is reopened. Empty disables it.
        type: string
        default: Done on
      reconcile:
        description: On `schedule` and `workflow_dispatch`, walk every open issue and pull request of the calling repository and every board item that points at it, adding what is missing and moving closed or merged items to Done with their close date. Never reopens an item. `false` makes those two events a no-op.
        type: boolean
        default: true
      default-area-field:
        description: A single-select field to set on items this workflow adds, so a repository can say `Area = Hill`. Items already on the board are never touched. Empty sets nothing; set together with `default-area`.
        type: string
        default: ""
      default-area:
        description: The option of `default-area-field` given to an item this workflow adds.
        type: string
        default: ""
      dry-run:
        description: Read the board and print every change instead of making it. Without a token, a dry run only says so and succeeds, which is how this repository's own CI exercises the workflow.
        type: boolean
        default: false
      client-id:
        description: The Client ID of the GitHub App that holds the Projects permission, from the App's settings page. An identifier, not a secret; callers pass the repository variable `PROJECTS_APP_CLIENT_ID`. Set this one or `app-id`.
        type: string
        default: ""
      app-id:
        description: Deprecated, accepted for one release. The numeric id of the same App; actions/create-github-app-token has deprecated it in favour of `client-id`, and a run that passes it prints that warning. Used only when `client-id` is empty.
        type: string
        default: ""
      app-owner:
        description: The account whose installation of the App mints the token, when the board belongs to a different account than the calling repository (a public repository on a personal account, a board in an organization). Empty, or the repository's own owner, keeps today's token scoped to this repository. Another account's installation needs `repositories` (the organization's repository names) and gives a token limited to them that holds only organization Projects write, and the repository must be public - an organization token cannot read a private repository on another account, so the run refuses one (visibility read from the API) before minting. A GitHub login; no new permission.
        type: string
        default: ""
      repositories:
        description: Comma-separated repository names (no owner) the minted token is limited to. Empty, the calling repository's name, which is right when the board belongs to the repository's own account. Required with `app-owner` naming another account, because the calling repository belongs to the personal account; name repositories the organization owns and the App is installed on (any one of them will do; the token still carries only organization Projects write). A repository name list, nothing else.
        type: string
        default: ""
      pull-request-events:
        description: Act on `pull_request_target` events. `false` makes a run started by that event skip the whole job, so a caller that keeps the trigger without an identity that covers a pull-request subject stays green instead of red; `issues`, `schedule` and `workflow_dispatch` runs are unaffected. See the README.
        type: boolean
        default: true
      egress-policy:
        description: harden-runner egress policy - `audit` logs outbound connections, `block` allows only `allowed-endpoints`.
        type: string
        default: audit
      allowed-endpoints:
        description: harden-runner allow-list for `block`, space-separated host:port entries. Doppler and the GitHub API are all this job reaches.
        type: string
        default: "api.doppler.com:443 api.github.com:443 files.pythonhosted.org:443 pypi.org:443"
      extra-allowed-endpoints:
        description: Appended to `allowed-endpoints`. Same format.
        type: string
        default: ""
      doppler-project:
        description: Doppler project slug.
        type: string
        default: ""
      doppler-config:
        description: Doppler config slug holding the App private key.
        type: string
        default: ""
      doppler-identity-id:
        description: Doppler Service Account Identity UUID for OIDC.
        type: string
        default: ""
      doppler-trusted-refs-only:
        description: Fetch the key only on the default branch, a version tag (vN.N.N) or a schedule. A caller that triggers on `pull_request_target` sets this to `false`, because that event is never trusted by this rule yet runs the base branch's workflow and checks out nothing from the pull request; see the README.
        type: boolean
        default: true
      timeout-minutes:
        description: Job timeout.
        type: number
        default: 15
    secrets:
      DOPPLER_TOKEN:
        description: Doppler Service Token fallback when OIDC is not configured.
        required: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync project
    # `pull-request-events: false` turns the pull request path off from the
    # calling side without editing the caller's triggers.
    if: ${{ inputs.pull-request-events || github.event_name != 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      id-token: write  # Doppler OIDC for the App private key
    steps:
      - name: Validate the egress policy inputs (EX-0001)
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ inputs.egress-policy == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443 github.com:443
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ (inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block' }}

      - name: Egress canary (EX-0001)
        if: ${{ runner.os == 'Linux' && ((inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block') }}
        timeout-minutes: 2
        shell: bash
        # The workspace root exists before checkout; a job default working-directory may not.
        working-directory: ${{ github.workspace }}
        run: |
          set -u
          NAMES="github.com api.github.com results-receiver.actions.githubusercontent.com"
          PORT=443
          canary_resolve() { timeout 5 getent ahostsv4 "$1" 2>/dev/null | awk '$2 == "STREAM" { print $1 }'; }
          canary_probe() { timeout 3 bash -c "exec 3<>\"/dev/tcp/\$0/\$1\"" "$1" "$PORT" 2>/dev/null; }
          canary_reach() {
            local i
            for i in 1 2 3 4; do
              canary_probe "$1" && return 0
              [ "$i" -lt 4 ] && sleep 1
            done
            return 1
          }
          canary_show() { local n=$1; shift; echo "+ $*"; { timeout 10 "$@" 2>&1 || true; } | head -n "$n" || true; }
          canary_diag() {
            local name
            echo "::group::egress canary diagnostics (EX-0001, for the GitHub Support ticket)"
            canary_show 5 uname -srmo
            canary_show 20 cat /etc/resolv.conf
            canary_show 20 bash -c "resolvectl status 2>/dev/null | grep -E '^ *(Current DNS Server|DNS Servers?|DNS Domain):'"
            canary_show 20 bash -c "ss -lun | grep ':53 '"
            for name in $NAMES pipelines.actions.githubusercontent.com; do
              canary_show 20 getent ahostsv4 "$name"
              canary_show 5 curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_connect}\n' --max-time 8 "https://$name"
            done
            echo "::endgroup::"
          }
          canary_main() {
            local tmp name addr n=0 bad
            tmp=$(mktemp -d) || return 1
            for _ in 1 2 3; do
              for name in $NAMES; do canary_resolve "$name" >>"$tmp/res.$name" & done
              wait
              sleep 1
            done
            for name in $NAMES; do
              if [ -s "$tmp/res.$name" ]; then sort -u "$tmp/res.$name"; else echo "-"; fi | sed "s|^|$name |" >>"$tmp/pairs"
            done
            while read -r name addr; do
              n=$((n + 1))
              ( { [ "$addr" != "-" ] && canary_reach "$addr"; } || echo "$name $addr" >"$tmp/bad.$n" ) </dev/null &
            done <"$tmp/pairs"
            wait
            bad=$(cat "$tmp"/bad.* 2>/dev/null | sort || true)
            rm -rf "$tmp"
            if [ -z "$bad" ]; then
              echo "egress canary: all $n addresses of $NAMES accept TCP $PORT"
              return 0
            fi
            echo "::error title=egress canary::egress broken on this runner (known westus2 DNS issue, EX-0001): rerun the job"
            echo "unreachable addresses (name address; '-' means the name did not resolve):"
            printf '%s\n' "$bad"
            canary_diag
            echo "EX-0001 egress canary failed, unreachable: $(printf '%s' "$bad" | tr '\n' ';')" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            return 1
          }
          set -m
          canary_main &
          main=$!
          (sleep 90; kill -TERM -- "-$main"; sleep 2; kill -KILL -- "-$main") >/dev/null 2>&1 &
          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
            kill -TERM -- "-$main" >/dev/null 2>&1 || true
            sleep 1
            kill -KILL -- "-$main" >/dev/null 2>&1 || true
          fi
          if [ "$rc" -eq 143 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=egress canary::the canary hit its 90 s deadline (EX-0001): rerun the job"
            rc=124
          fi
          exit "$rc"

      # --- Doppler (same steps as .github/actions/doppler-secrets) ---------
      - name: Decide how to authenticate to Doppler
        id: doppler
        if: inputs.doppler-project != ''
        env:
          IDENTITY_ID: ${{ inputs.doppler-identity-id }}
          TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PROJECT: ${{ inputs.doppler-project }}
          CONFIG: ${{ inputs.doppler-config }}
          REQUIRED: "false"
          TRUSTED_ONLY: ${{ inputs.doppler-trusted-refs-only }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mode=none
          skip=""
          untrusted_tag=false
          # A trusted run is one only a push by someone with write access, a manual
          # dispatch by such a person, or the schedule can produce, on the default
          # branch or a version tag (vN.N.N). The event must be on this allow-list:
          # any other event (issue_comment, workflow_run, an event added later) is
          # refused when the gate is on, because the ref alone does not say who
          # triggered it. A pull request is never trusted, whichever repository its
          # head is in. For a version tag the job also checks, when it can, that the
          # tagged commit is in the default branch's history (see the README).
          trusted=false
          # An inherited BASHOPTS must not make a comparison below case-insensitive.
          shopt -u nocasematch nocaseglob
          # The gate is parsed strictly: true or false in any casing, and anything else
          # stops the job. A typo must never switch the gate off.
          case "${TRUSTED_ONLY,,}" in
            true) TRUSTED_ONLY=true ;;
            false) TRUSTED_ONLY=false ;;
            *)
              echo "::error title=Doppler::trusted-refs-only must be true or false"
              exit 1 ;;
          esac
          case "$EVENT" in
            schedule) trusted=true ;;
            push|workflow_dispatch)
              if [ -n "$DEFAULT_BRANCH" ] && [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
                trusted=true
              elif [[ "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                trusted=true
                # Best effort: refuse a tag only when the workspace positively shows its
                # commit is not in the default branch's history. No checkout, a shallow
                # clone or a missing remote ref cannot show it, so the name rule stands.
                if [ "$TRUSTED_ONLY" = "true" ] && [ -n "$DEFAULT_BRANCH" ] && [ -n "${GITHUB_WORKSPACE:-}" ] && [ -n "${GITHUB_SHA:-}" ] \
                  && git -C "$GITHUB_WORKSPACE" rev-parse --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH^{commit}" >/dev/null 2>&1 \
                  && git -C "$GITHUB_WORKSPACE" rev-parse --verify --quiet "$GITHUB_SHA^{commit}" >/dev/null 2>&1; then
                  if git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT_BRANCH" >/dev/null 2>&1; then
                    :
                  elif [ "$(git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT_BRANCH" >/dev/null 2>&1; echo $?)" = "1" ]; then
                    trusted=false
                  fi
                else
                  echo "::notice title=Doppler::tag $REF not verified against the default branch history (no checkout or history); only its name was checked"
                fi
              fi ;;
            *) trusted=false ;;
          esac
          if [ "$IS_FORK" = "true" ]; then
            # A fork's pull request has no id-token and must never receive a
            # secret. Silent skip is correct here, whatever `required` says.
            skip="pull request from a fork"
          elif [ "$TRUSTED_ONLY" = "true" ] && [ "$trusted" != "true" ]; then
            skip="$EVENT on $REF is not a push or dispatch on the default branch or a version tag (vN.N.N, in the default branch history), or a schedule (trusted-refs-only)"
            # A tag this rule refused is reported, so a job that was asked for a
            # secret-backed feature can fail instead of skipping it quietly.
            case "$REF" in refs/tags/*) untrusted_tag=true ;; esac
          elif [ -n "$IDENTITY_ID" ]; then
            mode=oidc
          elif [ -n "$TOKEN" ]; then
            mode=token
          fi
          if [ -n "$skip" ]; then
            echo "::notice title=Doppler::$skip - no secrets are fetched"
          fi
          if [ "$mode" != "none" ] && { [ -z "$PROJECT" ] || [ -z "$CONFIG" ]; }; then
            echo "::error title=Doppler::project and config are required when authenticating"
            exit 1
          fi
          if [ "$mode" = "none" ] && [ -z "$skip" ]; then
            if [ "$REQUIRED" = "true" ]; then
              echo "::error title=Doppler::no identity-id and no DOPPLER_TOKEN; this job needs one (see README, 'Doppler setup')"
              exit 1
            fi
            echo "::notice title=Doppler::not configured (no identity-id, no DOPPLER_TOKEN) - continuing without CI secrets"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "untrusted-tag=$untrusted_tag" >> "$GITHUB_OUTPUT"
          echo "Doppler auth mode: $mode"

      - name: Fetch CI secrets from Doppler (OIDC)
        if: steps.doppler.outputs.mode == 'oidc'
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ inputs.doppler-identity-id }}
          doppler-project: ${{ inputs.doppler-project }}
          doppler-config: ${{ inputs.doppler-config }}
          inject-env-vars: true

      - name: Fetch CI secrets from Doppler (Service Token)
        if: steps.doppler.outputs.mode == 'token'
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: ${{ inputs.doppler-project }}
          doppler-config: ${{ inputs.doppler-config }}
          inject-env-vars: true
      # ---------------------------------------------------------------------

      # The key reaches safo as an input, never a command line; with no key (a
      # dry run with no Doppler) nothing is minted and safo says so and succeeds.
      # `reconcile: false` makes the schedule and manual runs a no-op, as before.
      - name: Sync the project
        if: ${{ inputs.reconcile || (github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') }}
        uses: ChiefGyk3D/scrum-around-and-find-out@dda1e44000f59dfe156f02faccbbddcaf8c9005f # v0.1.2
        with:
          mode: ${{ inputs.dry-run && env.PROJECTS_APP_PRIVATE_KEY == '' && 'validate' || (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'reconcile' || 'sync' }}
          project-url: ${{ inputs.project-url }}
          status-field: ${{ inputs.status-field }}
          status-open-issue: ${{ inputs.status-open-issue }}
          status-open-pr: ${{ inputs.status-open-pr }}
          status-draft-pr: ${{ inputs.status-draft-pr }}
          status-done: ${{ inputs.status-done }}
          done-date-field: ${{ inputs.done-date-field }}
          default-area-field: ${{ inputs.default-area-field }}
          default-area: ${{ inputs.default-area }}
          dry-run: ${{ inputs.dry-run }}
          client-id: ${{ inputs.client-id }}
          app-id: ${{ inputs.app-id }}
          app-owner: ${{ inputs.app-owner }}
          private-key: ${{ env.PROJECTS_APP_PRIVATE_KEY }}
          repositories: ${{ inputs.repositories || github.event.repository.name }}
