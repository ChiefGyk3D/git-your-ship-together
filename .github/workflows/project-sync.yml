# Reusable sync of a GitHub Projects v2 board with a repository's issues and
# pull requests: an item is added when one opens, moved to Done with a date when
# one closes or merges, and a scheduled reconcile repairs whatever an event
# missed. User-owned projects have no "auto-add" built-in, so each repository
# calls this from a small workflow of its own.
#
# Call it from a workflow that triggers on issues, pull_request_target,
# schedule and workflow_dispatch (the full caller is in the README, "Keeping a
# project current"):
#
#   jobs:
#     sync:
#       uses: ChiefGyk3D/git-your-ship-together/.github/workflows/project-sync.yml@<sha> # vX.Y.Z
#       permissions:
#         contents: read
#         id-token: write        # the Doppler OIDC fetch of the App key
#       secrets:
#         DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional fallback
#       with:
#         project-url: https://github.com/orgs/<org>/projects/<n>
#         client-id: ${{ vars.PROJECTS_APP_CLIENT_ID }}
#         doppler-project: projects
#         doppler-config: prd
#         doppler-identity-id: ${{ vars.PROJECTS_DOPPLER_IDENTITY_ID }}
#         doppler-trusted-refs-only: false    # see "Why pull_request_target" in the README
#
# Why pull_request_target in the caller: a `pull_request` run from a fork gets a
# read-only token and no secrets, so a fork's pull request could never reach the
# board. `pull_request_target` runs the workflow file from the base branch with
# secrets. That is safe here because this job checks out nothing from the pull
# request and runs only the script below, which reads the event payload as data
# (never expanded into a shell) and talks only to api.github.com.
#
# The script is scripts/project_sync.py, inlined because a reusable workflow
# cannot check out the commit it is running from (a `@main` checkout would make
# a caller's pin only as strong as this repository's default branch).
# tests/test_project_sync.py fails if the copy below drifts;
# scripts/inline_project_sync.py rewrites it.
#
# The only credential is a GitHub App installation token. The App's private key
# (PEM) is held in Doppler and fetched over the job's OIDC identity exactly as
# the other workflows fetch theirs; actions/create-github-app-token trades it
# for a token that lives an hour, is limited to the calling repository's
# installation, and is revoked by the action when the job ends. No personal
# access token is accepted.

name: Project sync (reusable)

on:
  workflow_call:
    inputs:
      project-url:
        description: The organization-owned project, `https://github.com/orgs/<login>/projects/<n>`. A `/users/` URL is refused, because an App has no user-account Projects permission.
        type: string
        default: ""
      status-field:
        description: The single-select field that holds an item's status.
        type: string
        default: Status
      status-open-issue:
        description: Status given to an issue that is opened, or reopened out of Done. An issue already holding a status other than Done keeps it.
        type: string
        default: Backlog
      status-open-pr:
        description: Status given to a pull request that is opened, reopened or marked ready for review.
        type: string
        default: In progress
      status-draft-pr:
        description: Status given to a draft pull request, opened as a draft or converted to one.
        type: string
        default: Backlog
      status-done:
        description: Status given to an issue that closes or a pull request that closes or merges.
        type: string
        default: Done
      done-date-field:
        description: The date field set to the close or merge date when an item reaches Done; cleared if the item is reopened. Empty disables it.
        type: string
        default: Done on
      reconcile:
        description: On `schedule` and `workflow_dispatch`, walk every open issue and pull request of the calling repository and every board item that points at it, adding what is missing and moving closed or merged items to Done with their close date. Never reopens an item. `false` makes those two events a no-op.
        type: boolean
        default: true
      default-area-field:
        description: A single-select field to set on items this workflow adds, so a repository can say `Area = Hill`. Items already on the board are never touched. Empty sets nothing; set together with `default-area`.
        type: string
        default: ""
      default-area:
        description: The option of `default-area-field` given to an item this workflow adds.
        type: string
        default: ""
      dry-run:
        description: Read the board and print every change instead of making it. Without a token, a dry run only says so and succeeds, which is how this repository's own CI exercises the workflow.
        type: boolean
        default: false
      client-id:
        description: The Client ID of the GitHub App that holds the Projects permission, from the App's settings page. An identifier, not a secret; callers pass the repository variable `PROJECTS_APP_CLIENT_ID`. Set this one or `app-id`.
        type: string
        default: ""
      app-id:
        description: Deprecated, accepted for one release. The numeric id of the same App; actions/create-github-app-token has deprecated it in favour of `client-id`, and a run that passes it prints that warning. Used only when `client-id` is empty.
        type: string
        default: ""
      app-owner:
        description: The account whose installation of the App mints the token, when the board belongs to a different account than the calling repository (a public repository on a personal account, a board in an organization). Empty uses the repository's own owner and scopes the token to this repository. Set, the token comes from that owner's installation with no repository list, so it reaches the whole installation, and the repository must be public - an organization token cannot read a private repository on another account, so the run refuses one before minting. A GitHub login; no new permission.
        type: string
        default: ""
      pull-request-events:
        description: Act on `pull_request_target` events. `false` makes a run started by that event skip the whole job, so a caller that keeps the trigger without an identity that covers a pull-request subject stays green instead of red; `issues`, `schedule` and `workflow_dispatch` runs are unaffected. See the README.
        type: boolean
        default: true
      egress-policy:
        description: harden-runner egress policy - `audit` logs outbound connections, `block` allows only `allowed-endpoints`.
        type: string
        default: audit
      allowed-endpoints:
        description: harden-runner allow-list for `block`, space-separated host:port entries. Doppler and the GitHub API are all this job reaches.
        type: string
        default: "api.doppler.com:443 api.github.com:443"
      extra-allowed-endpoints:
        description: Appended to `allowed-endpoints`. Same format.
        type: string
        default: ""
      doppler-project:
        description: Doppler project slug.
        type: string
        default: ""
      doppler-config:
        description: Doppler config slug holding the App private key.
        type: string
        default: ""
      doppler-identity-id:
        description: Doppler Service Account Identity UUID for OIDC.
        type: string
        default: ""
      doppler-trusted-refs-only:
        description: Fetch the key only on the default branch, a tag or a schedule. A caller that triggers on `pull_request_target` sets this to `false`, because that event is never trusted by this rule yet runs the base branch's workflow and checks out nothing from the pull request; see the README.
        type: boolean
        default: true
      timeout-minutes:
        description: Job timeout.
        type: number
        default: 15
    secrets:
      DOPPLER_TOKEN:
        description: Doppler Service Token fallback when OIDC is not configured.
        required: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync project
    # `pull-request-events: false` turns the pull request path off from the
    # calling side without editing the caller's triggers.
    if: ${{ inputs.pull-request-events || github.event_name != 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      id-token: write  # Doppler OIDC for the App private key
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }}
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ inputs.egress-policy == 'block' }}

      # --- Doppler (same steps as .github/actions/doppler-secrets) ---------
      - name: Decide how to authenticate to Doppler
        id: doppler
        if: inputs.doppler-project != ''
        env:
          IDENTITY_ID: ${{ inputs.doppler-identity-id }}
          TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PROJECT: ${{ inputs.doppler-project }}
          CONFIG: ${{ inputs.doppler-config }}
          REQUIRED: "false"
          TRUSTED_ONLY: ${{ inputs.doppler-trusted-refs-only }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mode=none
          skip=""
          # A trusted ref is one only a push by someone with write access, or the
          # schedule, can produce: the default branch, a tag, or a scheduled run
          # (which GitHub always starts from the default branch). A pull request
          # is never trusted, whichever repository its head is in.
          trusted=false
          case "$EVENT" in
            schedule) trusted=true ;;
            pull_request|pull_request_target) trusted=false ;;
            *)
              if [ -n "$DEFAULT_BRANCH" ] && [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
                trusted=true
              elif [ "${REF#refs/tags/}" != "$REF" ]; then
                trusted=true
              fi ;;
          esac
          if [ "$IS_FORK" = "true" ]; then
            # A fork's pull request has no id-token and must never receive a
            # secret. Silent skip is correct here, whatever `required` says.
            skip="pull request from a fork"
          elif [ "$TRUSTED_ONLY" = "true" ] && [ "$trusted" != "true" ]; then
            skip="$EVENT on $REF is not the default branch, a tag or a schedule (trusted-refs-only)"
          elif [ -n "$IDENTITY_ID" ]; then
            mode=oidc
          elif [ -n "$TOKEN" ]; then
            mode=token
          fi
          if [ -n "$skip" ]; then
            echo "::notice title=Doppler::$skip - no secrets are fetched"
          fi
          if [ "$mode" != "none" ] && { [ -z "$PROJECT" ] || [ -z "$CONFIG" ]; }; then
            echo "::error title=Doppler::project and config are required when authenticating"
            exit 1
          fi
          if [ "$mode" = "none" ] && [ -z "$skip" ]; then
            if [ "$REQUIRED" = "true" ]; then
              echo "::error title=Doppler::no identity-id and no DOPPLER_TOKEN; this job needs one (see README, 'Doppler setup')"
              exit 1
            fi
            echo "::notice title=Doppler::not configured (no identity-id, no DOPPLER_TOKEN) - continuing without CI secrets"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Doppler auth mode: $mode"

      - name: Fetch CI secrets from Doppler (OIDC)
        if: steps.doppler.outputs.mode == 'oidc'
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ inputs.doppler-identity-id }}
          doppler-project: ${{ inputs.doppler-project }}
          doppler-config: ${{ inputs.doppler-config }}
          inject-env-vars: true

      - name: Fetch CI secrets from Doppler (Service Token)
        if: steps.doppler.outputs.mode == 'token'
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: ${{ inputs.doppler-project }}
          doppler-config: ${{ inputs.doppler-config }}
          inject-env-vars: true
      # ---------------------------------------------------------------------

      # The key reaches the action as an input, never a command line. With no
      # key (a dry run with no Doppler) nothing is minted and the script says so.
      # The action revokes the token itself when the job ends (its default);
      # nothing here needs to. The `permission-*` inputs name the token's whole
      # reach (organization Projects write, Issues and Pull requests read): a
      # token minted without them would carry every permission the App has,
      # which zizmor's github-app audit rightly refuses.
      - name: Require an App identifier
        if: ${{ env.PROJECTS_APP_PRIVATE_KEY != '' && inputs.client-id == '' && inputs.app-id == '' }}
        run: |
          echo "::error::project-sync needs the App's Client ID: pass client-id (the PROJECTS_APP_CLIENT_ID repository variable). app-id is accepted for one release but is deprecated."
          exit 1

      # app-owner mints from another account's installation. That token has no
      # repository list and cannot read a private repository of this account, so
      # a private caller would get cards written blind: refuse it here, from the
      # token-free event context, before anything is minted. The value reaches
      # the script through env only, and must be a GitHub login.
      - name: Guard app-owner
        if: ${{ inputs.app-owner != '' }}
        env:
          APP_OWNER: ${{ inputs.app-owner }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if ! [[ "$APP_OWNER" =~ ^[A-Za-z0-9](-?[A-Za-z0-9]){0,38}$ ]]; then
            echo "::error::project-sync: app-owner is not a GitHub login (letters, digits and single hyphens, at most 39 characters)."
            exit 1
          fi
          if [ "${APP_OWNER,,}" != "${REPO_OWNER,,}" ] && [ "$REPO_PRIVATE" != "false" ]; then
            echo "::error::project-sync: app-owner is set to another account, which needs a public repository. This repository is private (or its visibility is unknown): an organization token cannot read a private repository on another account, so cards would be written blind."
            exit 1
          fi

      - name: Mint a one-hour installation token
        id: app
        if: ${{ env.PROJECTS_APP_PRIVATE_KEY != '' && inputs.client-id != '' && inputs.app-owner == '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ env.PROJECTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-organization-projects: write
          permission-issues: read
          permission-pull-requests: read

      - name: Mint a one-hour installation token (deprecated app-id)
        id: app_legacy
        if: ${{ env.PROJECTS_APP_PRIVATE_KEY != '' && inputs.client-id == '' && inputs.app-id != '' && inputs.app-owner == '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ env.PROJECTS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-organization-projects: write
          permission-issues: read
          permission-pull-requests: read

      # app-owner set: the same App, the owner's installation, no repository
      # list (the token covers that installation; the guard above holds the
      # repository public).
      - name: Mint a one-hour installation token (app-owner)
        id: app_org
        if: ${{ env.PROJECTS_APP_PRIVATE_KEY != '' && inputs.client-id != '' && inputs.app-owner != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ env.PROJECTS_APP_PRIVATE_KEY }}
          owner: ${{ inputs.app-owner }}
          permission-organization-projects: write
          permission-issues: read
          permission-pull-requests: read

      - name: Mint a one-hour installation token (deprecated app-id, app-owner)
        id: app_legacy_org
        if: ${{ env.PROJECTS_APP_PRIVATE_KEY != '' && inputs.client-id == '' && inputs.app-id != '' && inputs.app-owner != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ env.PROJECTS_APP_PRIVATE_KEY }}
          owner: ${{ inputs.app-owner }}
          permission-organization-projects: write
          permission-issues: read
          permission-pull-requests: read

      - name: Sync the project
        env:
          PS_TOKEN: ${{ steps.app.outputs.token || steps.app_legacy.outputs.token || steps.app_org.outputs.token || steps.app_legacy_org.outputs.token }}
          PS_PROJECT_URL: ${{ inputs.project-url }}
          PS_STATUS_FIELD: ${{ inputs.status-field }}
          PS_STATUS_OPEN_ISSUE: ${{ inputs.status-open-issue }}
          PS_STATUS_OPEN_PR: ${{ inputs.status-open-pr }}
          PS_STATUS_DRAFT_PR: ${{ inputs.status-draft-pr }}
          PS_STATUS_DONE: ${{ inputs.status-done }}
          PS_DONE_DATE_FIELD: ${{ inputs.done-date-field }}
          PS_RECONCILE: ${{ inputs.reconcile }}
          PS_DEFAULT_AREA_FIELD: ${{ inputs.default-area-field }}
          PS_DEFAULT_AREA: ${{ inputs.default-area }}
          PS_DRY_RUN: ${{ inputs.dry-run }}
          PS_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PROJECT_SYNC_PY'
          #!/usr/bin/env python3
          """Keep a GitHub Projects v2 board current from issue and pull request events.

          Run by .github/workflows/project-sync.yml, which carries a verbatim copy of this
          file (tests/test_project_sync.py checks the copy). Standard library only: the
          runner has python3, a hash-checked pip install would add a supply chain for
          about two hundred lines of HTTP, and `urllib` keeps the token inside this
          process instead of on a `gh` command line or in its config. Everything the
          script knows about GitHub goes through one callable, `gql(op, variables)`, so
          the tests hand it recorded responses.

          What it will never do: edit a field (`updateProjectV2Field` regenerates every
          option id and wipes the board's values), touch Area, Kind, Priority, Epic or
          any field it was not told about on an item that is already on the board, or
          print the token.
          """

          from __future__ import annotations

          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.request
          from collections.abc import Callable
          from dataclasses import dataclass
          from datetime import UTC, datetime

          GRAPHQL_URL = "https://api.github.com/graphql"


          class SyncError(Exception):
              """A problem the operator can fix; printed as one sentence, never a traceback."""


          # --- operations ---------------------------------------------------------------

          _FIELDS = """
            fields(first: 100) { nodes {
              __typename
              ... on ProjectV2FieldCommon { id name dataType }
              ... on ProjectV2SingleSelectField { options { id name } }
            } }
          """

          QUERIES = {
              "ProjectUser": "query ProjectUser($login: String!, $number: Int!) { user(login: $login) { projectV2(number: $number) { id title"
              + _FIELDS
              + "} } }",
              "ProjectOrg": "query ProjectOrg($login: String!, $number: Int!) { organization(login: $login) { projectV2(number: $number) { id title"
              + _FIELDS
              + "} } }",
              # The item's current Status and done date ride along, so a lookup is one request.
              "ItemLookup": """query ItemLookup($id: ID!, $statusField: String!, $doneField: String!, $withDone: Boolean!, $after: String) {
            node(id: $id) {
              ... on Issue { projectItems(first: 50, after: $after) { ...Items } }
              ... on PullRequest { projectItems(first: 50, after: $after) { ...Items } }
            }
          }
          fragment Items on ProjectV2ItemConnection {
            pageInfo { hasNextPage endCursor }
            nodes {
              id
              project { id }
              status: fieldValueByName(name: $statusField) { ... on ProjectV2ItemFieldSingleSelectValue { name } }
              done: fieldValueByName(name: $doneField) @include(if: $withDone) { ... on ProjectV2ItemFieldDateValue { date } }
            }
          }""",
              "ProjectItems": """query ProjectItems($id: ID!, $statusField: String!, $doneField: String!, $withDone: Boolean!, $after: String) {
            node(id: $id) {
              ... on ProjectV2 {
                items(first: 100, after: $after) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    id
                    status: fieldValueByName(name: $statusField) { ... on ProjectV2ItemFieldSingleSelectValue { name } }
                    done: fieldValueByName(name: $doneField) @include(if: $withDone) { ... on ProjectV2ItemFieldDateValue { date } }
                    content {
                      __typename
                      ... on Issue { id state closedAt repository { nameWithOwner } }
                      ... on PullRequest { id state isDraft merged closedAt repository { nameWithOwner } }
                    }
                  }
                }
              }
            }
          }""",
              "RepoIssues": """query RepoIssues($owner: String!, $name: String!, $after: String) {
            repository(owner: $owner, name: $name) {
              issues(states: OPEN, first: 100, after: $after) {
                pageInfo { hasNextPage endCursor }
                nodes { id number state closedAt }
              }
            }
          }""",
              "RepoPulls": """query RepoPulls($owner: String!, $name: String!, $after: String) {
            repository(owner: $owner, name: $name) {
              pullRequests(states: OPEN, first: 100, after: $after) {
                pageInfo { hasNextPage endCursor }
                nodes { id number state isDraft merged closedAt }
              }
            }
          }""",
              "AddItem": """mutation AddItem($projectId: ID!, $contentId: ID!) {
            addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) { item { id } }
          }""",
              "SetSelect": """mutation SetSelect($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
            ok: updateProjectV2ItemFieldValue(input: {projectId: $projectId, itemId: $itemId, fieldId: $fieldId, value: {singleSelectOptionId: $optionId}}) { clientMutationId }
          }""",
              "SetDate": """mutation SetDate($projectId: ID!, $itemId: ID!, $fieldId: ID!, $date: Date!) {
            ok: updateProjectV2ItemFieldValue(input: {projectId: $projectId, itemId: $itemId, fieldId: $fieldId, value: {date: $date}}) { clientMutationId }
          }""",
              "ClearField": """mutation ClearField($projectId: ID!, $itemId: ID!, $fieldId: ID!) {
            ok: clearProjectV2ItemFieldValue(input: {projectId: $projectId, itemId: $itemId, fieldId: $fieldId}) { clientMutationId }
          }""",
          }
          MUTATIONS = {"AddItem", "SetSelect", "SetDate", "ClearField"}

          Gql = Callable[[str, dict], dict]


          # --- the GitHub client ----------------------------------------------------------


          def _post(url: str, token: str, body: dict) -> dict:
              request = urllib.request.Request(
                  url,
                  data=json.dumps(body).encode(),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "git-your-ship-together-project-sync",
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:  # noqa: S310 - the URL is fixed https
                  return json.load(response)


          class Client:
              """`gql(op, variables)`: retries transient failures, skips mutations in a dry run."""

              def __init__(self, token: str, url: str = GRAPHQL_URL, dry_run: bool = False, transport=None):
                  self._token, self._url, self.dry_run = token, url, dry_run
                  self._transport = transport or _post
                  self.skipped = 0

              def __call__(self, op: str, variables: dict) -> dict:
                  if op in MUTATIONS and self.dry_run:
                      self.skipped += 1
                      print(f"dry run: would {op} {json.dumps(variables, sort_keys=True)}")
                      return {"data": {"addProjectV2ItemById": {"item": {"id": "DRY_RUN"}}, "ok": {}}}
                  for attempt in range(4):
                      try:
                          out = self._transport(self._url, self._token, {"query": QUERIES[op], "variables": variables})
                      except urllib.error.HTTPError as err:
                          if err.code in (401, 403):
                              raise SyncError(
                                  f"GitHub refused the token ({err.code}) on {op}. It needs user Projects read/write and "
                                  "repository Issues and Pull requests read; see the README, 'Keeping a project current'."
                              ) from None
                          if err.code in (500, 502, 503, 504) and attempt < 3:
                              time.sleep(2**attempt)
                              continue
                          raise SyncError(f"GitHub answered {err.code} to {op}.") from None
                      except (urllib.error.URLError, TimeoutError) as err:
                          if attempt < 3:
                              time.sleep(2**attempt)
                              continue
                          raise SyncError(f"Could not reach GitHub for {op}: {err}.") from None
                      if out.get("errors"):
                          messages = "; ".join(str(e.get("message", e)) for e in out["errors"])
                          if "RATE_LIMITED" in json.dumps(out["errors"]) and attempt < 3:
                              time.sleep(30 * (attempt + 1))
                              continue
                          raise SyncError(f"GitHub rejected {op}: {messages}")
                      return out
                  raise SyncError(f"GitHub kept failing {op}.")


          # --- configuration and the project -------------------------------------------


          @dataclass(frozen=True)
          class Config:
              project_url: str
              status_field: str
              status_open_issue: str
              status_open_pr: str
              status_draft_pr: str
              status_done: str
              done_date_field: str
              reconcile: bool
              default_area_field: str
              default_area: str
              dry_run: bool


          @dataclass(frozen=True)
          class Field:
              id: str
              name: str
              data_type: str
              options: dict[str, str]


          @dataclass(frozen=True)
          class Project:
              id: str
              fields: dict[str, Field]

              def field(self, name: str) -> Field:
                  if name not in self.fields:
                      raise SyncError(
                          f"The project has no field named '{name}'. Its fields are: {', '.join(self.fields)}. "
                          "Check the input that names it; this workflow never creates or renames a field."
                      )
                  return self.fields[name]

              def option_id(self, field: str, option: str) -> str:
                  found = self.field(field)
                  if option not in found.options:
                      raise SyncError(
                          f"The field '{field}' has no option named '{option}'. Its options are: {', '.join(found.options)}. "
                          "Fix the input, or add the option in the project's own settings; this workflow never edits a "
                          "field's options, because that regenerates every option id and wipes the board's values."
                      )
                  return found.options[option]


          def parse_project_url(url: str) -> tuple[str, str, int]:
              m = re.fullmatch(r"https://github\.com/(users|orgs)/([A-Za-z0-9-]+)/projects/(\d+)/?", url.strip())
              if not m:
                  raise SyncError(
                      f"'{url}' is not a GitHub Projects v2 URL. Expected https://github.com/users/<login>/projects/<n> "
                      "or https://github.com/orgs/<login>/projects/<n>."
                  )
              return ("user" if m[1] == "users" else "org"), m[2], int(m[3])


          def load_project(gql: Gql, url: str) -> Project:
              kind, login, number = parse_project_url(url)
              op = "ProjectUser" if kind == "user" else "ProjectOrg"
              owner = gql(op, {"login": login, "number": number})["data"]["user" if kind == "user" else "organization"]
              node = owner and owner["projectV2"]
              if not node:
                  raise SyncError(f"No project {number} under {login}, or the token cannot see it.")
              fields = {
                  f["name"]: Field(f["id"], f["name"], f.get("dataType", ""), {o["name"]: o["id"] for o in f.get("options") or []})
                  for f in node["fields"]["nodes"]
                  if f
              }
              return Project(node["id"], fields)


          def validate(project: Project, cfg: Config) -> None:
              """Every name the run will use, checked before the first mutation."""
              for name in (cfg.status_open_issue, cfg.status_open_pr, cfg.status_draft_pr, cfg.status_done):
                  project.option_id(cfg.status_field, name)
              if cfg.done_date_field and project.field(cfg.done_date_field).data_type != "DATE":
                  raise SyncError(f"The field '{cfg.done_date_field}' is not a date field; done-date-field must name one.")
              if bool(cfg.default_area_field) != bool(cfg.default_area):
                  raise SyncError("default-area-field and default-area go together: set both or neither.")
              if cfg.default_area_field:
                  project.option_id(cfg.default_area_field, cfg.default_area)


          # --- items --------------------------------------------------------------------


          @dataclass(frozen=True)
          class Content:
              id: str
              kind: str  # issue | pr
              state: str  # open | closed | merged
              draft: bool
              closed_at: str | None
              number: int
              repo: str


          @dataclass
          class Item:
              id: str
              status: str | None
              done: str | None


          def _item(node: dict) -> Item:
              return Item(node["id"], (node.get("status") or {}).get("name"), (node.get("done") or {}).get("date"))


          def find_item(gql: Gql, cfg: Config, project: Project, content_id: str) -> Item | None:
              after = None
              while True:
                  out = gql(
                      "ItemLookup",
                      {
                          "id": content_id,
                          "statusField": cfg.status_field,
                          "doneField": cfg.done_date_field or "-",
                          "withDone": bool(cfg.done_date_field),
                          "after": after,
                      },
                  )["data"]["node"]
                  conn = out["projectItems"]
                  for node in conn["nodes"]:
                      if node["project"]["id"] == project.id:
                          return _item(node)
                  if not conn["pageInfo"]["hasNextPage"]:
                      return None
                  after = conn["pageInfo"]["endCursor"]


          def target_status(cfg: Config, c: Content, action: str, current: str | None) -> str | None:
              """The status this content should move to, or None to leave it where it is."""
              if c.state in ("closed", "merged"):
                  return None if current == cfg.status_done else cfg.status_done
              if c.kind == "issue":
                  if current is None or (current == cfg.status_done and action == "reopened"):
                      return cfg.status_open_issue
                  return None
              wanted = cfg.status_draft_pr if c.draft else cfg.status_open_pr
              if action in ("opened", "ready_for_review", "converted_to_draft", "reopened"):
                  return wanted if current != wanted else None
              return wanted if current is None else None


          def _date_of(c: Content) -> str:
              return (c.closed_at or datetime.now(UTC).isoformat())[:10]


          def sync_content(
              gql: Gql, cfg: Config, project: Project, c: Content, action: str, item: Item | None = None, known_absent: bool = False
          ) -> list[str]:
              """Bring one issue or pull request's item in line with its state. Returns what it did."""
              done: list[str] = []
              if item is None and not known_absent:
                  item = find_item(gql, cfg, project, c.id)
              if item is None:
                  added = gql("AddItem", {"projectId": project.id, "contentId": c.id})["data"]["addProjectV2ItemById"]["item"]["id"]
                  item = Item(added, None, None)
                  done.append(f"added #{c.number}")
                  if cfg.default_area_field:
                      gql(
                          "SetSelect",
                          {
                              "projectId": project.id,
                              "itemId": item.id,
                              "fieldId": project.field(cfg.default_area_field).id,
                              "optionId": project.option_id(cfg.default_area_field, cfg.default_area),
                          },
                      )
                      done.append(f"{cfg.default_area_field} = {cfg.default_area}")
              target = target_status(cfg, c, action, item.status)
              if target:
                  gql(
                      "SetSelect",
                      {
                          "projectId": project.id,
                          "itemId": item.id,
                          "fieldId": project.field(cfg.status_field).id,
                          "optionId": project.option_id(cfg.status_field, target),
                      },
                  )
                  done.append(f"#{c.number} {cfg.status_field} = {target}")
              if cfg.done_date_field:
                  date_id = project.field(cfg.done_date_field).id
                  closed = c.state in ("closed", "merged")
                  if closed and item.done is None:
                      gql("SetDate", {"projectId": project.id, "itemId": item.id, "fieldId": date_id, "date": _date_of(c)})
                      done.append(f"#{c.number} {cfg.done_date_field} = {_date_of(c)}")
                  elif not closed and target and item.status == cfg.status_done and item.done is not None:
                      gql("ClearField", {"projectId": project.id, "itemId": item.id, "fieldId": date_id})
                      done.append(f"#{c.number} {cfg.done_date_field} cleared")
              return done


          def content_from_event(event_name: str, payload: dict) -> Content:
              repo = (payload.get("repository") or {}).get("full_name", "")
              if "pull_request" in payload:
                  pr = payload["pull_request"]
                  state = "merged" if pr.get("merged") else pr["state"]
                  return Content(pr["node_id"], "pr", state, bool(pr.get("draft")), pr.get("closed_at"), pr["number"], repo)
              if "issue" in payload:
                  issue = payload["issue"]
                  return Content(issue["node_id"], "issue", issue["state"], False, issue.get("closed_at"), issue["number"], repo)
              raise SyncError(f"The {event_name} event carries neither an issue nor a pull request.")


          # --- reconcile ------------------------------------------------------------------


          def _pages(gql: Gql, op: str, variables: dict, path: tuple[str, ...]):
              after = None
              while True:
                  node = gql(op, {**variables, "after": after})["data"]
                  for key in path:
                      node = node[key]
                  yield from node["nodes"]
                  if not node["pageInfo"]["hasNextPage"]:
                      return
                  after = node["pageInfo"]["endCursor"]


          def reconcile(gql: Gql, cfg: Config, project: Project, repo: str) -> dict[str, int]:
              """One walk of the board and one of the repository's open work; no query per item."""
              owner, name = repo.split("/", 1)
              summary = {"added": 0, "closed": 0, "reopened": 0, "dated": 0}
              on_board: dict[str, Item] = {}
              closed_here: list[tuple[Content, Item]] = []
              variables = {
                  "id": project.id,
                  "statusField": cfg.status_field,
                  "doneField": cfg.done_date_field or "-",
                  "withDone": bool(cfg.done_date_field),
              }
              for node in _pages(gql, "ProjectItems", variables, ("node", "items")):
                  content = node.get("content") or {}
                  if content.get("__typename") not in ("Issue", "PullRequest"):
                      continue  # a draft issue or an item the token cannot read
                  item = _item(node)
                  on_board[content["id"]] = item
                  if content["repository"]["nameWithOwner"].lower() != repo.lower():
                      continue
                  state = "merged" if content.get("merged") else content["state"].lower()
                  if state in ("closed", "merged"):
                      kind = "pr" if content["__typename"] == "PullRequest" else "issue"
                      c = Content(content["id"], kind, state, False, content.get("closedAt"), 0, repo)
                      closed_here.append((c, item))
              repo_vars = {"owner": owner, "name": name}
              open_work = [
                  Content(n["id"], "issue", "open", False, None, n["number"], repo)
                  for n in _pages(gql, "RepoIssues", repo_vars, ("repository", "issues"))
              ] + [
                  Content(n["id"], "pr", "open", bool(n["isDraft"]), None, n["number"], repo)
                  for n in _pages(gql, "RepoPulls", repo_vars, ("repository", "pullRequests"))
              ]
              for c in open_work:
                  item = on_board.get(c.id)
                  if item is None:
                      sync_content(gql, cfg, project, c, "reconcile", known_absent=True)
                      summary["added"] += 1
                  # An open item already on the board keeps whatever status it has: reconcile never reopens.
              for c, item in closed_here:
                  steps = sync_content(gql, cfg, project, c, "closed", item=item)
                  summary["closed"] += any("Status" in s or cfg.status_field in s for s in steps)
                  summary["dated"] += any(cfg.done_date_field and cfg.done_date_field in s for s in steps) and not any(
                      cfg.status_field in s for s in steps
                  )
              return summary


          # --- entry point --------------------------------------------------------------------


          def _bool(value: str) -> bool:
              return value.strip().lower() in ("1", "true", "yes")


          def config_from_env(env=os.environ) -> Config:
              return Config(
                  project_url=env.get("PS_PROJECT_URL", ""),
                  status_field=env.get("PS_STATUS_FIELD", "Status"),
                  status_open_issue=env.get("PS_STATUS_OPEN_ISSUE", "Backlog"),
                  status_open_pr=env.get("PS_STATUS_OPEN_PR", "In progress"),
                  status_draft_pr=env.get("PS_STATUS_DRAFT_PR", "Backlog"),
                  status_done=env.get("PS_STATUS_DONE", "Done"),
                  done_date_field=env.get("PS_DONE_DATE_FIELD", "Done on"),
                  reconcile=_bool(env.get("PS_RECONCILE", "false")),
                  default_area_field=env.get("PS_DEFAULT_AREA_FIELD", ""),
                  default_area=env.get("PS_DEFAULT_AREA", ""),
                  dry_run=_bool(env.get("PS_DRY_RUN", "false")),
              )


          def main() -> int:
              env = os.environ
              cfg = config_from_env(env)
              event_name = env.get("PS_EVENT_NAME", "")
              # The workflow mints a one-hour GitHub App installation token and hands it over here.
              token = env.get("PS_TOKEN", "")
              try:
                  if not cfg.project_url:
                      raise SyncError("project-url is empty.")
                  if parse_project_url(cfg.project_url)[0] == "user":
                      raise SyncError(
                          "GitHub Apps have no user-account Projects permission, so an installation token cannot write to "
                          "a user-owned project; move the project to an organization or run the sync by hand "
                          "(https://docs.github.com/en/rest/authentication/permissions-required-for-github-apps)."
                      )
                  if not token:
                      if cfg.dry_run:
                          print("::notice title=project-sync::dry run with no installation token; nothing to read, nothing sent")
                          return 0
                      raise SyncError(
                          "No token: PS_TOKEN is empty. The workflow mints it from the GitHub App's private key, which "
                          "must be in the Doppler config the doppler-* inputs name; see the README, "
                          "'Keeping a project current'."
                      )
                  gql = Client(token, env.get("GITHUB_GRAPHQL_URL", GRAPHQL_URL), dry_run=cfg.dry_run)
                  project = load_project(gql, cfg.project_url)
                  validate(project, cfg)
                  repo = env.get("GITHUB_REPOSITORY", "")
                  if event_name in ("schedule", "workflow_dispatch"):
                      if cfg.reconcile:
                          print(f"reconcile {repo}: {reconcile(gql, cfg, project, repo)}")
                      else:
                          print(f"{event_name} with reconcile off: nothing to do")
                      return 0
                  path = env.get("PS_EVENT_PATH") or env.get("GITHUB_EVENT_PATH", "")
                  if not path:
                      raise SyncError(f"The {event_name} event has no payload file.")
                  with open(path, encoding="utf-8") as handle:
                      payload = json.load(handle)
                  content = content_from_event(event_name, payload)
                  done = sync_content(gql, cfg, project, content, payload.get("action", ""))
                  print("; ".join(done) if done else f"#{content.number}: already current")
                  return 0
              except SyncError as err:
                  print(f"::error title=project-sync::{err}")
                  return 1


          if __name__ == "__main__":
              sys.exit(main())
          PROJECT_SYNC_PY
