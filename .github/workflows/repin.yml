# Reusable scheduled re-pin: when a repository's pins of this repository's reusable workflows are behind the
# latest release, open ONE pull request that moves them all, changing nothing but the pin SHA and the `# vX.Y.Z`
# comment. It never merges, never touches an input, and refuses (exit 5, no pull request) when the new release
# drops or retypes an input the caller sets or adds a required input it does not set; the job then fails and
# names them. The script is scripts/repin.sh in this repository, inlined below byte for byte (a reusable workflow
# cannot name the commit it runs from, so it cannot read its own repository's files); tests/test_repin.py holds
# the copy identical.
#
# The credential. A pull request that changes `.github/workflows/` needs the `workflows` permission, which the
# job's own GITHUB_TOKEN can never hold, and a pull request opened with GITHUB_TOKEN starts no checks. So opening
# one takes a GitHub App installation token, minted at the start of the job by actions/create-github-app-token,
# limited to the calling repository and to three permissions, valid an hour and revoked when the job ends. The App's
# private key is never a GitHub secret: the job fetches it from Doppler at run time over its own OIDC identity (the
# same steps as project-sync.yml), as the Doppler secret REPIN_APP_PRIVATE_KEY, and it reaches the token step only as
# a step input, never a command line, and is never echoed. No personal access token is accepted. Without the App
# (`client-id` empty or no key fetched), or off the default branch, or on any event other than `schedule` and `workflow_dispatch`, or with `dry-run: true`, the job opens
# nothing: it prints where each pin stands and succeeds.
#
# Owner setup (nothing here can do it for the owner): create a GitHub App with Repository permissions Contents,
# Pull requests and Workflows set to Read and write and nothing else, install it on the repositories that call
# this, store its private key in Doppler as REPIN_APP_PRIVATE_KEY (a Doppler Service Account Identity trusted for the
# calling repository reads it over OIDC), and give the caller the App's Client ID and the Doppler identity as variables.
#
# Call it from a small workflow of its own:
#
#   on:
#     schedule:
#       - cron: "17 6 * * 1"
#     workflow_dispatch:
#
#   permissions: {}
#
#   jobs:
#     repin:
#       uses: ChiefGyk3D/git-your-ship-together/.github/workflows/repin.yml@<sha> # vX.Y.Z
#       permissions:
#         contents: read
#         id-token: write        # the Doppler OIDC fetch of the App key
#       with:
#         client-id: ${{ vars.REPIN_APP_CLIENT_ID }}
#         doppler-project: <doppler project>
#         doppler-config: <doppler config>
#         doppler-identity-id: ${{ vars.REPIN_DOPPLER_IDENTITY_ID }}

name: Scheduled re-pin (reusable)

on:
  workflow_call:
    inputs:
      client-id:
        description: The Client ID of the GitHub App that opens the pull request, from the App's settings page. An identifier, not a secret. Empty makes the run report only.
        type: string
        default: ""
      dry-run:
        description: Report where each pin stands and what would change, and open nothing, even with the App configured.
        type: boolean
        default: false
      egress-policy:
        description: harden-runner egress policy - `audit` logs outbound connections, `block` allows only `allowed-endpoints`.
        type: string
        default: block
      allowed-endpoints:
        description: harden-runner allow-list for `block`, space-separated host:port entries. Doppler, the GitHub API and git over HTTPS are all this job reaches.
        type: string
        default: "api.doppler.com:443 api.github.com:443 github.com:443"
      extra-allowed-endpoints:
        description: Appended to `allowed-endpoints`. Same format.
        type: string
        default: ""
      doppler-project:
        description: Doppler project slug holding REPIN_APP_PRIVATE_KEY, the private key of the GitHub App named by `client-id`. Empty makes the run report only.
        type: string
        default: ""
      doppler-config:
        description: Doppler config slug holding REPIN_APP_PRIVATE_KEY.
        type: string
        default: ""
      doppler-identity-id:
        description: Doppler Service Account Identity UUID for OIDC.
        type: string
        default: ""
      doppler-trusted-refs-only:
        description: Fetch the key only on the default branch, a version tag (vN.N.N) or a schedule. Leave `true`; this job opens a pull request only from a schedule or a manual run on the default branch anyway.
        type: boolean
        default: true
      timeout-minutes:
        description: Job timeout.
        type: number
        default: 10
    secrets:
      DOPPLER_TOKEN:
        description: Doppler Service Token fallback when OIDC is not configured. Leave unset; the key is fetched over OIDC.
        required: false

permissions:
  contents: read

jobs:
  repin:
    name: Re-pin
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read  # check out the caller's repository; every write is done with the App token, which this job's token never holds
      id-token: write  # Doppler OIDC for the App private key
    steps:
      - name: Validate the egress policy inputs (EX-0001)
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443 github.com:443
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ (inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block' }}

      - name: Egress canary (EX-0001)
        if: ${{ runner.os == 'Linux' && ((inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block') }}
        timeout-minutes: 2
        shell: bash
        # The workspace root exists before checkout; a job default working-directory may not.
        working-directory: ${{ github.workspace }}
        run: |
          set -u
          NAMES="github.com api.github.com results-receiver.actions.githubusercontent.com"
          PORT=443
          canary_resolve() { timeout 5 getent ahostsv4 "$1" 2>/dev/null | awk '$2 == "STREAM" { print $1 }'; }
          canary_probe() { timeout 3 bash -c "exec 3<>\"/dev/tcp/\$0/\$1\"" "$1" "$PORT" 2>/dev/null; }
          canary_reach() {
            local i
            for i in 1 2 3 4; do
              canary_probe "$1" && return 0
              [ "$i" -lt 4 ] && sleep 1
            done
            return 1
          }
          canary_show() { local n=$1; shift; echo "+ $*"; { timeout 10 "$@" 2>&1 || true; } | head -n "$n" || true; }
          canary_diag() {
            local name
            echo "::group::egress canary diagnostics (EX-0001, for the GitHub Support ticket)"
            canary_show 5 uname -srmo
            canary_show 20 cat /etc/resolv.conf
            canary_show 20 bash -c "resolvectl status 2>/dev/null | grep -E '^ *(Current DNS Server|DNS Servers?|DNS Domain):'"
            canary_show 20 bash -c "ss -lun | grep ':53 '"
            for name in $NAMES pipelines.actions.githubusercontent.com; do
              canary_show 20 getent ahostsv4 "$name"
              canary_show 5 curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_connect}\n' --max-time 8 "https://$name"
            done
            echo "::endgroup::"
          }
          canary_main() {
            local tmp name addr n=0 bad
            tmp=$(mktemp -d) || return 1
            for _ in 1 2 3; do
              for name in $NAMES; do canary_resolve "$name" >>"$tmp/res.$name" & done
              wait
              sleep 1
            done
            for name in $NAMES; do
              if [ -s "$tmp/res.$name" ]; then sort -u "$tmp/res.$name"; else echo "-"; fi | sed "s|^|$name |" >>"$tmp/pairs"
            done
            while read -r name addr; do
              n=$((n + 1))
              ( { [ "$addr" != "-" ] && canary_reach "$addr"; } || echo "$name $addr" >"$tmp/bad.$n" ) </dev/null &
            done <"$tmp/pairs"
            wait
            bad=$(cat "$tmp"/bad.* 2>/dev/null | sort || true)
            rm -rf "$tmp"
            if [ -z "$bad" ]; then
              echo "egress canary: all $n addresses of $NAMES accept TCP $PORT"
              return 0
            fi
            echo "::error title=egress canary::egress broken on this runner (known westus2 DNS issue, EX-0001): rerun the job"
            echo "unreachable addresses (name address; '-' means the name did not resolve):"
            printf '%s\n' "$bad"
            canary_diag
            echo "EX-0001 egress canary failed, unreachable: $(printf '%s' "$bad" | tr '\n' ';')" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            return 1
          }
          set -m
          canary_main &
          main=$!
          (sleep 90; kill -TERM -- "-$main"; sleep 2; kill -KILL -- "-$main") >/dev/null 2>&1 &
          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
            kill -TERM -- "-$main" >/dev/null 2>&1 || true
            sleep 1
            kill -KILL -- "-$main" >/dev/null 2>&1 || true
          fi
          if [ "$rc" -eq 143 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=egress canary::the canary hit its 90 s deadline (EX-0001): rerun the job"
            rc=124
          fi
          exit "$rc"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --- Doppler (same steps as .github/actions/doppler-secrets) ---------
      - name: Decide how to authenticate to Doppler
        id: doppler
        if: inputs.doppler-project != ''
        env:
          IDENTITY_ID: ${{ inputs.doppler-identity-id }}
          TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PROJECT: ${{ inputs.doppler-project }}
          CONFIG: ${{ inputs.doppler-config }}
          REQUIRED: "false"
          TRUSTED_ONLY: ${{ inputs.doppler-trusted-refs-only }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mode=none
          skip=""
          untrusted_tag=false
          # A trusted run is one only a push by someone with write access, a manual
          # dispatch by such a person, or the schedule can produce, on the default
          # branch or a version tag (vN.N.N). The event must be on this allow-list:
          # any other event (issue_comment, workflow_run, an event added later) is
          # refused when the gate is on, because the ref alone does not say who
          # triggered it. A pull request is never trusted, whichever repository its
          # head is in. For a version tag the job also checks, when it can, that the
          # tagged commit is in the default branch's history (see the README).
          trusted=false
          # An inherited BASHOPTS must not make a comparison below case-insensitive.
          shopt -u nocasematch nocaseglob
          # The gate is parsed strictly: true or false in any casing, and anything else
          # stops the job. A typo must never switch the gate off.
          case "${TRUSTED_ONLY,,}" in
            true) TRUSTED_ONLY=true ;;
            false) TRUSTED_ONLY=false ;;
            *)
              echo "::error title=Doppler::trusted-refs-only must be true or false"
              exit 1 ;;
          esac
          case "$EVENT" in
            schedule) trusted=true ;;
            push|workflow_dispatch)
              if [ -n "$DEFAULT_BRANCH" ] && [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
                trusted=true
              elif [[ "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                trusted=true
                # Best effort: refuse a tag only on a clean "not an ancestor" answer from a
                # complete history. No checkout, a shallow clone, a missing remote ref or any
                # git error cannot show where the tag points, so the name rule stands and a
                # notice says the tag was not verified.
                if [ "$TRUSTED_ONLY" = "true" ]; then
                  verdict=unknown
                  if [ -n "$DEFAULT_BRANCH" ] && [ -n "${GITHUB_WORKSPACE:-}" ] && [ -n "${GITHUB_SHA:-}" ] \
                    && git -C "$GITHUB_WORKSPACE" rev-parse --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH^{commit}" >/dev/null 2>&1 \
                    && git -C "$GITHUB_WORKSPACE" rev-parse --verify --quiet "$GITHUB_SHA^{commit}" >/dev/null 2>&1 \
                    && [ "$(git -C "$GITHUB_WORKSPACE" rev-parse --is-shallow-repository 2>/dev/null)" = "false" ]; then
                    rc=0
                    git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT_BRANCH" >/dev/null 2>&1 || rc=$?
                    case "$rc" in
                      0) verdict=in ;;
                      1) verdict=out ;;
                    esac
                  fi
                  case "$verdict" in
                    out) trusted=false ;;
                    unknown) echo "::notice title=Doppler::tag $REF not verified against the default branch history (no checkout, incomplete history or git error); only its name was checked" ;;
                  esac
                fi
              fi ;;
            *) trusted=false ;;
          esac
          if [ "$IS_FORK" = "true" ]; then
            # A fork's pull request has no id-token and must never receive a
            # secret. Silent skip is correct here, whatever `required` says.
            skip="pull request from a fork"
          elif [ "$TRUSTED_ONLY" = "true" ] && [ "$trusted" != "true" ]; then
            skip="$EVENT on $REF is not a push or dispatch on the default branch or a version tag (vN.N.N, in the default branch history), or a schedule (trusted-refs-only)"
            # A tag this rule refused is reported, so a job that was asked for a
            # secret-backed feature can fail instead of skipping it quietly.
            case "$REF" in refs/tags/*) untrusted_tag=true ;; esac
          elif [ -n "$IDENTITY_ID" ]; then
            mode=oidc
          elif [ -n "$TOKEN" ]; then
            mode=token
          fi
          if [ -n "$skip" ]; then
            echo "::notice title=Doppler::$skip - no secrets are fetched"
          fi
          if [ "$mode" != "none" ] && { [ -z "$PROJECT" ] || [ -z "$CONFIG" ]; }; then
            echo "::error title=Doppler::project and config are required when authenticating"
            exit 1
          fi
          if [ "$mode" = "none" ] && [ -z "$skip" ]; then
            if [ "$REQUIRED" = "true" ]; then
              echo "::error title=Doppler::no identity-id and no DOPPLER_TOKEN; this job needs one (see README, 'Doppler setup')"
              exit 1
            fi
            echo "::notice title=Doppler::not configured (no identity-id, no DOPPLER_TOKEN) - continuing without CI secrets"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "untrusted-tag=$untrusted_tag" >> "$GITHUB_OUTPUT"
          echo "Doppler auth mode: $mode"

      - name: Fetch CI secrets from Doppler (OIDC)
        if: steps.doppler.outputs.mode == 'oidc'
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ inputs.doppler-identity-id }}
          doppler-project: ${{ inputs.doppler-project }}
          doppler-config: ${{ inputs.doppler-config }}
          inject-env-vars: true

      - name: Fetch CI secrets from Doppler (Service Token)
        if: steps.doppler.outputs.mode == 'token'
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: ${{ inputs.doppler-project }}
          doppler-config: ${{ inputs.doppler-config }}
          inject-env-vars: true
      # ---------------------------------------------------------------------

      - name: Decide whether this run may open a pull request
        id: mode
        env:
          CLIENT_ID: ${{ inputs.client-id }}
          KEY_SET: ${{ env.REPIN_APP_PRIVATE_KEY != '' }}
          DRY_RUN: ${{ inputs.dry-run }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          open=false
          reason=""
          if [ "$DRY_RUN" = "true" ]; then reason="dry-run is set"
          elif [ -z "$CLIENT_ID" ] || [ "$KEY_SET" != "true" ]; then reason="the GitHub App (client-id, and its private key from Doppler) is not configured"
          elif [ "$EVENT" != "schedule" ] && [ "$EVENT" != "workflow_dispatch" ]; then reason="a pull request is opened only from a schedule or a manual run, not from $EVENT"
          elif [ -z "$DEFAULT_BRANCH" ] || [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then reason="a pull request is opened only from the default branch"
          else open=true
          fi
          echo "open=$open" >> "$GITHUB_OUTPUT"
          if [ "$open" != "true" ]; then
            echo "::notice title=re-pin::report only: $reason"
          fi

      - name: Mint a one-hour installation token
        id: app
        if: steps.mode.outputs.open == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ env.REPIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write  # push the branch repin/gyst-<tag>
          permission-pull-requests: write  # open the pull request, and read whether one is already open
          permission-workflows: write  # the branch changes files under .github/workflows/, which needs this permission

      - name: Write the re-pin script (scripts/repin.sh, byte for byte)
        run: |
          cat > "$RUNNER_TEMP/repin.sh" <<'REPIN_SH'
          #!/usr/bin/env bash
          # repin.sh: move a repository's pins of this repository's reusable workflows to a release.
          #
          # A caller pins `uses: ChiefGyk3D/git-your-ship-together/<path>@<40 hex> # vX.Y.Z`. A release reaches a caller
          # only when the caller re-pins, and a re-pin is mechanical: the SHA of the release's commit and the version in
          # the comment, nothing else. This script does exactly that, for one or many repositories, and can open the pull
          # request. It never merges.
          #
          # Rules, each held by tests/test_repin.py:
          #
          #   * Pin-only. A pin line changes in two fields, the 40-hex SHA and the `# vX.Y.Z` comment. Before a file is
          #     written, the old and new text are compared with both fields blanked out; any other difference stops the
          #     run (exit 4) and writes nothing. Other repositories' actions, comments and every other byte are untouched.
          #   * All or nothing. A reference to this repository that is not a canonical pin (a branch, a tag, a SHA with no
          #     or an odd version comment) stops the run before anything is written (exit 3); so does a downgrade.
          #   * Inputs are not changed under a caller: if the new release drops or retypes an input the caller sets, or adds a
          #     required input it does not set, the run stops (exit 5) and lists them. --allow-input-changes overrides.
          #   * The release is read from the GitHub API only: the tag name must be vMAJOR.MINOR.PATCH and the commit a
          #     full 40-hex SHA, or the run stops. Nothing else is fetched, and no value from the API reaches a shell.
          #   * A symlinked workflow file is reported and skipped, never followed.
          #   * `pr` never merges and never enables auto-merge. `--watch` only waits (scripts/wait-ci.sh without --merge).
          #
          # Usage:
          #   repin.sh status DIR...                       pinned against latest, with ages, per repository
          #   repin.sh apply [--to TAG] [--dry-run] [--allow-input-changes] DIR    rewrite the pins in DIR (default: the latest release)
          #   repin.sh pr [--to TAG] [--base BRANCH] [--watch] [--allow-input-changes] DIR
          #                                                apply on a branch repin/gyst-<tag>, push, open a pull request
          #
          # Files read: DIR/.github/workflows/*.yml and *.yaml, DIR/.github/actions/*/action.yml and *.yaml.
          # Exit codes: 0 done or nothing to do (status: every pin is current); 10 status found a pin behind;
          #   3 refused (see the message); 5 an input the caller uses changed; 4 the pin-only check failed; 64 bad usage; 1 anything else (no release, gh error).
          # Environment: GH_BIN (the gh command, default gh; tests point it at a fake), REPIN_NOW (an ISO time standing
          #   in for now, tests only). GNU date and sed are required.
          set -euo pipefail
          export LC_ALL=C

          SRC=ChiefGyk3D/git-your-ship-together
          gh_bin="${GH_BIN:-gh}"
          here=$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)

          PIN_ERE='uses:[[:space:]]*ChiefGyk3D/git-your-ship-together/[A-Za-z0-9_./-]+@[0-9a-f]{40}[[:space:]]+#[[:space:]]*v[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$'
          REF_ERE='^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*ChiefGyk3D/git-your-ship-together/'
          TAG_ERE='^v[0-9]+\.[0-9]+\.[0-9]+$'
          SHA_ERE='^[0-9a-f]{40}$'

          # Every temporary file or directory is registered here and removed on any exit.
          TMPS=()
          trap 'rm -rf -- "${TMPS[@]}"' EXIT
          # mktmp NAME [mktemp args]: sets the variable NAME to a new temporary path (not in a subshell, so it registers).
          mktmp() { local p; p=$(mktemp "${@:2}") || exit 1; TMPS+=("$p"); printf -v "$1" '%s' "$p"; }

          die() { local rc=$1; shift; echo "repin: $*" >&2; exit "$rc"; }

          usage() { sed -n '/^# Usage:/,/^# Files read/p' "${BASH_SOURCE[0]}" | sed 's/^# \{0,1\}//' >&2; exit 64; }

          now_epoch() { date -u -d "${REPIN_NOW:-now}" +%s; }
          epoch() { date -u -d "$1" +%s; }
          days_old() { echo $(( ($(now_epoch) - $(epoch "$1")) / 86400 )); }

          declare -A TAG_SHA TAG_DATE

          # tag_info TAG: fills TAG_SHA and TAG_DATE from the API, after checking both.
          tag_info() {
            local tag=$1 line sha date
            [[ $tag =~ $TAG_ERE ]] || die 1 "refusing a release tag that is not vMAJOR.MINOR.PATCH: $(printf '%q' "$tag")"
            [ -n "${TAG_SHA[$tag]:-}" ] && return 0
            line=$("$gh_bin" api "repos/$SRC/commits/$tag" --jq '[.sha, .commit.committer.date] | @tsv') \
              || die 1 "no commit for $tag in $SRC"
            IFS=$'\t' read -r sha date <<<"$line"
            [[ $sha =~ $SHA_ERE ]] || die 1 "the API gave $tag a commit that is not 40 hex characters"
            [[ $date =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z$ ]] || die 1 "the API gave $tag a date that is not an ISO timestamp"
            TAG_SHA[$tag]=$sha
            TAG_DATE[$tag]=$date
          }

          latest_tag() {
            local tag
            tag=$("$gh_bin" api "repos/$SRC/releases/latest" --jq .tag_name) || die 1 "cannot read the latest release of $SRC"
            [[ $tag =~ $TAG_ERE ]] || die 1 "the latest release tag is not vMAJOR.MINOR.PATCH: $(printf '%q' "$tag")"
            printf '%s\n' "$tag"
          }

          # check_names DIR: refuse any workflow or action path (below DIR) outside [A-Za-z0-9._/-]. Run in the main shell
          # before anything else reads the files, because a file name is data and must never become part of a program.
          check_names() {
            local dir=$1 f rel
            for f in "$dir"/.github/workflows/* "$dir"/.github/actions/*/*; do
              [ -e "$f" ] || [ -L "$f" ] || continue
              rel=${f#"$dir"/}
              [[ $rel =~ ^[A-Za-z0-9._/-]+$ ]] || die 3 "refusing a workflow path with characters outside A-Za-z0-9._/-: $(printf '%q' "$rel")"
            done
          }

          # files_of DIR: the workflow and action files, one per line; a symlink is reported and left out.
          files_of() {
            local dir=$1 f
            for f in "$dir"/.github/workflows/*.yml "$dir"/.github/workflows/*.yaml "$dir"/.github/actions/*/action.yml "$dir"/.github/actions/*/action.yaml; do
              [ -e "$f" ] || [ -L "$f" ] || continue
              if [ -L "$f" ]; then
                echo "repin: skipping a symlink, never followed: $f" >&2
                continue
              fi
              [ -f "$f" ] && printf '%s\n' "$f"
            done
          }

          # non_canonical DIR: lines naming this repository that are not canonical pins, as `file:line: text`.
          non_canonical() {
            local f
            while IFS= read -r f; do
              { grep -nE "$REF_ERE" "$f" || true; } | { grep -vE "$PIN_ERE" || true; } | F="$f" awk '{ print ENVIRON["F"] ":" $0 }'
            done < <(files_of "$1")
          }

          # pins DIR: `file<TAB>line<TAB>sha<TAB>tag<TAB>path` for each canonical pin (path: what follows the repository name).
          pins() {
            local f
            while IFS= read -r f; do
              { grep -nE "^[[:space:]]*(-[[:space:]]+)?$PIN_ERE" "$f" || true; } \
                | sed -E 's|^([0-9]+):.*git-your-ship-together/([A-Za-z0-9_./-]+)@([0-9a-f]{40})[[:space:]]+#[[:space:]]*(v[0-9]+\.[0-9]+\.[0-9]+).*$|\1\t\3\t\4\t\2|' \
                | F="$f" awk -F'\t' '{ print ENVIRON["F"] "\t" $1 "\t" $2 "\t" $3 "\t" $4 }'
            done < <(files_of "$1")
          }

          # norm FILE: the file with each pin's SHA and version blanked, to prove a rewrite changed nothing else.
          norm() {
            sed -E 's#(uses:[[:space:]]*ChiefGyk3D/git-your-ship-together/[A-Za-z0-9_./-]+@)[0-9a-f]{40}([[:space:]]+\#[[:space:]]*)v[0-9]+\.[0-9]+\.[0-9]+#\1PIN\2VER#' "$1"
          }

          # tag_known TAG: success when the release exists (fills the caches); never exits.
          tag_known() { ( tag_info "$1" ) >/dev/null 2>&1 || return 1; tag_info "$1"; }

          # --- the input check ---------------------------------------------------------------------------------------------
          # A re-pin must not change what a caller passes. For each pin that moves, the called workflow (or composite action)
          # is read at the old and at the new commit, and the inputs it declares are compared with the `with:` keys the caller
          # sets. Refused (exit 5): a key the caller sets that the new release no longer declares or whose type changed, and a
          # new required input (no default) the caller does not set. Only noted, in the pull request: a default that changed
          # for an input the caller does not set. A definition that cannot be read or parsed is refused, never skipped.
          # The parser reads the layout this repository's workflows use (one scalar per line, or a block scalar), not all YAML.

          # inputs_of FILE: name, type, default and required of each declared input, separated by the control character
          # 0x1f (not a tab, because `read` merges a run of tabs and would lose an empty field).
          inputs_of() {
            awk '
              function ind(s) { match(s, /^ */); return RLENGTH }
              function flush() { if (cur != "") print cur "\037" ty "\037" df "\037" rq; cur = ""; ty = df = rq = "" }
              function clean(v) { sub(/^[ \t]+/, "", v); sub(/[ \t]+$/, "", v); if (v ~ /^".*"$/ || v ~ /^\047.*\047$/) v = substr(v, 2, length(v) - 2); return v }
              /^[ \t]*(#|$)/ { next }
              {
                i = ind($0)
                if (blk != "") {
                  if (i > bi) { acc = acc " " clean($0); next }
                  if (blk == "default") df = clean(acc)
                  blk = ""
                }
                if (mode == 2 && i <= ii) { flush(); mode = (i > wc ? 1 : 0); ni = -1; ci = -1 }
                if (mode == 1 && i <= wc) mode = 0
                if (mode == 0 && $0 ~ /^ *workflow_call:/) { wc = i; mode = 1; next }
                if (mode == 0 && $0 ~ /^inputs:/) { wc = -1; ii = 0; mode = 2; ni = -1; ci = -1; next }
                if (mode == 1 && $0 ~ /^ *inputs:/) { ii = i; mode = 2; ni = -1; ci = -1; next }
                if (mode != 2) next
                if (ni < 0) ni = i
                if (i == ni && match($0, /^ *[A-Za-z0-9_-]+:/)) {
                  flush()
                  cur = $0; sub(/^ */, "", cur); sub(/:.*$/, "", cur); ci = -1
                  next
                }
                if (i > ni) {
                  if (ci < 0) ci = i
                  if (i == ci && match($0, /^ *(type|default|required):/)) {
                    k = $0; sub(/^ */, "", k); sub(/:.*$/, "", k)
                    v = $0; sub(/^[^:]*:/, "", v); v = clean(v)
                    if (v ~ /^[|>][-+]?$/) { blk = k; bi = i; acc = ""; next }
                    if (k == "type") ty = v; else if (k == "default") df = v; else rq = v
                  }
                }
              }
              END { if (blk == "default") df = clean(acc); flush() }
            ' "$1"
          }

          # with_keys FILE LINE: the keys of the `with:` block that belongs to the `uses:` on LINE (same job or step).
          with_keys() {
            awk -v L="$2" '
              function ind(s) { match(s, /^ */); return RLENGTH }
              function skip(s) { return s ~ /^[ \t]*(#|$)/ }
              { lines[NR] = $0 }
              END {
                P = index(lines[L], "uses:") - 1
                a = L
                while (a > 1 && (skip(lines[a - 1]) || ind(lines[a - 1]) >= P)) a--
                b = L
                while (b < NR && (skip(lines[b + 1]) || ind(lines[b + 1]) >= P)) b++
                for (n = a; n <= b; n++) if (!skip(lines[n]) && ind(lines[n]) == P && lines[n] ~ /^ *with:[ \t]*$/) { w = n; break }
                if (!w) exit
                ci = -1
                for (n = w + 1; n <= b; n++) {
                  if (skip(lines[n])) continue
                  i = ind(lines[n])
                  if (i <= P) break
                  if (ci < 0) ci = i
                  if (i == ci && match(lines[n], /^ *[A-Za-z0-9_-]+:/)) { k = lines[n]; sub(/^ */, "", k); sub(/:.*$/, "", k); print k }
                }
              }
            ' "$1"
          }

          # fetch_def PATH SHA OUTFILE: the declaration file of a called workflow or action at a commit.
          fetch_def() {
            local p=$1 sha=$2 out=$3
            case $p in *.yml | *.yaml) ;; *) p="$p/action.yml" ;; esac
            case $p in *..* | /*) return 1 ;; esac
            "$gh_bin" api "repos/$SRC/contents/$p" -f ref="$sha" -H 'Accept: application/vnd.github.raw' >"$out" 2>/dev/null
          }

          # check_inputs DIR TAG ALLOW NOTES: exit 5 on a refused change unless ALLOW is 1; appends the findings to NOTES.
          check_inputs() {
            local dir=$1 tag=$2 allow=$3 notes=$4 newsha=${TAG_SHA[$2]} file line sha otag path
            local oldf newf key problems=0 name used
            declare -A odef ndef
            mktmp oldf
            mktmp newf
            while IFS=$'\t' read -r file line sha otag path; do
              [ "$sha" != "$newsha" ] || continue
              key="$path@$sha"
              if ! fetch_def "$path" "$sha" "$oldf" || ! fetch_def "$path" "$newsha" "$newf"; then
                echo "repin: cannot read $path at the old pin ($otag) or at $tag, so its inputs cannot be compared ($file:$line)" >&2
                problems=1
                continue
              fi
              odef=() ndef=() used=" "
              while IFS=$'\037' read -r name ty df rq; do odef[$name]="$ty|$df|$rq"; done < <(inputs_of "$oldf")
              while IFS=$'\037' read -r name ty df rq; do ndef[$name]="$ty|$df|$rq"; done < <(inputs_of "$newf")
              while IFS= read -r name; do
                [ -n "$name" ] || continue
                used="$used$name "
                if [ -z "${ndef[$name]:-}" ] && [ -z "${odef[$name]:-}" ]; then continue; fi
                if [ -z "${ndef[$name]:-}" ]; then
                  echo "repin: $file:$line $path: input $name is set by the caller but $tag no longer declares it" >&2
                  problems=1
                elif [ -n "${odef[$name]:-}" ] && [ "${odef[$name]%%|*}" != "${ndef[$name]%%|*}" ]; then
                  echo "repin: $file:$line $path: input $name changed type from '${odef[$name]%%|*}' to '${ndef[$name]%%|*}' in $tag" >&2
                  problems=1
                fi
              done < <(with_keys "$file" "$line")
              for name in "${!ndef[@]}"; do
                case $used in *" $name "*) continue ;; esac
                IFS='|' read -r nty ndf nrq <<<"${ndef[$name]}"
                IFS='|' read -r oty odf orq <<<"${odef[$name]:-||}"
                if [ "$nrq" = true ] && [ -z "$ndf" ] && { [ -z "${odef[$name]:-}" ] || [ "$orq" != true ]; }; then
                  echo "repin: $file:$line $path: $tag adds the required input $name, which the caller does not set" >&2
                  problems=1
                elif [ -n "${odef[$name]:-}" ] && [ "$odf" != "$ndf" ]; then
                  echo "- \`$path\`: the default of \`$name\` (not set by this caller) changed from \`$odf\` to \`$ndf\`" >>"$notes"
                fi
              done
            done < <(pins "$dir")
            if [ "$problems" = 1 ]; then
              if [ "$allow" = 1 ]; then
                echo "repin: input changes listed above were allowed with --allow-input-changes" >&2
                echo "- input changes were allowed by the operator (--allow-input-changes); read the run log" >>"$notes"
              else
                die 5 "the new release changes inputs this caller uses (listed above); nothing was written. Read the changelog, adjust the caller, or pass --allow-input-changes"
              fi
            fi
          }

          cmd_status() {
            [ $# -ge 1 ] || usage
            local dir latest behind=0 refused=0 list tag n sha note
            latest=$(latest_tag)
            tag_info "$latest"
            for dir in "$@"; do
              [ -d "$dir/.github" ] || die 64 "not a repository with a .github directory: $dir"
            check_names "$dir"
              if [ -n "$(non_canonical "$dir")" ]; then
                echo "$dir: references to $SRC that are not canonical pins:"
                non_canonical "$dir" | sed 's/^/  /'
                refused=1
              fi
              list=$(pins "$dir")
              if [ -z "$list" ]; then
                echo "$dir: no GYST pins"
                continue
              fi
              echo "$dir: latest $latest (${TAG_DATE[$latest]%%T*}, $(days_old "${TAG_DATE[$latest]}") days old)"
              while IFS= read -r tag; do
                n=$(printf '%s\n' "$list" | awk -F'\t' -v t="$tag" '$4 == t' | wc -l)
                sha=$(printf '%s\n' "$list" | awk -F'\t' -v t="$tag" '$4 == t { print $3; exit }')
                note=""
                if tag_known "$tag"; then
                  [ "${TAG_SHA[$tag]}" = "$sha" ] || note=" MISMATCH: the comment says $tag but that tag is ${TAG_SHA[$tag]:0:12} and the pin is ${sha:0:12}"
                  printf '  %s x%s (%s, %s days old)' "$tag" "$n" "${TAG_DATE[$tag]%%T*}" "$(days_old "${TAG_DATE[$tag]}")"
                else
                  printf '  %s x%s (no such release)' "$tag" "$n"
                  note=" MISMATCH: no release of that name"
                fi
                if [ "$tag" = "$latest" ]; then
                  [ -n "$note" ] && echo "$note" || echo " current"
                else
                  behind=1
                  echo " BEHIND$note"
                fi
              done < <(printf '%s\n' "$list" | awk -F'\t' '{ print $4 }' | sort -uV)
            done
            [ "$refused" = 0 ] || return 3
            [ "$behind" = 0 ] || return 10
          }

          # rewrite DIR TAG DRY LIST [ALLOW [NOTES]]: rewrite (or, when DRY is 1, only print the diff of) the pins of DIR to TAG. The
          # changed files are written to the file LIST, one per line.
          rewrite() {
            local dir=$1 tag=$2 dry=$3 list=$4 allow=${5:-0} notes=${6:-/dev/null} sha tmp f old n=0 i
            : >"$list"
            tag_info "$tag"
            sha=${TAG_SHA[$tag]}
            if [ -n "$(non_canonical "$dir")" ]; then
              echo "repin: these references to $SRC are not canonical pins (SHA plus # vX.Y.Z); fix them by hand first, nothing was written:" >&2
              non_canonical "$dir" | sed 's/^/  /' >&2
              exit 3
            fi
            while IFS=$'\t' read -r _ _ _ old _; do
              [ "$(printf '%s\n%s\n' "$old" "$tag" | sort -V | tail -1)" = "$tag" ] \
                || die 3 "refusing a downgrade: a pin says $old and the target is $tag (nothing was written)"
            done < <(pins "$dir")
            check_inputs "$dir" "$tag" "$allow" "$notes"
            mktmp tmp -d
            : >"$tmp/changed"
            while IFS= read -r f; do
              n=$((n + 1))
              sed -E "s#(uses:[[:space:]]*ChiefGyk3D/git-your-ship-together/[A-Za-z0-9_./-]+@)[0-9a-f]{40}([[:space:]]+\#[[:space:]]*)v[0-9]+\.[0-9]+\.[0-9]+#\1$sha\2$tag#" "$f" >"$tmp/$n.new"
              cmp -s "$f" "$tmp/$n.new" && continue
              cmp -s <(norm "$f") <(norm "$tmp/$n.new") || die 4 "the rewrite of $f changed more than the pin; nothing was written"
              printf '%s\t%s\n' "$n" "$f" >>"$tmp/changed"
            done < <(files_of "$dir")
            while IFS=$'\t' read -r i f; do
              if [ "$dry" = 1 ]; then
                diff -u "$f" "$tmp/$i.new" || true
              else
                cat "$tmp/$i.new" >"$f"
              fi
              printf '%s\n' "$f" >>"$list"
            done <"$tmp/changed"
          }

          cmd_apply() {
            local to="" dry=0 allow=0 dir="" changed list
            while [ $# -gt 0 ]; do
              case $1 in
                --to) [ $# -ge 2 ] || usage; to=$2; shift 2 ;;
                --dry-run) dry=1; shift ;;
                --allow-input-changes) allow=1; shift ;;
                -*) usage ;;
                *) [ -z "$dir" ] || usage; dir=$1; shift ;;
              esac
            done
            [ -n "$dir" ] || usage
            [ -d "$dir/.github" ] || die 64 "not a repository with a .github directory: $dir"
            check_names "$dir"
            [ -n "$to" ] || to=$(latest_tag)
            mktmp list
            rewrite "$dir" "$to" "$dry" "$list" "$allow"
            changed=$(cat "$list")
            if [ -z "$changed" ]; then
              echo "up to date: every pin in $dir is already $to"
            elif [ "$dry" = 1 ]; then
              echo "dry run: $(printf '%s\n' "$changed" | wc -l) file(s) would change to $to; nothing written"
            else
              echo "re-pinned to $to:"
              printf '%s\n' "$changed" | sed 's/^/  /'
            fi
          }

          cmd_pr() {
            local to="" base="" watch=0 allow=0 dir="" start branch open changed list notes body f count url
            local -a files=()
            while [ $# -gt 0 ]; do
              case $1 in
                --to) [ $# -ge 2 ] || usage; to=$2; shift 2 ;;
                --base) [ $# -ge 2 ] || usage; base=$2; shift 2 ;;
                --watch) watch=1; shift ;;
                --allow-input-changes) allow=1; shift ;;
                -*) usage ;;
                *) [ -z "$dir" ] || usage; dir=$1; shift ;;
              esac
            done
            [ -n "$dir" ] || usage
            [ -d "$dir/.github" ] || die 64 "not a repository with a .github directory: $dir"
            check_names "$dir"
            [ -n "$to" ] || to=$(latest_tag)
            tag_info "$to"
            branch="repin/gyst-$to"
            start=$(git -C "$dir" symbolic-ref --short HEAD) || die 3 "$dir is not on a branch"
            [ -n "$base" ] || base=$start
            [ -z "$(git -C "$dir" status --porcelain --untracked-files=no)" ] || die 3 "the working tree of $dir is not clean; commit or stash first"
            open=$(cd "$dir" && "$gh_bin" pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
            if [ -n "$open" ]; then
              echo "a pull request for $branch is already open (#$open); nothing to do"
              return 0
            fi
            mktmp list
            mktmp notes
            rewrite "$dir" "$to" 0 "$list" "$allow" "$notes"
            changed=$(cat "$list")
            if [ -z "$changed" ]; then
              echo "up to date: every pin in $dir is already $to"
              return 0
            fi
            while IFS= read -r f; do files+=("${f#"$dir"/}"); done <<<"$changed"
            count=$(git -C "$dir" diff --numstat -- "${files[@]}" | awk '{ n += $1 } END { print n + 0 }')
            mktmp body
            {
              echo "Pin-only re-pin of the reusable workflows from \`$SRC\` to \`$to\`."
              echo
              echo "It changes the pin SHA and the \`# vX.Y.Z\` comment on $count line(s) in ${#files[@]} file(s), and nothing else:"
              echo
              printf -- '- `%s`\n' "${files[@]}"
              echo
              echo "- Release: https://github.com/$SRC/releases/tag/$to"
              echo "- Changelog: https://github.com/$SRC/blob/$to/CHANGELOG.md"
              echo
              if [ -s "$notes" ]; then
                echo "Notes for the reviewer (not blockers):"
                echo
                cat "$notes"
                echo
              fi
              echo "Opened by \`scripts/repin.sh\`. It does not merge; read the changelog entries since the old pin, then merge once CI is green."
            } >"$body"
            git -C "$dir" switch -q -c "$branch"
            git -C "$dir" add -- "${files[@]}"
            git -C "$dir" commit -q -m "Re-pin git-your-ship-together to $to" -m "Pin-only: the commit SHA and the version comment of each reference, nothing else."
            git -C "$dir" push -q origin "$branch"
            url=$(cd "$dir" && "$gh_bin" pr create --base "$base" --head "$branch" --title "Re-pin git-your-ship-together to $to" --body-file "$body")
            echo "opened $url"
            git -C "$dir" switch -q "$start"
            if [ "$watch" = 1 ]; then
              bash "$here/wait-ci.sh" --repo "$(cd "$dir" && "$gh_bin" repo view --json nameWithOwner --jq .nameWithOwner)" \
                --pr "${url##*/}" --sha "$(git -C "$dir" rev-parse "$branch")"
            fi
          }

          [ $# -ge 1 ] || usage
          sub=$1
          shift
          case $sub in
            status) cmd_status "$@" ;;
            apply) cmd_apply "$@" ;;
            pr) cmd_pr "$@" ;;
            *) usage ;;
          esac
          REPIN_SH

      - name: Report where each pin stands
        if: steps.mode.outputs.open != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          rc=0
          bash "$RUNNER_TEMP/repin.sh" status "$GITHUB_WORKSPACE" | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          # 10: a pin is behind. That is the report, not a failure of the job.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 10 ]; then exit "$rc"; fi

      - name: Open the pin-only pull request
        if: steps.mode.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          GIT_ASKPASS_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The token reaches git through an askpass helper that reads it from the environment: never a URL,
          # a command line or the repository's config.
          printf '#!/bin/sh\necho "$GIT_ASKPASS_TOKEN"\n' > "$RUNNER_TEMP/askpass.sh"
          chmod 700 "$RUNNER_TEMP/askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass.sh" GIT_TERMINAL_PROMPT=0
          git -C "$GITHUB_WORKSPACE" remote set-url origin "$SERVER_URL/$REPOSITORY"
          export GIT_AUTHOR_NAME="$APP_SLUG[bot]" GIT_COMMITTER_NAME="$APP_SLUG[bot]"
          export GIT_AUTHOR_EMAIL="$APP_SLUG[bot]@users.noreply.github.com" GIT_COMMITTER_EMAIL="$APP_SLUG[bot]@users.noreply.github.com"
          bash "$RUNNER_TEMP/repin.sh" pr "$GITHUB_WORKSPACE" | tee -a "$GITHUB_STEP_SUMMARY"
