# Reusable consumer-side verification: prove, from outside, that a published
# image is what the producer says it is. container-release.yml signs, attests
# and records provenance; nothing there proves those verify the way an operator
# would run them. This workflow does exactly that, with no write access, no
# secret and no token beyond the read-only one GitHub gives every run.
#
#   1. cosign verify the image signature against an identity regexp and issuer.
#   2. cosign verify-attestation the SPDX SBOM (spdxjson) the same way.
#   3. gh attestation verify the SLSA build provenance for the image's owner.
#   4. For each platform: pull it, then run the caller's check against it.
#
# A GitHub release is verified the same way when `release-tag` is set (alone,
# or beside an image): every asset is downloaded, SHA256SUMS must list every
# file and match it, `gh attestation verify` must pass for every file for the
# owner, and, unless `verify-release-sbom` is false, `sbom.cdx.json` and
# `sbom.spdx.json` must be present, listed and the formats they claim to be.
# That is what python-package-release.yml publishes.
#
# With `rescan: true` it also asks the question verification cannot: has an
# advisory been published since this was released? Trivy (pinned by version and
# sha256) scans each platform of the image, and the release's `sbom.cdx.json`,
# against today's vulnerability database. Findings at or above `rescan-severity`
# fail the run, `rescan-exit-code` "0" only reports, and the SARIF is kept as a
# workflow artifact. It is off by default; a nightly `schedule:` in the caller
# is what makes it a rescan.
#
# Call it with:
#
#   on:
#     schedule:
#       - cron: "17 5 * * *"
#     workflow_dispatch:
#
#   jobs:
#     verify:
#       uses: ChiefGyk3D/git-your-ship-together/.github/workflows/verify-published.yml@<sha> # vX.Y.Z
#       permissions:
#         contents: read
#         packages: read
#       with:
#         image: ghcr.io/chiefgyk3d/star-daemon:latest
#         test-command: docker run --rm "$IMAGE" --version
#
# The identity regexp is matched against the signing certificate's subject.
# For an image published through container-release.yml that is the reusable
# workflow's own ref, so the default, any workflow in the owner's repositories,
# covers it; narrow it to pin one workflow and one tag pattern.

name: Verify published image (reusable)

on:
  workflow_call:
    inputs:
      image:
        description: Image reference to verify, for example `ghcr.io/chiefgyk3d/star-daemon:latest`. A digest reference is stronger than a tag. Empty skips the image checks; set this, `release-tag` or both.
        type: string
        default: ""
      release-tag:
        description: GitHub release tag whose assets are verified (checksums, build provenance and, by default, the SBOMs). Empty skips the release checks.
        type: string
        default: ""
      release-repository:
        description: owner/name holding the release; empty means the calling repository.
        type: string
        default: ""
      verify-release-sbom:
        description: Require `sbom.cdx.json` and `sbom.spdx.json` among the release assets, listed in SHA256SUMS and of the format they claim. Turn off for a release made by artifact-release.yml, which does not write them.
        type: boolean
        default: true
      identity-regexp:
        description: Regular expression the cosign certificate identity must match. Both cosign commands use it.
        type: string
        default: ^https://github.com/ChiefGyk3D/
      oidc-issuer:
        description: OIDC issuer the signing certificate must name.
        type: string
        default: https://token.actions.githubusercontent.com
      verify-sbom:
        description: Verify the SPDX SBOM attestation with `cosign verify-attestation --type spdxjson`.
        type: boolean
        default: true
      verify-provenance:
        description: Verify the SLSA build provenance with `gh attestation verify`, for the owner in the image reference.
        type: boolean
        default: true
      test-command:
        description: Shell run once per platform against the pulled image; `$IMAGE` is the verified digest reference (`repo@sha256:...`), never the tag, and `DOCKER_DEFAULT_PLATFORM` is set. Empty skips the check.
        type: string
        default: ""
      rescan:
        description: Rescan the verified image (every platform) and the release's `sbom.cdx.json` with Trivy for advisories published since release. Findings at or above `rescan-severity` fail the run unless `rescan-exit-code` is "0". Runs only when the verification itself passed. Off by default.
        type: boolean
        default: false
      rescan-severity:
        description: Severities the rescan reports and fails on, comma-separated.
        type: string
        default: CRITICAL,HIGH
      rescan-exit-code:
        description: Trivy exit code when the rescan finds something. "1" (the default, the same as `trivy-exit-code` in container-release.yml) fails the job; "0" reports only.
        type: string
        default: "1"
      rescan-ignore-unfixed:
        description: Skip advisories that have no fixed version yet, so a finding the maintainers cannot act on does not fail a nightly run.
        type: boolean
        default: true
      rescan-ignore-advisories:
        description: Comma-separated advisory IDs (CVE-..., GHSA-...) the rescan does not fail on. Each one needs an entry for the calling repository in the shared repository's baseline/risk-register.yaml with `trivy` in `where`; the weekly audit reads this input and fails on an ID that has none, or whose review date has passed.
        type: string
        default: ""
      rescan-artifact-name:
        description: Name of the workflow artifact that carries the rescan's SARIF and text reports. A caller that calls this workflow twice in one run gives each call its own name.
        type: string
        default: verify-published-rescan
      trivy-version:
        description: Trivy release to download (aquasecurity/trivy), without the `v`; the one Trivy pin in this workflow. Changing it means changing `trivy-sha256`. To bump - `gh release download v<new> -R aquasecurity/trivy -p 'trivy_<new>_Linux-64bit.tar.gz' -p 'trivy_<new>_checksums.txt'`, `sha256sum` the archive and compare the line in the checksums file.
        type: string
        default: 0.75.0
      trivy-sha256:
        description: sha256 of `trivy_<trivy-version>_Linux-64bit.tar.gz`. The download is refused when it does not match.
        type: string
        default: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
      platforms:
        description: Comma-separated platforms to pull and test. A platform that differs from the runner's runs under QEMU.
        type: string
        default: linux/amd64,linux/arm64
      egress-policy:
        description: harden-runner egress policy - `audit` logs outbound connections, `block` allows only `allowed-endpoints`. Jobs that hold no secret follow `egress-policy-secretless` instead (EX-0001).
        type: string
        default: block
      egress-policy-secretless:
        description: harden-runner egress policy for the jobs that hold no stored secret, no OIDC token and no write-scoped or publish-capable token (read-only contents, a SARIF upload at most), and whose output no privileged job consumes - exactly `audit` or `block`. Defaults to `audit` while security exception EX-0001 is active (GitHub-hosted runners in westus2 break harden-runner `block`; expires 2026-11-07 or when step-security/harden-runner#708 is fixed; see docs/security/exceptions/). Every job still has the default read-only job token. Set `block` to opt back in. Any other job follows `egress-policy`. Any other value fails the job.
        type: string
        default: audit
      allowed-endpoints:
        description: harden-runner allow-list for `block`, space-separated host:port entries. Wildcards are not supported and a newline-separated list matches nothing.
        type: string
        default: "api.github.com:443 auth.docker.io:443 fulcio.sigstore.dev:443 ghcr.io:443 github.com:443 index.docker.io:443 mirror.gcr.io:443 pkg-containers.githubusercontent.com:443 production.cloudfront.docker.com:443 raw.githubusercontent.com:443 registry-1.docker.io:443 rekor.sigstore.dev:443 release-assets.githubusercontent.com:443 timestamp.sigstore.dev:443 tmaproduction.blob.core.windows.net:443 tuf-repo-cdn.sigstore.dev:443"
      extra-allowed-endpoints:
        description: Appended to `allowed-endpoints`, for hosts only this image or test command reaches. Same format.
        type: string
        default: ""
      timeout-minutes:
        description: Job timeout. Pulling and running an emulated platform is slow.
        type: number
        default: 20

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ inputs.image }}
    if: inputs.image != ''
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      packages: read  # pull the image, its signature and its attestations
    outputs:
      # The immutable reference every check below ran against, and the rescan scans.
      ref: ${{ steps.digest.outputs.ref }}
    steps:
      - name: Validate the egress policy inputs (EX-0001)
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ inputs.egress-policy == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ (inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block' }}

      - name: Egress canary (EX-0001)
        if: ${{ runner.os == 'Linux' && ((inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block') }}
        timeout-minutes: 2
        shell: bash
        # The workspace root exists before checkout; a job default working-directory may not.
        working-directory: ${{ github.workspace }}
        run: |
          set -u
          NAMES="github.com api.github.com results-receiver.actions.githubusercontent.com"
          PORT=443
          canary_resolve() { timeout 5 getent ahostsv4 "$1" 2>/dev/null | awk '$2 == "STREAM" { print $1 }'; }
          canary_probe() { timeout 3 bash -c "exec 3<>\"/dev/tcp/\$0/\$1\"" "$1" "$PORT" 2>/dev/null; }
          canary_reach() {
            local i
            for i in 1 2 3 4; do
              canary_probe "$1" && return 0
              [ "$i" -lt 4 ] && sleep 1
            done
            return 1
          }
          canary_show() { local n=$1; shift; echo "+ $*"; { timeout 10 "$@" 2>&1 || true; } | head -n "$n" || true; }
          canary_diag() {
            local name
            echo "::group::egress canary diagnostics (EX-0001, for the GitHub Support ticket)"
            canary_show 5 uname -srmo
            canary_show 20 cat /etc/resolv.conf
            canary_show 20 bash -c "resolvectl status 2>/dev/null | grep -E '^ *(Current DNS Server|DNS Servers?|DNS Domain):'"
            canary_show 20 bash -c "ss -lun | grep ':53 '"
            for name in $NAMES pipelines.actions.githubusercontent.com; do
              canary_show 20 getent ahostsv4 "$name"
              canary_show 5 curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_connect}\n' --max-time 8 "https://$name"
            done
            echo "::endgroup::"
          }
          canary_main() {
            local tmp name addr n=0 bad
            tmp=$(mktemp -d) || return 1
            for _ in 1 2 3; do
              for name in $NAMES; do canary_resolve "$name" >>"$tmp/res.$name" & done
              wait
              sleep 1
            done
            for name in $NAMES; do
              if [ -s "$tmp/res.$name" ]; then sort -u "$tmp/res.$name"; else echo "-"; fi | sed "s|^|$name |" >>"$tmp/pairs"
            done
            while read -r name addr; do
              n=$((n + 1))
              ( { [ "$addr" != "-" ] && canary_reach "$addr"; } || echo "$name $addr" >"$tmp/bad.$n" ) </dev/null &
            done <"$tmp/pairs"
            wait
            bad=$(cat "$tmp"/bad.* 2>/dev/null | sort || true)
            rm -rf "$tmp"
            if [ -z "$bad" ]; then
              echo "egress canary: all $n addresses of $NAMES accept TCP $PORT"
              return 0
            fi
            echo "::error title=egress canary::egress broken on this runner (known westus2 DNS issue, EX-0001): rerun the job"
            echo "unreachable addresses (name address; '-' means the name did not resolve):"
            printf '%s\n' "$bad"
            canary_diag
            echo "EX-0001 egress canary failed, unreachable: $(printf '%s' "$bad" | tr '\n' ';')" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            return 1
          }
          set -m
          canary_main &
          main=$!
          (sleep 90; kill -TERM -- "-$main"; sleep 2; kill -KILL -- "-$main") >/dev/null 2>&1 &
          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
            kill -TERM -- "-$main" >/dev/null 2>&1 || true
            sleep 1
            kill -KILL -- "-$main" >/dev/null 2>&1 || true
          fi
          if [ "$rc" -eq 143 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=egress canary::the canary hit its 90 s deadline (EX-0001): rerun the job"
            rc=124
          fi
          exit "$rc"

      # Everything below verifies, and the rescan scans, the bytes this digest
      # names. A tag can move between jobs; a digest cannot.
      - name: Resolve the image digest
        id: digest
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::could not resolve a digest for $IMAGE"; exit 1; }
          repo="${IMAGE%%@*}"
          [[ "${repo##*/}" == *:* ]] && repo="${repo%:*}"
          echo "ref=${repo}@${digest}" >> "$GITHUB_OUTPUT"
          echo "verifying $IMAGE as ${repo}@${digest}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify the signature
        env:
          IMAGE: ${{ steps.digest.outputs.ref }}
          IDENTITY_REGEXP: ${{ inputs.identity-regexp }}
          OIDC_ISSUER: ${{ inputs.oidc-issuer }}
        run: |
          set -euo pipefail
          cosign verify "$IMAGE" \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$OIDC_ISSUER" > /dev/null
          echo "signature verified: $IMAGE"

      - name: Verify the SBOM attestation
        if: inputs.verify-sbom
        env:
          IMAGE: ${{ steps.digest.outputs.ref }}
          IDENTITY_REGEXP: ${{ inputs.identity-regexp }}
          OIDC_ISSUER: ${{ inputs.oidc-issuer }}
        run: |
          set -euo pipefail
          cosign verify-attestation --type spdxjson "$IMAGE" \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$OIDC_ISSUER" > /dev/null
          echo "SPDX SBOM attestation verified: $IMAGE"

      - name: Verify the build provenance
        if: inputs.verify-provenance
        env:
          IMAGE: ${{ steps.digest.outputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # ghcr.io/<owner>/<name>[:tag|@digest] -> <owner>
          path="${IMAGE#*/}"
          owner="${path%%/*}"
          gh attestation verify "oci://$IMAGE" --owner "$owner"

      - name: Work out whether a platform needs emulation
        id: emulation
        env:
          PLATFORMS: ${{ inputs.platforms }}
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) native=linux/amd64 ;;
            aarch64) native=linux/arm64 ;;
            *) native="linux/$(uname -m)" ;;
          esac
          needed=false
          if [ -n "$TEST_COMMAND" ]; then
            IFS=',' read -r -a list <<< "$PLATFORMS"
            for platform in "${list[@]}"; do
              platform="${platform// /}"
              if [ -n "$platform" ] && [ "$platform" != "$native" ]; then
                needed=true
              fi
            done
          fi
          echo "qemu=$needed" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.emulation.outputs.qemu == 'true'

      - name: Pull and check each platform
        if: inputs.test-command != ''
        env:
          IMAGE: ${{ steps.digest.outputs.ref }}
          PLATFORMS: ${{ inputs.platforms }}
          COMMAND: ${{ inputs.test-command }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a list <<< "$PLATFORMS"
          for platform in "${list[@]}"; do
            platform="${platform// /}"
            [ -n "$platform" ] || continue
            echo "::group::$platform"
            # One digest names one image in the local store: a second platform
            # cannot be pulled under it ("cannot overwrite digest") until the
            # first is removed. Its test has already run.
            docker image rm --force "$IMAGE" > /dev/null 2>&1 || true
            docker pull --platform "$platform" "$IMAGE"
            DOCKER_DEFAULT_PLATFORM="$platform" bash -eo pipefail -c "$COMMAND"
            echo "::endgroup::"
          done

  verify-release:
    name: Verify release ${{ inputs.release-tag }}
    if: inputs.release-tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read  # list and download the release's assets
    outputs:
      sbom-sha256: ${{ steps.sbom-hash.outputs.sha256 }}
    steps:
      - name: Validate the egress policy inputs (EX-0001)
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ inputs.egress-policy == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ (inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block' }}

      - name: Egress canary (EX-0001)
        if: ${{ runner.os == 'Linux' && ((inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block') }}
        timeout-minutes: 2
        shell: bash
        # The workspace root exists before checkout; a job default working-directory may not.
        working-directory: ${{ github.workspace }}
        run: |
          set -u
          NAMES="github.com api.github.com results-receiver.actions.githubusercontent.com"
          PORT=443
          canary_resolve() { timeout 5 getent ahostsv4 "$1" 2>/dev/null | awk '$2 == "STREAM" { print $1 }'; }
          canary_probe() { timeout 3 bash -c "exec 3<>\"/dev/tcp/\$0/\$1\"" "$1" "$PORT" 2>/dev/null; }
          canary_reach() {
            local i
            for i in 1 2 3 4; do
              canary_probe "$1" && return 0
              [ "$i" -lt 4 ] && sleep 1
            done
            return 1
          }
          canary_show() { local n=$1; shift; echo "+ $*"; { timeout 10 "$@" 2>&1 || true; } | head -n "$n" || true; }
          canary_diag() {
            local name
            echo "::group::egress canary diagnostics (EX-0001, for the GitHub Support ticket)"
            canary_show 5 uname -srmo
            canary_show 20 cat /etc/resolv.conf
            canary_show 20 bash -c "resolvectl status 2>/dev/null | grep -E '^ *(Current DNS Server|DNS Servers?|DNS Domain):'"
            canary_show 20 bash -c "ss -lun | grep ':53 '"
            for name in $NAMES pipelines.actions.githubusercontent.com; do
              canary_show 20 getent ahostsv4 "$name"
              canary_show 5 curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_connect}\n' --max-time 8 "https://$name"
            done
            echo "::endgroup::"
          }
          canary_main() {
            local tmp name addr n=0 bad
            tmp=$(mktemp -d) || return 1
            for _ in 1 2 3; do
              for name in $NAMES; do canary_resolve "$name" >>"$tmp/res.$name" & done
              wait
              sleep 1
            done
            for name in $NAMES; do
              if [ -s "$tmp/res.$name" ]; then sort -u "$tmp/res.$name"; else echo "-"; fi | sed "s|^|$name |" >>"$tmp/pairs"
            done
            while read -r name addr; do
              n=$((n + 1))
              ( { [ "$addr" != "-" ] && canary_reach "$addr"; } || echo "$name $addr" >"$tmp/bad.$n" ) </dev/null &
            done <"$tmp/pairs"
            wait
            bad=$(cat "$tmp"/bad.* 2>/dev/null | sort || true)
            rm -rf "$tmp"
            if [ -z "$bad" ]; then
              echo "egress canary: all $n addresses of $NAMES accept TCP $PORT"
              return 0
            fi
            echo "::error title=egress canary::egress broken on this runner (known westus2 DNS issue, EX-0001): rerun the job"
            echo "unreachable addresses (name address; '-' means the name did not resolve):"
            printf '%s\n' "$bad"
            canary_diag
            echo "EX-0001 egress canary failed, unreachable: $(printf '%s' "$bad" | tr '\n' ';')" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            return 1
          }
          set -m
          canary_main &
          main=$!
          (sleep 90; kill -TERM -- "-$main"; sleep 2; kill -KILL -- "-$main") >/dev/null 2>&1 &
          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
            kill -TERM -- "-$main" >/dev/null 2>&1 || true
            sleep 1
            kill -KILL -- "-$main" >/dev/null 2>&1 || true
          fi
          if [ "$rc" -eq 143 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=egress canary::the canary hit its 90 s deadline (EX-0001): rerun the job"
            rc=124
          fi
          exit "$rc"

      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag }}
          REPO: ${{ inputs.release-repository || github.repository }}
        run: |
          set -euo pipefail
          mkdir release
          gh release download "$TAG" --repo "$REPO" --dir release
          ls -l release

      # Every file must be listed, and every listed file must match: a file
      # added to the release after SHA256SUMS was written is as wrong as one
      # that changed.
      - name: Verify the checksums
        run: |
          set -euo pipefail
          cd release
          test -s SHA256SUMS || { echo "::error::the release has no SHA256SUMS"; exit 1; }
          sha256sum -c SHA256SUMS
          listed="$(awk '{print $2}' SHA256SUMS | sed 's#^\./##' | sort)"
          present="$(find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name '*.sigstore.json' -printf '%f\n' | sort)"
          if [ "$listed" != "$present" ]; then
            echo "::error::SHA256SUMS and the release assets disagree"
            diff <(echo "$listed") <(echo "$present") || true
            exit 1
          fi
          echo "checksums verified: $(wc -l < SHA256SUMS) file(s)"

      - name: Verify the build provenance of every asset
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.release-repository || github.repository }}
        run: |
          set -euo pipefail
          owner="${REPO%%/*}"
          cd release
          for f in *; do
            case "$f" in *.sigstore.json) continue ;; esac
            echo "::group::$f"
            gh attestation verify "$f" --owner "$owner"
            echo "::endgroup::"
          done

      - name: Verify the SBOMs
        if: inputs.verify-release-sbom
        run: |
          set -euo pipefail
          cd release
          for f in sbom.cdx.json sbom.spdx.json; do
            test -f "$f" || { echo "::error::the release has no $f"; exit 1; }
            grep -q "[ /]$f\$" SHA256SUMS || { echo "::error::SHA256SUMS does not list $f"; exit 1; }
          done
          python3 - <<'PY'
          import json
          cdx = json.load(open("sbom.cdx.json"))
          spdx = json.load(open("sbom.spdx.json"))
          assert cdx.get("bomFormat") == "CycloneDX", "sbom.cdx.json is not CycloneDX"
          assert cdx.get("components"), "sbom.cdx.json lists no components"
          assert str(spdx.get("spdxVersion", "")).startswith("SPDX-"), "sbom.spdx.json is not SPDX"
          assert spdx.get("packages"), "sbom.spdx.json lists no packages"
          print("SBOMs verified:", cdx["specVersion"], spdx["spdxVersion"])
          PY

      # The rescan scans this file, not a second download of the release: the
      # bytes checked above are the bytes scanned. The hash is recorded so the
      # rescan can prove the artifact it receives is the file that was verified.
      - name: Keep the verified SBOM for the rescan
        id: sbom-hash
        if: inputs.rescan
        run: |
          set -euo pipefail
          if [ -f release/sbom.cdx.json ]; then
            echo "sha256=$(sha256sum release/sbom.cdx.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.rescan
        with:
          name: ${{ inputs.rescan-artifact-name }}-verified-sbom
          path: release/sbom.cdx.json
          if-no-files-found: ignore
          retention-days: 1

  # Verification says the artefact is what the producer published; it says
  # nothing about what has been found in it since. This job asks that, with a
  # pinned Trivy binary and no action, against the vulnerability database as of
  # now. It holds a read token and writes nothing to the repository; the SARIF
  # leaves as a workflow artifact, because a job that uploads to the Security
  # tab needs `security-events: write`, and a called workflow that asks for a
  # permission its caller did not grant fails at startup for every caller,
  # opted in or not.
  rescan:
    name: Rescan for new advisories
    needs: [verify, verify-release]
    # Only artefacts that verified are worth rescanning. A skipped half is a
    # half the caller did not ask for.
    if: >-
      always() && inputs.rescan &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read  # download the release's SBOM
    steps:
      - name: Validate the egress policy inputs (EX-0001)
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ (inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          disable-sudo: true
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ ((inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block') == 'block' }}

      - name: Egress canary (EX-0001)
        if: ${{ runner.os == 'Linux' && (((inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block') == 'block') }}
        timeout-minutes: 2
        shell: bash
        # The workspace root exists before checkout; a job default working-directory may not.
        working-directory: ${{ github.workspace }}
        run: |
          set -u
          NAMES="github.com api.github.com results-receiver.actions.githubusercontent.com"
          PORT=443
          canary_resolve() { timeout 5 getent ahostsv4 "$1" 2>/dev/null | awk '$2 == "STREAM" { print $1 }'; }
          canary_probe() { timeout 3 bash -c "exec 3<>\"/dev/tcp/\$0/\$1\"" "$1" "$PORT" 2>/dev/null; }
          canary_reach() {
            local i
            for i in 1 2 3 4; do
              canary_probe "$1" && return 0
              [ "$i" -lt 4 ] && sleep 1
            done
            return 1
          }
          canary_show() { local n=$1; shift; echo "+ $*"; { timeout 10 "$@" 2>&1 || true; } | head -n "$n" || true; }
          canary_diag() {
            local name
            echo "::group::egress canary diagnostics (EX-0001, for the GitHub Support ticket)"
            canary_show 5 uname -srmo
            canary_show 20 cat /etc/resolv.conf
            canary_show 20 bash -c "resolvectl status 2>/dev/null | grep -E '^ *(Current DNS Server|DNS Servers?|DNS Domain):'"
            canary_show 20 bash -c "ss -lun | grep ':53 '"
            for name in $NAMES pipelines.actions.githubusercontent.com; do
              canary_show 20 getent ahostsv4 "$name"
              canary_show 5 curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_connect}\n' --max-time 8 "https://$name"
            done
            echo "::endgroup::"
          }
          canary_main() {
            local tmp name addr n=0 bad
            tmp=$(mktemp -d) || return 1
            for _ in 1 2 3; do
              for name in $NAMES; do canary_resolve "$name" >>"$tmp/res.$name" & done
              wait
              sleep 1
            done
            for name in $NAMES; do
              if [ -s "$tmp/res.$name" ]; then sort -u "$tmp/res.$name"; else echo "-"; fi | sed "s|^|$name |" >>"$tmp/pairs"
            done
            while read -r name addr; do
              n=$((n + 1))
              ( { [ "$addr" != "-" ] && canary_reach "$addr"; } || echo "$name $addr" >"$tmp/bad.$n" ) </dev/null &
            done <"$tmp/pairs"
            wait
            bad=$(cat "$tmp"/bad.* 2>/dev/null | sort || true)
            rm -rf "$tmp"
            if [ -z "$bad" ]; then
              echo "egress canary: all $n addresses of $NAMES accept TCP $PORT"
              return 0
            fi
            echo "::error title=egress canary::egress broken on this runner (known westus2 DNS issue, EX-0001): rerun the job"
            echo "unreachable addresses (name address; '-' means the name did not resolve):"
            printf '%s\n' "$bad"
            canary_diag
            echo "EX-0001 egress canary failed, unreachable: $(printf '%s' "$bad" | tr '\n' ';')" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            return 1
          }
          set -m
          canary_main &
          main=$!
          (sleep 90; kill -TERM -- "-$main"; sleep 2; kill -KILL -- "-$main") >/dev/null 2>&1 &
          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
            kill -TERM -- "-$main" >/dev/null 2>&1 || true
            sleep 1
            kill -KILL -- "-$main" >/dev/null 2>&1 || true
          fi
          if [ "$rc" -eq 143 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=egress canary::the canary hit its 90 s deadline (EX-0001): rerun the job"
            rc=124
          fi
          exit "$rc"

      # The binary is pinned by hash; no action and no new egress host is
      # involved (github.com redirects to release-assets.githubusercontent.com,
      # and the vulnerability database comes from mirror.gcr.io or ghcr.io,
      # all already on the list).
      - name: Install Trivy
        env:
          TRIVY_VERSION: ${{ inputs.trivy-version }}
          TRIVY_SHA256: ${{ inputs.trivy-sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum -c -
          mkdir "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/trivy-bin" trivy
          "$RUNNER_TEMP/trivy-bin/trivy" --version

      # The SBOM verify-release checked, carried between jobs; the rescan never
      # downloads the release again.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.release-tag != ''
        with:
          name: ${{ inputs.rescan-artifact-name }}-verified-sbom
          path: ${{ runner.temp }}/verified-sbom

      # The accepted advisories become a .trivyignore. An ID that is not
      # shaped like an advisory is refused rather than written, so the input
      # cannot add a line of anything else to the file.
      - name: Write the ignore file from the accepted advisories
        env:
          ADVISORIES: ${{ inputs.rescan-ignore-advisories }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/rescan.trivyignore"
          IFS=',' read -r -a list <<< "$ADVISORIES"
          for id in "${list[@]}"; do
            id="${id// /}"
            [ -n "$id" ] || continue
            if ! [[ "$id" =~ ^(CVE-[0-9]{4}-[0-9]{4,}|GHSA-[0-9a-z]{4}-[0-9a-z]{4}-[0-9a-z]{4})$ ]]; then
              echo "::error::rescan-ignore-advisories: '$id' is not a CVE or GHSA ID"
              exit 1
            fi
            echo "$id" >> "$RUNNER_TEMP/rescan.trivyignore"
          done
          echo "ignoring $(wc -l < "$RUNNER_TEMP/rescan.trivyignore") accepted advisory ID(s)"

      # One JSON report per target, converted to SARIF and to a table for the
      # log, so a failing run names what it found. Trivy's own exit code is
      # kept: a scan that errors fails as surely as one that finds something.
      # Both halves run before the step fails, so one finding hides nothing.
      - name: Rescan with Trivy
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
          TRIVY_DISABLE_TELEMETRY: "true"
          # What verify resolved and checked; never the tag the caller typed.
          IMAGE: ${{ needs.verify.outputs.ref }}
          IMAGE_REQUESTED: ${{ inputs.image }}
          PLATFORMS: ${{ inputs.platforms }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          SBOM_DIR: ${{ runner.temp }}/verified-sbom
          SBOM_SHA256: ${{ needs.verify-release.outputs.sbom-sha256 }}
          SEVERITY: ${{ inputs.rescan-severity }}
          EXIT_CODE: ${{ inputs.rescan-exit-code }}
          IGNORE_UNFIXED: ${{ inputs.rescan-ignore-unfixed }}
        run: |
          # No -e: a scan that finds something exits non-zero and the other half must still run.
          set -u +e
          set -o pipefail
          trivy="$RUNNER_TEMP/trivy-bin/trivy"
          ignorefile="$RUNNER_TEMP/rescan.trivyignore"
          out="$RUNNER_TEMP/rescan"
          mkdir -p "$out"
          common=(--quiet --skip-version-check --scanners vuln --severity "$SEVERITY" --ignorefile "$ignorefile")
          if [ "$IGNORE_UNFIXED" = "true" ]; then common+=(--ignore-unfixed); fi
          status=0

          # scan <name> <trivy subcommand and its target and extra flags...>
          scan() {
            local name="$1"; shift
            echo "::group::rescan $name"
            "$trivy" "$1" "${common[@]}" --format json --output "$out/$name.json" --exit-code "$EXIT_CODE" "${@:2}"
            local rc=$?
            if [ -s "$out/$name.json" ]; then
              "$trivy" convert --quiet --severity "$SEVERITY" --ignorefile "$ignorefile" \
                --format sarif --output "$out/$name.sarif" "$out/$name.json" || rc=1
              "$trivy" convert --quiet --severity "$SEVERITY" --ignorefile "$ignorefile" \
                --format table --output "$out/$name.txt" "$out/$name.json" || rc=1
              cat "$out/$name.txt"
            fi
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error title=rescan::$name: Trivy exited $rc (findings at $SEVERITY, or an error)"
              status=1
            fi
          }

          if [ -n "$IMAGE_REQUESTED" ]; then
            scanned=0
            if ! [[ "$IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]; then
              echo "::error title=rescan::the verify job passed no image digest, so there is nothing verified to scan"
              status=1
            else
              IFS=',' read -r -a list <<< "$PLATFORMS"
              for platform in "${list[@]}"; do
                platform="${platform// /}"
                [ -n "$platform" ] || continue
                scanned=$((scanned + 1))
                scan "image-${platform//\//-}" image --image-src remote --platform "$platform" -- "$IMAGE"
              done
              if [ "$scanned" -eq 0 ]; then
                echo "::error title=rescan::platforms names no platform, so no image scan ran; set at least one, for example linux/amd64"
                status=1
              fi
            fi
          fi

          if [ -n "$RELEASE_TAG" ]; then
            sbom="$SBOM_DIR/sbom.cdx.json"
            if [ ! -s "$sbom" ]; then
              echo "::error title=rescan::the verified release SBOM is missing; the release has no sbom.cdx.json to rescan"
              status=1
            elif [ -z "$SBOM_SHA256" ] || [ "$(sha256sum "$sbom" | awk '{print $1}')" != "$SBOM_SHA256" ]; then
              echo "::error title=rescan::the SBOM received is not the file the verify job checked (sha256 mismatch)"
              status=1
            else
              scan release sbom -- "$sbom"
            fi
          fi
          exit "$status"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ inputs.rescan-artifact-name }}
          path: |
            ${{ runner.temp }}/rescan/*.sarif
            ${{ runner.temp }}/rescan/*.txt
          if-no-files-found: ignore
          retention-days: 14

  verified:
    name: Verified
    if: always()
    needs: [verify, verify-release, rescan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Validate the egress policy inputs (EX-0001)
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ (inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          disable-telemetry: ${{ ((inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block') == 'block' }}

      - name: Egress canary (EX-0001)
        if: ${{ runner.os == 'Linux' && (((inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block') == 'block') }}
        timeout-minutes: 2
        shell: bash
        # The workspace root exists before checkout; a job default working-directory may not.
        working-directory: ${{ github.workspace }}
        run: |
          set -u
          NAMES="github.com api.github.com results-receiver.actions.githubusercontent.com"
          PORT=443
          canary_resolve() { timeout 5 getent ahostsv4 "$1" 2>/dev/null | awk '$2 == "STREAM" { print $1 }'; }
          canary_probe() { timeout 3 bash -c "exec 3<>\"/dev/tcp/\$0/\$1\"" "$1" "$PORT" 2>/dev/null; }
          canary_reach() {
            local i
            for i in 1 2 3 4; do
              canary_probe "$1" && return 0
              [ "$i" -lt 4 ] && sleep 1
            done
            return 1
          }
          canary_show() { local n=$1; shift; echo "+ $*"; { timeout 10 "$@" 2>&1 || true; } | head -n "$n" || true; }
          canary_diag() {
            local name
            echo "::group::egress canary diagnostics (EX-0001, for the GitHub Support ticket)"
            canary_show 5 uname -srmo
            canary_show 20 cat /etc/resolv.conf
            canary_show 20 bash -c "resolvectl status 2>/dev/null | grep -E '^ *(Current DNS Server|DNS Servers?|DNS Domain):'"
            canary_show 20 bash -c "ss -lun | grep ':53 '"
            for name in $NAMES pipelines.actions.githubusercontent.com; do
              canary_show 20 getent ahostsv4 "$name"
              canary_show 5 curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_connect}\n' --max-time 8 "https://$name"
            done
            echo "::endgroup::"
          }
          canary_main() {
            local tmp name addr n=0 bad
            tmp=$(mktemp -d) || return 1
            for _ in 1 2 3; do
              for name in $NAMES; do canary_resolve "$name" >>"$tmp/res.$name" & done
              wait
              sleep 1
            done
            for name in $NAMES; do
              if [ -s "$tmp/res.$name" ]; then sort -u "$tmp/res.$name"; else echo "-"; fi | sed "s|^|$name |" >>"$tmp/pairs"
            done
            while read -r name addr; do
              n=$((n + 1))
              ( { [ "$addr" != "-" ] && canary_reach "$addr"; } || echo "$name $addr" >"$tmp/bad.$n" ) </dev/null &
            done <"$tmp/pairs"
            wait
            bad=$(cat "$tmp"/bad.* 2>/dev/null | sort || true)
            rm -rf "$tmp"
            if [ -z "$bad" ]; then
              echo "egress canary: all $n addresses of $NAMES accept TCP $PORT"
              return 0
            fi
            echo "::error title=egress canary::egress broken on this runner (known westus2 DNS issue, EX-0001): rerun the job"
            echo "unreachable addresses (name address; '-' means the name did not resolve):"
            printf '%s\n' "$bad"
            canary_diag
            echo "EX-0001 egress canary failed, unreachable: $(printf '%s' "$bad" | tr '\n' ';')" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            return 1
          }
          set -m
          canary_main &
          main=$!
          (sleep 90; kill -TERM -- "-$main"; sleep 2; kill -KILL -- "-$main") >/dev/null 2>&1 &
          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
            kill -TERM -- "-$main" >/dev/null 2>&1 || true
            sleep 1
            kill -KILL -- "-$main" >/dev/null 2>&1 || true
          fi
          if [ "$rc" -eq 143 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=egress canary::the canary hit its 90 s deadline (EX-0001): rerun the job"
            rc=124
          fi
          exit "$rc"
      - name: Verification passed
        env:
          IMAGE_RESULT: ${{ needs.verify.result }}
          RELEASE_RESULT: ${{ needs.verify-release.result }}
          RESCAN_RESULT: ${{ needs.rescan.result }}
        run: |
          set -euo pipefail
          echo "image: $IMAGE_RESULT"
          echo "release: $RELEASE_RESULT"
          echo "rescan: $RESCAN_RESULT"
          # A skipped job is one the caller did not ask for; both skipped is
          # a call that verified nothing.
          if [ "$IMAGE_RESULT" = "skipped" ] && [ "$RELEASE_RESULT" = "skipped" ]; then
            echo "::error::neither image nor release-tag was set, so nothing was verified"
            exit 1
          fi
          for result in "$IMAGE_RESULT" "$RELEASE_RESULT" "$RESCAN_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::the published artefact did not verify, or the rescan found something"
              exit 1
            fi
          done
