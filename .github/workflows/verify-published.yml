# Reusable consumer-side verification: prove, from outside, that a published
# image is what the producer says it is. container-release.yml signs, attests
# and records provenance; nothing there proves those verify the way an operator
# would run them. This workflow does exactly that, with no write access, no
# secret and no token beyond the read-only one GitHub gives every run.
#
#   1. cosign verify the image signature against an identity regexp and issuer.
#   2. cosign verify-attestation the SPDX SBOM (spdxjson) the same way.
#   3. gh attestation verify the SLSA build provenance for the image's owner.
#   4. For each platform: pull it, then run the caller's check against it.
#
# A GitHub release is verified the same way when `release-tag` is set (alone,
# or beside an image): every asset is downloaded, SHA256SUMS must list every
# file and match it, `gh attestation verify` must pass for every file for the
# owner, and, unless `verify-release-sbom` is false, `sbom.cdx.json` and
# `sbom.spdx.json` must be present, listed and the formats they claim to be.
# That is what python-package-release.yml publishes.
#
# Call it with:
#
#   on:
#     schedule:
#       - cron: "17 5 * * *"
#     workflow_dispatch:
#
#   jobs:
#     verify:
#       uses: ChiefGyk3D/git-your-ship-together/.github/workflows/verify-published.yml@<sha> # vX.Y.Z
#       permissions:
#         contents: read
#         packages: read
#       with:
#         image: ghcr.io/chiefgyk3d/star-daemon:latest
#         test-command: docker run --rm "$IMAGE" --version
#
# The identity regexp is matched against the signing certificate's subject.
# For an image published through container-release.yml that is the reusable
# workflow's own ref, so the default, any workflow in the owner's repositories,
# covers it; narrow it to pin one workflow and one tag pattern.

name: Verify published image (reusable)

on:
  workflow_call:
    inputs:
      image:
        description: Image reference to verify, for example `ghcr.io/chiefgyk3d/star-daemon:latest`. A digest reference is stronger than a tag. Empty skips the image checks; set this, `release-tag` or both.
        type: string
        default: ""
      release-tag:
        description: GitHub release tag whose assets are verified (checksums, build provenance and, by default, the SBOMs). Empty skips the release checks.
        type: string
        default: ""
      release-repository:
        description: owner/name holding the release; empty means the calling repository.
        type: string
        default: ""
      verify-release-sbom:
        description: Require `sbom.cdx.json` and `sbom.spdx.json` among the release assets, listed in SHA256SUMS and of the format they claim. Turn off for a release made by artifact-release.yml, which does not write them.
        type: boolean
        default: true
      identity-regexp:
        description: Regular expression the cosign certificate identity must match. Both cosign commands use it.
        type: string
        default: ^https://github.com/ChiefGyk3D/
      oidc-issuer:
        description: OIDC issuer the signing certificate must name.
        type: string
        default: https://token.actions.githubusercontent.com
      verify-sbom:
        description: Verify the SPDX SBOM attestation with `cosign verify-attestation --type spdxjson`.
        type: boolean
        default: true
      verify-provenance:
        description: Verify the SLSA build provenance with `gh attestation verify`, for the owner in the image reference.
        type: boolean
        default: true
      test-command:
        description: Shell run once per platform against the pulled image; `$IMAGE` names it and `DOCKER_DEFAULT_PLATFORM` is set. Empty skips the check.
        type: string
        default: ""
      platforms:
        description: Comma-separated platforms to pull and test. A platform that differs from the runner's runs under QEMU.
        type: string
        default: linux/amd64,linux/arm64
      egress-policy:
        description: harden-runner egress policy - `audit` logs outbound connections, `block` allows only `allowed-endpoints`.
        type: string
        default: block
      allowed-endpoints:
        description: harden-runner allow-list for `block`, space-separated host:port entries. Wildcards are not supported and a newline-separated list matches nothing.
        type: string
        default: "api.github.com:443 auth.docker.io:443 fulcio.sigstore.dev:443 ghcr.io:443 github.com:443 index.docker.io:443 mirror.gcr.io:443 pkg-containers.githubusercontent.com:443 production.cloudfront.docker.com:443 raw.githubusercontent.com:443 registry-1.docker.io:443 rekor.sigstore.dev:443 release-assets.githubusercontent.com:443 timestamp.sigstore.dev:443 tmaproduction.blob.core.windows.net:443 tuf-repo-cdn.sigstore.dev:443"
      extra-allowed-endpoints:
        description: Appended to `allowed-endpoints`, for hosts only this image or test command reaches. Same format.
        type: string
        default: ""
      timeout-minutes:
        description: Job timeout. Pulling and running an emulated platform is slow.
        type: number
        default: 20

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ inputs.image }}
    if: inputs.image != ''
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      packages: read  # pull the image, its signature and its attestations
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }}
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ inputs.egress-policy == 'block' }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify the signature
        env:
          IMAGE: ${{ inputs.image }}
          IDENTITY_REGEXP: ${{ inputs.identity-regexp }}
          OIDC_ISSUER: ${{ inputs.oidc-issuer }}
        run: |
          set -euo pipefail
          cosign verify "$IMAGE" \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$OIDC_ISSUER" > /dev/null
          echo "signature verified: $IMAGE"

      - name: Verify the SBOM attestation
        if: inputs.verify-sbom
        env:
          IMAGE: ${{ inputs.image }}
          IDENTITY_REGEXP: ${{ inputs.identity-regexp }}
          OIDC_ISSUER: ${{ inputs.oidc-issuer }}
        run: |
          set -euo pipefail
          cosign verify-attestation --type spdxjson "$IMAGE" \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer "$OIDC_ISSUER" > /dev/null
          echo "SPDX SBOM attestation verified: $IMAGE"

      - name: Verify the build provenance
        if: inputs.verify-provenance
        env:
          IMAGE: ${{ inputs.image }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # ghcr.io/<owner>/<name>[:tag|@digest] -> <owner>
          path="${IMAGE#*/}"
          owner="${path%%/*}"
          gh attestation verify "oci://$IMAGE" --owner "$owner"

      - name: Work out whether a platform needs emulation
        id: emulation
        env:
          PLATFORMS: ${{ inputs.platforms }}
          TEST_COMMAND: ${{ inputs.test-command }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) native=linux/amd64 ;;
            aarch64) native=linux/arm64 ;;
            *) native="linux/$(uname -m)" ;;
          esac
          needed=false
          if [ -n "$TEST_COMMAND" ]; then
            IFS=',' read -r -a list <<< "$PLATFORMS"
            for platform in "${list[@]}"; do
              platform="${platform// /}"
              if [ -n "$platform" ] && [ "$platform" != "$native" ]; then
                needed=true
              fi
            done
          fi
          echo "qemu=$needed" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.emulation.outputs.qemu == 'true'

      - name: Pull and check each platform
        if: inputs.test-command != ''
        env:
          IMAGE: ${{ inputs.image }}
          PLATFORMS: ${{ inputs.platforms }}
          COMMAND: ${{ inputs.test-command }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a list <<< "$PLATFORMS"
          for platform in "${list[@]}"; do
            platform="${platform// /}"
            [ -n "$platform" ] || continue
            echo "::group::$platform"
            docker pull --platform "$platform" "$IMAGE"
            DOCKER_DEFAULT_PLATFORM="$platform" bash -eo pipefail -c "$COMMAND"
            echo "::endgroup::"
          done

  verify-release:
    name: Verify release ${{ inputs.release-tag }}
    if: inputs.release-tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read  # list and download the release's assets
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }}
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ inputs.egress-policy == 'block' }}

      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release-tag }}
          REPO: ${{ inputs.release-repository || github.repository }}
        run: |
          set -euo pipefail
          mkdir release
          gh release download "$TAG" --repo "$REPO" --dir release
          ls -l release

      # Every file must be listed, and every listed file must match: a file
      # added to the release after SHA256SUMS was written is as wrong as one
      # that changed.
      - name: Verify the checksums
        run: |
          set -euo pipefail
          cd release
          test -s SHA256SUMS || { echo "::error::the release has no SHA256SUMS"; exit 1; }
          sha256sum -c SHA256SUMS
          listed="$(awk '{print $2}' SHA256SUMS | sed 's#^\./##' | sort)"
          present="$(find . -maxdepth 1 -type f ! -name SHA256SUMS ! -name '*.sigstore.json' -printf '%f\n' | sort)"
          if [ "$listed" != "$present" ]; then
            echo "::error::SHA256SUMS and the release assets disagree"
            diff <(echo "$listed") <(echo "$present") || true
            exit 1
          fi
          echo "checksums verified: $(wc -l < SHA256SUMS) file(s)"

      - name: Verify the build provenance of every asset
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ inputs.release-repository || github.repository }}
        run: |
          set -euo pipefail
          owner="${REPO%%/*}"
          cd release
          for f in *; do
            case "$f" in *.sigstore.json) continue ;; esac
            echo "::group::$f"
            gh attestation verify "$f" --owner "$owner"
            echo "::endgroup::"
          done

      - name: Verify the SBOMs
        if: inputs.verify-release-sbom
        run: |
          set -euo pipefail
          cd release
          for f in sbom.cdx.json sbom.spdx.json; do
            test -f "$f" || { echo "::error::the release has no $f"; exit 1; }
            grep -q "[ /]$f\$" SHA256SUMS || { echo "::error::SHA256SUMS does not list $f"; exit 1; }
          done
          python3 - <<'PY'
          import json
          cdx = json.load(open("sbom.cdx.json"))
          spdx = json.load(open("sbom.spdx.json"))
          assert cdx.get("bomFormat") == "CycloneDX", "sbom.cdx.json is not CycloneDX"
          assert cdx.get("components"), "sbom.cdx.json lists no components"
          assert str(spdx.get("spdxVersion", "")).startswith("SPDX-"), "sbom.spdx.json is not SPDX"
          assert spdx.get("packages"), "sbom.spdx.json lists no packages"
          print("SBOMs verified:", cdx["specVersion"], spdx["spdxVersion"])
          PY

  verified:
    name: Verified
    if: always()
    needs: [verify, verify-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }}
          disable-telemetry: ${{ inputs.egress-policy == 'block' }}
      - name: Verification passed
        env:
          IMAGE_RESULT: ${{ needs.verify.result }}
          RELEASE_RESULT: ${{ needs.verify-release.result }}
        run: |
          set -euo pipefail
          echo "image: $IMAGE_RESULT"
          echo "release: $RELEASE_RESULT"
          # A skipped job is one the caller did not ask for; both skipped is
          # a call that verified nothing.
          if [ "$IMAGE_RESULT" = "skipped" ] && [ "$RELEASE_RESULT" = "skipped" ]; then
            echo "::error::neither image nor release-tag was set, so nothing was verified"
            exit 1
          fi
          for result in "$IMAGE_RESULT" "$RELEASE_RESULT"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::the published artefact did not verify"
              exit 1
            fi
          done
