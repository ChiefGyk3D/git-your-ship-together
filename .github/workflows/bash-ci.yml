      - name: Every job passed or was deliberately skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
          TEST_REQUESTED: ${{ inputs.test-command != '' }}
          DISTRO_REQUESTED: ${{ inputs.test-command != '' && inputs.distros != '[]' }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs-only }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          # A job switched off by its `if:` is skipped on purpose. `test` (and `distro`, when a
          # matrix was requested) is the exception: a skipped one is a missing check, not a pass.
