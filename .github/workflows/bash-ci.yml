# Reusable CI for shell scripts: shellcheck, shfmt, an optional test command,
# an optional configuration lint (yamllint, ansible-lint, whatever the
# repository keeps beside its scripts), and a lint of the caller's own
# workflow files.
#
# Call it from a repository with:
#
#   jobs:
#     shell:
#       uses: ChiefGyk3D/git-your-ship-together/.github/workflows/bash-ci.yml@<sha> # vX.Y.Z
#       permissions:
#         contents: read
#       with:
#         test-command: ./tests/run.sh
#
# A repository that is only shell names the job `ci`; a repository that also
# calls `python-ci.yml` from `ci:` names this one `shell:`, and branch
# protection requires both gates (BASELINE.md §2). The `ci-green` job at the
# end is the one to name: it fails when any job it needs failed, so a job
# added here can never merge unchecked.
#
# The scripts are found, not listed: every tracked file under `paths` whose
# name ends in .sh or .bash, or whose first line is a sh or bash shebang.
# shellcheck and shfmt are downloaded at a pinned version and checked against
# a pinned SHA-256, so what lints today is what lints next year and no
# third-party action has to join the allow-list for it.
#
# Docs-only skip (`skip-docs-only`, issue #460): a pull request that changes only markdown leaves the `test` and
# `distro` jobs out, with no edit in the caller. `auto` (the default) is on for a private repository and off for a
# public one. The `classify` job reads the changed files from the API, so a private repository must grant
# `pull-requests: read` in its caller:
#
#       permissions:
#         contents: read
#         pull-requests: read
#
# Without it the classifier fails closed and every job runs. Lint and the security scans never skip, `ci-green`
# still fails on any failed job, and docs/wiki/Docs-only-fast-path.md has the rules.
#
# Commands a caller supplies (`test-command`, ...) reach the shell through an
# environment variable, never by template expansion into the script, so a
# value can only ever be data. Nothing here fetches a secret: no job holds a
# token beyond the read-only default.

# Runner (`runs-on`): non-matrix jobs read the JSON `runs-on` input. The
# `test` and `distro` jobs keep their existing runner matrices. The default
# preserves the previous `ubuntu-latest` behavior. A self-hosted runner fails
# in its step right after harden-runner unless `allow-self-hosted` is true and the
# event passes the trust allowlist.
#
# step-security/harden-runner on a self-hosted runner (verified 2026-11-25)
# requires StepSecurity Enterprise. Without it the action is a no-op: the step
# succeeds, but nothing is monitored or enforced. A self-hosted runner therefore
# must not rely on its `block` value for isolation.
#

name: Bash CI (reusable)

on:
  workflow_call:
    inputs:
      paths:
        description: Space-separated git pathspecs to search for scripts; `:!dir` excludes one.
        type: string
        default: "."
      shellcheck-version:
        description: shellcheck release to download (koalaman/shellcheck), without the `v`.
        type: string
        default: "0.11.0"
      shellcheck-sha256:
        description: SHA-256 of the shellcheck linux.x86_64 tarball for that version.
        type: string
        default: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
      shellcheck-severity:
        description: Lowest severity that fails the job - `error`, `warning`, `info` or `style`.
        type: string
        default: warning
      shellcheck-args:
        description: Extra shellcheck arguments, e.g. `-x` to follow sourced files or `-e SC2034`.
        type: string
        default: "-x"
      shellcheck-continue-on-error:
        description: Report shellcheck findings without failing the job. A migration aid, not a resting state.
        type: boolean
        default: false
      shfmt:
        description: Run shfmt and fail on a formatting diff.
        type: boolean
        default: true
      shfmt-version:
        description: shfmt release to download (mvdan/sh), without the `v`.
        type: string
        default: "3.14.1"
      shfmt-sha256:
        description: SHA-256 of the shfmt linux_amd64 binary for that version.
        type: string
        default: "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf"
      shfmt-args:
        description: shfmt style arguments. The default is what most of the calling repositories already write; Skid-Finder and Hammunition pass `-i 2 -ci`.
        type: string
        default: "-i 4 -ci"
      shfmt-continue-on-error:
        description: Report a formatting diff without failing the job. A migration aid, not a resting state.
        type: boolean
        default: false
      test-install-command:
        description: Shell run before the tests, e.g. `sudo apt-get install -y bats`; empty installs nothing.
        type: string
        default: ""
      skip-docs-only:
        description: >-
          Leave the `test` and `distro` jobs out of a pull request that changes only documentation, with no per-repository edit beyond
          setting this. Off by default: a workflow cannot read whether its repository is private (a policy test forbids it), so the
          caller opts in. A new `classify` job reads the pull request's changed files from the API (never from the checkout) and says
          docs-only only when every path matches `docs-only-patterns` and none is under `.github/` or `never-skip-patterns`; every doubt
          runs the tests. Lint, workflow lint, type check and the security scans are never skipped, and `CI green` still fails on any
          failed job. The job holds `contents: read` only, so a private repository must also grant `pull-requests: read` in its caller to
          let it read the file list; without it the classifier fails closed and every job runs.
        type: boolean
        default: false
      docs-only-patterns:
        description: Newline-separated globs, anchored at the repository root (`*` stops at `/`, `**` crosses it), for the paths that make the tests unnecessary. The default is markdown only. A pattern that matches every path is refused. Used with `skip-docs-only`.
        type: string
        default: |
          *.md
          docs/**/*.md
      never-skip-patterns:
        description: Newline-separated globs that always run every job, on top of `.github/**`. Use it for a markdown file your tests read. Used with `skip-docs-only`.
        type: string
        default: ""
      test-command:
        description: The shell test suite, e.g. `bats tests/` or `./tests/run.sh`; empty skips the job.
        type: string
        default: ""
      config-lint-install-command:
        description: Installs the configuration linters for `config-lint-command`, with Python available.
        type: string
        default: "pip install yamllint"
      config-lint-command:
        description: Lints the configuration kept beside the scripts, e.g. `yamllint .` or `ansible-lint`; empty skips the job.
        type: string
        default: ""
      config-lint-python-version:
        description: Python for the configuration lint job.
        type: string
        default: "3.13"
      fragment-check-command:
        description: Shell run on pull requests only, with the full history checked out and `BASE` set to the pull request's base branch name (so `origin/$BASE` resolves); empty skips the `Changelog fragment` job. For a repository that keeps one changelog fragment per change under `changelog.d/`, e.g. `python3 scripts/changelog.py check-pr --base "origin/$BASE"`. Part of the gate when set.
        type: string
        default: ""
      commit-claims-command:
        description: Shell run on pull requests only, with the full history checked out, `BASE` set to the base branch name and `HEAD` to the pull request's head commit; empty skips the `Commit claims` job. For a repository that checks what each commit message claims against its diff, e.g. `python3 scripts/check_commit_claims.py --range "origin/$BASE..HEAD"`. Part of the gate when set.
        type: string
        default: ""
      workflow-lint:
        description: Run actionlint and zizmor over the caller's own workflow files. Turn off on one caller job when another already runs it.
        type: boolean
        default: true
      zizmor-persona:
        description: zizmor strictness - `regular`, `pedantic` or `auditor`.
        type: string
        default: regular
      runners:
        description: JSON array of runner labels for the `test` job, e.g. `["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15"]`. `test-install-command` and `test-command` run under bash on each.
        type: string
        default: '["ubuntu-24.04"]'
      distros:
        description: JSON array of container images to run the tests in as well, e.g. `["debian:13", "kalilinux/kali-rolling"]`. GitHub-hosted runners are Ubuntu, macOS and Windows only; another distribution is tested inside its official image on a runner. `[]` skips the job.
        type: string
        default: '[]'
      distro-runners:
        description: JSON array of runner labels the `distros` run on. Add `ubuntu-24.04-arm` to run the images natively on arm64.
        type: string
        default: '["ubuntu-24.04"]'
      distro-setup-command:
        description: Shell run as root inside each image before `test-install-command`. The default installs bash, git and ca-certificates with apt-get where it exists, else with dnf; non-interactive and quiet.
        type: string
        default: |
          export DEBIAN_FRONTEND=noninteractive
          if command -v apt-get >/dev/null 2>&1; then
            # Kali's redirector hands out a different mirror per request, which
            # no egress list can follow; the CDN host it fronts is one name.
            if grep -qx 'ID=kali' /etc/os-release; then
              sed -i 's|http://http.kali.org|http://kali.download|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            fi
            # Parrot's package redirector (director.parrot.sh) does the same;
            # its /direct path serves the pool from deb.parrot.sh itself.
            if grep -qx 'ID=parrot' /etc/os-release; then
              sed -i 's|https://deb.parrot.sh/parrot|https://deb.parrot.sh/direct/parrot|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            fi
            # A mirror that answers 502, or is caught mid-sync (Kali's "File has
            # unexpected size", #228), is not retried by apt itself, so the whole
            # step is tried six times with a growing pause (20 s up to 60 s). The
            # package lists are cleared between tries so a partial index is never
            # reused; the last failure exits non-zero with apt's own error shown.
            for attempt in 1 2 3 4 5 6; do
              apt-get -o Acquire::Retries=3 update -qq &&
                apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends bash git ca-certificates && break
              if [ "$attempt" = 6 ]; then
                echo "apt-get still failing after 6 attempts" >&2
                exit 1
              fi
              rm -rf /var/lib/apt/lists/*
              sleep $((attempt * 20 > 60 ? 60 : attempt * 20))
            done
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y -q bash git ca-certificates
          fi
      distro-egress-policy:
        description: harden-runner egress policy for the `distro` job - `audit` logs outbound connections, `block` allows only `distro-allowed-endpoints` and `extra-allowed-endpoints`.
        type: string
        default: block
      distro-allowed-endpoints:
        description: harden-runner allow-list for the `distro` job in `block`, space-separated host:port entries. The default is Docker Hub's image pull (registry, auth, CDN and the S3 host layer blobs redirect to), the package mirrors of the Debian, Ubuntu, Kali and Parrot images. A distribution not named here (Fedora, whose metalink mirrors vary by run) needs its hosts in `extra-allowed-endpoints`, or `distro-egress-policy` set to `audit`. Wildcards are not supported and a newline-separated list matches nothing.
        type: string
        default: "archive.ubuntu.com:80 auth.docker.io:443 deb.debian.org:80 deb.parrot.sh:443 docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443 kali.download:80 ports.ubuntu.com:80 production.cloudfront.docker.com:443 registry-1.docker.io:443 security.ubuntu.com:80"
      distro-continue-on-error:
        description: Let a failing distro run leave the gate green. For a suite that assumes a non-root user or a newer Python than the distribution ships; the result stays visible on the job.
        type: boolean
        default: false
      egress-policy:
        description: harden-runner egress policy for every job except `distro` - `audit` logs outbound connections, `block` allows only `allowed-endpoints`. Jobs that hold no secret follow `egress-policy-secretless` instead (EX-0001).
        type: string
        default: audit
      egress-policy-secretless:
        description: harden-runner egress policy for the jobs that hold no stored secret, no OIDC token and no write-scoped or publish-capable token (read-only contents, a SARIF upload at most), and whose output no privileged job consumes - exactly `audit` or `block`. Defaults to `block` since security exception EX-0001 (GitHub-hosted runners in westus2 broke harden-runner `block`) was closed on 2026-11-02 after harden-runner v2.22.3 passed on westus2; see docs/security/exceptions/. Every job still has the default read-only job token. Set `audit` to opt out if the defect recurs. Any other job follows `egress-policy`. Any other value fails the job.
        type: string
        default: block
      allowed-endpoints:
        description: harden-runner allow-list for `block`, space-separated host:port entries. The default is every endpoint this workflow's jobs reach; the runner's own infrastructure needs no entry. Wildcards are not supported and a newline-separated list matches nothing.
        type: string
        default: "api.github.com:443 files.pythonhosted.org:443 ghcr.io:443 github.com:443 objects.githubusercontent.com:443 pkg-containers.githubusercontent.com:443 pypi.org:443 raw.githubusercontent.com:443 registry.npmjs.org:443 release-assets.githubusercontent.com:443"
      extra-allowed-endpoints:
        description: Appended to `allowed-endpoints`, for hosts only this repository reaches, such as an apt repository its test install needs. Same format.
        type: string
        default: ""
      timeout-minutes:
        description: Per-job timeout.
        type: number
        default: 10
      runs-on:
        description: 'Runner for every non-matrix job, as a JSON string because `runs-on` takes a string, an array or an object. The default preserves the label those jobs previously used. The `test` and `distro` jobs keep their existing runner matrices.'
        type: string
        default: '"ubuntu-latest"'
      allow-self-hosted:
        description: 'Let these jobs run on an attested self-hosted runner. The runner must be ephemeral, one job per VM, and isolated from secrets and the network.'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The docs-only skip (issue #460). A reusable workflow cannot check out its own commit, so the classifier is
  # inline: a byte-identical copy of scripts/classify_changes.py (tests/test_skip_docs_only.py holds the two
  # together). It holds `contents: read` only, since a job may not ask for more than the caller granted; the
  # API read of a private repository needs `pull-requests: read` from the caller, and without it the script
  # prints why and answers docs-only=false (it fails closed, so every job runs).
  classify:
    name: Classify changes
    if: github.event_name == 'pull_request' && inputs.skip-docs-only
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - name: Validate the egress policy inputs
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_DISTRO_EGRESS_POLICY: ${{ inputs.distro-egress-policy }}
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          disable-sudo: true
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ (inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block' }}

      - name: Refuse an untrusted self-hosted runner
        timeout-minutes: 1
        shell: bash
        env:
          RUNNER_ENV: ${{ runner.environment }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          ALLOW_SELF_HOSTED: ${{ inputs.allow-self-hosted }}
        run: |
          set -u
          # Bash 3.2 compatible (macOS runners): lowercase through tr, keeping a trailing newline with a sentinel.
          lower() {
            LOWER=$(printf '%sx' "$1" | tr '[:upper:]' '[:lower:]')
            LOWER=${LOWER%x}
          }
          lower "$RUNNER_ENV"
          [ "$LOWER" = github-hosted ] && exit 0
          # Allowlist: only events whose code the repository's own writers control.
          lower "$EVENT_NAME"
          case "$LOWER" in
            push | schedule | workflow_dispatch | release) ;;
            pull_request)
              lower "$HEAD_REPO"
              head_repo=$LOWER
              lower "$THIS_REPO"
              if [ -z "$HEAD_REPO" ] || [ -z "$THIS_REPO" ] || [ "$head_repo" != "$LOWER" ]; then
                echo "::error title=self-hosted runner::a self-hosted runner never runs a pull request from a fork or from a repository it cannot name"
                exit 1
              fi
              ;;
            *)
              echo "::error title=self-hosted runner::a self-hosted runner runs only push, schedule, workflow_dispatch, release and same-repository pull_request events"
              exit 1
              ;;
          esac
          lower "$ALLOW_SELF_HOSTED"
          if [ "$LOWER" != true ]; then
            echo "::error title=self-hosted runner::a self-hosted runner needs allow-self-hosted: true, which attests that it is ephemeral, one job per VM, and isolated from secrets and the network"
            exit 1
          fi

      - name: Classify the changed files
        id: classify
        timeout-minutes: 2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CC_EVENT_NAME: ${{ github.event_name }}
          CC_REPO: ${{ github.repository }}
          CC_PR: ${{ github.event.pull_request.number }}
          CC_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CC_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          CC_PATTERNS: ${{ inputs.docs-only-patterns }}
          CC_NEVER_SKIP: ${{ inputs.never-skip-patterns }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          #!/usr/bin/env python3
          """Decide whether a pull request changes only files a caller calls "docs only".

          The answer feeds a deliberate skip: a caller leaves a job out of a docs-only
          pull request, and `scripts/ci_gate.py` counts that skip as a pass. It must
          therefore err one way only. Every doubt is `docs-only=false`, which runs the job.

          Inputs reach the script through the environment, never through its text:

            CC_EVENT_NAME      github.event_name; anything but `pull_request` is never docs only
            CC_REPO            OWNER/REPO whose pull request it is
            CC_PR              pull request number
            CC_HEAD_SHA        the head commit the event was started for
            CC_CHANGED_FILES   the event's own count of changed files
            CC_PATTERNS        newline-separated globs; a path is docs only when it matches one
            CC_NEVER_SKIP      newline-separated globs that always run the job, on top of `.github/**`
            GH_TOKEN           a token that can read the pull request (pull-requests: read)
            GITHUB_OUTPUT      where `docs-only`, `reason` and `changed` are written

          Glob syntax (anchored at the repository root, matched against the whole path):
          `*` any characters but `/`, `?` one such character, `**` anything including `/`,
          `**/` zero or more directories. Nothing else is special. A pattern that would
          match every path, starts with `/` or `!`, or contains `..` is a usage error.
          """

          from __future__ import annotations

          import json
          import os
          import re
          import subprocess
          import sys
          from collections.abc import Iterable

          # The API lists at most this many files of a pull request; a list this long may be cut short.
          API_FILE_LIMIT = 3000
          # Never docs only, whatever the caller's patterns say: the workflows, actions and rule files that
          # decide what runs. Changing them is changing the gate.
          ALWAYS_RUN = (".github/**",)


          class UsageError(Exception):
              pass


          def glob_to_regex(pattern: str) -> re.Pattern[str]:
              out: list[str] = []
              i = 0
              while i < len(pattern):
                  c = pattern[i]
                  if pattern.startswith("**/", i):
                      out.append("(?:[^/]+/)*")
                      i += 3
                  elif pattern.startswith("**", i):
                      out.append(".*")
                      i += 2
                  elif c == "*":
                      out.append("[^/]*")
                      i += 1
                  elif c == "?":
                      out.append("[^/]")
                      i += 1
                  else:
                      out.append(re.escape(c))
                      i += 1
              return re.compile("".join(out), re.DOTALL)


          def compile_patterns(text: str, what: str, reject_catch_all: bool) -> list[re.Pattern[str]]:
              compiled = []
              for raw in text.splitlines():
                  pattern = raw.strip()
                  if not pattern:
                      continue
                  if pattern.startswith(("/", "!", "#")) or ".." in pattern.split("/"):
                      raise UsageError(f"{what}: {pattern!r} must be a path glob relative to the root (no leading / ! #, no ..)")
                  rx = glob_to_regex(pattern)
                  # A catch-all would turn the fast path into "skip everything".
                  if reject_catch_all and (rx.fullmatch("x") or rx.fullmatch("a/b/c.tf")):
                      raise UsageError(f"{what}: {pattern!r} matches every path; name the directories or files instead")
                  compiled.append(rx)
              return compiled


          def paths_of(files: Iterable[dict]) -> set[str]:
              """Every path a change touches: the new name, and the old one of a rename (it left its directory)."""
              paths: set[str] = set()
              for f in files:
                  paths.add(f["filename"])
                  if f.get("previous_filename"):
                      paths.add(f["previous_filename"])
              return paths


          def classify(files: list[dict], patterns: list[re.Pattern[str]], never: list[re.Pattern[str]]) -> tuple[bool, str]:
              if not patterns:
                  return False, "no docs-only patterns were given"
              if not files:
                  return False, "the pull request lists no changed files"
              always = [glob_to_regex(p) for p in ALWAYS_RUN]
              for path in sorted(paths_of(files)):
                  # The API never returns these forms; a list that does is not one to trust.
                  if path.startswith("/") or {"", ".", ".."} & set(path.split("/")):
                      return False, f"{path!r} is not a normal repository path"
                  if any(rx.fullmatch(path) for rx in always) or any(rx.fullmatch(path) for rx in never):
                      return False, f"{path!r} is a path that always runs every job"
                  if not any(rx.fullmatch(path) for rx in patterns):
                      return False, f"{path!r} is not on the docs-only list"
              return True, "every changed path is on the docs-only list"


          def gh_json(args: list[str]) -> object:
              done = subprocess.run(["gh", "api", *args], capture_output=True, text=True, timeout=120, check=False)
              if done.returncode != 0:
                  raise RuntimeError(f"gh api {args[-1]} failed: {done.stderr.strip()[:200]!r}")
              return json.loads(done.stdout)


          def fetch_files(repo: str, pr: str, head_sha: str, changed: str) -> list[dict]:
              """The pull request's files from the API, checked against what the event itself says.

              The pull request is read before the file pages and again after the last one; the head must be the commit the
              run started for both times and the count must agree three ways (event, listing, final read), so a push or a
              rewrite while the pages were fetched cannot leave a list of no particular commit standing.
              Raises RuntimeError on any mismatch; the caller turns that into docs-only=false."""

              def read_meta() -> dict:
                  meta = gh_json([f"repos/{repo}/pulls/{pr}"])
                  if not isinstance(meta, dict):
                      raise RuntimeError("the pull request could not be read")
                  return meta

              if read_meta().get("head", {}).get("sha") != head_sha:
                  raise RuntimeError("the pull request head is no longer the commit this run was started for")
              pages = gh_json(["--paginate", "--slurp", f"repos/{repo}/pulls/{pr}/files?per_page=100"])
              files = [f for page in pages for f in page]
              final = read_meta()
              if final.get("head", {}).get("sha") != head_sha:
                  raise RuntimeError("the pull request head moved while its files were being listed")
              if not changed.isdigit() or int(changed) != len(files) or final.get("changed_files") != len(files):
                  raise RuntimeError(
                      f"file counts disagree: listing {len(files)}, event {changed!r}, final read {final.get('changed_files')!r}"
                  )
              if len(files) >= API_FILE_LIMIT:
                  raise RuntimeError("the file list may be cut short by the API limit")
              return files


          def write_outputs(docs_only: bool, reason: str, changed: int) -> None:
              reason = " ".join(reason.split())
