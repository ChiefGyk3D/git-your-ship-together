          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          mode=none
          skip=""
          untrusted_tag=false
          # A trusted run is one only a push by someone with write access, a manual
          # dispatch by such a person, or the schedule can produce, on the default
          # branch or a version tag (vN.N.N). The event must be on this allow-list:
          # any other event (issue_comment, workflow_run, an event added later) is
          # refused when the gate is on, because the ref alone does not say who
          # triggered it. A pull request is never trusted, whichever repository its
          # head is in. For a version tag the job also checks, when it can, that the
          # tagged commit is in the default branch's history (see the README).
          trusted=false
          # An inherited BASHOPTS must not make a comparison below case-insensitive.
          shopt -u nocasematch nocaseglob
          # The gate is parsed strictly: true or false in any casing, and anything else
          # stops the job. A typo must never switch the gate off.
          case "${TRUSTED_ONLY,,}" in
            true) TRUSTED_ONLY=true ;;
            false) TRUSTED_ONLY=false ;;
            *)
              echo "::error title=Doppler::trusted-refs-only must be true or false"
              exit 1 ;;
          esac
          case "$EVENT" in
            schedule) trusted=true ;;
            push|workflow_dispatch)
              if [ -n "$DEFAULT_BRANCH" ] && [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
                trusted=true
              elif [[ "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                trusted=true
                # Best effort: refuse a tag only on a clean "not an ancestor" answer from a
                # complete history. No checkout, a shallow clone, a missing remote ref or any
                # git error cannot show where the tag points, so the name rule stands and a
                # notice says the tag was not verified.
                if [ "$TRUSTED_ONLY" = "true" ]; then
                  verdict=unknown
                  if [ -n "$DEFAULT_BRANCH" ] && [ -n "${GITHUB_WORKSPACE:-}" ] && [ -n "${GITHUB_SHA:-}" ] \
                    && git -C "$GITHUB_WORKSPACE" rev-parse --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH^{commit}" >/dev/null 2>&1 \
                    && git -C "$GITHUB_WORKSPACE" rev-parse --verify --quiet "$GITHUB_SHA^{commit}" >/dev/null 2>&1 \
                    && [ "$(git -C "$GITHUB_WORKSPACE" rev-parse --is-shallow-repository 2>/dev/null)" = "false" ]; then
                    rc=0
                    git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT_BRANCH" >/dev/null 2>&1 || rc=$?
                    case "$rc" in
                      0) verdict=in ;;
                      1) verdict=out ;;
                    esac
                  fi
                  case "$verdict" in
                    out) trusted=false ;;
                    unknown) echo "::notice title=Doppler::tag $REF not verified against the default branch history (no checkout, incomplete history or git error); only its name was checked" ;;
                  esac
                fi
              fi ;;
            *) trusted=false ;;
          esac
          if [ "$IS_FORK" = "true" ]; then
            # A fork's pull request has no id-token and must never receive a
            # secret. Silent skip is correct here, whatever `required` says.
            skip="pull request from a fork"
          elif [ "$TRUSTED_ONLY" = "true" ] && [ "$trusted" != "true" ]; then
            skip="$EVENT on $REF is not a push or dispatch on the default branch or a version tag (vN.N.N, in the default branch history), or a schedule (trusted-refs-only)"
            # A tag this rule refused is reported, so a job that was asked for a
            # secret-backed feature can fail instead of skipping it quietly.
            case "$REF" in refs/tags/*) untrusted_tag=true ;; esac
          elif [ -n "$IDENTITY_ID" ]; then
            mode=oidc
          elif [ -n "$TOKEN" ]; then
            mode=token
          fi
          if [ -n "$skip" ]; then
            echo "::notice title=Doppler::$skip - no secrets are fetched"
          fi
          if [ "$mode" != "none" ] && { [ -z "$PROJECT" ] || [ -z "$CONFIG" ]; }; then
            echo "::error title=Doppler::project and config are required when authenticating"
            exit 1
          fi
          if [ "$mode" = "none" ] && [ -z "$skip" ]; then
            if [ "$REQUIRED" = "true" ]; then
              echo "::error title=Doppler::no identity-id and no DOPPLER_TOKEN; this job needs one (see README, 'Doppler setup')"
              exit 1
            fi
            echo "::notice title=Doppler::not configured (no identity-id, no DOPPLER_TOKEN) - continuing without CI secrets"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "untrusted-tag=$untrusted_tag" >> "$GITHUB_OUTPUT"
          echo "Doppler auth mode: $mode"

      - name: Fetch CI secrets from Doppler (OIDC)
        if: steps.doppler.outputs.mode == 'oidc'
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ inputs.doppler-identity-id }}
          doppler-project: ${{ inputs.doppler-project }}
          doppler-config: ${{ inputs.doppler-config }}
          inject-env-vars: true

      - name: Fetch CI secrets from Doppler (Service Token)
        if: steps.doppler.outputs.mode == 'token'
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: ${{ inputs.doppler-project }}
          doppler-config: ${{ inputs.doppler-config }}
          inject-env-vars: true

      - name: plan
        env:
          COMMAND: ${{ inputs.plan-command }}
        run: bash -eo pipefail -c "$COMMAND"

  workflow-lint:
    name: Workflow lint (actionlint, zizmor)
    if: inputs.workflow-lint
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    # normal: no fixture history
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Validate the egress policy inputs
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ (inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted' && contains(fromJSON('["ubuntu-latest","ubuntu-22.04","ubuntu-24.04","ubuntu-26.04","ubuntu-22.04-arm","ubuntu-24.04-arm","ubuntu-26.04-arm","ubuntu-slim","windows-latest","windows-2022","windows-2025","windows-2025-vs2026","windows-11-arm","windows-11-vs2026-arm","macos-latest","macos-14","macos-15","macos-15-intel","macos-26","macos-26-intel"]'), fromJSON(inputs.runs-on))) && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          disable-sudo: true
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ ((inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted' && contains(fromJSON('["ubuntu-latest","ubuntu-22.04","ubuntu-24.04","ubuntu-26.04","ubuntu-22.04-arm","ubuntu-24.04-arm","ubuntu-26.04-arm","ubuntu-slim","windows-latest","windows-2022","windows-2025","windows-2025-vs2026","windows-11-arm","windows-11-vs2026-arm","macos-latest","macos-14","macos-15","macos-15-intel","macos-26","macos-26-intel"]'), fromJSON(inputs.runs-on))) && 'audit' || 'block') == 'block' }}


      - name: Refuse an untrusted self-hosted runner
        timeout-minutes: 1
        shell: bash
        env:
          RUNNER_ENV: ${{ runner.environment }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          ALLOW_SELF_HOSTED: ${{ inputs.allow-self-hosted }}
        run: |
          set -u
          # Bash 3.2 compatible (macOS runners): lowercase through tr, keeping a trailing newline with a sentinel.
          lower() {
            LOWER=$(printf '%sx' "$1" | tr '[:upper:]' '[:lower:]')
            LOWER=${LOWER%x}
          }
          lower "$RUNNER_ENV"
          [ "$LOWER" = github-hosted ] && exit 0
          # Allowlist: only events whose code the repository's own writers control.
          lower "$EVENT_NAME"
          case "$LOWER" in
            push | schedule | workflow_dispatch | release) ;;
            pull_request)
              lower "$HEAD_REPO"
              head_repo=$LOWER
              lower "$THIS_REPO"
              if [ -z "$HEAD_REPO" ] || [ -z "$THIS_REPO" ] || [ "$head_repo" != "$LOWER" ]; then
                echo "::error title=self-hosted runner::a self-hosted runner never runs a pull request from a fork or from a repository it cannot name"
                exit 1
              fi
              ;;
            *)
              echo "::error title=self-hosted runner::a self-hosted runner runs only push, schedule, workflow_dispatch, release and same-repository pull_request events"
              exit 1
              ;;
          esac
          lower "$ALLOW_SELF_HOSTED"
          if [ "$LOWER" != true ]; then
            echo "::error title=self-hosted runner::a self-hosted runner needs allow-self-hosted: true, which attests that it is ephemeral, one job per VM, and isolated from secrets and the network"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          fail-on-error: true

      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.30.1
          persona: ${{ inputs.zizmor-persona }}
          # Findings go to the log and fail the job; the Security tab would
          # need security-events: write from every caller for a lint.
          advanced-security: false

  # The one job branch protection should require. `always()` so it runs when
  # a needed job was skipped; the shell then decides what counts as green.
  ci-green:
    name: CI green
    if: always()
    needs: [classify, fmt, validate, test-dirs, test, tflint, trivy, policy, plan, workflow-lint]
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    # normal: ~1 min (p50 0.3, p95 0.4; last ~30 green runs)
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Validate the egress policy inputs
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ (inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted' && contains(fromJSON('["ubuntu-latest","ubuntu-22.04","ubuntu-24.04","ubuntu-26.04","ubuntu-22.04-arm","ubuntu-24.04-arm","ubuntu-26.04-arm","ubuntu-slim","windows-latest","windows-2022","windows-2025","windows-2025-vs2026","windows-11-arm","windows-11-vs2026-arm","macos-latest","macos-14","macos-15","macos-15-intel","macos-26","macos-26-intel"]'), fromJSON(inputs.runs-on))) && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          disable-sudo: true
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ ((inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted' && contains(fromJSON('["ubuntu-latest","ubuntu-22.04","ubuntu-24.04","ubuntu-26.04","ubuntu-22.04-arm","ubuntu-24.04-arm","ubuntu-26.04-arm","ubuntu-slim","windows-latest","windows-2022","windows-2025","windows-2025-vs2026","windows-11-arm","windows-11-vs2026-arm","macos-latest","macos-14","macos-15","macos-15-intel","macos-26","macos-26-intel"]'), fromJSON(inputs.runs-on))) && 'audit' || 'block') == 'block' }}


      - name: Refuse an untrusted self-hosted runner
        timeout-minutes: 1
        shell: bash
        env:
          RUNNER_ENV: ${{ runner.environment }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          ALLOW_SELF_HOSTED: ${{ inputs.allow-self-hosted }}
        run: |
          set -u
          # Bash 3.2 compatible (macOS runners): lowercase through tr, keeping a trailing newline with a sentinel.
          lower() {
            LOWER=$(printf '%sx' "$1" | tr '[:upper:]' '[:lower:]')
            LOWER=${LOWER%x}
          }
          lower "$RUNNER_ENV"
          [ "$LOWER" = github-hosted ] && exit 0
          # Allowlist: only events whose code the repository's own writers control.
          lower "$EVENT_NAME"
          case "$LOWER" in
            push | schedule | workflow_dispatch | release) ;;
            pull_request)
              lower "$HEAD_REPO"
              head_repo=$LOWER
              lower "$THIS_REPO"
              if [ -z "$HEAD_REPO" ] || [ -z "$THIS_REPO" ] || [ "$head_repo" != "$LOWER" ]; then
                echo "::error title=self-hosted runner::a self-hosted runner never runs a pull request from a fork or from a repository it cannot name"
                exit 1
              fi
              ;;
            *)
              echo "::error title=self-hosted runner::a self-hosted runner runs only push, schedule, workflow_dispatch, release and same-repository pull_request events"
              exit 1
              ;;
          esac
          lower "$ALLOW_SELF_HOSTED"
          if [ "$LOWER" != true ]; then
            echo "::error title=self-hosted runner::a self-hosted runner needs allow-self-hosted: true, which attests that it is ephemeral, one job per VM, and isolated from secrets and the network"
            exit 1
          fi

      - name: Every job passed or was deliberately skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
          TEST_REQUESTED: ${{ inputs.test }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs-only }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          # A job switched off by its `if:` is skipped on purpose. `test` and its
          # leg list are the exception when the caller asked for them: a skipped
          # one (say, because the leg list failed) is a missing check, not a pass.
          # The exception lifts only on a docs-only verdict from a classify job that
          # succeeded: the classifier leaves its output empty on every doubt.
          # A matrix job is success only when every leg succeeded; one failed leg
          # makes it failure, a cancelled one cancelled.
          bad=$(echo "$RESULTS" | python3 -c '
          import json, os, sys
          needs = json.load(sys.stdin)
          docs_only = os.environ.get("DOCS_ONLY", "") == "true"
          strict = {"test-dirs", "test"} if os.environ["TEST_REQUESTED"] == "true" and not docs_only else set()
          print(" ".join(k for k, v in needs.items()
                         if v["result"] != "success" and (v["result"] != "skipped" or k in strict)))
          ')
          if [ -n "$bad" ]; then
            echo "::error::failed jobs: $bad"
            exit 1
          fi
