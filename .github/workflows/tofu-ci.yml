# Reusable CI for OpenTofu (or Terraform) configuration: fmt, validate, tflint
# and a Trivy configuration scan on every push and pull request, none of
# which needs a cloud credential; optionally `tofu test` (whose mocked
# providers need none either) and `opa test` over policy-as-code that lives
# beside the configuration; and a plan on pushes to the default branch only,
# with credentials fetched through the Doppler gate, which refuses a pull
# request by design. Nothing applies from CI, ever.
#
# Call it from a repository with:
#
#   jobs:
#     tofu:
#       uses: ChiefGyk3D/git-your-ship-together/.github/workflows/tofu-ci.yml@<sha> # vX.Y.Z
#       permissions:
#         contents: read
#         id-token: write        # only the plan job uses it, and only off a pull request
#         pull-requests: read    # only with skip-docs-only: the classify job lists the changed files
#       secrets:
#         DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional fallback
#       with:
#         directories: infra/terraform/examples/ecs-fargate infra/terraform/examples/eks-cronjob
#         test: true                          # tofu test in each directory
#         policy-directories: policies        # opa test over the Rego there
#
# The binary is OpenTofu, downloaded at a pinned version and checked against
# a pinned SHA-256; `binary: terraform` uses the Terraform the runner image
# ships instead. tflint and OPA are downloaded the same way. The `ci-green`
# job at the end is the one to name in branch protection.
#
# Commands a caller supplies reach the shell through an environment
# variable, never by template expansion into the script. The Doppler steps
# are the same as .github/actions/doppler-secrets, inlined so that a caller
# pinned to a commit of this file gets exactly that commit's behaviour.
#
# Runner (`runs-on`): every job reads the `runs-on` input, a JSON string, through
# `fromJSON(inputs.runs-on)`, because `runs-on` itself takes a string, an array
# or an object. Pass `'"ubuntu-latest"'`, `'["self-hosted","linux"]'` or
# `'{"group":"my-group","labels":["linux"]}'`. The default is `'"ubuntu-latest"'`, the
# label this workflow used before the input existed. A value that is not valid
# JSON fails the first job at expression time, before any step runs, since
# nothing can validate an input before `runs-on` resolves; an unknown label
# leaves the job queued. A job that follows `egress-policy-secretless` reaches
# `audit` only on a GitHub-hosted runner and a label in the hosted list of
# docs/security/exceptions/EX-0001-harden-runner-block-westus2.md, so an array,
# an object or a self-hosted runner always gets the `block` value.
#
# Trust domain: a job on a self-hosted runner fails in its step right after
# harden-runner unless `allow-self-hosted` is true, the caller's attestation
# that the runner is ephemeral, one job per VM, and isolated from secrets and the
# network. Even then a self-hosted runner takes only push,
# schedule, workflow_dispatch, release and same-repository pull_request events
# (an allowlist: merge_group, workflow_run, issue_comment, pull_request_target,
# a fork's pull request, a pull request whose head repository is unnamed, and
# any unknown event fail). That keeps out code from outside the repository's
# own writers; it does not isolate the runner. Same-repository code still runs
# there, so a persistent runner must not be shared with a job holding OIDC or
# Doppler access. Secret-bearing jobs belong on GitHub-hosted runners or a
# distinct ephemeral trusted pool.
#
# step-security/harden-runner on a self-hosted runner (read 2026-11-25, README
# of the pinned v2.22.3 commit, section "Features and Pricing Tiers"). Verified:
# it needs a StepSecurity Enterprise subscription there, even for a public
# repository, and without one the action is a no-op: the step succeeds, nothing
# is monitored and nothing is enforced. Verified: with a subscription the agent
# is installed on the runner itself and the workflow needs no change. Inferred,
# not tested here: the `egress-policy`, `allowed-endpoints` and
# `disable-telemetry` inputs still validate and pass through unchanged, so every
# egress-policy input keeps working as before, but a `block` value is a no-op
# on a self-hosted runner without that subscription, so do not rely on it
# there.
#

name: Tofu CI (reusable)

on:
  workflow_call:
    inputs:
      directories:
        description: Space-separated root modules to validate, lint and scan, relative to the repository root.
        type: string
        default: "."
      binary:
        description: "`tofu` (downloaded at `tofu-version`) or `terraform` (the runner image's)."
        type: string
        default: tofu
      tofu-version:
        description: OpenTofu release to download (opentofu/opentofu), without the `v`.
        type: string
        default: "1.13.2"
      tofu-sha256:
        description: SHA-256 of the OpenTofu linux_amd64 zip for that version.
        type: string
        default: "723bebb0df8411daff1e5fc3862e28ff5581fe5634087f4c29a9aa41d78208b5"
      tflint:
        description: Run tflint over every directory.
        type: boolean
        default: true
      tflint-version:
        description: tflint release to download (terraform-linters/tflint), without the `v`.
        type: string
        default: "0.65.0"
      tflint-sha256:
        description: SHA-256 of the tflint linux_amd64 zip for that version.
        type: string
        default: "d4c545ed2e29d6338604b586f34f544f380f70f243aa72f7b484713835eaec61"
      test:
        description: Run `tofu test` (or `terraform test`) in every directory, after `init -backend=false`. Off by default because a test file that reaches a real provider would need a credential this job never has; turn it on when the tests use mocked providers.
        type: boolean
        default: false
      test-matrix:
        description: With `test`, run `tofu test` as one job per directory (a matrix, all legs at once, none cancelled by another's failure) instead of every directory one after another in one job. The `ci-green` job still reports one result and fails on any failed, cancelled or skipped leg. Off by default, so a caller that sets nothing sees the same single `test` job.
        type: boolean
        default: false
      policy-directories:
        description: Space-separated directories of Rego policies (Spacelift, Conftest, OPA) with their `_test.rego` files, relative to the repository root. Each gets `opa fmt`, `opa check --strict` and `opa test`; empty skips the job.
        type: string
        default: ""
      opa-version:
        description: OPA release to download (open-policy-agent/opa), without the `v`.
        type: string
        default: "1.22.0"
      opa-sha256:
        description: SHA-256 of the OPA linux_amd64_static binary for that version.
        type: string
        default: "791790254c598a942eb140959bcec9a47f844535a632fd01d11d870ba2a47047"
      trivy:
        description: Run Trivy's configuration scan over the repository.
        type: boolean
        default: true
      trivy-severity:
        description: Severities the configuration scan reports.
        type: string
        default: CRITICAL,HIGH
      trivy-exit-code:
        description: Exit code when the scan finds something; `1` fails the job, `0` reports only. A migration aid, not a resting state.
        type: string
        default: "1"
      plan-command:
        description: Shell that plans, e.g. `cd infra/live && tofu init -input=false && tofu plan -input=false`, run only on a push to the default branch with the Doppler config's secrets in the environment; empty skips the job.
        type: string
        default: ""
      workflow-lint:
        description: Run actionlint and zizmor over the caller's own workflow files. Turn off on one caller job when another already runs it.
        type: boolean
        default: true
      zizmor-persona:
        description: zizmor strictness - `regular`, `pedantic` or `auditor`.
        type: string
        default: regular
      egress-policy:
        description: harden-runner egress policy for every job - `audit` logs outbound connections, `block` allows only `allowed-endpoints`. Jobs that hold no secret follow `egress-policy-secretless` instead (EX-0001).
        type: string
        default: audit
      egress-policy-secretless:
        description: harden-runner egress policy for the jobs that hold no stored secret, no OIDC token and no write-scoped or publish-capable token (read-only contents, a SARIF upload at most), and whose output no privileged job consumes - exactly `audit` or `block`. Defaults to `block` since security exception EX-0001 (GitHub-hosted runners in westus2 broke harden-runner `block`) was closed on 2026-11-02 after harden-runner v2.22.3 passed on westus2; see docs/security/exceptions/. Every job still has the default read-only job token. Set `audit` to opt out if the defect recurs. Any other job follows `egress-policy`. Any other value fails the job.
        type: string
        default: block
      allowed-endpoints:
        description: harden-runner allow-list for `block`, space-separated host:port entries. The default is the tool downloads, Trivy's checks bundle and PyPI (actionlint's `pipx install pyflakes` in workflow lint); provider registries a real module reaches go in `extra-allowed-endpoints`. Wildcards are not supported and a newline-separated list matches nothing.
        type: string
        default: "api.doppler.com:443 api.github.com:443 check.trivy.dev:443 files.pythonhosted.org:443 get.trivy.dev:443 ghcr.io:443 github.com:443 mirror.gcr.io:443 objects.githubusercontent.com:443 pkg-containers.githubusercontent.com:443 pypi.org:443 raw.githubusercontent.com:443 registry.npmjs.org:443 registry.opentofu.org:443 release-assets.githubusercontent.com:443"
      extra-allowed-endpoints:
        description: Appended to `allowed-endpoints`, for hosts only this repository reaches, such as a provider registry or a cloud API the plan talks to. Same format.
        type: string
        default: ""
      doppler-project:
        description: Doppler project slug.
        type: string
        default: ""
      doppler-config:
        description: Doppler config slug holding the plan's credentials.
        type: string
        default: ""
      doppler-identity-id:
        description: Doppler Service Account Identity UUID for OIDC.
        type: string
        default: ""
      doppler-trusted-refs-only:
        description: Fetch secrets only on the default branch, a version tag (vN.N.N) or a schedule; never on a pull request or another branch. `false` restores fetching on every same-repository run.
        type: boolean
        default: true
      timeout-minutes:
        description: Per-job timeout.
        type: number
        default: 16
      runs-on:
        description: 'Runner for every job, as a JSON string, because `runs-on` takes a string, an array or an object: `"ubuntu-latest"`, `["self-hosted","linux"]` or `{"group":"my-group","labels":["linux"]}`. The default parses to the label this workflow always used. Invalid JSON fails the job at expression time. Jobs that follow `egress-policy-secretless` reach `audit` only on a GitHub-hosted runner and a label in the hosted list (EX-0001); see the workflow header for how harden-runner behaves on a self-hosted runner.'
        type: string
        default: '"ubuntu-latest"'
      skip-docs-only:
        description: >-
          Leave the `test-dirs` and `test` jobs out of a pull request that changes only documentation, with no per-repository edit
          beyond setting this. Off by default: a workflow cannot read whether its repository is private, so the caller opts in. A new
          `classify` job reads the pull request's changed files from the API (never from the checkout) and says docs-only only when
          every path matches `docs-only-patterns` and none is under `.github/` or `never-skip-patterns`; every doubt runs the tests.
          Format, validate, tflint, Trivy, policy, plan and workflow lint are never skipped, and `CI green` still fails on any failed
          job. The job holds `contents: read` only, so a private repository must also grant `pull-requests: read` in its caller to let
          it read the file list; without it the classifier fails closed and every job runs.
        type: boolean
        default: false
      docs-only-patterns:
        description: Newline-separated globs, anchored at the repository root (`*` stops at `/`, `**` crosses it), for the paths that make the tests unnecessary. The default is markdown only. A pattern that matches every path is refused. Used with `skip-docs-only`.
        type: string
        default: |
          *.md
          docs/**/*.md
      never-skip-patterns:
        description: Newline-separated globs that always run every job, on top of `.github/**`. The default keeps every Terraform and lock file (`.tf`, `.tfvars`, `.hcl`, which includes `.terraform.lock.hcl`, and `.lock`), so a configuration change is never skipped even when `docs-only-patterns` names its path. Used with `skip-docs-only`.
        type: string
        default: |
          **/*.tf
          **/*.tfvars
          **/*.hcl
          **/*.lock
      allow-self-hosted:
        description: 'Let these jobs run on a self-hosted runner (default false: on any runner that is not GitHub-hosted the job fails). Setting it true is the caller''s attestation that the runner is ephemeral, one job per VM, and isolated from secrets and the network. Even then a self-hosted runner takes only push, schedule, workflow_dispatch, release and same-repository pull_request events. Secret-bearing jobs belong on GitHub-hosted runners or a distinct ephemeral trusted pool.'
        type: boolean
        default: false
    secrets:
      DOPPLER_TOKEN:
        description: Doppler Service Token fallback when OIDC is not configured.
        required: false

permissions:
  contents: read

# Every job that runs the binary starts the same way; the steps are repeated
# rather than shared so that each job stands alone in the log.
jobs:
  # The docs-only skip (issue #460). A reusable workflow cannot check out its own commit, so the classifier is
  # inline: a byte-identical copy of scripts/classify_changes.py (tests/test_skip_docs_only.py holds the two
  # together). It holds `contents: read` and the job token, so it follows `egress-policy` (block by default), as
  # python-ci's classify does. The API read of a private repository needs `pull-requests: read` from the caller;
  # without it the script prints why and answers docs-only=false (every job runs).
  classify:
    name: Classify changes
    if: github.event_name == 'pull_request' && inputs.skip-docs-only
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - name: Validate the egress policy inputs
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: ${{ inputs.egress-policy == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          disable-sudo: true
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ (inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block' }}


      - name: Refuse an untrusted self-hosted runner
        timeout-minutes: 1
        shell: bash
        env:
          RUNNER_ENV: ${{ runner.environment }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          ALLOW_SELF_HOSTED: ${{ inputs.allow-self-hosted }}
        run: |
          set -u
          # Bash 3.2 compatible (macOS runners): lowercase through tr, keeping a trailing newline with a sentinel.
          lower() {
            LOWER=$(printf '%sx' "$1" | tr '[:upper:]' '[:lower:]')
            LOWER=${LOWER%x}
          }
          lower "$RUNNER_ENV"
          [ "$LOWER" = github-hosted ] && exit 0
          # Allowlist: only events whose code the repository's own writers control.
          lower "$EVENT_NAME"
          case "$LOWER" in
            push | schedule | workflow_dispatch | release) ;;
            pull_request)
              lower "$HEAD_REPO"
              head_repo=$LOWER
              lower "$THIS_REPO"
              if [ -z "$HEAD_REPO" ] || [ -z "$THIS_REPO" ] || [ "$head_repo" != "$LOWER" ]; then
                echo "::error title=self-hosted runner::a self-hosted runner never runs a pull request from a fork or from a repository it cannot name"
                exit 1
              fi
              ;;
            *)
              echo "::error title=self-hosted runner::a self-hosted runner runs only push, schedule, workflow_dispatch, release and same-repository pull_request events"
              exit 1
              ;;
          esac
          lower "$ALLOW_SELF_HOSTED"
          if [ "$LOWER" != true ]; then
            echo "::error title=self-hosted runner::a self-hosted runner needs allow-self-hosted: true, which attests that it is ephemeral, one job per VM, and isolated from secrets and the network"
            exit 1
          fi

      - name: Classify the changed files
        id: classify
        timeout-minutes: 2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CC_EVENT_NAME: ${{ github.event_name }}
          CC_REPO: ${{ github.repository }}
          CC_PR: ${{ github.event.pull_request.number }}
          CC_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CC_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          CC_PATTERNS: ${{ inputs.docs-only-patterns }}
          CC_NEVER_SKIP: ${{ inputs.never-skip-patterns }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          #!/usr/bin/env python3
          """Decide whether a pull request changes only files a caller calls "docs only".

          The answer feeds a deliberate skip: a caller leaves a job out of a docs-only
          pull request, and `scripts/ci_gate.py` counts that skip as a pass. It must
          therefore err one way only. Every doubt is `docs-only=false`, which runs the job.

          Inputs reach the script through the environment, never through its text:

            CC_EVENT_NAME      github.event_name; anything but `pull_request` is never docs only
            CC_REPO            OWNER/REPO whose pull request it is
            CC_PR              pull request number
            CC_HEAD_SHA        the head commit the event was started for
            CC_CHANGED_FILES   the event's own count of changed files
            CC_PATTERNS        newline-separated globs; a path is docs only when it matches one
            CC_NEVER_SKIP      newline-separated globs that always run the job, on top of `.github/**`
            GH_TOKEN           a token that can read the pull request (pull-requests: read)
            GITHUB_OUTPUT      where `docs-only`, `reason` and `changed` are written

          Glob syntax (anchored at the repository root, matched against the whole path):
          `*` any characters but `/`, `?` one such character, `**` anything including `/`,
          `**/` zero or more directories. Nothing else is special. A pattern that would
          match every path, starts with `/` or `!`, or contains `..` is a usage error.
          """

          from __future__ import annotations

          import json
          import os
          import re
          import subprocess
          import sys
          from collections.abc import Iterable

          # The API lists at most this many files of a pull request; a list this long may be cut short.
          API_FILE_LIMIT = 3000
          # Never docs only, whatever the caller's patterns say: the workflows, actions and rule files that
          # decide what runs. Changing them is changing the gate.
          ALWAYS_RUN = (".github/**",)


          class UsageError(Exception):
              pass


          def glob_to_regex(pattern: str) -> re.Pattern[str]:
              out: list[str] = []
              i = 0
              while i < len(pattern):
                  c = pattern[i]
                  if pattern.startswith("**/", i):
                      out.append("(?:[^/]+/)*")
                      i += 3
                  elif pattern.startswith("**", i):
                      out.append(".*")
                      i += 2
                  elif c == "*":
                      out.append("[^/]*")
                      i += 1
                  elif c == "?":
                      out.append("[^/]")
                      i += 1
                  else:
                      out.append(re.escape(c))
                      i += 1
              return re.compile("".join(out), re.DOTALL)


          def compile_patterns(text: str, what: str, reject_catch_all: bool) -> list[re.Pattern[str]]:
              compiled = []
              for raw in text.splitlines():
                  pattern = raw.strip()
                  if not pattern:
                      continue
                  if pattern.startswith(("/", "!", "#")) or ".." in pattern.split("/"):
                      raise UsageError(f"{what}: {pattern!r} must be a path glob relative to the root (no leading / ! #, no ..)")
                  rx = glob_to_regex(pattern)
                  # A catch-all would turn the fast path into "skip everything".
                  if reject_catch_all and (rx.fullmatch("x") or rx.fullmatch("a/b/c.tf")):
                      raise UsageError(f"{what}: {pattern!r} matches every path; name the directories or files instead")
                  compiled.append(rx)
              return compiled


          def paths_of(files: Iterable[dict]) -> set[str]:
              """Every path a change touches: the new name, and the old one of a rename (it left its directory)."""
              paths: set[str] = set()
              for f in files:
                  paths.add(f["filename"])
                  if f.get("previous_filename"):
                      paths.add(f["previous_filename"])
              return paths


          def classify(files: list[dict], patterns: list[re.Pattern[str]], never: list[re.Pattern[str]]) -> tuple[bool, str]:
              if not patterns:
                  return False, "no docs-only patterns were given"
              if not files:
                  return False, "the pull request lists no changed files"
              always = [glob_to_regex(p) for p in ALWAYS_RUN]
              for path in sorted(paths_of(files)):
                  # The API never returns these forms; a list that does is not one to trust.
                  if path.startswith("/") or {"", ".", ".."} & set(path.split("/")):
                      return False, f"{path!r} is not a normal repository path"
                  if any(rx.fullmatch(path) for rx in always) or any(rx.fullmatch(path) for rx in never):
                      return False, f"{path!r} is a path that always runs every job"
                  if not any(rx.fullmatch(path) for rx in patterns):
                      return False, f"{path!r} is not on the docs-only list"
              return True, "every changed path is on the docs-only list"


          def gh_json(args: list[str]) -> object:
              done = subprocess.run(["gh", "api", *args], capture_output=True, text=True, timeout=120, check=False)
              if done.returncode != 0:
                  raise RuntimeError(f"gh api {args[-1]} failed: {done.stderr.strip()[:200]!r}")
              return json.loads(done.stdout)


          def fetch_files(repo: str, pr: str, head_sha: str, changed: str) -> list[dict]:
              """The pull request's files from the API, checked against what the event itself says.

              The pull request is read before the file pages and again after the last one; the head must be the commit the
              run started for both times and the count must agree three ways (event, listing, final read), so a push or a
              rewrite while the pages were fetched cannot leave a list of no particular commit standing.
              Raises RuntimeError on any mismatch; the caller turns that into docs-only=false."""

              def read_meta() -> dict:
                  meta = gh_json([f"repos/{repo}/pulls/{pr}"])
                  if not isinstance(meta, dict):
                      raise RuntimeError("the pull request could not be read")
                  return meta

              if read_meta().get("head", {}).get("sha") != head_sha:
                  raise RuntimeError("the pull request head is no longer the commit this run was started for")
              pages = gh_json(["--paginate", "--slurp", f"repos/{repo}/pulls/{pr}/files?per_page=100"])
              files = [f for page in pages for f in page]
              final = read_meta()
              if final.get("head", {}).get("sha") != head_sha:
                  raise RuntimeError("the pull request head moved while its files were being listed")
              if not changed.isdigit() or int(changed) != len(files) or final.get("changed_files") != len(files):
                  raise RuntimeError(
                      f"file counts disagree: listing {len(files)}, event {changed!r}, final read {final.get('changed_files')!r}"
                  )
              if len(files) >= API_FILE_LIMIT:
                  raise RuntimeError("the file list may be cut short by the API limit")
              return files


          def write_outputs(docs_only: bool, reason: str, changed: int) -> None:
              reason = " ".join(reason.split())
              line = f"docs-only={'true' if docs_only else 'false'}\nreason={reason}\nchanged={changed}\n"
              target = os.environ.get("GITHUB_OUTPUT")
              if target:
                  with open(target, "a", encoding="utf-8") as fh:
                      fh.write(line)
              print(line, end="")


          def main() -> int:
              env = os.environ
              try:
                  patterns = compile_patterns(env.get("CC_PATTERNS", ""), "patterns", True)
                  never = compile_patterns(env.get("CC_NEVER_SKIP", ""), "never-skip", False)
              except UsageError as err:
                  print(f"::error title=classify-changes::{err}")
                  return 1
              if env.get("CC_EVENT_NAME") != "pull_request":
                  write_outputs(False, f"the event is {env.get('CC_EVENT_NAME', '')!r}, not a pull request", 0)
                  return 0
              try:
                  files = fetch_files(
                      env.get("CC_REPO", ""), env.get("CC_PR", ""), env.get("CC_HEAD_SHA", ""), env.get("CC_CHANGED_FILES", "")
                  )
              except (RuntimeError, OSError, ValueError, KeyError, subprocess.SubprocessError) as err:
                  print(f"::warning title=classify-changes::running every job: {err}")
                  write_outputs(False, "the changed files could not be read and confirmed", 0)
                  return 0
              docs_only, reason = classify(files, patterns, never)
