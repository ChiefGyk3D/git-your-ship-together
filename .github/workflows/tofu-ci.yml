# Reusable CI for OpenTofu (or Terraform) configuration: fmt, validate, tflint
# and a Trivy configuration scan on every push and pull request, none of
# which needs a cloud credential; optionally `tofu test` (whose mocked
# providers need none either) and `opa test` over policy-as-code that lives
# beside the configuration; and a plan on pushes to the default branch only,
# with credentials fetched through the Doppler gate, which refuses a pull
# request by design. Nothing applies from CI, ever.
#
# Call it from a repository with:
#
#   jobs:
#     tofu:
#       uses: ChiefGyk3D/git-your-ship-together/.github/workflows/tofu-ci.yml@<sha> # vX.Y.Z
#       permissions:
#         contents: read
#         id-token: write        # only the plan job uses it, and only off a pull request
#       secrets:
#         DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional fallback
#       with:
#         directories: infra/terraform/examples/ecs-fargate infra/terraform/examples/eks-cronjob
#         test: true                          # tofu test in each directory
#         policy-directories: policies        # opa test over the Rego there
#
# The binary is OpenTofu, downloaded at a pinned version and checked against
# a pinned SHA-256; `binary: terraform` uses the Terraform the runner image
# ships instead. tflint and OPA are downloaded the same way. The `ci-green`
# job at the end is the one to name in branch protection.
#
# Commands a caller supplies reach the shell through an environment
# variable, never by template expansion into the script. The Doppler steps
# are the same as .github/actions/doppler-secrets, inlined so that a caller
# pinned to a commit of this file gets exactly that commit's behaviour.

name: Tofu CI (reusable)

on:
  workflow_call:
    inputs:
      directories:
        description: Space-separated root modules to validate, lint and scan, relative to the repository root.
        type: string
        default: "."
      binary:
        description: "`tofu` (downloaded at `tofu-version`) or `terraform` (the runner image's)."
        type: string
        default: tofu
      tofu-version:
        description: OpenTofu release to download (opentofu/opentofu), without the `v`.
        type: string
        default: "1.12.6"
      tofu-sha256:
        description: SHA-256 of the OpenTofu linux_amd64 zip for that version.
        type: string
        default: "5dc43da4f750f33873dc25e94587128709e819e544b7be9016b255316153c3a8"
      tflint:
        description: Run tflint over every directory.
        type: boolean
        default: true
      tflint-version:
        description: tflint release to download (terraform-linters/tflint), without the `v`.
        type: string
        default: "0.64.0"
      tflint-sha256:
        description: SHA-256 of the tflint linux_amd64 zip for that version.
        type: string
        default: "cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537"
      test:
        description: Run `tofu test` (or `terraform test`) in every directory, after `init -backend=false`. Off by default because a test file that reaches a real provider would need a credential this job never has; turn it on when the tests use mocked providers.
        type: boolean
        default: false
      policy-directories:
        description: Space-separated directories of Rego policies (Spacelift, Conftest, OPA) with their `_test.rego` files, relative to the repository root. Each gets `opa fmt`, `opa check --strict` and `opa test`; empty skips the job.
        type: string
        default: ""
      opa-version:
        description: OPA release to download (open-policy-agent/opa), without the `v`.
        type: string
        default: "1.21.0"
      opa-sha256:
        description: SHA-256 of the OPA linux_amd64_static binary for that version.
        type: string
        default: "5eef70644868bb04d0556bcc795ee42f2ab379e73f51d1bfa30f83e1305bc9b9"
      trivy:
        description: Run Trivy's configuration scan over the repository.
        type: boolean
        default: true
      trivy-severity:
        description: Severities the configuration scan reports.
        type: string
        default: CRITICAL,HIGH
      trivy-exit-code:
        description: Exit code when the scan finds something; `1` fails the job, `0` reports only. A migration aid, not a resting state.
        type: string
        default: "1"
      plan-command:
        description: Shell that plans, e.g. `cd infra/live && tofu init -input=false && tofu plan -input=false`, run only on a push to the default branch with the Doppler config's secrets in the environment; empty skips the job.
        type: string
        default: ""
      workflow-lint:
        description: Run actionlint and zizmor over the caller's own workflow files. Turn off on one caller job when another already runs it.
        type: boolean
        default: true
      zizmor-persona:
        description: zizmor strictness - `regular`, `pedantic` or `auditor`.
        type: string
        default: regular
      egress-policy:
        description: harden-runner egress policy for every job - `audit` logs outbound connections, `block` allows only `allowed-endpoints`. Jobs that hold no secret follow `egress-policy-secretless` instead (EX-0001).
        type: string
        default: audit
      egress-policy-secretless:
        description: harden-runner egress policy for the jobs that hold no stored secret, no OIDC token and no write-scoped or publish-capable token (read-only contents, a SARIF upload at most), and whose output no privileged job consumes - exactly `audit` or `block`. Defaults to `audit` while security exception EX-0001 is active (GitHub-hosted runners in westus2 break harden-runner `block`; expires 2026-11-07 or when step-security/harden-runner#708 is fixed; see docs/security/exceptions/). Every job still has the default read-only job token. Set `block` to opt back in. Any other job follows `egress-policy`. Any other value fails the job.
        type: string
        default: audit
      allowed-endpoints:
        description: harden-runner allow-list for `block`, space-separated host:port entries. The default is the tool downloads and Trivy's checks bundle; provider registries a real module reaches go in `extra-allowed-endpoints`. Wildcards are not supported and a newline-separated list matches nothing.
        type: string
        default: "api.doppler.com:443 api.github.com:443 check.trivy.dev:443 get.trivy.dev:443 ghcr.io:443 github.com:443 mirror.gcr.io:443 objects.githubusercontent.com:443 pkg-containers.githubusercontent.com:443 raw.githubusercontent.com:443 registry.npmjs.org:443 registry.opentofu.org:443 release-assets.githubusercontent.com:443"
      extra-allowed-endpoints:
        description: Appended to `allowed-endpoints`, for hosts only this repository reaches, such as a provider registry or a cloud API the plan talks to. Same format.
        type: string
        default: ""
      doppler-project:
        description: Doppler project slug.
        type: string
        default: ""
      doppler-config:
        description: Doppler config slug holding the plan's credentials.
        type: string
        default: ""
      doppler-identity-id:
        description: Doppler Service Account Identity UUID for OIDC.
        type: string
        default: ""
      doppler-trusted-refs-only:
        description: Fetch secrets only on the default branch, a version tag (vN.N.N) or a schedule; never on a pull request or another branch. `false` restores fetching on every same-repository run.
        type: boolean
        default: true
      timeout-minutes:
        description: Per-job timeout.
        type: number
        default: 16
    secrets:
      DOPPLER_TOKEN:
        description: Doppler Service Token fallback when OIDC is not configured.
        required: false

permissions:
  contents: read

# Every job that runs the binary starts the same way; the steps are repeated
# rather than shared so that each job stands alone in the log.
jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Validate the egress policy inputs (EX-0001)
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ (inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          disable-sudo: true
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ ((inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block') == 'block' }}

      - name: Egress canary (EX-0001)
        if: ${{ runner.os == 'Linux' && (((inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block') == 'block') }}
        timeout-minutes: 2
        shell: bash
        # The workspace root exists before checkout; a job default working-directory may not.
        working-directory: ${{ github.workspace }}
        run: |
          set -u
          NAMES="github.com api.github.com results-receiver.actions.githubusercontent.com"
          PORT=443
          canary_resolve() { timeout 5 getent ahostsv4 "$1" 2>/dev/null | awk '$2 == "STREAM" { print $1 }'; }
          canary_probe() { timeout 3 bash -c "exec 3<>\"/dev/tcp/\$0/\$1\"" "$1" "$PORT" 2>/dev/null; }
          canary_reach() {
            local i
            for i in 1 2 3 4; do
              canary_probe "$1" && return 0
              [ "$i" -lt 4 ] && sleep 1
            done
            return 1
          }
          canary_show() { local n=$1; shift; echo "+ $*"; { timeout 10 "$@" 2>&1 || true; } | head -n "$n" || true; }
          canary_diag() {
            local name
            echo "::group::egress canary diagnostics (EX-0001, for the GitHub Support ticket)"
            canary_show 5 uname -srmo
            canary_show 20 cat /etc/resolv.conf
            canary_show 20 bash -c "resolvectl status 2>/dev/null | grep -E '^ *(Current DNS Server|DNS Servers?|DNS Domain):'"
            canary_show 20 bash -c "ss -lun | grep ':53 '"
            for name in $NAMES pipelines.actions.githubusercontent.com; do
              canary_show 20 getent ahostsv4 "$name"
              canary_show 5 curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_connect}\n' --max-time 8 "https://$name"
            done
            echo "::endgroup::"
          }
          canary_main() {
            local tmp name addr n=0 bad
            tmp=$(mktemp -d) || return 1
            for _ in 1 2 3; do
              for name in $NAMES; do canary_resolve "$name" >>"$tmp/res.$name" & done
              wait
              sleep 1
            done
            for name in $NAMES; do
              if [ -s "$tmp/res.$name" ]; then sort -u "$tmp/res.$name"; else echo "-"; fi | sed "s|^|$name |" >>"$tmp/pairs"
            done
            while read -r name addr; do
              n=$((n + 1))
              ( { [ "$addr" != "-" ] && canary_reach "$addr"; } || echo "$name $addr" >"$tmp/bad.$n" ) </dev/null &
            done <"$tmp/pairs"
            wait
            bad=$(cat "$tmp"/bad.* 2>/dev/null | sort || true)
            rm -rf "$tmp"
            if [ -z "$bad" ]; then
              echo "egress canary: all $n addresses of $NAMES accept TCP $PORT"
              return 0
            fi
            echo "::error title=egress canary::egress broken on this runner (known westus2 DNS issue, EX-0001): rerun the job"
            echo "unreachable addresses (name address; '-' means the name did not resolve):"
            printf '%s\n' "$bad"
            canary_diag
            echo "EX-0001 egress canary failed, unreachable: $(printf '%s' "$bad" | tr '\n' ';')" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            return 1
          }
          set -m
          canary_main &
          main=$!
          (sleep 90; kill -TERM -- "-$main"; sleep 2; kill -KILL -- "-$main") >/dev/null 2>&1 &
          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
            kill -TERM -- "-$main" >/dev/null 2>&1 || true
            sleep 1
            kill -KILL -- "-$main" >/dev/null 2>&1 || true
          fi
          if [ "$rc" -eq 143 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=egress canary::the canary hit its 90 s deadline (EX-0001): rerun the job"
            rc=124
          fi
          exit "$rc"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore the cached tofu archive
        if: inputs.binary == 'tofu'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tool-cache/tofu
          key: tool-tofu-${{ inputs.tofu-version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install the binary at the pinned version
        env:
          BINARY: ${{ inputs.binary }}
          VERSION: ${{ inputs.tofu-version }}
          SHA256: ${{ inputs.tofu-sha256 }}
          CACHE_DIR: ${{ runner.temp }}/tool-cache/tofu
        run: |
          set -euo pipefail
          case "$BINARY" in
            tofu)
              mkdir -p "$CACHE_DIR"
              # The cache holds only the downloaded archive, and the archive is
              # checked against the pinned hash whether it came from the cache or
              # the network; a cached file that fails is discarded and fetched again.
              if [ -f "$CACHE_DIR/tofu.zip" ] && ! echo "${SHA256}  $CACHE_DIR/tofu.zip" | sha256sum --status -c -; then
                echo "cached OpenTofu archive does not match the pinned hash; fetching it again"
                rm -f "$CACHE_DIR/tofu.zip"
              fi
              if [ ! -f "$CACHE_DIR/tofu.zip" ]; then
                curl -sSfL -o "$CACHE_DIR/tofu.zip" "https://github.com/opentofu/opentofu/releases/download/v${VERSION}/tofu_${VERSION}_linux_amd64.zip"
              fi
              echo "${SHA256}  $CACHE_DIR/tofu.zip" | sha256sum -c -
              unzip -q -o "$CACHE_DIR/tofu.zip" tofu -d /tmp
              install -m 0755 /tmp/tofu /usr/local/bin/tofu
              ;;
            terraform) command -v terraform ;;
            *) echo "::error::binary must be tofu or terraform, not $BINARY"; exit 1 ;;
          esac
          "$BINARY" version

      - name: fmt -check
        env:
          BINARY: ${{ inputs.binary }}
          DIRECTORIES: ${{ inputs.directories }}
        run: |
          set -euo pipefail
          read -r -a dirs <<< "$DIRECTORIES"
          for d in "${dirs[@]}"; do
            echo "== $d"
            "$BINARY" fmt -check -diff -recursive "$d"
          done

  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Validate the egress policy inputs (EX-0001)
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ (inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          disable-sudo: true
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ ((inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block') == 'block' }}

      - name: Egress canary (EX-0001)
        if: ${{ runner.os == 'Linux' && (((inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block') == 'block') }}
        timeout-minutes: 2
        shell: bash
        # The workspace root exists before checkout; a job default working-directory may not.
        working-directory: ${{ github.workspace }}
        run: |
          set -u
          NAMES="github.com api.github.com results-receiver.actions.githubusercontent.com"
          PORT=443
          canary_resolve() { timeout 5 getent ahostsv4 "$1" 2>/dev/null | awk '$2 == "STREAM" { print $1 }'; }
          canary_probe() { timeout 3 bash -c "exec 3<>\"/dev/tcp/\$0/\$1\"" "$1" "$PORT" 2>/dev/null; }
          canary_reach() {
            local i
            for i in 1 2 3 4; do
              canary_probe "$1" && return 0
              [ "$i" -lt 4 ] && sleep 1
            done
            return 1
          }
          canary_show() { local n=$1; shift; echo "+ $*"; { timeout 10 "$@" 2>&1 || true; } | head -n "$n" || true; }
          canary_diag() {
            local name
            echo "::group::egress canary diagnostics (EX-0001, for the GitHub Support ticket)"
            canary_show 5 uname -srmo
            canary_show 20 cat /etc/resolv.conf
            canary_show 20 bash -c "resolvectl status 2>/dev/null | grep -E '^ *(Current DNS Server|DNS Servers?|DNS Domain):'"
            canary_show 20 bash -c "ss -lun | grep ':53 '"
            for name in $NAMES pipelines.actions.githubusercontent.com; do
              canary_show 20 getent ahostsv4 "$name"
              canary_show 5 curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_connect}\n' --max-time 8 "https://$name"
            done
            echo "::endgroup::"
          }
          canary_main() {
            local tmp name addr n=0 bad
            tmp=$(mktemp -d) || return 1
            for _ in 1 2 3; do
              for name in $NAMES; do canary_resolve "$name" >>"$tmp/res.$name" & done
              wait
              sleep 1
            done
            for name in $NAMES; do
              if [ -s "$tmp/res.$name" ]; then sort -u "$tmp/res.$name"; else echo "-"; fi | sed "s|^|$name |" >>"$tmp/pairs"
            done
            while read -r name addr; do
              n=$((n + 1))
              ( { [ "$addr" != "-" ] && canary_reach "$addr"; } || echo "$name $addr" >"$tmp/bad.$n" ) </dev/null &
            done <"$tmp/pairs"
            wait
            bad=$(cat "$tmp"/bad.* 2>/dev/null | sort || true)
            rm -rf "$tmp"
            if [ -z "$bad" ]; then
              echo "egress canary: all $n addresses of $NAMES accept TCP $PORT"
              return 0
            fi
            echo "::error title=egress canary::egress broken on this runner (known westus2 DNS issue, EX-0001): rerun the job"
            echo "unreachable addresses (name address; '-' means the name did not resolve):"
            printf '%s\n' "$bad"
            canary_diag
            echo "EX-0001 egress canary failed, unreachable: $(printf '%s' "$bad" | tr '\n' ';')" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            return 1
          }
          set -m
          canary_main &
          main=$!
          (sleep 90; kill -TERM -- "-$main"; sleep 2; kill -KILL -- "-$main") >/dev/null 2>&1 &
          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
            kill -TERM -- "-$main" >/dev/null 2>&1 || true
            sleep 1
            kill -KILL -- "-$main" >/dev/null 2>&1 || true
          fi
          if [ "$rc" -eq 143 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=egress canary::the canary hit its 90 s deadline (EX-0001): rerun the job"
            rc=124
          fi
          exit "$rc"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore the cached tofu archive
        if: inputs.binary == 'tofu'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tool-cache/tofu
          key: tool-tofu-${{ inputs.tofu-version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install the binary at the pinned version
        env:
          BINARY: ${{ inputs.binary }}
          VERSION: ${{ inputs.tofu-version }}
          SHA256: ${{ inputs.tofu-sha256 }}
          CACHE_DIR: ${{ runner.temp }}/tool-cache/tofu
        run: |
          set -euo pipefail
          case "$BINARY" in
            tofu)
              mkdir -p "$CACHE_DIR"
              # The cache holds only the downloaded archive, and the archive is
              # checked against the pinned hash whether it came from the cache or
              # the network; a cached file that fails is discarded and fetched again.
              if [ -f "$CACHE_DIR/tofu.zip" ] && ! echo "${SHA256}  $CACHE_DIR/tofu.zip" | sha256sum --status -c -; then
                echo "cached OpenTofu archive does not match the pinned hash; fetching it again"
                rm -f "$CACHE_DIR/tofu.zip"
              fi
              if [ ! -f "$CACHE_DIR/tofu.zip" ]; then
                curl -sSfL -o "$CACHE_DIR/tofu.zip" "https://github.com/opentofu/opentofu/releases/download/v${VERSION}/tofu_${VERSION}_linux_amd64.zip"
              fi
              echo "${SHA256}  $CACHE_DIR/tofu.zip" | sha256sum -c -
              unzip -q -o "$CACHE_DIR/tofu.zip" tofu -d /tmp
              install -m 0755 /tmp/tofu /usr/local/bin/tofu
              ;;
            terraform) command -v terraform ;;
            *) echo "::error::binary must be tofu or terraform, not $BINARY"; exit 1 ;;
          esac
          "$BINARY" version

      # No backend and no credentials: validate reads the configuration and
      # the providers' schemas, which is all a pull request may do.
      - name: init -backend=false, validate
        env:
          BINARY: ${{ inputs.binary }}
          DIRECTORIES: ${{ inputs.directories }}
        run: |
          set -euo pipefail
          read -r -a dirs <<< "$DIRECTORIES"
          for d in "${dirs[@]}"; do
            echo "== $d"
            (cd "$d" && "$BINARY" init -backend=false -input=false && "$BINARY" validate)
          done

  # `tofu test` with whatever the caller's test files declare. Mocked providers
  # need no credential and this job never has one, so a test file that reaches
  # a real provider fails here, which is the point: that test belongs behind
  # the plan's gate, not on a pull request. Opt-in for the same reason.
  test:
    name: test
    if: inputs.test
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Validate the egress policy inputs (EX-0001)
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
