          if [ "$LOWER" != true ]; then
            echo "::error title=self-hosted runner::a self-hosted runner needs allow-self-hosted: true, which attests that it is ephemeral, one job per VM, and isolated from secrets and the network"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore the cached tofu archive
        if: inputs.binary == 'tofu'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tool-cache/tofu
          key: tool-tofu-${{ inputs.tofu-version }}-${{ runner.os }}-${{ runner.arch }}

      - name: Download the binary at the pinned version
        if: inputs.binary == 'tofu'
        env:
          FETCH_RELEASE_TOKEN: ${{ github.token }}
