# The old name of container-release.yml, kept so that a caller pinned to a
# commit of this file keeps working. Everything is forwarded, nothing is
# decided here: the inputs, their defaults and descriptions, the secret and
# the outputs are those of container-release.yml at this same commit, which
# tests/test_workflows.py holds identical. A `./` reference resolves to the
# commit of the workflow that contains it, so a caller's pin still pins.
#
# New callers use container-release.yml directly; the README shows how.

name: Python container release (reusable)

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Path to the Dockerfile.
        type: string
        default: Dockerfile
      context:
        description: Build context.
        type: string
        default: .
      platforms:
        description: Platforms for the published image.
        type: string
        default: linux/amd64,linux/arm64
      image-name:
        description: Image name under ghcr.io. Defaults to the repository name, lower-cased.
        type: string
        default: ''
      push:
        description: Publish. False builds, tests and scans only.
        type: boolean
        default: false
      tags:
        description: docker/metadata-action tag rules.
        type: string
        default: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}
      docker-test-command:
        description: Shell run against the locally built image; `$IMAGE` names it. Empty skips the check.
        type: string
        default: ''
      dockerhub:
        description: Also publish to Docker Hub when the Doppler config holds DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
        type: boolean
        default: false
      dockerhub-repository:
        description: Docker Hub repository name (without the namespace). Defaults to the repository name, lower-cased.
        type: string
        default: ''
      sign:
        description: Sign the published image with cosign (keyless).
        type: boolean
        default: true
      sbom:
        description: Generate an SPDX SBOM with syft and attach it as a cosign attestation.
        type: boolean
        default: true
      provenance:
        description: Record SLSA build provenance with GitHub Artifact Attestations.
        type: boolean
        default: true
      trivy:
        description: Scan the built image with Trivy and upload SARIF.
        type: boolean
        default: true
      trivy-severity:
        description: Severities Trivy reports.
        type: string
        default: CRITICAL,HIGH
      trivy-exit-code:
        description: Trivy exit code when findings exist. "1" makes findings fail the job.
        type: string
        default: '0'
      egress-policy:
        description: harden-runner egress policy - `audit` logs outbound connections, `block` allows only `allowed-endpoints`.
        type: string
        default: audit
      allowed-endpoints:
        description: harden-runner allow-list for `block`, space-separated host:port entries. The default is every endpoint this workflow's jobs reached in audit mode across the calling repositories; the runner's own infrastructure needs no entry. Wildcards are not supported and a newline-separated list matches nothing.
        type: string
        default: api.doppler.com:443 api.github.com:443 auth.docker.io:443 check.trivy.dev:443 deb.debian.org:80 files.pythonhosted.org:443 fulcio.sigstore.dev:443 get.trivy.dev:443 ghcr.io:443 github.com:443 index.docker.io:443 mirror.gcr.io:443 pkg-containers.githubusercontent.com:443 production.cloudfront.docker.com:443 pypi.org:443 raw.githubusercontent.com:443 registry-1.docker.io:443 rekor.sigstore.dev:443 release-assets.githubusercontent.com:443 timestamp.sigstore.dev:443 tuf-repo-cdn.sigstore.dev:443
      extra-allowed-endpoints:
        description: Appended to `allowed-endpoints`, for hosts only this repository reaches, such as an apt repository its Dockerfile adds. Same format.
        type: string
        default: ''
      doppler-project:
        description: Doppler project slug.
        type: string
        default: ''
      doppler-config:
        description: Doppler config slug holding CI secrets.
        type: string
        default: ''
      doppler-identity-id:
        description: Doppler Service Account Identity UUID for OIDC.
        type: string
        default: ''
      doppler-trusted-refs-only:
        description: Fetch CI secrets only on the default branch, a tag or a schedule; never on a pull request or another branch. `false` restores fetching on every same-repository run.
        type: boolean
        default: true
      timeout-minutes:
        description: Job timeout. Multi-arch builds that compile native code need a generous one.
        type: number
        default: 60
    secrets:
      DOPPLER_TOKEN:
        description: Doppler Service Token fallback when OIDC is not configured.
        required: false
    outputs:
      digest:
        description: Digest of the published image index (empty when not pushed).
        value: ${{ jobs.release.outputs.digest }}
      image:
        description: The GHCR image reference by digest (empty when not pushed).
        value: ${{ jobs.release.outputs.image }}

permissions:
  contents: read

jobs:
  release:
    uses: ./.github/workflows/container-release.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      packages: write  # forwarded: push the image, signature, SBOM attestation and provenance
      id-token: write  # forwarded: cosign keyless signing, provenance, Doppler OIDC
      attestations: write  # forwarded: the SLSA provenance record
      security-events: write  # forwarded: the Trivy SARIF upload
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    with:
      dockerfile: ${{ inputs.dockerfile }}
      context: ${{ inputs.context }}
      platforms: ${{ inputs.platforms }}
      image-name: ${{ inputs.image-name }}
      push: ${{ inputs.push }}
      tags: ${{ inputs.tags }}
      docker-test-command: ${{ inputs.docker-test-command }}
      dockerhub: ${{ inputs.dockerhub }}
      dockerhub-repository: ${{ inputs.dockerhub-repository }}
      sign: ${{ inputs.sign }}
      sbom: ${{ inputs.sbom }}
      provenance: ${{ inputs.provenance }}
      trivy: ${{ inputs.trivy }}
      trivy-severity: ${{ inputs.trivy-severity }}
      trivy-exit-code: ${{ inputs.trivy-exit-code }}
      egress-policy: ${{ inputs.egress-policy }}
      allowed-endpoints: ${{ inputs.allowed-endpoints }}
      extra-allowed-endpoints: ${{ inputs.extra-allowed-endpoints }}
      doppler-project: ${{ inputs.doppler-project }}
      doppler-config: ${{ inputs.doppler-config }}
      doppler-identity-id: ${{ inputs.doppler-identity-id }}
      doppler-trusted-refs-only: ${{ inputs.doppler-trusted-refs-only }}
      timeout-minutes: ${{ inputs.timeout-minutes }}
