# Reusable container release: build once, test it, scan it, then publish a
# multi-arch image with the provenance an integrator can verify.
#
#   1. Build for the runner's platform, load it, run the caller's check.
#   2. Scan it with Trivy; results go to the Security tab as SARIF.
#   3. When `push` is true: build linux/amd64 + linux/arm64 and push to GHCR
#      (and Docker Hub when the Doppler config carries credentials), then
#        - sign the index with cosign (keyless, Sigstore, GitHub OIDC identity),
#        - generate an SPDX SBOM with syft, attach it as a cosign attestation
#          and keep it as a workflow artifact,
#        - record SLSA build provenance with GitHub Artifact Attestations.
#
# Call it with:
#
#   jobs:
#     release:
#       uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-docker-release.yml@main
#       permissions:
#         contents: read
#         packages: write
#         id-token: write
#         attestations: write
#         security-events: write
#       secrets: inherit
#       with:
#         dockerfile: docker/Dockerfile
#         push: ${{ github.event_name != 'pull_request' }}
#         docker-test-command: docker run --rm "$IMAGE" --version
#
# Secrets come from Doppler (see .github/actions/doppler-secrets). Docker Hub
# publishing reads DOCKERHUB_USERNAME and DOCKERHUB_TOKEN from the Doppler
# config; GHCR needs only the job's own GITHUB_TOKEN.
#
# Verify a published image with:
#
#   cosign verify ghcr.io/<owner>/<repo>:<tag> \
#     --certificate-identity-regexp '^https://github.com/ChiefGyk3D/git-your-ship-together/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   cosign verify-attestation --type spdxjson ghcr.io/<owner>/<repo>:<tag> \
#     --certificate-identity-regexp '^https://github.com/ChiefGyk3D/git-your-ship-together/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify oci://ghcr.io/<owner>/<repo>:<tag> --owner <owner>
#
# The signing identity is this reusable workflow, not the caller: that is how
# keyless signing attributes a job that runs in a reusable workflow, and it
# means one identity to trust across every repository that calls it.

name: Python container release (reusable)

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Path to the Dockerfile.
        type: string
        default: Dockerfile
      context:
        description: Build context.
        type: string
        default: "."
      platforms:
        description: Platforms for the published image.
        type: string
        default: linux/amd64,linux/arm64
      image-name:
        description: Image name under ghcr.io. Defaults to the repository name, lower-cased.
        type: string
        default: ""
      push:
        description: Publish. False builds, tests and scans only.
        type: boolean
        default: false
      tags:
        description: docker/metadata-action tag rules.
        type: string
        default: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}
      docker-test-command:
        description: Shell run against the locally built image; `$IMAGE` names it. Empty skips the check.
        type: string
        default: ""
      dockerhub:
        description: Also publish to Docker Hub when the Doppler config holds DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
        type: boolean
        default: false
      dockerhub-repository:
        description: Docker Hub repository name (without the namespace). Defaults to the repository name, lower-cased.
        type: string
        default: ""
      sign:
        description: Sign the published image with cosign (keyless).
        type: boolean
        default: true
      sbom:
        description: Generate an SPDX SBOM with syft and attach it as a cosign attestation.
        type: boolean
        default: true
      provenance:
        description: Record SLSA build provenance with GitHub Artifact Attestations.
        type: boolean
        default: true
      trivy:
        description: Scan the built image with Trivy and upload SARIF.
        type: boolean
        default: true
      trivy-severity:
        description: Severities Trivy reports.
        type: string
        default: CRITICAL,HIGH
      trivy-exit-code:
        description: Trivy exit code when findings exist. "1" makes findings fail the job.
        type: string
        default: "0"
      doppler-project:
        description: Doppler project slug.
        type: string
        default: ""
      doppler-config:
        description: Doppler config slug holding CI secrets.
        type: string
        default: ""
      doppler-identity-id:
        description: Doppler Service Account Identity UUID for OIDC.
        type: string
        default: ""
      timeout-minutes:
        description: Job timeout. Multi-arch builds that compile native code need a generous one.
        type: number
        default: 60
    secrets:
      DOPPLER_TOKEN:
        description: Doppler Service Token fallback when OIDC is not configured.
        required: false
    outputs:
      digest:
        description: Digest of the published image index (empty when not pushed).
        value: ${{ jobs.release.outputs.digest }}
      image:
        description: The GHCR image reference by digest (empty when not pushed).
        value: ${{ jobs.release.outputs.image }}

permissions:
  contents: read

jobs:
  release:
    name: Build, test, scan${{ inputs.push && ', publish, sign' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.names.outputs.ghcr }}@${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch CI secrets from Doppler
        if: inputs.push && inputs.dockerhub
        uses: ChiefGyk3D/git-your-ship-together/.github/actions/doppler-secrets@main
        with:
          project: ${{ inputs.doppler-project }}
          config: ${{ inputs.doppler-config }}
          identity-id: ${{ inputs.doppler-identity-id }}
          token: ${{ secrets.DOPPLER_TOKEN }}

      - name: Resolve image names
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
          IMAGE_NAME: ${{ inputs.image-name }}
          DOCKERHUB: ${{ inputs.dockerhub }}
          DOCKERHUB_REPOSITORY: ${{ inputs.dockerhub-repository }}
          PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail
          repo_name="${REPOSITORY#*/}"
          repo_name="$(printf '%s' "$repo_name" | tr '[:upper:]' '[:lower:]')"
          owner="$(printf '%s' "${REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
          ghcr="ghcr.io/${owner}/${IMAGE_NAME:-$repo_name}"
          echo "ghcr=$ghcr" >> "$GITHUB_OUTPUT"
          images="$ghcr"
          hub=""
          if [ "$PUSH" = "true" ] && [ "$DOCKERHUB" = "true" ]; then
            if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
              hub="docker.io/${DOCKERHUB_USERNAME}/${DOCKERHUB_REPOSITORY:-$repo_name}"
              images="$images"$'\n'"$hub"
              echo "Docker Hub publish enabled: $hub"
            else
              echo "::warning title=Docker Hub::dockerhub is true but DOCKERHUB_USERNAME/DOCKERHUB_TOKEN were not fetched from Doppler - publishing to GHCR only"
            fi
          fi
          echo "dockerhub=$hub" >> "$GITHUB_OUTPUT"
          {
            echo "images<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: inputs.push

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: inputs.push && steps.names.outputs.dockerhub != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.names.outputs.images }}
          tags: ${{ inputs.tags }}

      - name: Build for this runner and load it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: false
          load: true
          tags: release-candidate:local
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image
        if: inputs.docker-test-command != ''
        env:
          IMAGE: release-candidate:local
        run: ${{ inputs.docker-test-command }}

      - name: Scan the image with Trivy
        if: inputs.trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: release-candidate:local
          format: sarif
          output: trivy-results.sarif
          severity: ${{ inputs.trivy-severity }}
          exit-code: ${{ inputs.trivy-exit-code }}
          ignore-unfixed: true

      - name: Upload Trivy results to the Security tab
        if: inputs.trivy && always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@c23de5a82f64bb08c6d9f28844551440ca298e76 # v4.38.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Build and push the multi-arch image
        if: inputs.push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Signing, the SBOM and provenance are produced below as explicit,
          # verifiable artefacts; BuildKit's own attestation manifests would
          # duplicate them and add unknown/unknown entries to the index.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: inputs.push && (inputs.sign || inputs.sbom)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        if: inputs.push && inputs.sign
        env:
          GHCR: ${{ steps.names.outputs.ghcr }}
          DOCKERHUB: ${{ steps.names.outputs.dockerhub }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          for image in $GHCR $DOCKERHUB; do
            echo "signing ${image}@${DIGEST}"
            cosign sign --yes "${image}@${DIGEST}"
          done

      - name: Generate the SBOM with syft
        if: inputs.push && inputs.sbom
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          image: ${{ steps.names.outputs.ghcr }}@${{ steps.push.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Attach the SBOM as a cosign attestation
        if: inputs.push && inputs.sbom
        env:
          GHCR: ${{ steps.names.outputs.ghcr }}
          DOCKERHUB: ${{ steps.names.outputs.dockerhub }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          for image in $GHCR $DOCKERHUB; do
            echo "attesting SBOM on ${image}@${DIGEST}"
            cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${image}@${DIGEST}"
          done

      - name: Record build provenance
        if: inputs.push && inputs.provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.ghcr }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: inputs.push
        env:
          GHCR: ${{ steps.names.outputs.ghcr }}
          DOCKERHUB: ${{ steps.names.outputs.dockerhub }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          SIGNED: ${{ inputs.sign }}
          SBOM: ${{ inputs.sbom }}
          PROVENANCE: ${{ inputs.provenance }}
        run: |
          {
            echo "## Published"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "| Artefact | Present |"
            echo "|---|---|"
            echo "| cosign signature | $SIGNED |"
            echo "| SPDX SBOM (syft, cosign attestation + artifact) | $SBOM |"
            echo "| SLSA provenance (GitHub attestation) | $PROVENANCE |"
            echo
            echo "Verify:"
            echo
            echo '```'
            echo "cosign verify ${GHCR}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/ChiefGyk3D/git-your-ship-together/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
