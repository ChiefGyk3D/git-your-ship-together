      - name: Validate the gitleaks-scope input
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GITLEAKS_SCOPE: ${{ inputs.gitleaks-scope }}
        run: |
          set -u
          value=${GITLEAKS_SCOPE-}
          case "$value" in
            pr-commits | all-refs) ;;
            *)
              echo "::error title=gitleaks-scope::the gitleaks-scope input must be exactly 'pr-commits' or 'all-refs' (its value is ${#value} characters long); the job fails until it is fixed"
              exit 1
              ;;
          esac

