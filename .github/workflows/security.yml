            echo "::error title=Snyk::snyk is enabled but $REF: ref is not a vMAJOR.MINOR.PATCH release tag: Doppler secrets are not fetched"
            exit 1
          fi
          if [ -z "${SNYK_TOKEN:-}" ]; then
            echo "::warning title=Snyk::snyk is enabled but SNYK_TOKEN is not in the Doppler config - scan skipped"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.token.outputs.present == 'true'
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies for Snyk Open Source
        if: steps.token.outputs.present == 'true'
        env:
          REQUIREMENTS: ${{ inputs.pip-audit-requirements }}
          INSTALL: ${{ inputs.snyk-install-command }}
        run: |
          # A lock is installed under --require-hashes, the same way the images
          # install it. A plain pin list is refused rather than installed
          # unchecked: it was the one unhashed install left in this file
          # (Scorecard PinnedDependenciesID, issue #87), and every caller
          # that names a lock already hashes it. A repository with no lock
          # names its own install (`pip install .`): the project's build runs
          # here, as it already does for pip-audit's audit-command, on a
          # trusted ref only, with nothing a `pip install -r` of third-party
          # packages would not run as well.
          if [ -n "$REQUIREMENTS" ]; then
            if ! grep -q -- '--hash=' "$REQUIREMENTS"; then
              echo "::error title=Snyk::$REQUIREMENTS has no hashes. Compile it with --generate-hashes (pip-compile or uv pip compile); Snyk's install runs under --require-hashes."
              exit 1
            fi
            pip install --require-hashes -r "$REQUIREMENTS"
          elif [ -n "$INSTALL" ]; then
            eval "$INSTALL"
          fi

      - uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        if: steps.token.outputs.present == 'true'

      # Snyk exits 1 when it finds something, 2 when it could not run at all
      # (an expired or revoked SNYK_TOKEN included) and 3 when it found
      # nothing it knows how to scan. Findings are reported through the SARIF
      # upload, not by failing the job; a scan that never happened fails it,
      # so an expired token shows up as a red job on the next push or schedule
      # instead of a quietly empty Security tab. Exit 3 is a warning, not a
      # failure: a shell-only repository has no files Snyk Code reads
      # (SNYK-CODE-0006, measured on Patch-Gremlin 2026-10-03) and no manifest
      # for Snyk Open Source, and that is a fact about the repository, not a
      # scan that broke.
      - name: Snyk Code (SAST)
        if: steps.token.outputs.present == 'true'
        run: |
          if snyk code test --sarif-file-output=snyk-code.sarif; then rc=0; else rc=$?; fi
          case "$rc" in
            0|1) ;;
            3) echo "::warning title=Snyk::snyk code test found no files it can analyse (exit 3); nothing scanned" ;;
            *) echo "::error title=Snyk::snyk code test did not run (exit $rc): an expired or revoked SNYK_TOKEN, or a project it could not read"; exit "$rc" ;;
          esac

      - name: Snyk Open Source (SCA)
        if: steps.token.outputs.present == 'true'
        env:
          REQUIREMENTS: ${{ inputs.pip-audit-requirements }}
          INSTALL: ${{ inputs.snyk-install-command }}
        run: |
          # Snyk's pip resolver reads the requirements file itself and refuses
          # the whole file when a line names a package that is not installed.
          # A universal lock (uv pip compile --universal) always has such
          # lines: pins under markers for other Pythons and platforms, which
          # pip skips with "Ignoring X: markers ... don't match". Measured
          # 2026-10-03 on four repositories: exit 2, "Missing required
          # packages", and --skip-unresolved=true changes nothing. Reproduced
          # locally with the CLI; a freeze of the installed environment scanned
          # the same project clean (49 dependencies).
          #
          # So when a requirements file was installed, the lock in the checkout
          # is replaced by a freeze of what it installed on this Python: every
          # package that actually went in, exact versions, nothing Snyk cannot
          # resolve. It is written over the input file rather than beside it
          # because the SARIF names the scanned file: a path outside the
          # checkout comes out absolute and a sibling would name a file the
          # repository does not have, while this way an alert lands on the lock
          # itself. Nothing after this step reads the file. A repository with
          # no lock but a snyk-install-command gets the same freeze written over
          # pyproject.toml, the file that declares what was installed (Snyk
          # reads it as pip requirements under --package-manager=pip; measured
          # with the CLI, the SARIF then names pyproject.toml). With neither,
          # Snyk discovers manifests itself as before.
          if [ -n "$REQUIREMENTS" ]; then
            target=$REQUIREMENTS
          elif [ -n "$INSTALL" ]; then
            target=pyproject.toml
          else
            target=
          fi
          if [ -n "$target" ]; then
            pip freeze --exclude-editable > "$target"
            echo "scanning a freeze of the installed environment ($(grep -c . "$target") packages) as $target"
            set -- --file="$target" --package-manager=pip
          else
            set -- --all-projects --skip-unresolved=true
          fi
          if snyk test "$@" --severity-threshold=high --sarif-file-output=snyk-opensource.sarif; then rc=0; else rc=$?; fi
          case "$rc" in
            0|1) ;;
            3) echo "::warning title=Snyk::snyk test found no manifest it can read (exit 3); nothing scanned" ;;
            *) echo "::error title=Snyk::snyk test did not run (exit $rc): an expired or revoked SNYK_TOKEN, or a project it could not read"; exit "$rc" ;;
          esac

      # Gated on the token as well as the file: a repository that committed an
      # old scan report would otherwise upload it as if it were fresh.
      - name: Upload Snyk Code results
        if: steps.token.outputs.present == 'true' && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      - name: Upload Snyk Open Source results
        if: steps.token.outputs.present == 'true' && hashFiles('snyk-opensource.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: snyk-opensource.sarif
          category: snyk-opensource

  scorecard:
    name: OpenSSF Scorecard
    # Scorecard publishes only from the default branch; on a pull request it
    # would score the base and mislead.
    if: inputs.scorecard && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      security-events: write  # Scorecard SARIF upload
      id-token: write  # publishing the result
    steps:
      - name: Validate the egress policy inputs (EX-0001)
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
          POLICY_SEMGREP_EGRESS_POLICY: ${{ inputs.semgrep-egress-policy }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ inputs.egress-policy == 'audit' && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ (inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block' }}

      - name: Egress canary (EX-0001)
        if: ${{ runner.os == 'Linux' && ((inputs.egress-policy == 'audit' && 'audit' || 'block') == 'block') }}
        timeout-minutes: 2
        shell: bash
        # The workspace root exists before checkout; a job default working-directory may not.
        working-directory: ${{ github.workspace }}
        run: |
          set -u
          NAMES="github.com api.github.com results-receiver.actions.githubusercontent.com"
          PORT=443
          canary_resolve() { timeout 5 getent ahostsv4 "$1" 2>/dev/null | awk '$2 == "STREAM" { print $1 }'; }
          canary_probe() { timeout 3 bash -c "exec 3<>\"/dev/tcp/\$0/\$1\"" "$1" "$PORT" 2>/dev/null; }
          canary_reach() {
            local i
            for i in 1 2 3 4; do
              canary_probe "$1" && return 0
              [ "$i" -lt 4 ] && sleep 1
            done
            return 1
          }
          canary_show() { local n=$1; shift; echo "+ $*"; { timeout 10 "$@" 2>&1 || true; } | head -n "$n" || true; }
          canary_diag() {
            local name
            echo "::group::egress canary diagnostics (EX-0001, for the GitHub Support ticket)"
            canary_show 5 uname -srmo
            canary_show 20 cat /etc/resolv.conf
            canary_show 20 bash -c "resolvectl status 2>/dev/null | grep -E '^ *(Current DNS Server|DNS Servers?|DNS Domain):'"
            canary_show 20 bash -c "ss -lun | grep ':53 '"
            for name in $NAMES pipelines.actions.githubusercontent.com; do
              canary_show 20 getent ahostsv4 "$name"
              canary_show 5 curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_connect}\n' --max-time 8 "https://$name"
            done
            echo "::endgroup::"
          }
          canary_main() {
            local tmp name addr n=0 bad
            tmp=$(mktemp -d) || return 1
            for _ in 1 2 3; do
              for name in $NAMES; do canary_resolve "$name" >>"$tmp/res.$name" & done
              wait
              sleep 1
            done
            for name in $NAMES; do
              if [ -s "$tmp/res.$name" ]; then sort -u "$tmp/res.$name"; else echo "-"; fi | sed "s|^|$name |" >>"$tmp/pairs"
            done
            while read -r name addr; do
              n=$((n + 1))
              ( { [ "$addr" != "-" ] && canary_reach "$addr"; } || echo "$name $addr" >"$tmp/bad.$n" ) </dev/null &
            done <"$tmp/pairs"
            wait
            bad=$(cat "$tmp"/bad.* 2>/dev/null | sort || true)
            rm -rf "$tmp"
            if [ -z "$bad" ]; then
              echo "egress canary: all $n addresses of $NAMES accept TCP $PORT"
              return 0
            fi
            echo "::error title=egress canary::egress broken on this runner (known westus2 DNS issue, EX-0001): rerun the job"
            echo "unreachable addresses (name address; '-' means the name did not resolve):"
            printf '%s\n' "$bad"
            canary_diag
            echo "EX-0001 egress canary failed, unreachable: $(printf '%s' "$bad" | tr '\n' ';')" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            return 1
          }
          set -m
          canary_main &
          main=$!
          (sleep 90; kill -TERM -- "-$main"; sleep 2; kill -KILL -- "-$main") >/dev/null 2>&1 &
          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
            kill -TERM -- "-$main" >/dev/null 2>&1 || true
            sleep 1
            kill -KILL -- "-$main" >/dev/null 2>&1 || true
          fi
          if [ "$rc" -eq 143 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=egress canary::the canary hit its 90 s deadline (EX-0001): rerun the job"
            rc=124
          fi
          exit "$rc"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard.sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
          category: scorecard
