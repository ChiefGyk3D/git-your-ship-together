# Reusable security checks for a Python repository.
#
#   codeql             SAST; findings land in the Security tab.
#   gitleaks           Secret scan over the full history, on top of what Doppler
#                      already prevents by keeping secrets out of the tree.
#   pip-audit          Known vulnerabilities in the pinned dependencies.
#   dependency-review  On pull requests: what a dependency change brings in,
#                      and any dependency under a denied licence.
#   semgrep            SAST with the registry rules; SARIF to the Security tab.
#   snyk               Optional; SNYK_TOKEN comes from the Doppler config.
#   scorecard          Optional; OpenSSF Scorecard on the default branch.
#
# Call it with:
#
#   on:
#     push: { branches: [main] }
#     pull_request:
#     schedule: [{ cron: '0 6 * * 1' }]
#   jobs:
#     security:
#       uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@<sha> # vX.Y.Z
#       permissions:
#         contents: read
#         security-events: write
#         pull-requests: write     # dependency-review's PR summary comment
#         id-token: write          # Doppler OIDC; Scorecard publishing
#       secrets:
#         DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional fallback
#
# gitleaks runs as the pinned MIT binary, so it needs no licence under any
# account and no secret. A `.gitleaks.toml` at the caller's root is picked up
# automatically for allowlisting documented placeholders.

name: Security (reusable)

on:
  workflow_call:
    inputs:
      codeql:
        description: Run CodeQL.
        type: boolean
        default: true
      codeql-languages:
        description: CodeQL languages, comma-separated. `actions` scans the workflow files themselves and fits every repository; a repository with no Python passes `actions` alone, since CodeQL fails on a language with no source.
        type: string
        default: python,actions
      codeql-queries:
        description: CodeQL query suite.
        type: string
        default: security-extended
      codeql-config:
        description: Inline CodeQL configuration (YAML), for example paths-ignore.
        type: string
        default: ""
      gitleaks:
        description: Run gitleaks over the full history.
        type: boolean
        default: true
      gitleaks-version:
        description: gitleaks release to download (gitleaks/gitleaks), without the `v`. Changing it means changing `gitleaks-sha256`.
        type: string
        default: "8.30.1"
      gitleaks-sha256:
        description: SHA-256 of the gitleaks linux_x64 tarball for that version.
        type: string
        default: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      pip-audit-requirements:
        description: Requirements file audited by pip-audit; empty skips that step. With `audit-command` empty too, the job is skipped.
        type: string
        default: requirements.txt
      pip-audit-continue-on-error:
        description: Report advisories without failing the job. A migration aid, not a resting state.
        type: boolean
        default: false
      pip-audit-extra-args:
        description: Extra pip-audit arguments, e.g. `--ignore-vuln PYSEC-2026-3740` for an advisory with no fix yet. Name the reason in the caller.
        type: string
        default: ""
      audit-install-command:
        description: Shell run before `audit-command`, e.g. `npm ci --ignore-scripts` or `cargo install cargo-audit`; empty installs nothing. Python is available.
        type: string
        default: ""
      audit-command:
        description: A dependency audit that is not pip-shaped, e.g. `npm audit --audit-level=high`, `govulncheck ./...`, `cargo audit`; empty runs none. Runs in the same job as pip-audit, after it.
        type: string
        default: ""
      audit-continue-on-error:
        description: Report `audit-command` findings without failing the job. A migration aid, not a resting state.
        type: boolean
        default: false
      dependency-review:
        description: Run dependency-review on pull requests.
        type: boolean
        default: true
      dependency-review-severity:
        description: Fail the review at this severity or above.
        type: string
        default: moderate
      dependency-review-deny-licenses:
        description: Comma-separated SPDX identifiers the review fails on when a pull request adds a dependency under one of them. Empty means no licence rule. A dependency whose licence cannot be detected is reported, not failed.
        type: string
        default: AGPL-3.0, GPL-3.0, GPL-2.0, LGPL-3.0, SSPL-1.0
      dependency-review-allow-ghsas:
        description: Comma-separated GitHub Advisory IDs the review may not fail on. Each one must have an entry in the shared repository's baseline/risk-register.yaml (the audit checks); an advisory with no fixed release is the usual case.
        type: string
        default: ""
      semgrep:
        description: Run Semgrep over the repository and upload the SARIF.
        type: boolean
        default: true
      semgrep-config:
        description: Space-separated Semgrep configs, each passed as `--config` (registry packs or repository paths). Empty selects `p/github-actions p/secrets`, adding `p/python` when tracked Python files exist.
        type: string
        default: ""
      semgrep-continue-on-error:
        description: Report findings without failing the job (they still reach the Security tab). A migration aid, not a resting state.
        type: boolean
        default: false
      semgrep-egress-policy:
        description: harden-runner egress policy for the Semgrep job only - `audit` logs outbound connections, `block` allows only `semgrep-allowed-endpoints` and `extra-allowed-endpoints`.
        type: string
        default: block
      semgrep-allowed-endpoints:
        description: harden-runner allow-list for the Semgrep job in `block`, space-separated host:port entries. The default is the pip install of Semgrep, the rule registry, and the SARIF upload. Wildcards are not supported and a newline-separated list matches nothing.
        type: string
        default: "api.github.com:443 files.pythonhosted.org:443 github.com:443 pypi.org:443 semgrep.dev:443"
      snyk:
        description: Run Snyk Code and Snyk Open Source. Needs SNYK_TOKEN in the Doppler config.
        type: boolean
        default: false
      snyk-on:
        description: When the Snyk job runs. `schedule` (default) runs it on the weekly schedule and on workflow_dispatch only; `push` also runs it on every push to the default branch and every tag. Snyk's free plan meters tests per month (one Snyk Code test and one Snyk Open Source test per run) across every repository on the account, and ten repositories on `push` used the month's Code tests in a day (measured 2026-10-04, 34 runs). Weekly across the same ten is about a tenth of that. Never on a pull request in either mode.
        type: string
        default: schedule
      snyk-install-command:
        description: Shell that installs the project's dependencies for Snyk Open Source when `pip-audit-requirements` is empty, for a repository that declares them in `pyproject.toml` and keeps no lock (`pip install .`, `pip install .[all]`). Snyk then scans a freeze of the result, written over `pyproject.toml` in the checkout so the SARIF names the file that declares the dependencies. Empty with an empty `pip-audit-requirements` leaves Snyk's own discovery, which reads no PEP 621 `pyproject.toml` and ends in a "nothing to scan" warning.
        type: string
        default: ""
      scorecard:
        description: Run OpenSSF Scorecard and publish the result. Runs only on the default branch (push or schedule).
        type: boolean
        default: false
      python-version:
        description: Python for pip-audit and Snyk.
        type: string
        default: "3.13"
      egress-policy:
        description: harden-runner egress policy for every job - `audit` logs outbound connections, `block` allows only `allowed-endpoints`.
        type: string
        default: audit
      allowed-endpoints:
        description: harden-runner allow-list for `block`, space-separated host:port entries. The default is every endpoint this workflow's jobs reached in audit mode across the calling repositories; the runner's own infrastructure needs no entry. Wildcards are not supported and a newline-separated list matches nothing.
        type: string
        default: "api.deps.dev:443 api.doppler.com:443 api.github.com:443 api.osv.dev:443 api.scorecard.dev:443 api.securityscorecards.dev:443 api.snyk.io:443 app.snyk.io:443 codeload.github.com:443 deeproxy.snyk.io:443 downloads.snyk.io:443 files.pythonhosted.org:443 fulcio.sigstore.dev:443 github.com:443 oss-fuzz-build-logs.storage.googleapis.com:443 pypi.org:443 rekor.sigstore.dev:443 release-assets.githubusercontent.com:443 static.snyk.io:443 tuf-repo-cdn.sigstore.dev:443 uploads.github.com:443 www.bestpractices.dev:443"
      extra-allowed-endpoints:
        description: Appended to `allowed-endpoints`, for hosts only this repository reaches, such as an apt repository its Dockerfile adds. Same format.
        type: string
        default: ""
      doppler-project:
        description: Doppler project slug.
        type: string
        default: ""
      doppler-config:
        description: Doppler config slug holding CI secrets.
        type: string
        default: ""
      doppler-identity-id:
        description: Doppler Service Account Identity UUID for OIDC.
        type: string
        default: ""
      doppler-trusted-refs-only:
        description: Fetch CI secrets only on the default branch, a tag or a schedule; never on a pull request or another branch. `false` restores fetching on every same-repository run.
        type: boolean
        default: true
      timeout-minutes:
        description: Per-job timeout.
        type: number
        default: 30
    secrets:
      DOPPLER_TOKEN:
        description: Doppler Service Token fallback when OIDC is not configured.
        required: false

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    if: inputs.codeql
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      security-events: write  # CodeQL SARIF upload
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }}
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ inputs.egress-policy == 'block' }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ inputs.codeql-languages }}
          queries: ${{ inputs.codeql-queries }}
          config: ${{ inputs.codeql-config }}

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  gitleaks:
    name: Secret scan (gitleaks)
    if: inputs.gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      security-events: write  # gitleaks SARIF upload
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }}
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ inputs.egress-policy == 'block' }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The gitleaks binary is MIT and needs no licence; gitleaks-action
      # demands one under an organisation (#90). The release and its hash are
      # the `gitleaks-version` and `gitleaks-sha256` inputs. To bump: `gh release view -R gitleaks/gitleaks --json
      # tagName,assets`, `gh release download <tag> -R gitleaks/gitleaks -p
      # '*_linux_x64.tar.gz'`, then `sha256sum` the downloaded file (it must
      # also match the release's checksums.txt). Dependabot cannot bump this.
      # The github.com download redirects to release-assets.githubusercontent.com,
      # which the shared allow-list already carries.
      - name: Install gitleaks at the pinned version
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
          GITLEAKS_SHA256: ${{ inputs.gitleaks-sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks-bin/gitleaks"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version

      # The scan must be able to fail. This plants an AWS-shaped key (built at
      # run time, so no credential-shaped literal sits in this file) in a
      # scratch repository and requires the same invocation to exit 1 on it.
      - name: Check that the scan catches a planted key
        run: |
          set -euo pipefail
          canary="$(mktemp -d)"
          git init -q "$canary"
          printf 'aws_access_key_id = %s%s\naws_secret_access_key = %s\n' AKIA IOSFODNN7EXAMPLE 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYzq3x9KpZmQ' > "$canary/planted.txt"
          git -C "$canary" add planted.txt
          git -C "$canary" -c user.email=ci@example.invalid -c user.name=ci commit -q -m planted
          status=0
          gitleaks git --redact --no-banner --exit-code 1 --log-opts="--all" "$canary" > /dev/null 2>&1 || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error title=gitleaks::the planted key was not caught (exit $status); the secret scan cannot be trusted"
            exit 1
          fi

      # A `.gitleaks.toml` at the repository root is read automatically (the
      # target path's config, gitleaks' own order of precedence), so a caller
      # allowlists documented placeholders there. Full history, as before.
      - name: Scan the full history (gitleaks)
        run: gitleaks git --redact --no-banner --exit-code 1 --report-format sarif --report-path gitleaks.sarif --log-opts="--all" .

      - name: Upload gitleaks results
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  dependency-audit:
    name: Dependency audit
    if: inputs.pip-audit-requirements != '' || inputs.audit-command != ''
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }}
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ inputs.egress-policy == 'block' }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      # pip-audit and every package it needs, each wheel hash-checked: the lock
      # is .github/requirements/pip-audit.txt, copied here by
      # scripts/tool_locks.py (a reusable workflow cannot check out its own
      # commit) and compared with it by tests/test_tool_locks.py. --no-deps
      # because the lock is the whole dependency set; --only-binary so nothing
      # is built on the runner.
      - name: Install pip-audit
        if: inputs.pip-audit-requirements != ''
        env:
          REQUIREMENTS: |
            # pip-audit: generated by scripts/tool_locks.py from pip-audit.in; do not edit.
            # Wheels for x86_64 Linux and CPython 3.10-3.14 only (see that script).
            boolean-py==5.0 \
                --hash=sha256:ef28a70bd43115208441b53a045d1549e2f0ec6e3d08a9d142cbc41c1938e8d9
            cachecontrol==0.14.4 \
                --hash=sha256:b7ac014ff72ee199b5f8af1de29d60239954f223e948196fa3d84adaffc71d2b
            certifi==2026.7.22 \
                --hash=sha256:62f22742b58a1a33014a2b6b706588a8d7e2a88ae7bd1a6ebe8c992928483775
            charset-normalizer==3.5.2 \
                --hash=sha256:1c50fe28bbc2ced33386f298650d91218076c05420e6cbd790b913adc41659e7 \
                --hash=sha256:211d5a3eb6af8f513b8d4ca19a8c1b7accab1b5f0d3175f9826b03c1a920dc1f \
                --hash=sha256:34276fd796040bf0993ab33a369aa572e6979c7aab225a88893667ad8eac8f7a \
                --hash=sha256:3d31298449090ab8d47b7b1b2a555ff73cac7ed438a08b7ac160980c7ebed649 \
                --hash=sha256:7218e8f32b0956cfcd048fd42d9d5779809745ca1d86113ca56f66e7ae1549c4 \
                --hash=sha256:8a893cc101149f80a653f82062ebc95b34525a2614382e1da5458fe7c6997249 \
                --hash=sha256:b6b751274acb69d77b3323d6b7dbaa3c7fdfc1eb829b7eb61d262f32e1af9685
            cyclonedx-python-lib==11.12.0 \
                --hash=sha256:0e807521a921a5c3cb8ce1153f8a61d29eedfe76a46aac2796b7c6b573391a54
            defusedxml==0.7.1 \
                --hash=sha256:a352e7e428770286cc899e2542b6cdaedb2b4953ff269a210103ec58f6198a61
            filelock==4.0.12 \
                --hash=sha256:5f17ee83ecee8a6f3e389c75822fb70a1c2f0506b99438a6dffa1d56793588c8
            idna==3.20 \
                --hash=sha256:ab7ae7122974553370f0bdb919e1a960b2cd1bc1ef0276416d896db81c14582c
            license-expression==30.4.4 \
                --hash=sha256:421788fdcadb41f049d2dc934ce666626265aeccefddd25e162a26f23bcbf8a4
            markdown-it-py==4.2.0 \
                --hash=sha256:9f7ebbcd14fe59494226453aed97c1070d83f8d24b6fc3a3bcf9a38092641c4a
            mdurl==0.1.2 \
                --hash=sha256:84008a41e51615a49fc9966191ff91509e3c40b939176e643fd50a5c2196b8f8
            msgpack==1.2.3 \
                --hash=sha256:07c9733089d1b176c3dd2f7fa268452f9d5d784d076473499d754a58e8d1fbbb \
                --hash=sha256:382b219de3d436de3baba0f4b0c6d4336e8f5858d0eb047918b13b69a71c6c55 \
                --hash=sha256:5bf390259cb25a6a1cd197c65810999b811f64cd38683251538bcc5a1e41f7d3 \
                --hash=sha256:d8ef3a66e4b52d2d7fdd90df2984670124b2ff7546d76bb25dcf68ef47f7df58 \
                --hash=sha256:ede33b2892ceb976283e009ad12fa1834cfdf1f9c43ee9c97849fc588d00a618
            packageurl-python==0.17.6 \
                --hash=sha256:31a85c2717bc41dd818f3c62908685ff9eebcb68588213745b14a6ee9e7df7c9
            packaging==26.3 \
                --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
            pip==26.2.1 \
                --hash=sha256:71138adf1f4ca900cdb7d289c21b7494329f2332b6d85f0e1c42108c0384ed3e
            pip-api==0.0.35 \
                --hash=sha256:66990d0da25378555cbb538db79384bab92d4617c6350dfd7a2126ba2a3a9894
            pip-audit==2.10.1 \
                --hash=sha256:99ef3f600a317c1945f1e89e227ef26e1c2d618429b8bd3fa6f4f7c440c4611a
            pip-requirements-parser==32.0.1 \
                --hash=sha256:4659bc2a667783e7a15d190f6fccf8b2486685b6dba4c19c3876314769c57526
            platformdirs==4.12.3 \
                --hash=sha256:080f3b39423b5abfca9a23d84c4e9795f54d395cd8459867a8ded44084fcd5f8
            py-serializable==2.1.0 \
                --hash=sha256:b56d5d686b5a03ba4f4db5e769dc32336e142fc3bd4d68a8c25579ebb0a67304
            pygments==2.21.0 \
                --hash=sha256:2363c69b61c4a97c838da3b130dcd6468f4848992b21a82f2a63ec34377137d9
            pyparsing==3.3.3 \
                --hash=sha256:ece8c00a69cf01b45d0b1dedabb469c90d8caf996d4fda40f147627a122849a4
            requests==2.34.2 \
                --hash=sha256:2a0d60c172f83ac6ab31e4554906c0f3b3588d37b5cb939b1c061f4907e278e0
            rich==15.0.0 \
                --hash=sha256:33bd4ef74232fb73fe9279a257718407f169c09b78a87ad3d296f548e27de0bb
            sortedcontainers==2.4.0 \
                --hash=sha256:a163dcaede0f1c021485e957a39245190e74249897e2ae4b2aa38595db237ee0
            tomli==2.5.0 \
                --hash=sha256:32a7b79ac57a2e83670ce329ccf675798bc5a2094783a63676866b70503f2e2b \
                --hash=sha256:5d8bac3d603c97e6854424e5b2b5b741bdbde387e09f162fb0446812b4a8362b \
                --hash=sha256:6cf74416bdc94ae458b14e37286c1073081850ac8459a00d0c5efef5d44294c6 \
                --hash=sha256:7ac2027d37c3afbdf4bdd377f2676f6f1d2122a5be1f1137b49dced590b37e75 \
                --hash=sha256:d7e369fd63331746182360977b1892bfc215476a30d61612d732425311639f56
            tomli-w==1.2.0 \
                --hash=sha256:188306098d013b691fcadc011abd66727d3c414c571bb01b1a174ba8c983cf90
            typing-extensions==4.16.0 ; python_full_version < '3.13' \
                --hash=sha256:481caa481374e813c1b176ada14e97f1f67a4539ce9cfeb3f350d78d6370c2e8
            urllib3==2.8.0 \
                --hash=sha256:0cf3cae568d36aa9576b28dfb35f11328f1cb974ca7647d9475ebb86c75ac6e3
        run: |
          set -euo pipefail
          printf '%s\n' "$REQUIREMENTS" > "$RUNNER_TEMP/pip-audit-requirements.txt"
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r "$RUNNER_TEMP/pip-audit-requirements.txt"

      # Scoped to the declared dependencies on purpose. Auditing the whole
      # environment reports advisories against the runner's own pip and
      # setuptools, which nobody here ships or controls, and a recurring red
      # that everyone learns to ignore is worse than no check.
      - name: Audit pinned dependencies (pip-audit)
        if: inputs.pip-audit-requirements != ''
        continue-on-error: ${{ inputs.pip-audit-continue-on-error }}
        env:
          REQUIREMENTS: ${{ inputs.pip-audit-requirements }}
          EXTRA_ARGS: ${{ inputs.pip-audit-extra-args }}
        run: |
          read -r -a extra <<< "$EXTRA_ARGS"
          pip-audit --requirement "$REQUIREMENTS" --strict "${extra[@]}"

      # The same job for any other ecosystem: the caller names the tool. The
      # command reaches the shell through the environment, as every caller
      # command does, and this job holds contents: read and nothing else.
      - name: Install the audit tool
        if: inputs.audit-install-command != ''
        env:
          COMMAND: ${{ inputs.audit-install-command }}
        run: bash -eo pipefail -c "$COMMAND"

      - name: Audit dependencies (audit-command)
        if: inputs.audit-command != ''
        continue-on-error: ${{ inputs.audit-continue-on-error }}
        env:
          COMMAND: ${{ inputs.audit-command }}
        run: bash -eo pipefail -c "$COMMAND"

  dependency-review:
    name: Dependency review
    if: inputs.dependency-review && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: write  # the summary comment on failure
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.egress-policy }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }}
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ inputs.egress-policy == 'block' }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: ${{ inputs.dependency-review-severity }}
          allow-ghsas: ${{ inputs.dependency-review-allow-ghsas }}
          deny-licenses: ${{ inputs.dependency-review-deny-licenses }}
          comment-summary-in-pr: on-failure

  semgrep:
    name: Semgrep
    if: inputs.semgrep
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      security-events: write  # Semgrep SARIF upload
    steps:
      # Its own egress input and list: the rule registry (semgrep.dev) is
      # reached by this job alone, so it stays out of the shared list.
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.semgrep-egress-policy }}
          allowed-endpoints: ${{ inputs.semgrep-allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }}
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ inputs.semgrep-egress-policy == 'block' }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

