# Reusable security checks for a Python repository.
#
#   codeql             SAST; findings land in the Security tab.
#   gitleaks           Secret scan over the full history (or, on a pull request
#                      with gitleaks-scope: pr-commits, the pull request's own
#                      commits plus the tree), on top of what Doppler already
#                      prevents by keeping secrets out of the tree.
#   pip-audit          Known vulnerabilities in the pinned dependencies.
#   dependency-review  On pull requests: what a dependency change brings in,
#                      and any dependency under a denied licence.
#   semgrep            SAST with the registry rules; SARIF to the Security tab.
#   snyk               Optional; SNYK_TOKEN comes from the Doppler config.
#   scorecard          Optional; OpenSSF Scorecard on the default branch.
#
# Call it with:
#
#   on:
#     push: { branches: [main] }
#     pull_request:
#     schedule: [{ cron: '0 6 * * 1' }]
#   jobs:
#     security:
#       uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@<sha> # vX.Y.Z
#       permissions:
#         contents: read
#         security-events: write
#         pull-requests: write     # dependency-review's PR summary comment
#         id-token: write          # Doppler OIDC; Scorecard publishing
#       secrets:
#         DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional fallback
#
# gitleaks runs as the pinned MIT binary, so it needs no licence under any
# account and no secret. A `.gitleaks.toml` at the caller's root is picked up
# automatically for allowlisting documented placeholders.

name: Security (reusable)

on:
  workflow_call:
    inputs:
      advanced-security:
        description: Whether the repository has GitHub Advanced Security - exactly `true` (default, unchanged behavior) or `false`. A private repository without Advanced Security sets `false`; dependency review and CodeQL are then skipped, and Semgrep and gitleaks still run and still fail on a finding but do not upload SARIF, and the job summary says so. Any other value (including `False` or an empty string) fails the `advanced-security-check` job, and so the whole call, though the scans still run.
        type: string
        default: "true"
      codeql:
        description: Run CodeQL.
        type: boolean
        default: true
      codeql-languages:
        description: CodeQL languages, comma-separated. `actions` scans the workflow files themselves and fits every repository; a repository with no Python passes `actions` alone, since CodeQL fails on a language with no source.
        type: string
        default: python,actions
      codeql-queries:
        description: CodeQL query suite.
        type: string
        default: security-extended
      codeql-config:
        description: Inline CodeQL configuration (YAML), for example paths-ignore.
        type: string
        default: ""
      gitleaks:
        description: Run gitleaks over the full history.
        type: boolean
        default: true
      gitleaks-scope:
        description: What the gitleaks history scan covers - exactly `all-refs` (default, unchanged behavior - every ref in the clone) or `pr-commits`. `pr-commits` narrows only a `pull_request` run, to the commits of the pull request (base..head) plus a scan of the checked-out tree; a push, a schedule, a workflow_dispatch and any other event scan the full history whatever this is set to. Any other value fails the gitleaks job.
        type: string
        default: all-refs
      gitleaks-version:
        description: gitleaks release to download (gitleaks/gitleaks), without the `v`. Changing it means changing `gitleaks-sha256`.
        type: string
        default: "8.30.1"
      gitleaks-sha256:
        description: SHA-256 of the gitleaks linux_x64 tarball for that version.
        type: string
        default: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      gitleaks-upload-sarif:
        description: Upload the gitleaks SARIF to code scanning. Turn it off on a private repository without GitHub Advanced Security, where code scanning is unavailable and the upload fails the job; the scan still runs and still fails on a finding.
        type: boolean
        default: true
      pip-audit-requirements:
        description: Requirements file audited by pip-audit; empty skips that step. With `audit-command` empty too, the job is skipped.
        type: string
        default: requirements.txt
      pip-audit-continue-on-error:
        description: Report advisories without failing the job. A migration aid, not a resting state.
        type: boolean
        default: false
      pip-audit-extra-args:
        description: Extra pip-audit arguments, e.g. `--ignore-vuln PYSEC-2026-3740` for an advisory with no fix yet. Name the reason in the caller.
        type: string
        default: ""
      audit-install-command:
        description: Shell run before `audit-command`, e.g. `npm ci --ignore-scripts` or `cargo install cargo-audit`; empty installs nothing. Python is available.
        type: string
        default: ""
      audit-command:
        description: A dependency audit that is not pip-shaped, e.g. `npm audit --audit-level=high`, `govulncheck ./...`, `cargo audit`; empty runs none. Runs in the same job as pip-audit, after it.
        type: string
        default: ""
      audit-continue-on-error:
        description: Report `audit-command` findings without failing the job. A migration aid, not a resting state.
        type: boolean
        default: false
      dependency-review:
        description: Run dependency-review on pull requests.
        type: boolean
        default: true
      dependency-review-severity:
        description: Fail the review at this severity or above.
        type: string
        default: moderate
      dependency-review-deny-licenses:
        description: Comma-separated SPDX identifiers the review fails on when a pull request adds a dependency under one of them. Empty means no licence rule. A dependency whose licence cannot be detected is reported, not failed.
        type: string
        default: AGPL-3.0, GPL-3.0, GPL-2.0, LGPL-3.0, SSPL-1.0
      dependency-review-allow-dependencies-licenses:
        description: Comma-separated package URLs (`pkg:pypi/semgrep`) the licence rule does not apply to. For a tool the repository runs but does not link or ship, such as a CLI under LGPL whose hash lock is a manifest the review reads. Empty exempts nothing. Licence only; advisories still fail the review.
        type: string
        default: ""
      dependency-review-allow-ghsas:
        description: Comma-separated GitHub Advisory IDs the review may not fail on. Each one must have an entry in the shared repository's baseline/risk-register.yaml (the audit checks); an advisory with no fixed release is the usual case.
        type: string
        default: ""
      semgrep:
        description: Run Semgrep over the repository and upload the SARIF.
        type: boolean
        default: true
      semgrep-config:
        description: Space-separated Semgrep configs, each passed as `--config` (registry packs or repository paths). Empty selects `p/github-actions p/secrets`, adding `p/python` when tracked Python files exist.
        type: string
        default: ""
      semgrep-version:
        description: Deprecated, and will be removed. Semgrep is installed from a hash lock (`.github/requirements/semgrep.txt`), so the version is the lock's. Leave empty; a value that is not the locked version fails the install step.
        type: string
        default: ""
      semgrep-continue-on-error:
        description: Report findings without failing the job (they still reach the Security tab). A migration aid, not a resting state.
        type: boolean
        default: false
      semgrep-egress-policy:
        description: harden-runner egress policy for the Semgrep job only - `audit` logs outbound connections, `block` allows only `semgrep-allowed-endpoints` and `extra-allowed-endpoints`.
        type: string
        default: block
      semgrep-allowed-endpoints:
        description: harden-runner allow-list for the Semgrep job in `block`, space-separated host:port entries. The default is the pip install of Semgrep, the rule registry, and the SARIF upload. Wildcards are not supported and a newline-separated list matches nothing.
        type: string
        default: "api.github.com:443 files.pythonhosted.org:443 github.com:443 pypi.org:443 semgrep.dev:443"
      snyk:
        description: Run Snyk Code and Snyk Open Source. Needs SNYK_TOKEN in the Doppler config.
        type: boolean
        default: false
      snyk-on:
        description: When the Snyk job runs. `schedule` (default) runs it on the weekly schedule and on workflow_dispatch only; `push` also runs it on every push to the default branch and every tag. Snyk's free plan meters tests per month (one Snyk Code test and one Snyk Open Source test per run) across every repository on the account, and ten repositories on `push` used the month's Code tests in a day (measured 2026-10-04, 34 runs). Weekly across the same ten is about a tenth of that. Never on a pull request in either mode.
        type: string
        default: schedule
      snyk-install-command:
        description: Shell that installs the project's dependencies for Snyk Open Source when `pip-audit-requirements` is empty, for a repository that declares them in `pyproject.toml` and keeps no lock (`pip install .`, `pip install .[all]`). Snyk then scans a freeze of the result, written over `pyproject.toml` in the checkout so the SARIF names the file that declares the dependencies. Empty with an empty `pip-audit-requirements` leaves Snyk's own discovery, which reads no PEP 621 `pyproject.toml` and ends in a "nothing to scan" warning.
        type: string
        default: ""
      scorecard:
        description: Run OpenSSF Scorecard and publish the result. Runs only on the default branch (push or schedule).
        type: boolean
        default: false
      python-version:
        description: Python for pip-audit and Snyk.
        type: string
        default: "3.13"
      egress-policy:
        description: harden-runner egress policy for every job - `audit` logs outbound connections, `block` allows only `allowed-endpoints`. Jobs that hold no secret follow `egress-policy-secretless` instead (EX-0001).
        type: string
        default: audit
      egress-policy-secretless:
        description: harden-runner egress policy for the jobs that hold no stored secret, no OIDC token and no write-scoped or publish-capable token (read-only contents, a SARIF upload at most; `dependency-review` also holds its comment-scoped pull-requests write grant, a stated EX-0001 deviation), and whose output no privileged job consumes - exactly `audit` or `block`. Defaults to `audit` while security exception EX-0001 is active (GitHub-hosted runners in westus2 break harden-runner `block`; expires 2026-11-07 or when step-security/harden-runner#708 is fixed; see docs/security/exceptions/). Every job still has the default read-only job token. Set `block` to opt back in. Any other job follows `egress-policy`. Any other value fails the job.
        type: string
        default: audit
      allowed-endpoints:
        description: harden-runner allow-list for `block`, space-separated host:port entries. The default is every endpoint this workflow's jobs reached in audit mode across the calling repositories; the runner's own infrastructure needs no entry. Wildcards are not supported and a newline-separated list matches nothing.
        type: string
        default: "api.deps.dev:443 api.doppler.com:443 api.github.com:443 api.osv.dev:443 api.scorecard.dev:443 api.securityscorecards.dev:443 api.snyk.io:443 app.snyk.io:443 codeload.github.com:443 deeproxy.snyk.io:443 downloads.snyk.io:443 files.pythonhosted.org:443 fulcio.sigstore.dev:443 github.com:443 oss-fuzz-build-logs.storage.googleapis.com:443 pypi.org:443 rekor.sigstore.dev:443 release-assets.githubusercontent.com:443 static.snyk.io:443 tuf-repo-cdn.sigstore.dev:443 uploads.github.com:443 www.bestpractices.dev:443"
      extra-allowed-endpoints:
        description: Appended to `allowed-endpoints`, for hosts only this repository reaches, such as an apt repository its Dockerfile adds. Same format.
        type: string
        default: ""
      doppler-project:
        description: Doppler project slug.
        type: string
        default: ""
      doppler-config:
        description: Doppler config slug holding CI secrets.
        type: string
        default: ""
      doppler-identity-id:
        description: Doppler Service Account Identity UUID for OIDC.
        type: string
        default: ""
      doppler-trusted-refs-only:
        description: Fetch CI secrets only on the default branch, a version tag (vN.N.N) or a schedule; never on a pull request or another branch. `false` restores fetching on every same-repository run.
        type: boolean
        default: true
      timeout-minutes:
        description: Per-job timeout.
        type: number
        default: 15
    secrets:
      DOPPLER_TOKEN:
        description: Doppler Service Token fallback when OIDC is not configured.
        required: false

permissions:
  contents: read

jobs:
  advanced-security-check:
    name: Advanced Security setting
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions: {}  # no repository operation; the job only checks an input
    steps:
      - name: Validate the egress policy inputs (EX-0001)
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
          POLICY_SEMGREP_EGRESS_POLICY: ${{ inputs.semgrep-egress-policy }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ (inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ ((inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block') == 'block' }}

      - name: Egress canary (EX-0001)
        if: ${{ runner.os == 'Linux' && (((inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block') == 'block') }}
        timeout-minutes: 2
        shell: bash
        # The workspace root exists before checkout; a job default working-directory may not.
        working-directory: ${{ github.workspace }}
        run: |
          set -u
          NAMES="github.com api.github.com results-receiver.actions.githubusercontent.com"
          PORT=443
          canary_resolve() { timeout 5 getent ahostsv4 "$1" 2>/dev/null | awk '$2 == "STREAM" { print $1 }'; }
          canary_probe() { timeout 3 bash -c "exec 3<>\"/dev/tcp/\$0/\$1\"" "$1" "$PORT" 2>/dev/null; }
          canary_reach() {
            local i
            for i in 1 2 3 4; do
              canary_probe "$1" && return 0
              [ "$i" -lt 4 ] && sleep 1
            done
            return 1
          }
          canary_show() { local n=$1; shift; echo "+ $*"; { timeout 10 "$@" 2>&1 || true; } | head -n "$n" || true; }
          canary_diag() {
            local name
            echo "::group::egress canary diagnostics (EX-0001, for the GitHub Support ticket)"
            canary_show 5 uname -srmo
            canary_show 20 cat /etc/resolv.conf
            canary_show 20 bash -c "resolvectl status 2>/dev/null | grep -E '^ *(Current DNS Server|DNS Servers?|DNS Domain):'"
            canary_show 20 bash -c "ss -lun | grep ':53 '"
            for name in $NAMES pipelines.actions.githubusercontent.com; do
              canary_show 20 getent ahostsv4 "$name"
              canary_show 5 curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_connect}\n' --max-time 8 "https://$name"
            done
            echo "::endgroup::"
          }
          canary_main() {
            local tmp name addr n=0 bad
            tmp=$(mktemp -d) || return 1
            for _ in 1 2 3; do
              for name in $NAMES; do canary_resolve "$name" >>"$tmp/res.$name" & done
              wait
              sleep 1
            done
            for name in $NAMES; do
              if [ -s "$tmp/res.$name" ]; then sort -u "$tmp/res.$name"; else echo "-"; fi | sed "s|^|$name |" >>"$tmp/pairs"
            done
            while read -r name addr; do
              n=$((n + 1))
              ( { [ "$addr" != "-" ] && canary_reach "$addr"; } || echo "$name $addr" >"$tmp/bad.$n" ) </dev/null &
            done <"$tmp/pairs"
            wait
            bad=$(cat "$tmp"/bad.* 2>/dev/null | sort || true)
            rm -rf "$tmp"
            if [ -z "$bad" ]; then
              echo "egress canary: all $n addresses of $NAMES accept TCP $PORT"
              return 0
            fi
            echo "::error title=egress canary::egress broken on this runner (known westus2 DNS issue, EX-0001): rerun the job"
            echo "unreachable addresses (name address; '-' means the name did not resolve):"
            printf '%s\n' "$bad"
            canary_diag
            echo "EX-0001 egress canary failed, unreachable: $(printf '%s' "$bad" | tr '\n' ';')" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            return 1
          }
          set -m
          canary_main &
          main=$!
          (sleep 90; kill -TERM -- "-$main"; sleep 2; kill -KILL -- "-$main") >/dev/null 2>&1 &
          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
            kill -TERM -- "-$main" >/dev/null 2>&1 || true
            sleep 1
            kill -KILL -- "-$main" >/dev/null 2>&1 || true
          fi
          if [ "$rc" -eq 143 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=egress canary::the canary hit its 90 s deadline (EX-0001): rerun the job"
            rc=124
          fi
          exit "$rc"

      - name: Validate the advanced-security input
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          ADVANCED_SECURITY: ${{ inputs.advanced-security }}
        run: |
          set -u
          value=${ADVANCED_SECURITY-}
          case "$value" in
            true | false) ;;
            *)
              echo "::error title=advanced-security::the advanced-security input must be exactly 'true' or 'false' (its value is ${#value} characters long); the call fails until it is fixed"
              exit 1
              ;;
          esac

  codeql:
    name: CodeQL
    if: inputs.codeql && inputs.advanced-security != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      security-events: write  # CodeQL SARIF upload
    steps:
      - name: Validate the egress policy inputs (EX-0001)
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          POLICY_EGRESS_POLICY: ${{ inputs.egress-policy }}
          POLICY_EGRESS_POLICY_SECRETLESS: ${{ inputs.egress-policy-secretless }}
          POLICY_SEMGREP_EGRESS_POLICY: ${{ inputs.semgrep-egress-policy }}
        run: |
          set -u
          bad=0
          check() {
            if [ "$2" = set ] && [ "$3" != audit ] && [ "$3" != block ]; then
              echo "::error title=egress policy::the $1 input must be exactly 'audit' or 'block' (its value is ${#3} characters long)"
              bad=1
            fi
          }
          check egress-policy "${POLICY_EGRESS_POLICY+set}" "${POLICY_EGRESS_POLICY-}"
          check egress-policy-secretless "${POLICY_EGRESS_POLICY_SECRETLESS+set}" "${POLICY_EGRESS_POLICY_SECRETLESS-}"
          check distro-egress-policy "${POLICY_DISTRO_EGRESS_POLICY+set}" "${POLICY_DISTRO_EGRESS_POLICY-}"
          check semgrep-egress-policy "${POLICY_SEMGREP_EGRESS_POLICY+set}" "${POLICY_SEMGREP_EGRESS_POLICY-}"
          exit "$bad"

      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: ${{ (inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block' }}
          allowed-endpoints: ${{ inputs.allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ ((inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block') == 'block' }}

      - name: Egress canary (EX-0001)
        if: ${{ runner.os == 'Linux' && (((inputs.egress-policy-secretless == 'audit' && runner.environment == 'github-hosted') && 'audit' || 'block') == 'block') }}
        timeout-minutes: 2
        shell: bash
        # The workspace root exists before checkout; a job default working-directory may not.
        working-directory: ${{ github.workspace }}
        run: |
          set -u
          NAMES="github.com api.github.com results-receiver.actions.githubusercontent.com"
          PORT=443
          canary_resolve() { timeout 5 getent ahostsv4 "$1" 2>/dev/null | awk '$2 == "STREAM" { print $1 }'; }
          canary_probe() { timeout 3 bash -c "exec 3<>\"/dev/tcp/\$0/\$1\"" "$1" "$PORT" 2>/dev/null; }
          canary_reach() {
            local i
            for i in 1 2 3 4; do
              canary_probe "$1" && return 0
              [ "$i" -lt 4 ] && sleep 1
            done
            return 1
          }
          canary_show() { local n=$1; shift; echo "+ $*"; { timeout 10 "$@" 2>&1 || true; } | head -n "$n" || true; }
          canary_diag() {
            local name
            echo "::group::egress canary diagnostics (EX-0001, for the GitHub Support ticket)"
            canary_show 5 uname -srmo
            canary_show 20 cat /etc/resolv.conf
            canary_show 20 bash -c "resolvectl status 2>/dev/null | grep -E '^ *(Current DNS Server|DNS Servers?|DNS Domain):'"
            canary_show 20 bash -c "ss -lun | grep ':53 '"
            for name in $NAMES pipelines.actions.githubusercontent.com; do
              canary_show 20 getent ahostsv4 "$name"
              canary_show 5 curl -sS -o /dev/null -w '%{http_code} %{remote_ip} %{time_connect}\n' --max-time 8 "https://$name"
            done
            echo "::endgroup::"
          }
          canary_main() {
            local tmp name addr n=0 bad
            tmp=$(mktemp -d) || return 1
            for _ in 1 2 3; do
              for name in $NAMES; do canary_resolve "$name" >>"$tmp/res.$name" & done
              wait
              sleep 1
            done
            for name in $NAMES; do
              if [ -s "$tmp/res.$name" ]; then sort -u "$tmp/res.$name"; else echo "-"; fi | sed "s|^|$name |" >>"$tmp/pairs"
            done
            while read -r name addr; do
              n=$((n + 1))
              ( { [ "$addr" != "-" ] && canary_reach "$addr"; } || echo "$name $addr" >"$tmp/bad.$n" ) </dev/null &
            done <"$tmp/pairs"
            wait
            bad=$(cat "$tmp"/bad.* 2>/dev/null | sort || true)
            rm -rf "$tmp"
            if [ -z "$bad" ]; then
              echo "egress canary: all $n addresses of $NAMES accept TCP $PORT"
              return 0
            fi
            echo "::error title=egress canary::egress broken on this runner (known westus2 DNS issue, EX-0001): rerun the job"
            echo "unreachable addresses (name address; '-' means the name did not resolve):"
            printf '%s\n' "$bad"
            canary_diag
            echo "EX-0001 egress canary failed, unreachable: $(printf '%s' "$bad" | tr '\n' ';')" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
            return 1
          }
          set -m
          canary_main &
          main=$!
          (sleep 90; kill -TERM -- "-$main"; sleep 2; kill -KILL -- "-$main") >/dev/null 2>&1 &
          dog=$!
          wait "$main" && rc=0 || rc=$?
          kill -TERM -- "-$dog" >/dev/null 2>&1 || true
          if kill -0 -- "-$main" >/dev/null 2>&1; then
            kill -TERM -- "-$main" >/dev/null 2>&1 || true
            sleep 1
            kill -KILL -- "-$main" >/dev/null 2>&1 || true
          fi
          if [ "$rc" -eq 143 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=egress canary::the canary hit its 90 s deadline (EX-0001): rerun the job"
            rc=124
          fi
          exit "$rc"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ inputs.codeql-languages }}
          queries: ${{ inputs.codeql-queries }}
          config: ${{ inputs.codeql-config }}

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

  gitleaks:
    name: Secret scan (gitleaks)
    if: inputs.gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      security-events: write  # gitleaks SARIF upload
    steps:
