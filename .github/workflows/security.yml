          python -m pip install --require-hashes --no-deps --only-binary=:all: -r "$RUNNER_TEMP/semgrep-requirements.txt"

      # --error makes findings exit 1; without it Semgrep exits 0 and only the
      # SARIF carries them. Metrics are off: nothing about the repository is
      # sent anywhere but the rule download.
      - name: Scan (Semgrep)
        env:
          CONFIGS: ${{ inputs.semgrep-config }}
          CONTINUE: ${{ inputs.semgrep-continue-on-error }}
        run: |
          set -euo pipefail
          if [ -z "$CONFIGS" ]; then
            CONFIGS="p/github-actions p/secrets"
            if [ -n "$(git ls-files -- '*.py')" ]; then
              CONFIGS="p/python $CONFIGS"
            fi
          fi
          args=()
          for config in $CONFIGS; do args+=(--config "$config"); done
          if [ "$CONTINUE" != "true" ]; then args+=(--error); fi
          semgrep scan --metrics=off --sarif --output semgrep.sarif "${args[@]}" .

