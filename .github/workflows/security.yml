          allowed-endpoints: ${{ inputs.semgrep-allowed-endpoints }} ${{ inputs.extra-allowed-endpoints }} results-receiver.actions.githubusercontent.com:443
          # The agent may only stop reporting to StepSecurity in block mode.
          disable-telemetry: ${{ (((inputs.egress-policy-secretless == 'audit' || inputs.semgrep-egress-policy == 'audit') && runner.environment == 'github-hosted') && 'audit' || 'block') == 'block' }}

