        with:
          persist-credentials: false
          fetch-depth: 0

      # Decide what the history scan covers. Only a `pull_request` run with
      # `pr-commits` narrows, to the commits reachable from the head and not
      # from the base (git's base..head), plus a scan of the checked-out tree.
      # Every other event, and `all-refs`, scans every ref. The SHAs come from
      # the event payload through env (never inline in this script) and must
      # be full lowercase hex ids present in the clone, or the job fails.
      - name: Resolve the gitleaks scan scope
        id: scope
        timeout-minutes: 1
        env:
          GITLEAKS_SCOPE: ${{ inputs.gitleaks-scope }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error title=gitleaks-scope::$1"
            exit 1
          }
          scope=${GITLEAKS_SCOPE-}
          case "$scope" in
            pr-commits | all-refs) ;;
            *) fail "the gitleaks-scope input must be exactly 'pr-commits' or 'all-refs' (its value is ${#scope} characters long)" ;;
          esac
          log_opts="--all"
          tree=false
          if [ "$scope" = pr-commits ] && [ "${EVENT_NAME-}" = pull_request ]; then
            sha_re='^([0-9a-f]{40}|[0-9a-f]{64})$'
            for sha in "${BASE_SHA-}" "${HEAD_SHA-}"; do
              [[ "$sha" =~ $sha_re ]] || fail "gitleaks-scope pr-commits needs the pull request base and head as full commit ids, and got something else; refusing to guess a narrower scope"
              git cat-file -e "${sha}^{commit}" 2>/dev/null || fail "gitleaks-scope pr-commits: ${sha:0:12} is not in the clone, so the pull request range cannot be scanned; refusing to guess a narrower scope"
            done
            log_opts="${BASE_SHA}..${HEAD_SHA}"
            tree=true
          fi
          echo "scope=$scope event=${EVENT_NAME-} log-opts=$log_opts tree-scan=$tree"
          {
            echo "log_opts=$log_opts"
            echo "tree=$tree"
          } >> "$GITHUB_OUTPUT"

      # The gitleaks binary is MIT and needs no licence; gitleaks-action
      # demands one under an organisation (#90). The release and its hash are
      # the `gitleaks-version` and `gitleaks-sha256` inputs. To bump: `gh release view -R gitleaks/gitleaks --json
      # tagName,assets`, `gh release download <tag> -R gitleaks/gitleaks -p
      # '*_linux_x64.tar.gz'`, then `sha256sum` the downloaded file (it must
      # also match the release's checksums.txt). Dependabot cannot bump this.
      # The github.com download redirects to release-assets.githubusercontent.com,
      # which the shared allow-list already carries.
      - name: Install gitleaks at the pinned version
        env:
          GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
          GITLEAKS_SHA256: ${{ inputs.gitleaks-sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          chmod 0755 "$RUNNER_TEMP/gitleaks-bin/gitleaks"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version

      # The scan must be able to fail. This plants an AWS-shaped key (built at
      # run time, so no credential-shaped literal sits in this file) in a
      # scratch repository, on top of a clean commit, and requires the same
      # invocations to exit 1 on it. The all-refs scan is always checked; when
      # the scope narrows (TREE_SCAN is true) the base..head form and the tree
      # scan the job will run are checked as well.
      - name: Check that the scan catches a planted key
        timeout-minutes: 2
        env:
          TREE_SCAN: ${{ steps.scope.outputs.tree }}
        run: |
          set -euo pipefail
          canary="$(mktemp -d)"
          git init -q "$canary"
          printf 'nothing to see here\n' > "$canary/clean.txt"
          git -C "$canary" add clean.txt
          git -C "$canary" -c user.email=ci@example.invalid -c user.name=ci commit -q -m clean
          printf 'aws_access_key_id = %s%s\naws_secret_access_key = %s\n' AKIA IOSFODNN7EXAMPLE 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYzq3x9KpZmQ' > "$canary/planted.txt"
          git -C "$canary" add planted.txt
          git -C "$canary" -c user.email=ci@example.invalid -c user.name=ci commit -q -m planted
          must_catch() {
            local what=$1
            shift
            local status=0
            "$@" > /dev/null 2>&1 || status=$?
            if [ "$status" -ne 1 ]; then
              echo "::error title=gitleaks::the planted key was not caught by the $what scan (exit $status); the secret scan cannot be trusted"
              exit 1
            fi
          }
          must_catch "all-refs" gitleaks git --redact --no-banner --exit-code 1 --log-opts="--all" "$canary"
          if [ "${TREE_SCAN-}" = true ]; then
            must_catch "pull-request range" gitleaks git --redact --no-banner --exit-code 1 --log-opts="HEAD~1..HEAD" "$canary"
            must_catch "working-tree" gitleaks dir --redact --no-banner --exit-code 1 "$canary"
          fi

      # A `.gitleaks.toml` at the repository root is read automatically (the
      # target path's config, gitleaks' own order of precedence), so a caller
      # allowlists documented placeholders there. The range is `--all` (every
      # ref, as before) or, for a narrowed pull request, base..head.
      - name: Scan the commits (gitleaks)
        env:
          LOG_OPTS: ${{ steps.scope.outputs.log_opts }}
        run: gitleaks git --redact --no-banner --exit-code 1 --report-format sarif --report-path gitleaks.sarif --log-opts="$LOG_OPTS" .

      # Only for a narrowed pull request: the history scan no longer sees every
      # ref, so the checked-out tree is scanned as well. It runs even when the
      # commits scan failed, so one run reports both. No SARIF: a second report
      # under the same category would replace the first.
      - name: Scan the working tree (gitleaks)
        if: always() && steps.scope.outputs.tree == 'true'
        run: gitleaks dir --redact --no-banner --exit-code 1 .

      - name: Note the skipped Advanced Security features
        if: inputs.advanced-security == 'false'
        timeout-minutes: 1
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo "### GitHub Advanced Security features skipped"
            echo
            echo "Skipped because the caller set \`advanced-security: false\`: dependency review, CodeQL, and the SARIF uploads of Semgrep and gitleaks (code scanning is not available without Advanced Security)."
            echo "Semgrep and gitleaks still run and still fail the job on a finding."
            echo "If this repository has Advanced Security, remove the line or set \`advanced-security: true\` on the caller to turn all of it on."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Upload gitleaks results
        if: always() && inputs.gitleaks-upload-sarif && inputs.advanced-security != 'false' && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

