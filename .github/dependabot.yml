version: 2
updates:
  # Every action here is pinned to a commit with a version comment; Dependabot
  # reads the comment and moves both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A release that turns out to be malicious is usually pulled within days;
    # waiting a week before proposing it costs nothing.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, github-actions]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: [dependencies, python]

  # pip-audit and Semgrep, locked for security.yml. A bump rewrites the lock
  # with every platform's hashes, which fails tests/test_tool_locks.py until
  # `python scripts/tool_locks.py --relock` puts the pruned lock back and
  # copies it into the workflow.
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: [dependencies, python]

  # The fixture image's base is pinned by digest; without this entry the pin
  # goes stale and Trivy reports the base's OS packages against it.
  - package-ecosystem: docker
    directory: /fixture
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: [dependencies, docker]
